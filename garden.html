  async function aStart(off) { aStop(); if (!snd) return; const key = CUR.seed + CUR.def.id; if (BUFKEY !== key) { const oc = new OfflineAudioContext(2, Math.ceil(CUR.total * 44100), 44100); buildAudio(oc); BUF = await oc.startRendering(); BUFKEY = key; } if (!playing) return; AC2 = AC2 || new (window.AudioContext || window.webkitAudioContext)(); SRC = AC2.createBufferSource(); SRC.buffer = BUF; SRC.connect(AC2.destination); SRC.start(0, Math.min(off, CUR.total - 0.05)); }
  function frame(now) { if (!playing) return; T += (now - tPrev) / 1000; tPrev = now; if (T >= CUR.total) { if (loop) { T = 0; aStart(0); } else { playing = false; $('play').textContent = 'Play'; T = CUR.total - 0.01; aStop(); } } draw(); requestAnimationFrame(frame); }
  function play() { playing = true; $('play').textContent = 'Pause'; tPrev = performance.now(); aStart(T); requestAnimationFrame(frame); }
  function pause() { playing = false; $('play').textContent = 'Play'; aStop(); }
  function reload(seed) { pause(); const i = loadBuild($('bsel').value, { seed }); T = 0; $('info').textContent = 'v1 | ' + i.name + ' | ' + i.kind + ' | seed ' + i.seed + ' | ' + i.total.toFixed(0) + 's (estimate, the real length follows the voice)'; draw(); }
  $('play').onclick = () => (playing ? pause() : play()); $('seek').oninput = () => { T = parseFloat($('seek').value); draw(); if (playing) aStart(T); };
  $('snd').onclick = () => { snd = !snd; $('snd').setAttribute('aria-pressed', snd); if (!snd) aStop(); else if (playing) aStart(T); }; $('loop').onclick = () => { loop = !loop; $('loop').setAttribute('aria-pressed', loop); };
  $('endb').onclick = () => { pause(); T = CUR.total - 0.3; draw(); }; $('thumb').onclick = () => { pause(); thumbFrame(ctx); }; $('bsel').onchange = () => reload(); $('roll').onclick = () => { const was = playing; reload(); if (was) play(); };
  (window.GARDEN || []).forEach((b) => { const o = document.createElement('option'); o.value = b.id; o.textContent = b.kind.toUpperCase() + ' | ' + b.title; $('bsel').appendChild(o); });
  (async () => { try { await Promise.all([document.fonts.load('40px "Alfa Slab One"', 'Aa'), document.fonts.load('800 30px Poppins', 'Aa')]); await document.fonts.ready; } catch (e) {} if (!(window.GARDEN || []).length) { window._error = 'No stories loaded: content_gd.js is missing or empty'; document.getElementById('loading').textContent = window._error; return; } const q = new URLSearchParams(location.search); if (q.get('b')) $('bsel').value = q.get('b'); reload(q.get('seed') ? parseInt(q.get('seed'), 10) : undefined); document.getElementById('loading').style.display = 'none'; window._ready = true; if (!navigator.webdriver) play(); })();
})();
