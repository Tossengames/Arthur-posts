              ("Now faith is the substance of things hoped for, the evidence of things not seen.", "Hebrews", "Hebrews 11:1", ["James", "Romans"]),
              ("Be strong and of a good courage; be not afraid, neither be thou dismayed.", "Joshua", "Joshua 1:9", ["Judges", "Ruth"]),
              ("Blessed are the poor in spirit: for theirs is the kingdom of heaven.", "Matthew", "Matthew 5:3", ["Mark", "Acts"]),
              ("Charity suffereth long, and is kind; charity envieth not.", "1 Corinthians", "1 Corinthians 13:4", ["Romans", "Galatians"]),
              ("Fear thou not; for I am with thee: be not dismayed; for I am thy God.", "Isaiah", "Isaiah 41:10", ["Jeremiah", "Psalms"]),
              ("But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith.", "Galatians", "Galatians 5:22", ["Ephesians", "Colossians"]),
