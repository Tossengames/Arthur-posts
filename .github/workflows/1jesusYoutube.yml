              ("Moses led the Israelites into the Promised Land.", False, "Moses died before they crossed the Jordan. Joshua led them in.", "Deuteronomy 34:5"),
              ("David defeated Goliath with a sword.", False, "David prevailed with a sling and a single stone.", "1 Samuel 17:50"),
              ("Jonah spent three days and three nights inside a great fish.", True, "The LORD prepared a great fish to swallow Jonah.", "Jonah 1:17"),
              ("Jesus was born in Nazareth.", False, "Jesus was born in Bethlehem. He grew up in Nazareth.", "Matthew 2:1"),
