          # ================================================================== BACKGROUNDS
          def vgrad(stops, h):
              ys = np.linspace(0, 1, h)[:, None]
              n = len(stops) - 1
              pos = ys * n
              idx = np.minimum(pos.astype(int), n - 1)
              fr = pos - idx
              c = np.array(stops, dtype=np.float32)
              g = c[idx[:, 0]] * (1 - fr) + c[idx[:, 0] + 1] * fr
              return np.repeat(g[:, None, :], W, axis=1)


          def glow(a, cx, cy, r, col, s=0.6):
              yy, xx = np.mgrid[0:a.shape[0], 0:a.shape[1]]
              d = np.sqrt((xx - cx) ** 2 + (yy - cy) ** 2) / r
              m = (np.clip(1 - d, 0, 1) ** 2 * s)[..., None]
              a += m * (np.array(col, dtype=np.float32) - a)


          def to_img(a):
              return Image.fromarray(np.clip(a, 0, 255).astype(np.uint8))


          def bg_sunrise():
              a = vgrad([(226, 92, 48), (247, 150, 58), (255, 205, 105), (255, 236, 170)], BH)
              glow(a, W / 2, BH * 0.78, 900, (255, 244, 200), 0.75)
              return to_img(a)


          def bg_midnight():
              a = vgrad([(5, 8, 30), (14, 22, 66), (30, 42, 102), (46, 58, 128)], BH)
              glow(a, W * 0.8, 260, 420, (200, 210, 255), 0.35)
              im = to_img(a)
              d = ImageDraw.Draw(im)
              r = random.Random(3)
              for _ in range(230):
                  x, y, s = r.randint(0, W), r.randint(0, BH), r.choice([1, 1, 2, 2, 3])
                  v = r.randint(150, 255)
                  d.ellipse([x, y, x + s, y + s], fill=(v, v, min(255, v + 10)))
              return im


          def bg_glass():
              w, h = W // 2, BH // 2
              rng = np.random.RandomState(random.randint(0, 10 ** 6))
              n = 46
              sx, sy = rng.uniform(0, w, n), rng.uniform(0, h, n)
              yy, xx = np.mgrid[0:h, 0:w]
              d1 = np.full((h, w), 1e9)
              d2 = np.full((h, w), 1e9)
              ix = np.zeros((h, w), dtype=int)
              for i in range(n):
                  d = np.sqrt((xx - sx[i]) ** 2 + (yy - sy[i]) ** 2)
                  m1 = d < d1
                  d2 = np.where(m1, d1, np.minimum(d2, d))
                  ix = np.where(m1, i, ix)
                  d1 = np.where(m1, d, d1)
              pal = np.array([(155, 20, 40), (20, 70, 150), (25, 120, 70), (110, 40, 140), (210, 140, 20), (20, 120, 140), (180, 70, 30), (60, 40, 120)], dtype=np.float32)
              cols = pal[rng.randint(0, len(pal), n)]
              img = cols[ix] * (0.62 + 0.3 * np.clip(1 - d1 / 70, 0, 1))[..., None]
              img[(d2 - d1) < 2.4] = (22, 16, 26)
              return Image.fromarray(img.astype(np.uint8)).resize((W, BH), Image.LANCZOS).filter(ImageFilter.GaussianBlur(1))


          def bg_parchment():
              base = np.zeros((BH, W, 3), dtype=np.float32) + np.array((233, 214, 172), dtype=np.float32)
              for sc, amp in ((90, 24), (24, 10), (6, 5)):
                  n = np.random.rand(BH // sc + 2, W // sc + 2).astype(np.float32)
                  n = np.array(Image.fromarray((n * 255).astype(np.uint8)).resize((W, BH), Image.BICUBIC), dtype=np.float32) / 255 - 0.5
                  base += n[..., None] * amp
              yy, xx = np.mgrid[0:BH, 0:W]
              d = np.sqrt(((xx - W / 2) / (W * 0.75)) ** 2 + ((yy - BH / 2) / (BH * 0.7)) ** 2)
              v = (np.clip(d, 0, 1) ** 2.2)[..., None]
              base = base * (1 - v * np.array([0.35, 0.5, 0.7], dtype=np.float32))
              return to_img(base)


          def bg_watercolor():
              im = Image.new("RGB", (W, BH), (250, 245, 235))
              d = ImageDraw.Draw(im)
              pal = [(255, 205, 210), (200, 225, 255), (210, 240, 215), (255, 235, 190), (225, 210, 250)]
              for _ in range(11):
                  cx, cy = random.randint(0, W), random.randint(0, BH)
                  rx, ry = random.randint(220, 520), random.randint(260, 600)
                  d.ellipse([cx - rx, cy - ry, cx + rx, cy + ry], fill=random.choice(pal))
              im = im.filter(ImageFilter.GaussianBlur(110))
              a = np.array(im, dtype=np.float32)
              n = np.random.rand(BH, W).astype(np.float32)
              a += (n[..., None] - 0.5) * 8
              return to_img(a)


          def bg_dawn():
              a = vgrad([(58, 44, 110), (128, 76, 150), (214, 112, 140), (255, 172, 120), (255, 214, 160)], BH)
              base = to_img(a).convert("RGBA")
              layer = Image.new("RGBA", (W, BH), (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)
              for _ in range(14):
                  cx, cy = random.randint(0, W), random.randint(int(BH * 0.2), int(BH * 0.9))
                  rw, rh = random.randint(180, 400), random.randint(30, 70)
                  d.ellipse([cx - rw, cy - rh, cx + rw, cy + rh], fill=(255, 255, 255, 62))
              layer = layer.filter(ImageFilter.GaussianBlur(30))
              return Image.alpha_composite(base, layer).convert("RGB")


          def bg_minimal():
              a = vgrad([(10, 10, 12), (22, 20, 20), (12, 12, 14)], BH)
              glow(a, W / 2, 300, 900, (212, 175, 55), 0.16)
              im = to_img(a)
              ImageDraw.Draw(im).rectangle([40, 40, W - 40, BH - 40], outline=(212, 175, 55), width=2)
              return im


          BG = {"sunrise": bg_sunrise, "midnight": bg_midnight, "glass": bg_glass, "parchment": bg_parchment,
