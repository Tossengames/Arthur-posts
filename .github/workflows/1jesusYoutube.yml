              ("Daniel was thrown into a den of lions.", True, "God shut the lions' mouths, and Daniel was unharmed.", "Daniel 6:22"),
              ("Judas betrayed Jesus for thirty pieces of silver.", True, "The chief priests paid him thirty pieces of silver.", "Matthew 26:15"),
              ("Abraham's wife was named Rebekah.", False, "Abraham's wife was Sarah. Rebekah married his son Isaac.", "Genesis 17:15"),
              ("Elijah went up to heaven in a whirlwind.", True, "A chariot of fire and horses of fire appeared, and Elijah went up by a whirlwind.", "2 Kings 2:11"),
              ("Lazarus had been dead four days when Jesus raised him.", True, "Jesus called him out of the tomb, and he came out alive.", "John 11:39"),
              ("Jesus fed five thousand men with five loaves and two fish.", True, "Twelve baskets of leftovers were gathered afterward.", "Matthew 14:17"),
              ("The wise men came to Jerusalem from the west.", False, "The wise men came from the east.", "Matthew 2:1"),
              ("Genesis says God rested on the seventh day.", True, "After six days of creation, God rested from his work.", "Genesis 2:2"),
              ("The apostle Paul wrote the Gospel of John.", False, "Tradition credits the apostle John. Paul wrote letters like Romans.", "John 21:24"),
              ("King Solomon asked God for wisdom.", True, "God was pleased and gave him a wise and understanding heart.", "1 Kings 3:9"),
              ("The Israelites crossed the Red Sea on dry ground.", True, "The waters stood like a wall on their right and left.", "Exodus 14:22"),
              ("Zacchaeus climbed a fig tree to see Jesus.", False, "He climbed a sycamore tree.", "Luke 19:4"),
              ("Golgotha means the place of a skull.", True, "Jesus was crucified at this place.", "Matthew 27:33"),
              ("Esther became the queen of Egypt.", False, "Esther became queen of Persia.", "Esther 2:17"),
              ("The Gospel of Luke was written by a physician.", True, "Paul called Luke the beloved physician.", "Colossians 4:14"),
              ("Samson's strength was tied to his uncut hair.", True, "He told Delilah his strength would leave him if he was shaven.", "Judges 16:17"),
