          # (verse, book, ref, [2 wrong books])
          GB = [
              ("In the beginning God created the heaven and the earth.", "Genesis", "Genesis 1:1", ["Exodus", "Psalms"]),
              ("The LORD is my shepherd; I shall not want.", "Psalms", "Psalm 23:1", ["Proverbs", "Isaiah"]),
              ("For God so loved the world, that he gave his only begotten Son.", "John", "John 3:16", ["Romans", "Matthew"]),
