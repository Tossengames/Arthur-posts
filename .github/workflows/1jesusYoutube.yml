                        r=prng.choice([3, 4, 5, 7]) if pk == "twinkle" else prng.choice([5, 8, 12, 18])) for _ in range(pn)]
          SPR = {}


          def sprite(r, lvl):
              k = (r, lvl)
              if k not in SPR:
                  im = Image.new("RGBA", (r * 4, r * 4), (0, 0, 0, 0))
                  ImageDraw.Draw(im).ellipse([r, r, r * 3, r * 3], fill=hexrgb(pc) + (int(255 * lvl / 6),))
                  SPR[k] = im.filter(ImageFilter.GaussianBlur(max(1, r * 0.45)))
              return SPR[k]


          def draw_parts(img, t):
              for p in parts:
                  if pk == "twinkle":
                      a = 0.5 + 0.5 * math.sin(t * 1.7 + p["ph"])
                      x, y = p["x"], p["y"]
                  else:
                      a = 0.5 + 0.5 * math.sin(t * 1.1 + p["ph"])
                      y = (p["y"] - t * p["sp"]) % (H + 100) - 50
                      x = p["x"] + math.sin(t * 0.5 + p["ph"]) * 28
                  s = sprite(p["r"], int(a * 5) + 1)
                  img.paste(s, (int(x - s.width / 2), int(y - s.height / 2)), s)


          # ================================================================== IMAGE HELPERS
          def wrap(text, f, maxw):
              lines, cur = [], ""
              for w in text.split():
                  tr = (cur + " " + w).strip()
                  if cur and M.textlength(tr, font=f) > maxw:
                      lines.append(cur)
                      cur = w
                  else:
                      cur = tr
              if cur:
                  lines.append(cur)
              return lines


          def text_img(text, fp, size, color, maxw, shadow=True, lh=1.25):
              f = font(fp, size)
              lines = wrap(text, f, maxw)
              wd = int(max(M.textlength(l, font=f) for l in lines)) + 40
              hd = int(size * lh * len(lines)) + 30
              im = Image.new("RGBA", (wd, hd), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              for i, l in enumerate(lines):
                  cy = 15 + size * lh * (i + 0.5)
                  if shadow:
                      d.text((wd / 2 + 3, cy + 4), l, font=f, fill=(0, 0, 0, 110), anchor="mm")
                  d.text((wd / 2, cy), l, font=f, fill=rgba(color), anchor="mm")
              return im


          def panel_img(text, fp, size, maxw=930, maxh=700, pad=46, fillc=None, ink=None, outline=None, lh=1.3):
              while True:
                  f = font(fp, size)
                  lines = wrap(text, f, maxw - 2 * pad)
                  h = int(size * lh * len(lines)) + 2 * pad
                  if h <= maxh or size <= 28:
                      break
                  size -= 2
              wd = int(max(M.textlength(l, font=f) for l in lines)) + 2 * pad
              m = 14
              im = Image.new("RGBA", (wd + 2 * m, h + 2 * m), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              d.rounded_rectangle([m + 4, m + 8, m + wd + 4, m + h + 8], radius=44, fill=(0, 0, 0, 70))
              d.rounded_rectangle([m, m, m + wd, m + h], radius=44, fill=rgba(fillc or th["panel"]),
                                  outline=rgba(outline or th["acc"]), width=5)
              for i, l in enumerate(lines):
                  d.text((m + wd / 2, m + pad + size * lh * (i + 0.5)), l, font=f, fill=rgba(ink or th["pink"]), anchor="mm")
              return im


          def pill_img(text, fp, size, fill, ink, maxw=940, minw=0, outline="#FFFFFF"):
              while True:
                  f = font(fp, size)
                  tw = int(M.textlength(text, font=f))
                  w = max(int(tw + size * 1.6), minw)
                  if w <= maxw or size <= 26:
                      break
                  size -= 2
              h = int(size * 1.85)
              pad = 16
              im = Image.new("RGBA", (w + 2 * pad, h + 2 * pad), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              d.rounded_rectangle([pad + 4, pad + 8, pad + w + 4, pad + h + 8], radius=h // 2, fill=(0, 0, 0, 80))
              d.rounded_rectangle([pad, pad, pad + w, pad + h], radius=h // 2, fill=rgba(fill), outline=rgba(outline), width=5)
              d.text((pad + w / 2, pad + h / 2), text, font=f, fill=rgba(ink), anchor="mm")
              return im


          def choice_pill(text, i, state):
              if state == "ok":
                  fill, ink = "#2E9E5B", "#FFFFFF"
              elif state == "no":
                  fill, ink = "#4B515C", "#AEB3BC"
              else:
                  fill, ink = th["chips"][i % 4], th["chip_ink"]
              return pill_img(text, th["fb"], 54, fill, ink, minw=700)


          def num_img(n):
              s = 200
              im = Image.new("RGBA", (s, s), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              d.ellipse([10, 14, s - 6, s - 2], fill=(0, 0, 0, 80))
              d.ellipse([6, 6, s - 10, s - 10], fill=rgba(th["acc"]), outline=(255, 255, 255, 255), width=6)
              d.text((s / 2 - 2, s / 2 - 2), str(n), font=font(th["fh"], 110), fill=rgba(th["acc_ink"]), anchor="mm")
              return im


          def E(im, cx, cy, off=0.0, frac=0.0, until=None, fd=0.45, rise=True, tag=None):
              return dict(im=im, cx=cx, cy=cy, off=off, frac=frac, until=until, fd=max(fd, 0.001), rise=rise, tag=tag, a=0, b=None)


          def seg(text=None, dur=None, els=None, gap=0.3, cd=None, cd_y=None, kill=None, sfx=None):
              return dict(text=text, dur=dur, els=els or [], gap=gap, cd=cd, cd_y=cd_y, kill=kill or [], sfx=sfx)


          def header(title):
              return [E(pill_img(series, th["fh"], 40, th["acc"], th["acc_ink"], outline=th["tx"]), W / 2, 255, fd=0.01, rise=False),
                      E(text_img(title, th["fh"], 70, th["tx"], 940, shadow=th["sh"]), W / 2, 375, fd=0.01, rise=False)]


          # ================================================================== SPEECH HELPERS
          def spoken_ref(r):
              r = re.sub(r"^1 ", "First ", r)
              r = re.sub(r"^2 ", "Second ", r)
              r = re.sub(r"^3 ", "Third ", r)
              m = re.search(r"(\d+):(\d+)-(\d+)", r)
              if m:
                  return r[:m.start()] + f"chapter {m.group(1)}, verses {m.group(2)} through {m.group(3)}"
              m = re.search(r"(\d+):(\d+)", r)
              if m:
                  return r[:m.start()] + f"chapter {m.group(1)}, verse {m.group(2)}"
              return r


          def tts_clean(s):
              s = s.replace("_____", "blank").replace("___", "blank").replace("\u201c", "").replace("\u201d", "").replace('"', "")
              s = re.sub(r"\b[A-Z]{2,}\b", lambda m: m.group(0).capitalize(), s)
              return re.sub(r"\s+", " ", s).strip()


          def load(path):
              raw = subprocess.run(["ffmpeg", "-v", "error", "-i", path, "-f", "f32le", "-ac", "1", "-ar", str(SR), "-"],
                                   capture_output=True, check=True).stdout
              return np.frombuffer(raw, dtype=np.float32).copy()


          TTS_DEAD = False


          def synth(i, text):
              global TTS_DEAD
              if TTS_DEAD:
                  return None
              out = f"/tmp/seg{i}.mp3"
              clean = tts_clean(text)
              for v in VOICES:
                  for _ in range(2):
                      if os.path.exists(out):
                          os.remove(out)
                      try:
                          subprocess.run([sys.executable, "-m", "edge_tts", "--voice", v, "--rate=-6%", "--text", clean, "--write-media", out],
                                         capture_output=True, timeout=60)
                      except Exception:
                          pass
                      if os.path.exists(out) and os.path.getsize(out) > 0:
                          try:
                              return load(out)
                          except Exception:
                              pass
              TTS_DEAD = True
              return None


          # ================================================================== BUILDERS
          META = {}
          OUTRO_Q = "Comment your answer below, and follow for a new Bible quiz every day."
          HASH_Q = ["#BibleQuiz", "#BibleVerse", "#Jesus", "#ChristianShorts", "#KJV", "#Shorts"]
          TAGS_BASE = ["bible quiz", "bible trivia", "bible verse", "jesus", "christian shorts", "bible study", "kjv", "christian quiz", "faith", "scripture"]


          def choice_quiz(title, intro, ptxt, opts, ci, cd, say, outro, ref_label=None, extra=None, mode="keep", psize=58):
              els = header(title)
              pim = panel_img(ptxt, th["fb"], psize, maxw=930, maxh=450)
              els.append(E(pim, W / 2, 500 + pim.height / 2, fd=0.3))
              y1 = 500 + pim.height + 125
              ys = [y1 + i * 125 for i in range(len(opts))]
              ycd = ys[-1] + 195
              for i, o in enumerate(opts):
                  els.append(E(choice_pill(o, i, "n"), W / 2, ys[i], frac=0.5 + 0.1 * i, tag=f"opt{i}"))
              s1 = seg(text=intro, els=els, gap=0.2)
              s2 = seg(dur=cd, cd=cd, cd_y=ycd)
              rev = []
              if mode == "keep":
                  for i, o in enumerate(opts):
                      rev.append(E(choice_pill(o, i, "ok" if i == ci else "no"), W / 2, ys[i], fd=0.001, rise=False))
                  if ref_label:
                      rev.append(E(pill_img(ref_label, th["fb"], 46, th["acc"], th["acc_ink"]), W / 2, ycd, tag="ref", frac=0.2))
              else:
                  col = "#2E9E5B" if opts[ci] == "TRUE" else "#C0392B"
                  rev.append(E(pill_img(opts[ci], th["fh"], 64, col, "#FFFFFF", minw=520), W / 2, ys[0], fd=0.001, rise=False))
                  top = ys[0] + 80
                  eim = panel_img(extra, th["fb"], 44, maxw=930, maxh=1540 - top)
                  rev.append(E(eim, W / 2, top + eim.height / 2, frac=0.15))
              s3 = seg(text=say, els=rev, kill=[f"opt{i}" for i in range(len(opts))], sfx="chime")
              oel = []
              if mode == "keep":
                  oel.append(E(pill_img("COMMENT YOUR ANSWER", th["fh"], 44, th["acc"], th["acc_ink"]), W / 2, ycd, fd=0.4))
              s4 = seg(text=outro, els=oel, kill=["ref"] if mode == "keep" else [])
              return [s1, s2, s3, s4]


          def build_fill():
              ref, before, ans, after, dis = pick_item(FV, lambda p: p[0])
