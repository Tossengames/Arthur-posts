name: bible-shorts-post

"on":
  workflow_dispatch:
    inputs:
      game:
        description: "Format"
        required: false
        default: "auto"
        type: choice
        options: [auto, fill_verse, unscramble, true_false, order_events, guess_book, names_of_jesus, parable, message]
      theme:
        description: "Look"
        required: false
        default: "auto"
        type: choice
        options: [auto, sunrise_gold, midnight_stars, stained_glass, parchment, watercolor, minimal_dark, dawn_sky]
  schedule:
    - cron: "0 13 * * *"   # once a day, 9 AM EST / 13:00 UTC

permissions:
  contents: write

concurrency:
  group: bible-shorts-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq python3-pip fonts-noto-core fonts-dejavu-core fonts-liberation
          for p in fonts-ebgaramond fonts-lora fonts-playfair-display fonts-cinzel fonts-merriweather; do
            sudo apt-get install -y "$p" || true
          done
          pip install --quiet --break-system-packages pillow numpy edge-tts google-auth google-auth-oauthlib google-api-python-client || pip install --quiet pillow numpy edge-tts google-auth google-auth-oauthlib google-api-python-client

      - name: build-video
        id: build
        timeout-minutes: 14
        env:
          GAME: ${{ github.event.inputs.game }}
          THEME: ${{ github.event.inputs.theme }}
        run: |
          cat > bible.py << 'PYEOF'
          import os, re, json, random, math, subprocess, glob, wave, sys
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          W, H, FPS, SR = 1080, 1920, 24, 44100
          BH = H + 120
          VOICES = ["en-US-AndrewNeural", "en-US-GuyNeural", "en-US-AriaNeural"]

          # ================================================================== FONTS
          ALL_FONTS = glob.glob("/usr/share/fonts/**/*.[ot]tf", recursive=True)


          def pick(*cands, ital=False):
              for toks in cands:
                  for f in sorted(ALL_FONTS):
                      n = os.path.basename(f).lower()
                      if all(t in n for t in toks) and (("italic" in n) == ital):
                          return f
              return None


          SANS_B = pick(("notosans-bold",), ("liberationsans-bold",), ("dejavusans-bold",))
          SERIF_B = pick(("notoserif-bold",), ("liberationserif-bold",), ("dejavuserif-bold",))
          GAR_B = pick(("garamond", "bold"), ("lora", "bold"), ("cormorant", "bold")) or SERIF_B
          PLAY_B = pick(("playfair", "bold"), ("cinzel", "bold"), ("merriweather", "bold")) or SERIF_B
          SERIF_I = pick(("notoserif-bold",), ("dejavuserif-bold",), ("liberationserif-bold",), ital=True) or SERIF_B
          print("Fonts:", SANS_B, SERIF_B, GAR_B, PLAY_B, SERIF_I)

          _fc = {}


          def font(p, s):
              k = (p, s)
              if k not in _fc:
                  _fc[k] = ImageFont.truetype(p, s)
              return _fc[k]


          M = ImageDraw.Draw(Image.new("RGBA", (1, 1)))


          def hexrgb(h):
              h = h.lstrip("#")
              return tuple(int(h[i:i + 2], 16) for i in (0, 2, 4))


          def rgba(c, a=255):
              if isinstance(c, str):
                  return hexrgb(c) + (a,)
              return tuple(c) if len(c) == 4 else tuple(c) + (a,)


          # ================================================================== CONTENT (KJV, public domain)
          # Finish the Verse: (ref, text BEFORE the gap, ANSWER, text AFTER the gap, [2 wrong options])
          # Exactly one gap per verse, by construction.
          FV = [
              ("John 3:16", "For God so ", "loved", " the world, that he gave his only begotten Son.", ["saw", "knew"]),
              ("Psalm 23:1", "The LORD is my ", "shepherd", "; I shall not want.", ["guide", "father"]),
              ("Philippians 4:13", "I can do ", "all things", " through Christ which strengtheneth me.", ["great things", "hard things"]),
              ("Proverbs 3:5", "", "Trust", " in the LORD with all thine heart; and lean not unto thine own understanding.", ["Wait", "Boast"]),
              ("Isaiah 41:10", "Fear thou not; for I am with thee: be not ", "dismayed", "; for I am thy God: I will strengthen thee; yea, I will help thee.", ["troubled", "ashamed"]),
              ("Matthew 11:28", "Come unto me, all ye that labour and are heavy laden, and I will give you ", "rest", ".", ["peace", "strength"]),
              ("Jeremiah 29:11", "For I know the thoughts that I think toward you, saith the LORD, thoughts of ", "peace", ", and not of evil, to give you an expected end.", ["joy", "comfort"]),
              ("Joshua 1:9", "Have not I commanded thee? Be strong and of a good ", "courage", "; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.", ["heart", "mind"]),
              ("Psalm 119:105", "Thy word is a ", "lamp", " unto my feet, and a light unto my path.", ["sword", "staff"]),
              ("Genesis 1:1", "In the beginning God ", "created", " the heaven and the earth.", ["blessed", "called"]),
              ("Psalm 27:1", "The LORD is my ", "light", " and my salvation; whom shall I fear?", ["shepherd", "king"]),
              ("1 Corinthians 13:4", "Charity suffereth long, and is ", "kind", "; charity envieth not; charity vaunteth not itself, is not puffed up.", ["wise", "strong"]),
              ("Ephesians 2:8", "For by ", "grace", " are ye saved through faith; and that not of yourselves: it is the gift of God.", ["works", "law"]),
              ("Matthew 7:7", "Ask, and it shall be given you; seek, and ye shall find; ", "knock", ", and it shall be opened unto you.", ["pray", "call"]),
              ("Psalm 118:24", "This is the day which the LORD hath made; we will ", "rejoice", " and be glad in it.", ["sing", "kneel"]),
              ("2 Timothy 1:7", "For God hath not given us the spirit of ", "fear", "; but of power, and of love, and of a sound mind.", ["doubt", "pride"]),
              ("Hebrews 11:1", "Now ", "faith", " is the substance of things hoped for, the evidence of things not seen.", ["hope", "love"]),
              ("Luke 1:37", "For with God nothing shall be ", "impossible", ".", ["hidden", "hard"]),
              ("Proverbs 15:1", "A ", "soft answer", " turneth away wrath: but grievous words stir up anger.", ["quick reply", "loud voice"]),
              ("John 14:6", "Jesus saith unto him, I am the way, the ", "truth", ", and the life: no man cometh unto the Father, but by me.", ["light", "door"]),
              ("Matthew 6:33", "But seek ye ", "first", " the kingdom of God, and his righteousness; and all these things shall be added unto you.", ["only", "daily"]),
              ("1 John 4:8", "He that loveth not knoweth not God; for God is ", "love", ".", ["good", "just"]),
              ("Psalm 46:1", "God is our ", "refuge and strength", ", a very present help in trouble.", ["king and judge", "shield and sword"]),
              ("Romans 8:31", "What shall we then say to these things? If God be for us, who can be ", "against us", "?", ["beside us", "before us"]),
              ("Psalm 34:8", "O ", "taste and see", " that the LORD is good: blessed is the man that trusteth in him.", ["hear and know", "look and learn"]),
              ("Isaiah 40:31", "But they that wait upon the LORD shall renew their strength; they shall mount up with wings as ", "eagles", "; they shall run, and not be weary; and they shall walk, and not faint.", ["doves", "angels"]),
              ("Matthew 5:14", "Ye are the light of the world. A city that is set on an ", "hill", " cannot be hid.", ["rock", "tower"]),
              ("Galatians 6:9", "And let us not be weary in well doing: for in due season we shall ", "reap", ", if we faint not.", ["rest", "win"]),
          ]

          # (ref, verse) for unscramble
          UV = [
              ("Psalm 23:1", "The LORD is my shepherd; I shall not want."),
              ("Genesis 1:1", "In the beginning God created the heaven and the earth."),
              ("Luke 1:37", "For with God nothing shall be impossible."),
