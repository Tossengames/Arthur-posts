              ("Create in me a clean heart, O God; and renew a right spirit within me.", "Psalms", "Psalm 51:10", ["Proverbs", "Isaiah"]),
          ]

          # (name, meaning, KJV verse, ref)
          NJ = [
              ("Prince of Peace", "He brings peace with God, and peace to troubled hearts.", "And his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.", "Isaiah 9:6"),
