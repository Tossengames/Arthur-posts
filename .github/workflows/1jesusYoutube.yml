              ("Joseph", ["Sold by his brothers", "Thrown into prison in Egypt", "Interprets Pharaoh's dream", "Forgives his brothers"]),
              ("The Early Church", ["Pentecost", "Stephen is stoned", "Paul meets Jesus on the road", "Paul's first missionary journey"]),
              ("Jonah", ["God calls Jonah to Nineveh", "Jonah boards a ship to Tarshish", "Swallowed by a great fish", "Jonah preaches in Nineveh"]),
              ("Abraham", ["God calls Abram to leave Haran", "Isaac is born", "Abraham is tested on Mount Moriah", "Sarah dies"]),
