              META.update(
                  title=random.choice(t_opts)[:100],
                  hook="True or false? Test your Bible knowledge with this quick Bible fact challenge about Jesus and Scripture.",
                  body="Make your choice before the countdown ends. The answer and the verse are revealed at the end of the Short.",
                  cta="Comment TRUE or FALSE!",
                  comment=f"\u2705 {'TRUE' if ans else 'FALSE'}\n{expl} ({ref}, KJV)\n\nDid you get it right? \U0001F447",
                  hashtags=["#BibleQuiz", "#BibleTrivia", "#Jesus", "#ChristianShorts", "#KJV", "#Shorts"], tags=["true or false bible", "bible facts", "bible fact check"])
              return choice_quiz("TRUE OR FALSE?", "True or false? " + st, st, opts, ci, 4,
                                 f"{'True' if ans else 'False'}! {expl} That's {spoken_ref(ref)}.", OUTRO_Q, extra=f"{expl} ({ref})", mode="result", psize=56)


          def build_unscramble():
              ref, text = pick_item(UV, lambda p: p[0])
              words = text.split()
              sh = words[:]
              for _ in range(60):
                  random.shuffle(sh)
                  if sh != words:
                      break
              cd = int(min(16, max(8, len(words) * 0.9)))
              els = header("UNSCRAMBLE THE VERSE")
              sp = [pill_img(w, th["fb"], 50, th["chips"][i % 4], th["chip_ink"], maxw=1000) for i, w in enumerate(sh)]
              rows, cur = [[]], 0
              for s in sp:
                  if rows[-1] and cur + s.width > 1020:
                      rows.append([])
                      cur = 0
                  rows[-1].append(s)
                  cur += s.width
              rh = max(s.height for s in sp)
              y0 = 880 - len(rows) * rh / 2
              k = 0
              for r, row in enumerate(rows):
                  x = W / 2 - sum(s.width for s in row) / 2
                  for s in row:
                      els.append(E(s, x + s.width / 2, y0 + r * rh + rh / 2, frac=0.1 + 0.8 * k / len(sp), fd=0.35, tag="chips"))
                      x += s.width
                      k += 1
              ycd = min(1560, max(y0 + len(rows) * rh + 170, 1300))
              aim = panel_img("\u201c" + text + "\u201d", th["fb"], 56, maxw=930, maxh=560)
              ay = 540 + aim.height / 2
              rev = [E(aim, W / 2, ay, frac=0.0), E(pill_img(f"{ref} (KJV)", th["fb"], 46, th["acc"], th["acc_ink"]), W / 2, 540 + aim.height + 90, frac=0.7)]
              META.update(
                  title=random.choice([f"Unscramble This Bible Verse \U0001F9E9 Bible Quiz #{EP}", "Can You Rebuild This Bible Verse? \U0001F9E9 Bible Word Puzzle", f"Bible Word Puzzle: Unscramble the Verse #{EP}"]),
                  hook="Can you unscramble these words to rebuild a famous Bible verse? A fun Bible word puzzle to test your Scripture knowledge.",
                  body="Rearrange the words in your head, then check the answer at the end of the Short.",
                  cta="Comment the first word of the verse!",
                  comment=f"\u2705 {ref} (KJV)\n\n\"{text}\"\n\nHow fast did you get it? \U0001F447",
                  hashtags=HASH_Q, tags=["bible word puzzle", "unscramble bible verse", ref.lower()])
              return [seg(text="Unscramble these words to rebuild a Bible verse.", els=els, gap=0.2),
                      seg(dur=cd, cd=cd, cd_y=ycd),
                      seg(text=f"{text} {spoken_ref(ref)}.", els=rev, kill=["chips"], sfx="chime"),
                      seg(text=OUTRO_Q)]


          def build_order():
              topic, evs = pick_item(OE, lambda p: p[0])
              idx = [0, 1, 2, 3]
              for _ in range(60):
                  random.shuffle(idx)
                  if idx != [0, 1, 2, 3]:
                      break
              shown = [evs[i] for i in idx]
              L = "ABCD"
              els = header("PUT IT IN ORDER")
              q = panel_img(f"{topic}: what happened first to last?", th["fb"], 48, maxw=930, maxh=230)
              els.append(E(q, W / 2, 500 + q.height / 2, fd=0.3))
              y1 = 500 + q.height + 125
              ys = [y1 + i * 135 for i in range(4)]
              ycd = ys[-1] + 195
              for i in range(4):
                  els.append(E(choice_pill(f"{L[i]}) {shown[i]}", i, "n"), W / 2, ys[i], frac=0.45 + 0.12 * i, tag=f"opt{i}"))
              intro = f"Put these Bible events in the right order. {topic}. " + " ".join(f"{L[i]}, {shown[i]}." for i in range(4))
              rev = [E(choice_pill(f"{i + 1}. {evs[i]}", i, "n"), W / 2, ys[i], frac=0.05 + 0.2 * i, fd=0.35) for i in range(4)]
              say = f"Here is the correct order. First, {evs[0]}. Second, {evs[1]}. Third, {evs[2]}. And finally, {evs[3]}."
              META.update(
                  title=random.choice([f"Put These Bible Events in Order \u23F3 {topic} Quiz", f"Order the Events: {topic} | Bible Quiz #{EP}", f"Can You Order These {topic} Events? \U0001F4D6"]),
                  hook=f"Can you put these {topic} events from the Bible in the right order? A quick Bible quiz about Jesus and Scripture.",
                  body="Think it through, then check the correct order at the end of the Short.",
                  cta="Comment your order, like B A D C!",
                  comment="\u2705 Correct order:\n" + "\n".join(f"{i + 1}. {evs[i]}" for i in range(4)) + "\n\nHow did you do? \U0001F447",
                  hashtags=["#BibleQuiz", "#BibleStudy", "#Jesus", "#ChristianShorts", "#KJV", "#Shorts"], tags=["bible events in order", topic.lower(), "bible timeline"])
              return [seg(text=intro, els=els, gap=0.2), seg(dur=7, cd=7, cd_y=ycd),
                      seg(text=say, els=rev, kill=[f"opt{i}" for i in range(4)], sfx="chime"), seg(text=OUTRO_Q)]


          def build_names():
              name, meaning, verse, ref = pick_item(NJ, lambda p: p[0])
              nim = panel_img(name, th["fh"], 80, maxw=930, maxh=330, fillc=th["acc"], ink=th["acc_ink"], outline="#FFFFFF")
              mim = panel_img(meaning, th["fb"], 46, maxw=930, maxh=300)
              y = 500
              ny = y + nim.height / 2
              y += nim.height + 30
              my = y + mim.height / 2
              y += mim.height + 30
              vim = panel_img("\u201c" + verse + "\u201d", SERIF_I, 42, maxw=930, maxh=max(250, 1520 - y - 120))
              vy = y + vim.height / 2
              y += vim.height + 10
              rim = pill_img(f"{ref} (KJV)", th["fb"], 44, th["acc"], th["acc_ink"])
              ry = y + rim.height / 2
              META.update(
                  title=random.choice([f"{name}: What Does This Name of Jesus Mean? \u271D\uFE0F", f"Why Is Jesus Called {name}?", f"Names of Jesus #{EP}: {name} Meaning"]),
                  hook=f"{name} is one of the names of Jesus in the Bible. Learn what it means and where it appears in Scripture.",
                  body=f"{name}: {meaning}\n\n{ref} (KJV): \"{verse}\"",
                  cta="Comment your favorite name of Jesus!",
                  comment=f"\u271D\uFE0F {name}\n{meaning}\n{ref} (KJV)\n\nWhat is your favorite name of Jesus? \U0001F447",
                  hashtags=["#NamesOfJesus", "#Jesus", "#Bible", "#Christian", "#KJV", "#Shorts"], tags=["names of jesus", name.lower(), "who is jesus", ref.lower()])
              return [seg(text=f"Names of Jesus. Today: {name}.", els=header("NAMES OF JESUS") + [E(nim, W / 2, ny)], sfx="chime"),
                      seg(text=meaning, els=[E(mim, W / 2, my)]),
                      seg(text=f"In {spoken_ref(ref)}, we read: {verse}", els=[E(vim, W / 2, vy), E(rim, W / 2, ry, frac=0.5)]),
                      seg(text="Follow for more names of Jesus, and leave a comment with your favorite.")]


          def build_parable():
              title, ref, summary, lesson = pick_item(PB, lambda p: p[0])
              tim = panel_img(title, th["fh"], 70, maxw=930, maxh=260, fillc=th["acc"], ink=th["acc_ink"], outline="#FFFFFF")
              rim = pill_img(f"{ref} (KJV)", th["fb"], 42, th["chips"][0], th["chip_ink"])
              y = 500
              ty = y + tim.height / 2
              y += tim.height + 10
              ry = y + rim.height / 2
              y += rim.height + 30
              sim = panel_img(summary, th["fb"], 44, maxw=930, maxh=520)
              sy = y + sim.height / 2
              y += sim.height + 30
              lim = panel_img("Lesson: " + lesson, th["fb"], 44, maxw=930, maxh=max(200, 1540 - y), outline="#FFFFFF", fillc=th["chips"][1], ink=th["chip_ink"])
              ly = y + lim.height / 2
              META.update(
                  title=random.choice([f"{title} Explained in 1 Minute \u271D\uFE0F Parables of Jesus", f"{title}: Meaning of the Parable ({ref})", f"Parables of Jesus: {title} #{EP}"]),
                  hook=f"{title} is one of the parables of Jesus in the Bible ({ref}). Here is the story and its meaning in under a minute.",
                  body=f"The story: {summary}\n\nThe lesson: {lesson}",
                  cta="Comment your favorite parable of Jesus!",
                  comment=f"\u271D\uFE0F {title} ({ref})\nLesson: {lesson}\n\nWhat is your favorite parable? \U0001F447",
                  hashtags=["#ParablesOfJesus", "#Jesus", "#Bible", "#Christian", "#KJV", "#Shorts"], tags=["parables of jesus", title.lower(), "bible stories", ref.lower()])
              return [seg(text=f"{title}. {spoken_ref(ref)}.", els=header("PARABLES OF JESUS") + [E(tim, W / 2, ty), E(rim, W / 2, ry, frac=0.4)], sfx="chime"),
                      seg(text=summary, els=[E(sim, W / 2, sy)]),
                      seg(text="The lesson: " + lesson, els=[E(lim, W / 2, ly)]),
                      seg(text="Follow for more Bible stories and teachings from Jesus.")]


          def build_message():
              hook, msg, verse, ref = pick_item(MSG, lambda p: p[0])
              him = panel_img(hook, th["fh"], 62, maxw=930, maxh=300, fillc=th["acc"], ink=th["acc_ink"], outline="#FFFFFF")
              mim = panel_img(msg, th["fb"], 50, maxw=930, maxh=420)
              y = 500
              hy = y + him.height / 2
              y += him.height + 30
              my = y + mim.height / 2
              y += mim.height + 30
              vim = panel_img("\u201c" + verse + "\u201d", SERIF_I, 42, maxw=930, maxh=max(250, 1540 - y - 110))
              vy = y + vim.height / 2
              y += vim.height + 10
              rim = pill_img(f"{ref} (KJV)", th["fb"], 44, th["acc"], th["acc_ink"])
              ry = y + rim.height / 2
              short_hook = hook.rstrip(".")
              META.update(
                  title=random.choice([f"{short_hook}, Listen to This \u2728 Bible Encouragement", f"A Message for You Today \U0001F49B {ref}", f"{short_hook} | Encouraging Bible Verse"])[:100],
                  hook=f"{short_hook}, here is a short, encouraging message from the Bible ({ref}) to lift your faith today.",
                  body=f"{msg}\n\n{ref} (KJV): \"{verse}\"",
                  cta="Share this with someone who needs encouragement today.",
                  comment=f"\U0001F49B {msg}\n\n{ref} (KJV): \"{verse}\"\n\nWho needs to hear this today? Share it with them \U0001F447",
                  hashtags=["#Encouragement", "#BibleVerse", "#Faith", "#Jesus", "#ChristianShorts", "#Shorts"],
                  tags=["encouraging bible verse", "bible verse for today", "daily encouragement", "christian encouragement", ref.lower()])
              return [seg(text="A message for you. " + hook, els=header("A MESSAGE FOR YOU") + [E(him, W / 2, hy)], sfx="chime"),
                      seg(text=msg, els=[E(mim, W / 2, my)]),
                      seg(text=f"{spoken_ref(ref)}. {verse}", els=[E(vim, W / 2, vy), E(rim, W / 2, ry, frac=0.5)]),
                      seg(text="You are loved, and you are not alone. Follow for a new message every day.")]


          segs = {"fill_verse": build_fill, "unscramble": build_unscramble, "true_false": build_tf, "order_events": build_order,
                  "guess_book": build_guess, "names_of_jesus": build_names, "parable": build_parable, "message": build_message}[fmt]()

          # ================================================================== TIMELINE
          t = 0.15
          for i, s in enumerate(segs):
              if s["text"]:
                  a = synth(i, s["text"])
                  if a is not None and len(a) > 0:
                      a = a / (float(np.max(np.abs(a))) or 1.0) * 0.9
                      s["audio"] = a
                      s["dur"] = len(a) / SR + 0.1
                  else:
                      s["audio"] = None
                      s["dur"] = max(2.0, len(s["text"].split()) * 0.42)
              s["start"], s["end"] = t, t + s["dur"]
              t = s["end"] + s["gap"]
          TOTAL = segs[-1]["end"] + 1.4
          print(f"Total duration: {TOTAL:.1f}s")

          els_all, sfx, ticks = [], [], []
          for s in segs:
              st, en = s["start"], s["end"]
              for tag in s["kill"]:
                  for e in els_all:
                      if e["tag"] == tag and e["b"] is None:
                          e["b"] = st
                          e["fdo"] = 0.12
              for e in s["els"]:
                  e["a"] = st + e["off"] + e["frac"] * s["dur"]
                  e["b"] = en if e["until"] == "seg" else None
                  els_all.append(e)
              if s["cd"]:
                  for k in range(s["cd"]):
                      els_all.append(dict(im=num_img(s["cd"] - k), cx=W / 2, cy=s["cd_y"], a=st + k, b=st + k + 1, fd=0.001,
                                          rise=False, tag=None, until=None, off=0, frac=0))
                      ticks.append(st + k)
              if s["sfx"]:
                  sfx.append((st, s["sfx"]))


          # ================================================================== RENDER FRAMES
          def fade(im, a):
              r, g, b, al = im.split()
              al = al.point(lambda v: int(v * a))
              return Image.merge("RGBA", (r, g, b, al))


          def render(t):
              off = int(60 + 60 * math.sin(t * 0.25))
              img = BG.crop((0, off, W, off + H))
              draw_parts(img, t)
              for e in els_all:
                  if t < e["a"]:
                      continue
                  if e["b"] is not None and t >= e["b"]:
                      al = 1 - (t - e["b"]) / e.get("fdo", e["fd"])
                      if al <= 0:
                          continue
                      dy = 0
                  else:
                      x = min(1.0, (t - e["a"]) / e["fd"])
                      al = 1 - (1 - x) ** 3
                      dy = (1 - al) * 36 if e["rise"] else 0
                  im = e["im"] if al >= 0.99 else fade(e["im"], al)
                  img.paste(im, (int(e["cx"] - im.width / 2), int(e["cy"] + dy - im.height / 2)), im)
              return img


          # ================================================================== AUDIO
          buf = np.zeros(int((TOTAL + 0.5) * SR), dtype=np.float32)


          def tone(freq, d_, vol, decay):
              tt = np.arange(int(SR * d_)) / SR
              return (np.sin(2 * np.pi * freq * tt) * np.exp(-decay * tt) * vol).astype(np.float32)


          SND = {"tick": tone(880, 0.06, 0.22, 60),
                 "chime": tone(784, 1.4, 0.30, 3.5) + tone(988, 1.4, 0.22, 3.5) + tone(1319, 1.4, 0.16, 3.5)}


          def mix(snd, at, gain=1.0):
              i = int(at * SR)
              n = min(len(snd), len(buf) - i)
              if n > 0 and i >= 0:
                  buf[i:i + n] += snd[:n] * gain


          for tk in ticks:
              mix(SND["tick"], tk)
          for at, name in sfx:
              mix(SND[name], at)
          for s in segs:
              if s.get("audio") is not None:
                  mix(s["audio"], s["start"])


          def pad_music(total):
              tt = np.arange(int(total * SR)) / SR
              root = random.choice([130.81, 146.83, 164.81, 174.61, 196.0])
              out = np.zeros_like(tt)
              for r, a in ((1, 1.0), (1.5, 0.7), (2, 0.6), (2.5, 0.4), (3, 0.3)):
                  out += a * np.sin(2 * np.pi * root * r * tt + random.uniform(0, 6.28)) * (0.7 + 0.3 * np.sin(2 * np.pi * random.uniform(0.07, 0.15) * tt))
              return (out / (np.max(np.abs(out)) or 1)).astype(np.float32)


          # music: one folder, bgmusic/
          EXTS = ("mp3", "wav", "m4a", "aac", "ogg", "flac", "mp4")
          cands = [p for e in EXTS for p in glob.glob(f"bgmusic/*.{e}")]
          m = None
          if cands:
              try:
                  mp = random.choice(cands)
                  dd = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", mp], capture_output=True, text=True).stdout.strip()
                  mdur = float(dd) if dd else 0
                  ms = random.uniform(0, mdur - TOTAL - 2) if mdur > TOTAL + 4 else 0
                  raw = subprocess.run(["ffmpeg", "-v", "error", "-stream_loop", "-1", "-ss", f"{ms:.1f}", "-t", f"{TOTAL:.1f}", "-i", mp,
                                        "-f", "f32le", "-ac", "1", "-ar", str(SR), "-"], capture_output=True).stdout
                  m = np.frombuffer(raw, dtype=np.float32).copy()
                  m = m / (float(np.max(np.abs(m))) or 1.0)
                  print("Music:", mp)
              except Exception as ex:
                  print("music failed:", ex)
                  m = None
          if m is None or len(m) == 0:
              m = pad_music(TOTAL)
          n = min(len(m), len(buf))
          env = np.ones(n, dtype=np.float32)
          fi, fo = int(SR * 0.6), int(SR * 1.2)
          if n > fi + fo:
              env[:fi] = np.linspace(0, 1, fi)
              env[-fo:] = np.linspace(1, 0, fo)
          buf[:n] += m[:n] * env * 0.15

          buf = np.clip(buf * 0.92, -1, 1)
          with wave.open("audio.wav", "wb") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(SR)
              wf.writeframes((buf * 32767).astype(np.int16).tobytes())

          # ================================================================== ENCODE
          ff = subprocess.Popen(["ffmpeg", "-v", "error", "-y", "-f", "rawvideo", "-pix_fmt", "rgb24", "-s", f"{W}x{H}", "-r", str(FPS),
                                 "-i", "-", "-i", "audio.wav", "-c:v", "libx264", "-preset", "veryfast", "-crf", "20", "-pix_fmt", "yuv420p",
                                 "-c:a", "aac", "-b:a", "192k", "-ac", "2", "-t", f"{TOTAL:.2f}", "-movflags", "+faststart", "final.mp4"],
                                stdin=subprocess.PIPE)
          for k in range(int(TOTAL * FPS)):
              ff.stdin.write(render(k / FPS).tobytes())
          ff.stdin.close()
          ff.wait()

          # ================================================================== METADATA (SEO)
          desc = (f"{META['hook']}\n\n{META['body']}\n\n\U0001F4AC {META['cta']}\n\n"
                  "\U0001F4D6 Bible translation: King James Version (KJV, public domain).\n"
                  "\U0001F514 Subscribe for a new Bible quiz, verse, and teaching about Jesus every day.\n\n" + " ".join(META["hashtags"]))
          tags, total_len = [], 0
          for tg in TAGS_BASE + META["tags"]:
              if tg not in tags and total_len + len(tg) + 3 < 480:
                  tags.append(tg)
                  total_len += len(tg) + 3
          json.dump(dict(title=META["title"][:100], description=desc[:4900], tags=tags, comment=META["comment"], fmt=fmt),
                    open("meta.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          used["_last_fmt"] = fmt
          used["_last_theme"] = tname
          json.dump(used, open(USED_FILE, "w"), ensure_ascii=False, indent=1)
          print("Title:", META["title"])
          print("Done.")
          PYEOF

          python3 bible.py
          ls -lh final.mp4

      - name: post-to-youtube
        id: post
        timeout-minutes: 8
        env:
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_PLAYLISTS: ${{ secrets.YT_PLAYLISTS }}
        run: |
          python3 << 'PYEOF'
          import os, json, time
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials

          meta = json.load(open("meta.json", encoding="utf-8"))

          creds = Credentials(
              token=os.environ.get("YT_ACCESS_TOKEN"),
              refresh_token=os.environ.get("YT_REFRESH_TOKEN"),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ.get("YT_CLIENT_ID"),
              client_secret=os.environ.get("YT_CLIENT_SECRET"),
          )
          youtube = build("youtube", "v3", credentials=creds)

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": meta["title"],
                      "description": meta["description"],
                      "tags": meta["tags"],
                      "categoryId": "27",
                      "defaultLanguage": "en",
                      "defaultAudioLanguage": "en",
                  },
                  "status": {"privacyStatus": "public", "selfDeclaredMadeForKids": False},
              },
              media_body=MediaFileUpload("final.mp4", mimetype="video/mp4", resumable=True),
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"Upload progress: {int(status.progress() * 100)}%")

          vid = response.get("id", "")
          print(f"Uploaded: https://youtube.com/shorts/{vid}")

          for attempt in range(4):
              try:
                  time.sleep(20)
                  youtube.commentThreads().insert(
                      part="snippet",
                      body={"snippet": {"videoId": vid, "topLevelComment": {"snippet": {"textOriginal": meta["comment"]}}}},
                  ).execute()
                  print("Comment posted")
                  break
              except Exception as ex:
                  print(f"::warning::Comment attempt {attempt + 1} failed: {ex}")

          try:
              pl = json.loads(os.environ.get("YT_PLAYLISTS") or "{}")
              pid = pl.get(meta["fmt"])
              if pid:
                  youtube.playlistItems().insert(
                      part="snippet",
                      body={"snippet": {"playlistId": pid, "resourceId": {"kind": "youtube#video", "videoId": vid}}},
                  ).execute()
                  print("Added to playlist")
          except Exception as ex:
              print(f"::warning::Playlist add failed: {ex}")
          PYEOF

