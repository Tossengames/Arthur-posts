name: Test Workflow

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Print hello
        run: echo "Hello from GitHub Actions!"
      
      - name: Show current time
        run: date
      
      - name: List files
        run: ls -la