name: Test Simple Workflow

on:
  workflow_dispatch:
    inputs:
      test_input:
        description: "Test input"
        required: false
        default: "Hello"
        type: string
  schedule:
    - cron: "0 20 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Print test message
        run: echo "Test workflow is working!"
      
      - name: Show input
        run: echo "Input was: ${{ github.event.inputs.test_input || 'default' }}"
      
      - name: Show date
        run: date