name: ✝️ Post Bible Reel to Facebook + YouTube

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Force a topic id (leave empty to pick the next unposted one)"
        required: false
        default: ""
      dry_run:
        description: "Render only: do not post and do not remember the topic"
        type: boolean
        default: false
      yt_privacy:
        description: "YouTube privacy for this run"
        type: choice
        default: "public"
        options: [public, unlisted, private]
  schedule:
    - cron: "0 14 * * *"   # checks every day at 14:00 UTC, but only posts when MIN_DAYS_BETWEEN_POSTS has passed

env:
  MIN_DAYS_BETWEEN_POSTS: "3"   # 1 = every day, 2 = every other day, 3 = every 3 days

permissions:
  contents: write           # lets the job commit posted.json back to the repo

concurrency:
  group: bible-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if a post is due
        id: due
        run: |
          python3 - << 'PYEOF'
          import json, os, datetime
          need = int(os.environ.get("MIN_DAYS_BETWEEN_POSTS", "3"))
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          due = True
          if event == "schedule" and os.path.exists("posted.json"):
            try:
              hist = json.load(open("posted.json")).get("posted", [])
            except Exception:
              hist = []
            dates = [r.get("date") for r in hist if r.get("date")]
            if dates:
              last = datetime.date.fromisoformat(max(dates))
              gap = (datetime.datetime.utcnow().date() - last).days
              print(f"Last post: {last} ({gap} day(s) ago). Needs {need}.")
              due = gap >= need
          print("Post due:", due)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"due={'true' if due else 'false'}\n")
          PYEOF

      - name: Install ffmpeg
        if: steps.due.outputs.due == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Cache pip
        if: steps.due.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-bible-v2

      - name: Cache Piper binary and voice
        if: steps.due.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-binary-jenny-dioco-v3

      - name: Setup Python
        if: steps.due.outputs.due == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python deps
        if: steps.due.outputs.due == 'true'
        run: pip install selenium requests edge-tts google-auth google-auth-oauthlib google-api-python-client

      - name: Download Piper binary and voice (backup voice)
        if: steps.due.outputs.due == 'true'
        run: |
          mkdir -p ~/.cache/piper
          PIPER_BIN=~/.cache/piper/piper

          if [ ! -f "$PIPER_BIN" ]; then
            echo "Downloading Piper binary..."
            curl -L -o /tmp/piper.tar.gz \
              "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" || {
              echo "Piper download failed - will rely on Edge TTS"
              exit 0
            }
            mkdir -p /tmp/piper_extract
            tar -xzf /tmp/piper.tar.gz -C /tmp/piper_extract
            FOUND=$(find /tmp/piper_extract -name "piper" -type f | head -1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" "$PIPER_BIN"
              chmod +x "$PIPER_BIN"
              find /tmp/piper_extract -name "*.so*" -exec cp {} ~/.cache/piper/ \;
              echo "Piper binary ready."
            else
              echo "Piper binary not found in tarball - will rely on Edge TTS"
            fi
          else
            echo "Piper binary already cached."
          fi

          VOICE_FILE=~/.cache/piper/en_US-jenny_dioco-medium.onnx
          CONFIG_FILE=~/.cache/piper/en_US-jenny_dioco-medium.onnx.json
          if [ ! -f "$VOICE_FILE" ]; then
            echo "Downloading jenny_dioco voice..."
            curl -L -o "$VOICE_FILE" \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/jenny_dioco/medium/en_US-jenny_dioco-medium.onnx" || true
            curl -L -o "$CONFIG_FILE" \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/jenny_dioco/medium/en_US-jenny_dioco-medium.onnx.json" || true
          else
            echo "Voice model already cached."
          fi

      - name: Render and Post (Facebook + YouTube)
        if: steps.due.outputs.due == 'true'
        run: |
          python3 << 'PYEOF'
          import os, sys, json, math, time, random, subprocess, base64, re, glob, tempfile, asyncio, datetime
          from pathlib import Path
          import requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          # ════════════════════════════════════════════════════════════════
          #  SETTINGS  (everything you are likely to edit is in this block)
          # ════════════════════════════════════════════════════════════════

          # ── Music folders (exact names, case-sensitive). Missing/empty folder = that platform posts with NO music.
          FB_MUSIC_FOLDER   = "bgmusic"        # Facebook uses this folder
          YT_MUSIC_FOLDER   = "bgmusic2Y"      # YouTube uses this folder
          MUSIC_EXTENSIONS  = ["mp3", "wav", "m4a", "mp4", "aac", "ogg", "flac", "wma", "opus"]

          # ── Volumes (1.0 = unchanged)
          FB_MUSIC_VOLUME   = 0.12
          YT_MUSIC_VOLUME   = 0.12
          SFX_VOLUME        = 0.8              # watercolor sound effects
          VOICE_VOLUME      = 1.0

          # ── Voice
          EDGE_VOICE        = "en-US-AndrewNeural"   # try en-US-JennyNeural or en-US-GuyNeural too
          EDGE_RATE         = "-8%"                  # a little slower suits scripture
          CTA_CHANCE        = 0.40                   # chance of a spoken call-to-action at the end (0 to 1)
          CTA_POOL = ["Follow for daily scripture", "Share this with someone who needs it", "Save this for later",
                      "Tag a friend who needs to hear this", "Follow along", "Pass it on"]

          # ── Video
          FPS               = 24

          # ── Facebook
          FB_API_VERSION    = "v18.0"
          FB_FOOTER         = "Scripture: King James Version (public domain). Read the full passage in your Bible."

          # ── YouTube
          YT_DEFAULT_PRIVACY = "public"              # public, unlisted or private (manual runs can override)
          YT_CATEGORY_ID     = "27"                  # 27 = Education
          YT_TITLE_SUFFIX    = " #Shorts"
          YT_EXTRA_TAGS      = ["bible", "bible verse", "jesus", "kjv", "scripture", "faith", "christian shorts", "bible story"]
          YT_FOOTER          = ("Scripture: King James Version (public domain). Read the full passage in your Bible.\n"
                                "Subscribe for a new Bible story every few days.")
          YT_COMMENT_QUESTION = "What does this verse mean to you? \U0001F447"
          YT_PLAYLIST_KEY    = "bible_reel"          # optional: add {"bible_reel": "PLAYLIST_ID"} to the YT_PLAYLISTS secret

          # ── Files
          PIPER_BIN        = str(Path.home() / ".cache/piper/piper")
          PIPER_VOICE      = str(Path.home() / ".cache/piper/en_US-jenny_dioco-medium.onnx")
          HTML_FILE        = "bible.html"
          POSTED_FILE      = Path("posted.json")
          OUT_DIR          = Path("out"); OUT_DIR.mkdir(exist_ok=True)

          # ════════════════════════════════════════════════════════════════
          #  END OF SETTINGS
          # ════════════════════════════════════════════════════════════════

          # ── POSTED-TOPIC MEMORY ───────────────────────────────
          def load_hist():
            if POSTED_FILE.exists():
              try: return json.loads(POSTED_FILE.read_text()).get("posted", [])
              except Exception: return []
            return []

          def save_hist(hist):
            POSTED_FILE.write_text(json.dumps({"posted": hist}, indent=2) + "\n")

          def pick_topic(ids, hist):
            # go through the pool once before any topic repeats
            used = []
            for rec in reversed(hist):
              if rec.get("id") in used: break
              used.append(rec.get("id"))
            used = [u for u in used if u in ids]
            if len(set(used)) >= len(ids): used = []
            remaining = [i for i in ids if i not in used]
            return random.choice(remaining or ids)

          # ── VOICE (Edge TTS first, Piper as backup) ───────────
          def clean_for_tts(text):
            text = text.replace('\u2014', ', ').replace('\u2013', ', ')
            text = text.replace('*', '').replace('#', '').replace('_', '')
            return re.sub(r'\s+', ' ', text).strip()

          def make_silence(duration_s, out_path, sample_rate=24000):
            subprocess.run(["ffmpeg", "-y", "-f", "lavfi", "-i", f"anullsrc=r={sample_rate}:cl=mono",
                            "-t", f"{duration_s:.3f}", "-acodec", "pcm_s16le", out_path], capture_output=True)

          async def edge_speak_async(text, out_mp3):
            try:
              import edge_tts
              await edge_tts.Communicate(text, EDGE_VOICE, rate=EDGE_RATE, pitch="+0Hz").save(out_mp3)
              return Path(out_mp3).exists() and Path(out_mp3).stat().st_size > 100
            except Exception as e:
              print(f"  Edge TTS error: {e}")
              return False

          def edge_speak(text, out_wav):
            out_mp3 = out_wav.replace(".wav", "_edge.mp3")
            if not asyncio.run(edge_speak_async(text, out_mp3)): return False
            r = subprocess.run(["ffmpeg", "-y", "-i", out_mp3, "-acodec", "pcm_s16le", "-ar", "24000", "-ac", "1", out_wav], capture_output=True)
            try: os.remove(out_mp3)
            except Exception: pass
            return r.returncode == 0 and Path(out_wav).exists() and Path(out_wav).stat().st_size > 100

          def piper_speak(text, out_wav):
            if not Path(PIPER_BIN).exists() or not Path(PIPER_VOICE).exists(): return False
            try:
              env = os.environ.copy()
              env["LD_LIBRARY_PATH"] = str(Path.home() / ".cache/piper") + ":" + env.get("LD_LIBRARY_PATH", "")
              res = subprocess.run([PIPER_BIN, "--model", PIPER_VOICE, "--output_file", out_wav],
                                   input=text.encode("utf-8"), capture_output=True, timeout=60, env=env)
              return res.returncode == 0 and Path(out_wav).exists() and Path(out_wav).stat().st_size > 100
            except Exception as e:
              print(f"  Piper exception: {e}")
              return False

          def synthesise(text, out_wav):
            text = clean_for_tts(text)
            if not text: return False          # the silent cover line ends up here
            print(f"  Speaking: '{text[:70]}{'...' if len(text) > 70 else ''}'")
            if edge_speak(text, out_wav): return True
            print("  -> Edge failed, trying Piper...")
            return piper_speak(text, out_wav)

          def norm_wav(src, dst):  # every segment becomes 24 kHz mono so they can be joined safely
            r = subprocess.run(["ffmpeg", "-y", "-i", src, "-ar", "24000", "-ac", "1", "-acodec", "pcm_s16le", dst], capture_output=True)
            return r.returncode == 0 and Path(dst).exists()

          def duration_of(path):
            p = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", path], capture_output=True, text=True)
            try: return float(p.stdout.strip())
            except Exception: return 0.0

          def concat_wavs(wavs, out_path):
            lst = out_path + ".txt"
            with open(lst, "w") as f:
              for w in wavs: f.write(f"file '{w}'\n")
            r = subprocess.run(["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", lst, "-acodec", "pcm_s16le", out_path], capture_output=True)
            return r.returncode == 0 and Path(out_path).exists()

          # ── MUSIC (one exact folder per platform; none found = no music) ──
          def pick_music(folder, label):
            if not Path(folder).is_dir():
              print(f"[{label}] Music folder '{folder}' not found -> posting WITHOUT music.")
              return None
            found = []
            for ext in MUSIC_EXTENSIONS:
              found += glob.glob(os.path.join(folder, f"*.{ext}")) + glob.glob(os.path.join(folder, f"*.{ext.upper()}"))
            found = sorted(set(found))
            if not found:
              print(f"[{label}] Music folder '{folder}' is empty -> posting WITHOUT music.")
              return None
            m = random.choice(found)
            print(f"[{label}] Music: {m}")
            return m

          def music_start(path):
            d = duration_of(path)
            return random.uniform(0, max(0, d - 12)) if d > 15 else 0

          # ── FINAL MIX: attach one platform's audio to the already-encoded picture (no re-encode) ──
          def mux_final(video_in, sfx_raw, voice_wav, music_path, music_vol, out_path, total):
            cmd = ["ffmpeg", "-y", "-i", video_in, "-f", "s16le", "-ar", "48000", "-ac", "2", "-i", sfx_raw]
            nxt = 2; vi = mi = None
            if voice_wav:  cmd += ["-i", voice_wav]; vi = nxt; nxt += 1
            if music_path: cmd += ["-stream_loop", "-1", "-ss", f"{music_start(music_path):.2f}", "-t", f"{total:.3f}", "-i", music_path]; mi = nxt; nxt += 1
            af = [f"[1:a]volume={SFX_VOLUME},apad=whole_dur={total:.3f}[sfx]"]; mix = ["[sfx]"]
            if vi is not None:
              af.append(f"[{vi}:a]aresample=48000,aformat=channel_layouts=stereo,volume={VOICE_VOLUME},apad=whole_dur={total:.3f}[voice]"); mix.append("[voice]")
            if mi is not None:
              af.append(f"[{mi}:a]aresample=48000,aformat=channel_layouts=stereo,volume={music_vol},afade=t=in:st=0:d=1.5,"
                        f"afade=t=out:st={max(0.0, total - 1.5):.3f}:d=1.5,apad=whole_dur={total:.3f}[music]"); mix.append("[music]")
            af.append("".join(mix) + f"amix=inputs={len(mix)}:duration=longest:dropout_transition=0,volume={len(mix)},alimiter=limit=0.95[a]")
            cmd += ["-filter_complex", ";".join(af), "-map", "0:v", "-map", "[a]", "-t", f"{total:.3f}",
                    "-c:v", "copy", "-c:a", "aac", "-b:a", "192k", "-movflags", "+faststart", out_path]
            r = subprocess.run(cmd, capture_output=True)
            if r.returncode != 0 or not os.path.exists(out_path) or os.path.getsize(out_path) < 10000:
              print(r.stderr.decode("utf-8", errors="ignore")[-1500:])
              raise RuntimeError(f"Mixing failed for {out_path}")
            print(f"  {out_path}: {os.path.getsize(out_path)/1024/1024:.1f} MB")

          # ── PLATFORM UPLOADERS ────────────────────────────────
          def post_facebook(video_path, info, token, page_id):
            description = f"{info['caption']}\n\n{info['tags']}\n\n{FB_FOOTER}"
            thumb = OUT_DIR / "thumb.jpg"
            with open(video_path, "rb") as f:
              files = {"source": ("reel.mp4", f, "video/mp4")}
              thumb_f = open(thumb, "rb") if thumb.exists() else None
              if thumb_f: files["thumb"] = ("thumb.jpg", thumb_f, "image/jpeg")
              try:
                response = requests.post(
                  f"https://graph-video.facebook.com/{FB_API_VERSION}/{page_id}/videos",
                  data={"description": description, "access_token": token},
                  files=files, timeout=900)
              finally:
                if thumb_f: thumb_f.close()
            print(f"  Facebook response: {response.status_code}")
            if response.status_code != 200:
              raise RuntimeError(f"Facebook post failed: {response.text}")
            return response.json().get("id")

          def yt_build_text(info):
            hook = re.sub(r"[<>]", "", info["title"]).strip()
            if len(hook) + len(YT_TITLE_SUFFIX) > 100:
              hook = hook[:100 - len(YT_TITLE_SUFFIX) - 1].rstrip() + "\u2026"
            title = hook + YT_TITLE_SUFFIX
            desc = f"{info['caption']}\n\n{YT_FOOTER}\n\n{info['tags']} #Shorts"
            tags = YT_EXTRA_TAGS + [info["id"]]
            comment = info["caption"].split("\n\n", 1)[-1] + "\n\n" + YT_COMMENT_QUESTION
            return title, desc[:4900], tags, comment

          def post_youtube(video_path, info, privacy):
            from googleapiclient.discovery import build
            from googleapiclient.http import MediaFileUpload
            from google.oauth2.credentials import Credentials

            creds = Credentials(
              token=os.environ.get("YT_ACCESS_TOKEN") or None,
              refresh_token=os.environ.get("YT_REFRESH_TOKEN"),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ.get("YT_CLIENT_ID"),
              client_secret=os.environ.get("YT_CLIENT_SECRET"),
            )
            youtube = build("youtube", "v3", credentials=creds)
            title, desc, tags, comment = yt_build_text(info)
            print(f"  YouTube title: {title}")

            request = youtube.videos().insert(
              part="snippet,status",
              body={
                "snippet": {"title": title, "description": desc, "tags": tags, "categoryId": YT_CATEGORY_ID,
                            "defaultLanguage": "en", "defaultAudioLanguage": "en"},
                "status": {"privacyStatus": privacy, "selfDeclaredMadeForKids": False},
              },
              media_body=MediaFileUpload(video_path, mimetype="video/mp4", resumable=True),
            )
            response = None
            while response is None:
              status, response = request.next_chunk()
              if status: print(f"  YouTube upload progress: {int(status.progress() * 100)}%")
            vid = response.get("id", "")
            print(f"  Uploaded: https://youtube.com/shorts/{vid}")

            # nice-to-haves: a failure in any of these never fails the upload
            thumb = OUT_DIR / "thumb.jpg"
            if thumb.exists():
              try:
                youtube.thumbnails().set(videoId=vid, media_body=MediaFileUpload(str(thumb), mimetype="image/jpeg")).execute()
                print("  Thumbnail set")
              except Exception as ex:
                print(f"::warning::YouTube thumbnail failed (channel may need verifying): {ex}")
            for attempt in range(4):
              try:
                time.sleep(20)
                youtube.commentThreads().insert(
                  part="snippet",
                  body={"snippet": {"videoId": vid, "topLevelComment": {"snippet": {"textOriginal": comment}}}},
                ).execute()
                print("  Comment posted")
                break
              except Exception as ex:
                print(f"::warning::YouTube comment attempt {attempt + 1} failed: {ex}")
            try:
              pl = json.loads(os.environ.get("YT_PLAYLISTS") or "{}")
              pid = pl.get(YT_PLAYLIST_KEY)
              if pid:
                youtube.playlistItems().insert(
                  part="snippet",
                  body={"snippet": {"playlistId": pid, "resourceId": {"kind": "youtube#video", "videoId": vid}}},
                ).execute()
                print("  Added to playlist")
            except Exception as ex:
              print(f"::warning::YouTube playlist add failed: {ex}")
            return vid

          # ── SETUP ─────────────────────────────────────────────
          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          dry   = os.environ.get("DRY_RUN", "false").lower() == "true"
          hist  = load_hist()          # (the "is a post due?" check already ran in the first step)

          fb_token   = os.environ.get("FB_PAGE_TOKEN")
          fb_page_id = os.environ.get("FB_PAGE_ID")
          yt_privacy = (os.environ.get("YT_PRIVACY") or YT_DEFAULT_PRIVACY).strip().lower()
          if yt_privacy not in ("public", "unlisted", "private"): yt_privacy = "public"

          fb_enabled = bool(fb_token and fb_page_id)
          yt_enabled = all(os.environ.get(k) for k in ("YT_REFRESH_TOKEN", "YT_CLIENT_ID", "YT_CLIENT_SECRET"))
          print(f"Facebook configured: {fb_enabled} | YouTube configured: {yt_enabled} (privacy: {yt_privacy})")
          if not dry and not fb_enabled and not yt_enabled:
            raise RuntimeError("No platform configured: set FB_PAGE_TOKEN + FB_PAGE_ID and/or YT_REFRESH_TOKEN + YT_CLIENT_ID + YT_CLIENT_SECRET")
          if not dry and not fb_enabled: print("::warning::Facebook secrets missing - skipping Facebook")
          if not dry and not yt_enabled: print("::warning::YouTube secrets missing - skipping YouTube")

          # ── OPEN THE PAGE, PICK THE TOPIC ─────────────────────
          opts = Options()
          for a in ["--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu", "--window-size=1280,900",
                    "--force-device-scale-factor=1", "--autoplay-policy=no-user-gesture-required",
                    "--disable-background-timer-throttling", "--disable-renderer-backgrounding",
                    "--disable-backgrounding-occluded-windows", "--no-first-run", "--allow-file-access-from-files"]:
            opts.add_argument(a)
          print("Starting Chrome...")
          driver = webdriver.Chrome(options=opts)
          driver.set_script_timeout(600)
          driver.get("file://" + os.path.abspath(HTML_FILE))
          for _ in range(120):
            if driver.execute_script("return window._ready === true;"): break
            time.sleep(1)
          else:
            driver.quit(); raise RuntimeError("Page never became ready")

          ids = driver.execute_script("return window.TOPIC_IDS;")
          forced = os.environ.get("FORCE_TOPIC", "").strip()
          topic_id = forced if forced in ids else pick_topic(ids, hist)
          info = driver.execute_script("return window.loadTopic(arguments[0]);", topic_id)
          print(f"Topic: {info['id']} | {info['title']} | palette: {info.get('palette')}")

          # ── VOICE: one line per beat, measured, then placed on the timeline ──
          vo = info["vo"]
          durs = [0.0] * len(vo)
          seg_wavs = [None] * len(vo)
          voice_wav = None
          video_silent = str(OUT_DIR / "video_silent.mp4")
          fb_mp4 = str(OUT_DIR / "reel_facebook.mp4")
          yt_mp4 = str(OUT_DIR / "reel_youtube.mp4")
          with tempfile.TemporaryDirectory() as tmp:
            for i, line in enumerate(vo):
              raw = os.path.join(tmp, f"raw{i}.wav"); wav = os.path.join(tmp, f"seg{i}.wav")
              if synthesise(line, raw) and norm_wav(raw, wav):
                seg_wavs[i] = wav
            if seg_wavs[-1] and random.random() < CTA_CHANCE:       # optional spoken call-to-action after the last line
              cta = random.choice(CTA_POOL); print(f"  CTA: '{cta}'")
              craw = os.path.join(tmp, "cta_raw.wav"); cwav = os.path.join(tmp, "cta.wav"); sil = os.path.join(tmp, "cta_sil.wav")
              if synthesise(cta, craw) and norm_wav(craw, cwav):
                make_silence(0.45, sil)
                joined = os.path.join(tmp, "seg_last.wav")
                if concat_wavs([seg_wavs[-1], sil, cwav], joined): seg_wavs[-1] = joined
            for i, w in enumerate(seg_wavs):
              durs[i] = duration_of(w) if w else 0.0
            print("Voice durations:", [round(d, 2) for d in durs])

            tl = driver.execute_script("return window.setVoiceDurations(arguments[0]);", durs)
            starts, total = tl["starts"], float(tl["total"])
            print(f"Video length: {total:.1f}s")
            if total >= 180:
              print("::warning::Video is 3 minutes or longer - YouTube will not treat it as a Short")

            if any(seg_wavs):
              parts, cursor, n = [], 0.0, 0
              for i, w in enumerate(seg_wavs):
                if not w: continue
                gap = max(0.0, starts[i] - cursor)
                if gap > 0.005:
                  s = os.path.join(tmp, f"gap{n}.wav"); make_silence(gap, s); parts.append(s); n += 1
                parts.append(w); cursor = starts[i] + durs[i]
              voice_wav = os.path.join(OUT_DIR, "voice.wav")
              if not concat_wavs(parts, voice_wav): voice_wav = None

            # ── SOUND EFFECTS (rendered offline from the page's score, quieter under the voice) ──
            print("Rendering sound effects...")
            b64a = driver.execute_async_script("""
              var done = arguments[0];
              window.renderAudioBase64(%s).then(done).catch(function(e){ done(null); });
            """ % ("true" if voice_wav else "false"))
            sfx_raw = os.path.join(OUT_DIR, "sfx.raw")
            if b64a:
              with open(sfx_raw, "wb") as f: f.write(base64.b64decode(b64a))
            else:
              print("SFX render failed - using silence")
              subprocess.run(["ffmpeg", "-y", "-f", "lavfi", "-i", "anullsrc=r=48000:cl=stereo", "-t", f"{total:.3f}", "-f", "s16le", sfx_raw], capture_output=True)

            # ── ENCODE THE PICTURE ONCE (720x1280 frames from the page -> 1080x1920, no audio) ──
            cmd = ["ffmpeg", "-y", "-f", "image2pipe", "-framerate", str(FPS), "-c:v", "mjpeg", "-i", "-",
                   "-vf", "scale=1080:1920:flags=lanczos,format=yuv420p", "-an", "-t", f"{total:.3f}",
                   "-r", str(FPS), "-c:v", "libx264", "-preset", "medium", "-crf", "18", "-pix_fmt", "yuv420p",
                   "-movflags", "+faststart", video_silent]
            log = open(OUT_DIR / "ffmpeg.log", "wb")
            proc = subprocess.Popen(cmd, stdin=subprocess.PIPE, stderr=log)
            nframes = int(math.ceil(total * FPS))
            print(f"Capturing {nframes} frames...")
            try:
              for i in range(nframes):
                b64 = driver.execute_script("return window.frameJPEG(arguments[0]);", i / FPS)
                frame = base64.b64decode(b64)
                if i == 0: (OUT_DIR / "thumb.jpg").write_bytes(frame)     # the cover frame doubles as the thumbnail
                proc.stdin.write(frame)
                if i % 100 == 0: print(f"  frame {i}/{nframes}")
              proc.stdin.close()
            except BrokenPipeError:
              print("ffmpeg closed the pipe early")
            proc.wait()
            driver.quit()
            log.close()
            if proc.returncode != 0 or not os.path.exists(video_silent) or os.path.getsize(video_silent) < 10000:
              print(open(OUT_DIR / "ffmpeg.log", errors="ignore").read()[-1500:])
              raise RuntimeError("Encoding failed")
            print(f"Picture encoded: {os.path.getsize(video_silent)/1024/1024:.1f} MB")

            # ── ONE FINAL FILE PER PLATFORM (same picture + voice + effects, that platform's own music) ──
            if dry or fb_enabled:
              print("Mixing Facebook version...")
              mux_final(video_silent, sfx_raw, voice_wav, pick_music(FB_MUSIC_FOLDER, "Facebook"), FB_MUSIC_VOLUME, fb_mp4, total)
            if dry or yt_enabled:
              print("Mixing YouTube version...")
              mux_final(video_silent, sfx_raw, voice_wav, pick_music(YT_MUSIC_FOLDER, "YouTube"), YT_MUSIC_VOLUME, yt_mp4, total)

          for junk in ["sfx.raw", "voice.wav", "video_silent.mp4"]:
            try: os.remove(OUT_DIR / junk)
            except Exception: pass

          if dry:
            print("Dry run: not posting.")
            sys.exit(0)

          # ── POST TO BOTH PLATFORMS (independent: one failing never blocks the other) ──
          fb_id = yt_id = None
          errors = []

          if fb_enabled:
            print("Posting to Facebook...")
            try:
              fb_id = post_facebook(fb_mp4, info, fb_token, fb_page_id)
              print(f"  Facebook posted! ID: {fb_id}")
            except Exception as e:
              errors.append(f"Facebook: {e}")
              print(f"::error::Facebook failed: {e}")

          if yt_enabled:
            print("Posting to YouTube...")
            try:
              yt_id = post_youtube(yt_mp4, info, yt_privacy)
              print(f"  YouTube posted! ID: {yt_id}")
            except Exception as e:
              errors.append(f"YouTube: {e}")
              print(f"::error::YouTube failed: {e}")

          # remember the topic if at least one platform got it
          if fb_id or yt_id:
            hist.append({"id": info["id"], "date": today, "fb_id": fb_id, "yt_id": yt_id})
            save_hist(hist)
            print("Remembered topic in posted.json.")

          if errors:
            print("Finished with errors: " + " | ".join(errors))
            sys.exit(1)          # the run shows red so you notice; the commit step below still runs
          print("Done!")
          PYEOF
        env:
          FB_PAGE_TOKEN:    ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID:       ${{ secrets.FB_PAGE_ID }}
          YT_ACCESS_TOKEN:  ${{ secrets.YT_ACCESS_TOKEN }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_PLAYLISTS:     ${{ secrets.YT_PLAYLISTS }}
          YT_PRIVACY:       ${{ inputs.yt_privacy }}
          FORCE_TOPIC:      ${{ inputs.topic }}
          DRY_RUN:          ${{ inputs.dry_run }}

      - name: Remember the posted topic (commit posted.json)
        if: ${{ steps.due.outputs.due == 'true' && !cancelled() && inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json || true
          if git diff --cached --quiet; then
            echo "Nothing new to remember."
          else
            git commit -m "Remember posted topic [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Keep the preview videos (dry runs only)
        if: ${{ steps.due.outputs.due == 'true' && always() && inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview
          path: |
            out/reel_*.mp4
            out/thumb.jpg