name: french-words-post

"on":
  workflow_dispatch:
    inputs:
      caption:
        description: "Post caption (leave empty for random)"
        required: false
        default: ""
  schedule:
    - cron: "0 15 * * *"  # 11 AM EST / 3 PM UTC daily

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg bc jq python3 fonts-noto fonts-noto-extra fonts-noto-color-emoji fonts-noto-cjk fonts-noto-core fonts-noto-ui-core
          pip install --break-system-packages google-auth google-auth-oauthlib google-api-python-client

      - name: find-video
        id: vid
        timeout-minutes: 3
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: |
          set -e
          CLIP=18
          SKIP_HEAD=5
          SKIP_TAIL=5
          MIN_DUR=$((SKIP_HEAD + CLIP + SKIP_TAIL))
          VIDEO_URL=""
          VALID_VIDEO=0

          TERMS="sky| clouds| sunrise| sunset| nature| mountains| forest| ocean| river| stars| light rays| fog| meadow| waterfall| peaceful nature| paris| eiffel tower"
          IFS='|' read -ra TERM_ARR <<< "$TERMS"

          for TERM in $(printf "%s\n" "${TERM_ARR[@]}" | shuf); do
            [ "$VALID_VIDEO" -eq 1 ] && break
            PAGE=$((RANDOM % 10 + 1))
            OFFSET=$((RANDOM % 20))
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TERM")
            URL="https://pixabay.com/api/videos/?key=${PIXABAY_KEY}&q=${ENCODED}&video_type=film&per_page=20&page=${PAGE}"
            RESP=$(timeout 10 curl -sf --max-time 10 "$URL" 2>/dev/null) || continue
            COUNT=$(echo "$RESP" | jq -r '.hits | length' 2>/dev/null) || continue
            [ "$COUNT" -eq 0 ] && continue
            for i in $(seq 0 $((COUNT - 1)) | shuf); do
              [ "$VALID_VIDEO" -eq 1 ] && break
              IDX=$(( (i + OFFSET) % COUNT ))
              DUR=$(echo "$RESP" | jq -r ".hits[$IDX].duration" 2>/dev/null)
              [[ "$DUR" =~ ^[0-9]+$ ]] || continue
              [ "$DUR" -lt "$MIN_DUR" ] && continue
              VURL=$(echo "$RESP" | jq -r ".hits[$IDX].videos.large.url // .hits[$IDX].videos.medium.url // .hits[$IDX].videos.small.url" 2>/dev/null)
              [ -z "$VURL" ] || [ "$VURL" = "null" ] && continue
              ZONE_END=$((DUR - SKIP_TAIL - CLIP))
              RANGE=$((ZONE_END - SKIP_HEAD))
              [ "$RANGE" -le 0 ] && continue
              START=$((SKIP_HEAD + RANDOM % RANGE))
              echo "Testing video: $VURL"
              timeout 30 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$VURL" -t 5 -c copy test_probe.mp4 2>/dev/null || true
              TEST_STREAM=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 test_probe.mp4 2>/dev/null || echo "")
              rm -f test_probe.mp4
              if [ -z "$TEST_STREAM" ]; then
                echo "Video failed probe, skipping..."
                continue
              fi
              VIDEO_URL="$VURL"
              VALID_VIDEO=1
              echo "video_url=$VIDEO_URL" >> "$GITHUB_OUTPUT"
              echo "start=$START" >> "$GITHUB_OUTPUT"
              echo "clip=$CLIP" >> "$GITHUB_OUTPUT"
              echo "Found valid video: start=${START}s dur=${DUR}s"
            done
          done

          if [ -z "$VIDEO_URL" ]; then
            echo "No valid video found"
            exit 1
          fi

      - name: pick-music
        id: music
        timeout-minutes: 1
        run: |
          TRACKS=(bgmusic/*.mp3 bgmusic/*.wav bgmusic/*.m4a bgmusic/*.mp4 bgmusic/*.aac bgmusic/*.ogg bgmusic/*.flac)
          VALID=()
          for t in "${TRACKS[@]}"; do
            [ -f "$t" ] && VALID+=("$t")
          done
          if [ ${#VALID[@]} -eq 0 ]; then
            echo "No music files found"
            exit 1
          fi
          IDX=$((RANDOM % ${#VALID[@]}))
          PICKED="${VALID[$IDX]}"
          echo "music_file=$PICKED" >> "$GITHUB_OUTPUT"
          echo "Selected: $PICKED"

      - name: pick-content
        id: content
        timeout-minutes: 1
        run: |
          # 30 French words — each: WORD|PRONUNCIATION|ENGLISH_MEANING
          CONTENT_RAW=(
            "Bonjour|bohn-ZHOOR|Hello"
            "Merci|mehr-SEE|Thank you"
            "Amour|ah-MOOR|Love"
            "Fromage|froh-MAHZH|Cheese"
            "Château|shah-TOH|Castle"
            "Voiture|vwah-TEWR|Car"
            "Musique|myoo-ZEEK|Music"
            "Café|ka-FAY|Coffee"
            "Maison|may-ZOHN|House"
            "Bibliothèque|bee-blee-oh-TEK|Library"
            "Beaucoup|boh-KOO|A lot / Very much"
            "Aujourd'hui|oh-zhoor-DWEE|Today"
            "Étoile|ay-TWAHL|Star"
            "Fleur|FLUR|Flower"
            "Voyage|vwah-YAHZH|Trip / Journey"
            "Bonheur|bo-NUR|Happiness"
            "Soleil|so-LAY|Sun"
            "Nuage|noo-AHZH|Cloud"
            "Rivière|ree-VYEHR|River"
            "Montagne|mohn-TAHN-yuh|Mountain"
            "Ville|VEEL|City"
            "École|ay-KOHL|School"
            "Travail|trah-VYE|Work"
            "Famille|fah-MEEY|Family"
            "Enfant|ahn-FAHN|Child"
            "Livre|LEEV-ruh|Book"
            "Jardin|zhar-DAN|Garden"
            "Cuisine|kwee-ZEEN|Kitchen / Cooking"
            "Chanson|shahn-SOHN|Song"
            "Liberté|lee-behr-TAY|Freedom"
          )

          IDX=$((RANDOM % ${#CONTENT_RAW[@]}))
          ENTRY="${CONTENT_RAW[$IDX]}"
          WORD=$(echo "$ENTRY" | cut -d'|' -f1)
          PRON_EN=$(echo "$ENTRY" | cut -d'|' -f2)
          MEANING=$(echo "$ENTRY" | cut -d'|' -f3)

          echo "word=$WORD" >> "$GITHUB_OUTPUT"
          echo "pron_en=$PRON_EN" >> "$GITHUB_OUTPUT"
          echo "meaning=$MEANING" >> "$GITHUB_OUTPUT"
          echo "Selected word: $WORD"

      - name: pick-caption
        id: caption
        timeout-minutes: 1
        run: |
          INPUT_CAPTION="${{ github.event.inputs.caption }}"
          if [ -n "$INPUT_CAPTION" ]; then
            echo "caption=$INPUT_CAPTION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          WORD="${{ steps.content.outputs.word }}"
          MEANING="${{ steps.content.outputs.meaning }}"
          CAPTIONS=(
            "Learn a new French word every day. Follow for more! #LearnFrench #French #FrenchWords #FLE #FrenchVocabulary #FrenchLessons"
            "Today's French word: ${WORD} (${MEANING}). Save it and practice! #LearnFrench #French #FrenchWords #FLE #FrenchVocabulary #Shorts"
            "Do you know how to pronounce this French word? Tag a friend who's learning French. #LearnFrench #French #FrenchWords #FLE #SpeakFrench"
            "Master French pronunciation step by step. Save this video for later. #LearnFrench #French #FrenchLessons #FLE #FrenchVocabulary"
            "Every new word gets you closer to fluency. Follow along daily. #LearnFrench #French #FrenchTeacher #FLE #FrenchVocabulary #Shorts"
          )
          IDX=$((RANDOM % ${#CAPTIONS[@]}))
          PICKED="${CAPTIONS[$IDX]}"
          echo "caption=$PICKED" >> "$GITHUB_OUTPUT"

      - name: process-video
        timeout-minutes: 8
        run: |
          URL="${{ steps.vid.outputs.video_url }}"
          START="${{ steps.vid.outputs.start }}"
          DUR="${{ steps.vid.outputs.clip }}"
          MUSIC_FILE="${{ steps.music.outputs.music_file }}"
          WORD="${{ steps.content.outputs.word }}"
          PRON_EN="${{ steps.content.outputs.pron_en }}"
          MEANING="${{ steps.content.outputs.meaning }}"

          FETCH=$(echo "$DUR + 5" | bc)
          FADEOUT=$(echo "$DUR - 1.5" | bc)

          echo "Downloading video..."
          timeout 90 ffmpeg -hide_banner -loglevel error -y -ss "$START" -i "$URL" -t "$FETCH" -c copy source.mp4

          MDUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$MUSIC_FILE" 2>/dev/null | cut -d. -f1)
          MMAX=$((MDUR - 5))
          [ "$MMAX" -le 5 ] && MMAX=5
          MSTART=$((RANDOM % MMAX))
          timeout 60 ffmpeg -hide_banner -loglevel error -y -stream_loop -1 -i "$MUSIC_FILE" -ss "$MSTART" -t "$FETCH" -ac 2 -ar 44100 music_clip.mp3

          python3 << 'PYEOF'
          import os, random

          word = os.environ.get("WORD", "Bonjour")
          pron_en = os.environ.get("PRON_EN", "bohn-ZHOOR")
          meaning = os.environ.get("MEANING", "Hello")
          dur = float(os.environ.get("DUR", "18"))
          fadeout = float(os.environ.get("FADEOUT", "16.5"))

          # Noto Sans has full Latin Extended coverage (needed for French accents: é è à ç û ï etc.)
          font_candidates = [
              "/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
          ]
          font = next((f for f in font_candidates if os.path.exists(f)), font_candidates[-1])

          color_palette = [
              "white", "gold", "lightyellow", "lightcyan",
              "lightpink", "peachpuff", "lavender", "palegreen",
              "lightskyblue", "wheat", "khaki", "lightsalmon",
              "mistyrose", "honeydew", "aliceblue"
          ]
          main_color = random.choice(color_palette)
          accent_palette = [c for c in color_palette if c != main_color]
          accent_color = random.choice(accent_palette)

          def esc(t):
              return t.replace("'", "\u2019").replace(":", "\\:").replace(",", "\\,")

          intros = [
              "Learn a new French word",
              "Today's French word",
              "Master French pronunciation",
              "Grow your French vocabulary",
              "New French word every day",
          ]
          intro_text = random.choice(intros)

          filters = []
          text_start = 1.8
          line_interval = 1.1

          def fade_in(t):
              return f"if(lt(t,{t:.2f}),0,min(1,(t-{t:.2f})/0.35))"

          # 1) Top: English intro line
          y_intro = 160
          t_intro = 0.4
          filters.append(
              f"drawtext=text='{esc(intro_text)}'"
              f":fontfile={font}"
              f":fontcolor=white@0.95"
              f":fontsize=50"
              f":x=(w-text_w)/2"
              f":y={y_intro}"
              f":alpha='{fade_in(t_intro)}'"
              f":shadowcolor=black@0.85:shadowx=3:shadowy=3"
          )

          # 2) The French word (large, bold, center-upper)
          y_word = 460
          t_word = text_start
          filters.append(
              f"drawtext=text='{esc(word)}'"
              f":fontfile={font}"
              f":fontcolor={main_color}"
              f":fontsize=100"
              f":x=(w-text_w)/2"
              f":y={y_word}"
              f":alpha='{fade_in(t_word)}'"
              f":shadowcolor=black@0.85:shadowx=4:shadowy=4"
          )

          # 3) Pronunciation guide
          y_pron = 640
          t_pron = text_start + line_interval
          filters.append(
              f"drawtext=text='{esc(pron_en)}'"
              f":fontfile={font}"
              f":fontcolor={accent_color}"
              f":fontsize=58"
              f":x=(w-text_w)/2"
              f":y={y_pron}"
              f":alpha='{fade_in(t_pron)}'"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )

          # 4) English meaning
          y_meaning = 780
          t_meaning = text_start + line_interval * 2
          filters.append(
              f"drawtext=text='{esc('Meaning: ' + meaning)}'"
              f":fontfile={font}"
              f":fontcolor=white@0.9"
              f":fontsize=52"
              f":x=(w-text_w)/2"
              f":y={y_meaning}"
              f":alpha='{fade_in(t_meaning)}'"
              f":shadowcolor=black@0.8:shadowx=3:shadowy=3"
          )

          # 5) CTA box near bottom
          ctas = ["Follow for more", "Comment below", "Tag a friend", "Save this video", "Follow daily"]
          cta_text = random.choice(ctas)
          t_cta = text_start + line_interval * 3 + 0.3
          box_y_top = 1580
          box_y_bottom = 1680
          filters.append(
              f"drawbox=x=180:y={box_y_top}:w=720:h={box_y_bottom - box_y_top}"
              f":color=black@0.55:t=fill"
              f":enable='gte(t,{t_cta:.2f})'"
          )
          filters.append(
              f"drawtext=text='{esc(cta_text)}'"
              f":fontfile={font}"
              f":fontcolor=lightyellow"
              f":fontsize=56"
              f":x=(w-text_w)/2"
              f":y={box_y_top + 22}"
              f":alpha='{fade_in(t_cta)}'"
              f":shadowcolor=black@0.8:shadowx=2:shadowy=2"
          )

          all_dt = ",".join(filters)

          vfilter = (
              f"[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
              f"crop=1080:1920,"
              f"setsar=1,"
              f"gblur=sigma=25,"
              f"fade=t=in:st=0:d=1,"
              f"fade=t=out:st={fadeout:.2f}:d=1.5,"
              f"{all_dt}[vout]"
          )

          with open("/tmp/vfilter.txt", "w") as f:
              f.write(vfilter)

          print(f"Built filter | word: {word} | main_color: {main_color} | accent: {accent_color} | intro: {intro_text} | cta: {cta_text}")
          PYEOF

          VFILTER=$(cat /tmp/vfilter.txt)

          timeout 240 ffmpeg -hide_banner -loglevel error -y \
            -i source.mp4 \
            -i music_clip.mp3 \
            -filter_complex "${VFILTER};[1:a]volume=1.0,afade=t=in:st=0:d=1,afade=t=out:st=${FADEOUT}:d=1.5[aout]" \
            -map "[vout]" \
            -map "[aout]" \
            -t "$DUR" \
            -c:v libx264 -preset medium -crf 16 \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            -pix_fmt yuv420p \
            final.mp4

          ls -lh final.mp4
        env:
          WORD: ${{ steps.content.outputs.word }}
          PRON_EN: ${{ steps.content.outputs.pron_en }}
          MEANING: ${{ steps.content.outputs.meaning }}
          DUR: "18"
          FADEOUT: "16.5"

      - name: post-to-youtube
        timeout-minutes: 10
        env:
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          WORD: ${{ steps.content.outputs.word }}
          PRON_EN: ${{ steps.content.outputs.pron_en }}
          MEANING: ${{ steps.content.outputs.meaning }}
          CAPTION: ${{ steps.caption.outputs.caption }}
        run: |
          python3 << 'PYEOF'
          import os, sys
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials

          word = os.environ.get("WORD", "French Word")
          pron_en = os.environ.get("PRON_EN", "")
          meaning = os.environ.get("MEANING", "")
          caption = os.environ.get("CAPTION", "")

          filepath = "final.mp4"
          if not os.path.exists(filepath):
              print("final.mp4 not found")
              sys.exit(1)

          title = f"{word} — {meaning} | Learn French #Shorts"
          if len(title) > 100:
              title = title[:97] + "..."

          description = "\n".join([
              f"French word of the day: {word}",
              f"Pronunciation: {pron_en}",
              f"Meaning: {meaning}",
              "",
              caption,
              "",
              "----------------------------------------",
              "Learn a new French word every day with us.",
              "Follow for daily French vocabulary, pronunciation, and quick lessons.",
              "----------------------------------------",
              "",
              f"#LearnFrench #French #FrenchWords #FrenchVocabulary #FLE #FrenchLessons #{word.replace(chr(39),'').replace(' ','')} #Shorts",
          ])

          tags = [
              "learn french", "french vocabulary", "french lesson", "french words",
              "french pronunciation", "FLE", "french for beginners", "daily french",
              word.lower(), meaning.lower()
          ]

          creds = Credentials(
              token=os.environ.get("YT_ACCESS_TOKEN"),
              refresh_token=os.environ.get("YT_REFRESH_TOKEN"),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ.get("YT_CLIENT_ID"),
              client_secret=os.environ.get("YT_CLIENT_SECRET"),
          )
          youtube = build("youtube", "v3", credentials=creds)

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": title,
                      "description": description,
                      "tags": tags,
                      "categoryId": "27",  # Education
                      "defaultLanguage": "en",
                  },
                  "status": {
                      "privacyStatus": "public",
                      "madeForKids": False,
                      "selfDeclaredMadeForKids": False,
                  },
              },
              media_body=MediaFileUpload(filepath, mimetype="video/mp4", resumable=True),
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"Upload progress: {int(status.progress() * 100)}%")

          video_id = response.get("id", "")
          print(f"Uploaded: https://youtube.com/shorts/{video_id}")
          PYEOF