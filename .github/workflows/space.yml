name: Post Space Footage to YouTube

on:
  workflow_dispatch:
    inputs:
      min_size:
        description: "Minimum footage size to search for"
        required: true
        default: "100"
        type: choice
        options:
          - "100"
          - "200"
          - "400"
          - "500"
          - "700"
          - "1000"
          - "2000"
      search_terms:
        description: "Custom search terms (comma separated, optional). Leave blank for default rotation."
        required: false
        default: ""
  schedule:
    - cron: "0 19 * * 1,3,5"  # Mon Wed Fri 2PM EST

jobs:
  post:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu
          pip install requests google-auth google-auth-oauthlib google-api-python-client
          echo "Done"

      - name: Find and download footage
        run: |
          python3 << 'PYEOF'
          import requests, os, sys, json, random, subprocess, re

          POSTED_FILE = "posted.txt"
          already_posted = set()
          if os.path.exists(POSTED_FILE):
              with open(POSTED_FILE) as f:
                  already_posted = set(line.strip() for line in f if line.strip())
          print(f"Already posted: {len(already_posted)} items")

          ALL_TIERS = [100, 200, 400, 500, 700, 1000, 2000]
          min_size = int(os.environ.get("MIN_SIZE_MB", "100"))
          SIZE_TIERS_MB = sorted(set(t for t in ALL_TIERS if t >= min_size))
          if not SIZE_TIERS_MB:
              SIZE_TIERS_MB = [2000]
          print(f"Size tiers to try: {SIZE_TIERS_MB}")

          custom_terms_raw = os.environ.get("SEARCH_TERMS", "").strip()
          custom_terms = [t.strip() for t in custom_terms_raw.split(",") if t.strip()] if custom_terms_raw else []
          print(f"Custom search terms: {custom_terms if custom_terms else 'none - using default rotation'}")

          # Default rotation biased toward galaxy, planets, and deep space
          DEFAULT_QUERIES = [
              "galaxy", "nebula", "milky way", "saturn rings", "jupiter", "mars surface",
              "planet earth from space", "solar system", "deep space", "hubble telescope",
              "spiral galaxy", "star cluster", "planetary nebula", "aurora", "moon surface",
              "international space station", "black hole", "exoplanet", "cosmic",
              "spacecraft", "rocket launch"
          ]

          found = None

          def search_nasa(min_mb, max_mb, queries):
              qlist = list(queries)
              random.shuffle(qlist)
              for query in qlist:
                  try:
                      r = requests.get(
                          "https://images-api.nasa.gov/search",
                          params={"q": query, "media_type": "video", "page_size": 20},
                          timeout=20
                      )
                      if r.status_code != 200:
                          continue
                      items = r.json().get("collection", {}).get("items", [])
                      random.shuffle(items)
                      for item in items:
                          nasa_id = item.get("data", [{}])[0].get("nasa_id", "")
                          title = item.get("data", [{}])[0].get("title", "Unknown")
                          desc = item.get("data", [{}])[0].get("description", "")
                          if nasa_id in already_posted:
                              continue
                          try:
                              ar = requests.get(f"https://images-api.nasa.gov/asset/{nasa_id}", timeout=15)
                              if ar.status_code != 200:
                                  continue
                              assets = ar.json().get("collection", {}).get("items", [])
                              mp4s = [a["href"] for a in assets if a.get("href", "").endswith(".mp4")]
                              if not mp4s:
                                  continue
                              for mp4_url in sorted(mp4s):
                                  try:
                                      head = requests.head(mp4_url, timeout=10, allow_redirects=True)
                                      size_mb = int(head.headers.get("content-length", 0)) / 1024 / 1024
                                      if min_mb < size_mb <= max_mb:
                                          return {"url": mp4_url, "title": title, "desc": desc,
                                                  "id": nasa_id, "source": "NASA", "size_mb": size_mb,
                                                  "query": query}
                                  except Exception:
                                      continue
                          except Exception:
                              continue
                  except Exception:
                      continue
              return None

          def search_archive(min_mb, max_mb, queries):
              qlist = list(queries)
              random.shuffle(qlist)
              for query in qlist:
                  try:
                      r = requests.get(
                          "https://archive.org/advancedsearch.php",
                          params={
                              "q": f"{query} AND mediatype:movies AND licenseurl:(*creativecommons* OR *publicdomain*)",
                              "fl[]": ["identifier", "title", "description"],
                              "rows": 30, "page": 1, "output": "json",
                              "sort[]": "downloads desc"
                          },
                          timeout=20
                      )
                      if r.status_code != 200:
                          continue
                      docs = r.json().get("response", {}).get("docs", [])
                      random.shuffle(docs)
                      for doc in docs:
                          identifier = doc.get("identifier", "")
                          if identifier in already_posted:
                              continue
                          title = doc.get("title", "Unknown")
                          desc = doc.get("description", "")
                          if isinstance(desc, list):
                              desc = " ".join(desc)
                          try:
                              mr = requests.get(f"https://archive.org/metadata/{identifier}", timeout=15)
                              if mr.status_code != 200:
                                  continue
                              files = mr.json().get("files", [])
                              videos = [f for f in files if f.get("name", "").lower().endswith((".mp4", ".mov", ".avi", ".mkv"))]
                              for vf in videos:
                                  size_mb = int(vf.get("size", 0)) / 1024 / 1024
                                  if min_mb < size_mb <= max_mb:
                                      url = f"https://archive.org/download/{identifier}/{vf['name']}"
                                      return {"url": url, "title": title, "desc": desc,
                                              "id": identifier, "source": "Archive.org", "size_mb": size_mb,
                                              "query": query}
                          except Exception:
                              continue
                  except Exception:
                      continue
              return None

          # Try custom terms first (if provided) across NASA then Archive, all size tiers
          if custom_terms:
              for max_mb in SIZE_TIERS_MB:
                  print(f"Searching NASA (custom terms) under {max_mb}MB...")
                  found = search_nasa(min_size, max_mb, custom_terms)
                  if found:
                      break
              if not found:
                  for max_mb in SIZE_TIERS_MB:
                      print(f"Searching Archive.org (custom terms) under {max_mb}MB...")
                      found = search_archive(min_size, max_mb, custom_terms)
                      if found:
                          break

          # Fall back to default rotation if custom terms found nothing (or none given)
          if not found:
              for max_mb in SIZE_TIERS_MB:
                  print(f"Searching NASA (default rotation) under {max_mb}MB...")
                  found = search_nasa(min_size, max_mb, DEFAULT_QUERIES)
                  if found:
                      break
          if not found:
              for max_mb in SIZE_TIERS_MB:
                  print(f"Searching Archive.org (default rotation) under {max_mb}MB...")
                  found = search_archive(min_size, max_mb, DEFAULT_QUERIES)
                  if found:
                      break

          if not found:
              print("No footage found in any tier")
              sys.exit(1)

          print(f"Found: {found['title']} ({found['size_mb']:.1f}MB) from {found['source']}")
          print(f"Downloading {found['url']}")
          r = requests.get(found["url"], stream=True, timeout=120)
          raw_path = "/tmp/raw_footage" + os.path.splitext(found["url"].split("?")[0])[-1]
          with open(raw_path, "wb") as f:
              for chunk in r.iter_content(chunk_size=65536):
                  f.write(chunk)
          print(f"Downloaded: {os.path.getsize(raw_path)/1024/1024:.1f}MB")

          with open("/tmp/meta.json", "w") as f:
              json.dump({**found, "raw_path": raw_path}, f)
          PYEOF
        env:
          MIN_SIZE_MB: ${{ github.event.inputs.min_size || '100' }}
          SEARCH_TERMS: ${{ github.event.inputs.search_terms || '' }}

      - name: Process footage
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os, sys, random, glob

          with open("/tmp/meta.json") as f:
              meta = json.load(f)

          raw = meta["raw_path"]
          out = "/tmp/processed.mp4"

          probe = subprocess.run([
              "ffprobe", "-v", "quiet", "-print_format", "json", "-show_streams", raw
          ], capture_output=True, text=True)
          info = json.loads(probe.stdout)
          duration = 0
          for s in info.get("streams", []):
              try:
                  duration = max(duration, float(s.get("duration", 0)))
              except Exception:
                  pass
          print(f"Duration: {duration:.1f}s")

          zoom = round(random.uniform(1.05, 1.15), 2)
          print(f"Zoom: {zoom}x")

          music_file = None
          music_exts = ["*.mp3", "*.mp4", "*.m4a", "*.wav", "*.ogg", "*.flac"]
          music_files = []
          for ext in music_exts:
              music_files += glob.glob(f"bgmusic/{ext}")
          if music_files:
              music_file = random.choice(music_files)
              print(f"Music: {music_file}")
          else:
              print("No bgmusic found — using original audio only")

          # CTA setup: SUBSCRIBE = red box, LIKE = blue box, text always white
          cta_options = [
              ("SUBSCRIBE", "red"),
              ("LIKE", "blue"),
          ]
          t_start = min(2.0, duration * 0.1)
          t_mid = duration / 2
          t_end = max(duration - 4.0, t_mid + 2)
          cta_times = [t_start, t_mid, t_end]

          font = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          drawtext_filters = []
          for t in cta_times:
              text, color = random.choice(cta_options)
              t_in = t
              t_out = t + 2.0
              fade_dur = 0.4
              alpha_expr = (
                  f"if(lt(t,{t_in+fade_dur}),(t-{t_in})/{fade_dur},"
                  f"if(gt(t,{t_out-fade_dur}),({t_out}-t)/{fade_dur},1))"
              )
              dt = (
                  f"drawtext=fontfile={font}:text='{text}':fontsize=64:fontcolor=white:"
                  f"x=(w-text_w)/2:y=(h-text_h)/2:box=1:boxcolor={color}@0.75:boxborderw=20:"
                  f"enable='between(t,{t_in},{t_out})':alpha='{alpha_expr}'"
              )
              drawtext_filters.append(dt)

          vf_chain = f"scale=iw*{zoom}:ih*{zoom},crop=iw/{zoom}:ih/{zoom}," + ",".join(drawtext_filters) + \
                     ",scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2"

          ping_inputs = []
          ping_filter_parts = []
          for i, t in enumerate(cta_times):
              ping_inputs += ["-f", "lavfi", "-i", f"sine=frequency=1500:duration=0.3"]
              ping_filter_parts.append(f"[{i+1}:a]adelay={int(t*1000)}|{int(t*1000)},volume=0.5[ping{i}]")

          main_inputs = ["-i", raw]
          if music_file:
              main_inputs += ["-stream_loop", "-1", "-i", music_file]

          all_inputs = main_inputs + ping_inputs

          audio_mix_parts = []
          if music_file:
              audio_mix_parts.append("[0:a]volume=1.0[a1]")
              audio_mix_parts.append("[1:a]volume=0.15[a2]")
              base_audio = "[a1][a2]"
              n_base = 2
          else:
              audio_mix_parts.append("[0:a]volume=1.0[a1]")
              base_audio = "[a1]"
              n_base = 1

          ping_labels = "".join(f"[ping{i}]" for i in range(len(cta_times)))
          n_total = n_base + len(cta_times)
          audio_mix_parts.append(f"{base_audio}{ping_labels}amix=inputs={n_total}:duration=first[aout]")

          filter_complex = f"[0:v]{vf_chain}[vout];" + ";".join(ping_filter_parts) + ";" + ";".join(audio_mix_parts)

          cmd = ["ffmpeg", "-y"] + all_inputs + [
              "-filter_complex", filter_complex,
              "-map", "[vout]", "-map", "[aout]",
              "-c:v", "libx264", "-preset", "medium", "-crf", "18",
              "-pix_fmt", "yuv420p",
              "-c:a", "aac", "-b:a", "192k", "-ar", "44100",
              "-movflags", "+faststart",
              out
          ]

          print("Processing long-form video...")
          result = subprocess.run(cmd, capture_output=True, text=True)
          if result.returncode != 0:
              print(f"ffmpeg error:\n{result.stderr[-3000:]}")
              sys.exit(1)

          size = os.path.getsize(out) / 1024 / 1024
          print(f"Processed: {size:.1f}MB")

          # ==== Build Short: random vertical slice from processed video ====
          probe2 = subprocess.run([
              "ffprobe", "-v", "quiet", "-print_format", "json", "-show_streams", out
          ], capture_output=True, text=True)
          info2 = json.loads(probe2.stdout)
          proc_duration = 0
          for s in info2.get("streams", []):
              try:
                  proc_duration = max(proc_duration, float(s.get("duration", 0)))
              except Exception:
                  pass

          short_len = min(45, max(15, proc_duration * 0.3))
          max_start = max(0, proc_duration - short_len)
          # bias toward the middle section, not the very start/end
          mid_window_start = max_start * 0.25
          mid_window_end = max_start * 0.75
          if mid_window_end <= mid_window_start:
              clip_start = max_start / 2
          else:
              clip_start = random.uniform(mid_window_start, mid_window_end)

          print(f"Short clip: start={clip_start:.1f}s length={short_len:.1f}s")

          short_out = "/tmp/short.mp4"
          short_cmd = [
              "ffmpeg", "-y", "-ss", str(clip_start), "-i", out, "-t", str(short_len),
              "-vf", "crop=ih*9/16:ih,scale=1080:1920",
              "-c:v", "libx264", "-preset", "medium", "-crf", "18",
              "-pix_fmt", "yuv420p",
              "-c:a", "aac", "-b:a", "192k", "-ar", "44100",
              "-movflags", "+faststart",
              short_out
          ]
          result2 = subprocess.run(short_cmd, capture_output=True, text=True)
          if result2.returncode != 0:
              print(f"Short ffmpeg error:\n{result2.stderr[-2000:]}")
              print("Continuing without Short")
          else:
              print(f"Short created: {os.path.getsize(short_out)/1024/1024:.1f}MB")

          os.remove(raw)
          PYEOF

      - name: Upload to YouTube
        run: |
          python3 << 'PYEOF'
          import os, json, sys, re
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials

          with open("/tmp/meta.json") as f:
              meta = json.load(f)

          mp4 = "/tmp/processed.mp4"
          if not os.path.exists(mp4):
              print("Processed video not found")
              sys.exit(1)

          title_base = meta["title"].strip()
          source = meta["source"]
          query = meta.get("query", "space")

          title_base = re.sub(r'[^\w\s\-\(\)\:\,\.\!]', '', title_base)[:80].strip()

          # Title no longer includes source credit
          title = title_base
          if len(title) > 100:
              title = title[:97] + "..."

          raw_desc = meta.get("desc", "") or ""
          if isinstance(raw_desc, list):
              raw_desc = " ".join(raw_desc)
          raw_desc = raw_desc[:500].strip()

          source_credit = (
              "NASA Public Domain -- nasa.gov" if source == "NASA"
              else "Archive.org Public Domain -- archive.org"
          )

          hashtag_query = query.replace(" ", "").lower()

          def build_description(is_short=False):
              lines = [
                  title_base,
                  "",
                  raw_desc,
                  "",
                  source_credit,
                  f"Original footage ID: {meta['id']}",
                  "This footage has been transformed (zoomed, reprocessed) for this upload.",
                  "",
                  "----------------------------------------",
                  "About this video:",
                  f"Stunning {query} footage captured and released into the public domain.",
                  "",
                  "Subscribe for more space footage.",
                  "",
                  "----------------------------------------",
                  f"Tags: space, nasa, {query}, earth, universe, cosmos, relaxation, meditation, sleep, ambient, timelapse, astronomy, science, documentary",
                  "----------------------------------------",
                  "",
                  f"#space #nasa #universe #cosmos #{hashtag_query} #astronomy #relaxation #ambient #timelapse #documentary #publicdomain" + (" #shorts" if is_short else ""),
              ]
              return "\n".join(lines)

          tags = [
              "space", "nasa", "universe", "cosmos", "earth from space",
              "astronomy", "relaxation", "meditation", "ambient", "sleep music",
              "timelapse", "documentary", "public domain", "space footage",
              "nebula", "galaxy", "milky way", "solar system", "science",
              query
          ]
          tags = list(dict.fromkeys(tags))[:30]

          creds = Credentials(
              token=os.environ.get("YT_ACCESS_TOKEN"),
              refresh_token=os.environ.get("YT_REFRESH_TOKEN"),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ.get("YT_CLIENT_ID"),
              client_secret=os.environ.get("YT_CLIENT_SECRET"),
          )
          youtube = build("youtube", "v3", credentials=creds)

          def upload(filepath, vid_title, vid_desc):
              request = youtube.videos().insert(
                  part="snippet,status",
                  body={
                      "snippet": {
                          "title": vid_title,
                          "description": vid_desc,
                          "tags": tags,
                          "categoryId": "28",
                          "defaultLanguage": "en"
                      },
                      "status": {
                          "privacyStatus": "public",
                          "madeForKids": False,
                          "selfDeclaredMadeForKids": False
                      }
                  },
                  media_body=MediaFileUpload(filepath, mimetype="video/mp4", resumable=True)
              )
              response = None
              while response is None:
                  status, response = request.next_chunk()
                  if status:
                      print(f"Upload progress: {int(status.progress()*100)}%")
              return response.get("id", "")

          print(f"Title: {title}")
          video_id = upload(mp4, title, build_description(is_short=False))
          print(f"https://youtube.com/watch?v={video_id}")
          os.remove(mp4)

          short_path = "/tmp/short.mp4"
          if os.path.exists(short_path):
              short_title = title[:90] + " #shorts" if len(title) <= 90 else title[:90] + "#shorts"
              print(f"Short title: {short_title}")
              short_id = upload(short_path, short_title, build_description(is_short=True))
              print(f"https://youtube.com/shorts/{short_id}")
              os.remove(short_path)
          else:
              print("No short to upload")

          with open("posted.txt", "a") as f:
              f.write(meta["id"] + "\n")
          PYEOF
        env:
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}

      - name: Save posted.txt to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posted.txt
          git diff --staged --quiet || git commit -m "track posted footage [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}