          def build_art(name):
              spec = ART[name]
              sky = vgrad(SKY[spec["sky"]], HZ + 80, CW)
              arr = np.vstack([sky, np.repeat(sky[-1:], CH - HZ - 80, axis=0)])
              img = Image.fromarray(np.clip(arr, 0, 255).astype(np.uint8)).convert("RGBA")
              for p in spec["p"]:
                  PRIM[p[0]](img, *p[1:])
              return img.convert("RGB")


          ART_IMG = {}


          def art_frame(name, lt, span, idx):
              if name not in ART_IMG:
                  ART_IMG[name] = build_art(name)
              p = min(1.0, max(0.0, lt / max(span, 1.0)))
              z = 1.0 + 0.07 * p
              cw, ch = W / z, H / z
              panx = (p - 0.5) * 50 * (1 if idx % 2 else -1)
              x0 = CW / 2 + panx - cw / 2
              y0 = CH / 2 - ch / 2
              return ART_IMG[name].transform((W, H), Image.EXTENT, (x0, y0, x0 + cw, y0 + ch), Image.BILINEAR)


          # ================================================================== STOCK FOOTAGE (Pixabay)
          def pix_find(q, taken):
              if not PIX:
                  return None
              try:
                  url = "https://pixabay.com/api/videos/?" + urllib.parse.urlencode(dict(key=PIX, q=q, video_type="film", per_page=20, safesearch="true"))
                  data = json.load(urllib.request.urlopen(url, timeout=15))
              except Exception as ex:
                  print("Pixabay search failed:", q, ex)
                  return None
              hits = [h for h in data.get("hits", []) if h.get("duration", 0) >= 5]
              random.shuffle(hits)
              for h in hits[:8]:
                  v = h.get("videos", {})
                  for k in ("large", "medium", "small"):
                      u = (v.get(k) or {}).get("url")
                      if u and u not in taken:
                          return u
              return None


          def fetch_clip(url, out, secs):
              try:
                  subprocess.run(["ffmpeg", "-v", "error", "-y", "-i", url, "-t", str(secs), "-c", "copy", out], capture_output=True, timeout=120)
              except Exception:
                  return False
              return os.path.exists(out) and os.path.getsize(out) > 10000


          class VReader:
              def __init__(self, path, dur):
                  vf = f"scale={W}:{H}:force_original_aspect_ratio=increase,crop={W}:{H},fps={FPS},eq=brightness=-0.10:saturation=0.9"
                  self.p = subprocess.Popen(["ffmpeg", "-v", "error", "-stream_loop", "-1", "-i", path, "-t", f"{dur:.2f}", "-vf", vf,
                                             "-pix_fmt", "rgb24", "-f", "rawvideo", "-"], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
                  self.last = None

              def read(self):
                  b = self.p.stdout.read(W * H * 3)
                  if b and len(b) == W * H * 3:
                      self.last = Image.frombytes("RGB", (W, H), b)
                  return self.last

              def close(self):
                  try:
                      self.p.stdout.close()
                      self.p.kill()
                      self.p.wait()
                  except Exception:
                      pass


