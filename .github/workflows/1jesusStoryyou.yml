          # ================================================================== NARRATION (TTS)
          VOICE = None
          TTS_DEAD = False


          def synth(i, text):
              global VOICE, TTS_DEAD
              if TTS_DEAD:
                  return None
              out = f"/tmp/seg{i}.mp3"
              clean = tts_clean(text)
              order = ([VOICE] if VOICE else []) + [v for v in VOICES if v != VOICE]
              for v in order:
                  for _ in range(2):
                      if os.path.exists(out):
                          os.remove(out)
                      try:
                          subprocess.run([sys.executable, "-m", "edge_tts", "--voice", v, "--rate=-8%", "--text", clean, "--write-media", out],
                                         capture_output=True, timeout=60)
                      except Exception:
                          pass
                      if os.path.exists(out) and os.path.getsize(out) > 0:
                          try:
                              a = load(out)
                              VOICE = v
                              return a
                          except Exception:
                              pass
              TTS_DEAD = True
              return None


          t = 0.2
          for i, s in enumerate(segs):
              a = synth(i, s["text"])
              if a is None or len(a) == 0:
                  sys.exit("Narration failed, not creating a silent story video.")
              s["audio"] = a / (float(np.max(np.abs(a))) or 1.0) * 0.92
              s["start"] = t
              s["dur"] = len(a) / SR + 0.1
              t = s["start"] + s["dur"] + 0.45
          TOTAL = segs[-1]["start"] + segs[-1]["dur"] + 1.3
          for i, s in enumerate(segs):
              nxt = segs[i + 1]["start"] if i + 1 < len(segs) else TOTAL
              s["span"] = nxt - s["start"]
              s["end"] = nxt
          print(f"Total duration: {TOTAL:.1f}s with {len(segs)} scenes")

          # ================================================================== VISUAL SOURCES
          for s in segs:
              s["vid"] = None
          if vis == "stock":
              taken = set()
              for i, s in enumerate(segs):
                  for q in [s["stock"], "peaceful nature", "clouds sky"]:
                      u = pix_find(q, taken)
                      if not u:
                          continue
                      taken.add(u)
                      path = f"/tmp/clip{i}.mp4"
                      if fetch_clip(u, path, min(12, int(s["span"]) + 3)):
                          s["vid"] = path
                          break
                  print(f"Scene {i}: {'stock' if s['vid'] else 'illustration (fallback)'}")

          # ================================================================== OVERLAYS
          OVS = []


          def ov(im, cx, cy, a, b=None, fd=0.4):
              OVS.append(dict(im=im, cx=cx, cy=cy, a=a, b=b, fd=fd))


          ov(pill_img(series, PLAY_B, 40, GOLD, GINK), W / 2, 255, 0.05, None, 0.5)
          ov(text_img(st["title"], PLAY_B, 66, "#FFFFFF", 940), W / 2, 375, 0.05, None, 0.5)
          for s in segs:
              for im, cy in s["cap"]:
                  ov(im, W / 2, cy, s["start"] + 0.08, s["end"] if s is not segs[-1] else None, 0.4)


          def fade(im, a):
              r, g, b, al = im.split()
              return Image.merge("RGBA", (r, g, b, al.point(lambda v: int(v * a))))


          BLACK = Image.new("RGB", (W, H), (0, 0, 0))
          sm = np.zeros(H, dtype=np.float32)
          sm[:520] = np.linspace(125, 0, 520)
          sm[1000:] = np.linspace(0, 110, H - 1000)
          SHADE = Image.fromarray(np.repeat(sm[:, None], W, axis=1).astype(np.uint8), "L")

          cur = 0


          def render(t):
              global cur
              while cur + 1 < len(segs) and t >= segs[cur + 1]["start"]:
                  r = segs[cur].get("reader")
                  if r:
                      r.close()
                      segs[cur]["reader"] = None
                  cur += 1
              s = segs[cur]
              lt = t - s["start"]
              fr = None
              if s["vid"]:
                  if s.get("reader") is None:
                      s["reader"] = VReader(s["vid"], s["span"] + 1.0)
                  fr = s["reader"].read()
              fr = fr.copy() if fr is not None else art_frame(s["art"], lt, s["span"], cur)
              a = min(1.0, max(0.0, lt / 0.4))
              if t > TOTAL - 1.0:
                  a = min(a, max(0.0, TOTAL - t))
              if a < 1.0:
                  fr = Image.blend(BLACK, fr, a)
              fr.paste(BLACK, (0, 0), SHADE)
              fr = fr.convert("RGBA")
              for o in OVS:
                  if t < o["a"]:
                      continue
                  if o["b"] is not None and t >= o["b"]:
                      al = 1 - (t - o["b"]) / 0.2
                      if al <= 0:
                          continue
                      dy = 0
                  else:
                      x = min(1.0, (t - o["a"]) / o["fd"])
                      al = 1 - (1 - x) ** 3
                      dy = (1 - al) * 30
                  im = o["im"] if al >= 0.99 else fade(o["im"], al)
                  fr.alpha_composite(im, (int(o["cx"] - im.width / 2), int(o["cy"] + dy - im.height / 2)))
              return fr.convert("RGB")


          # ================================================================== AUDIO
          buf = np.zeros(int((TOTAL + 0.5) * SR), dtype=np.float32)


          def tone(freq, d_, vol, decay):
              tt = np.arange(int(SR * d_)) / SR
              return (np.sin(2 * np.pi * freq * tt) * np.exp(-decay * tt) * vol).astype(np.float32)


          CHIME = tone(784, 1.4, 0.26, 3.5) + tone(988, 1.4, 0.2, 3.5) + tone(1319, 1.4, 0.14, 3.5)


          def mix(snd, at, gain=1.0):
              i = int(at * SR)
              n = min(len(snd), len(buf) - i)
              if n > 0 and i >= 0:
                  buf[i:i + n] += snd[:n] * gain


          for s in segs:
              mix(s["audio"], s["start"])
          mix(CHIME, 0.05)
          mix(CHIME, segs[-2]["start"] - 0.1, 0.8)


          def pad_music(total):
              tt = np.arange(int(total * SR)) / SR
              root = random.choice([130.81, 146.83, 164.81, 174.61, 196.0])
              out = np.zeros_like(tt)
              for r, a in ((1, 1.0), (1.5, 0.7), (2, 0.6), (2.5, 0.4), (3, 0.3)):
                  out += a * np.sin(2 * np.pi * root * r * tt + random.uniform(0, 6.28)) * (0.7 + 0.3 * np.sin(2 * np.pi * random.uniform(0.07, 0.15) * tt))
              return (out / (np.max(np.abs(out)) or 1)).astype(np.float32)


          # music: one folder, bgmusic/
          EXTS = ("mp3", "wav", "m4a", "aac", "ogg", "flac", "mp4")
          cands = [p for e in EXTS for p in glob.glob(f"bgmusic/*.{e}")]
          m = None
          if cands:
              try:
                  mp = random.choice(cands)
                  dd = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", mp], capture_output=True, text=True).stdout.strip()
                  mdur = float(dd) if dd else 0
                  ms = random.uniform(0, mdur - TOTAL - 2) if mdur > TOTAL + 4 else 0
                  raw = subprocess.run(["ffmpeg", "-v", "error", "-stream_loop", "-1", "-ss", f"{ms:.1f}", "-t", f"{TOTAL:.1f}", "-i", mp,
                                        "-f", "f32le", "-ac", "1", "-ar", str(SR), "-"], capture_output=True).stdout
                  m = np.frombuffer(raw, dtype=np.float32).copy()
                  m = m / (float(np.max(np.abs(m))) or 1.0)
                  print("Music:", mp)
              except Exception as ex:
                  print("music failed:", ex)
                  m = None
          if m is None or len(m) == 0:
              m = pad_music(TOTAL)
          n = min(len(m), len(buf))
          env = np.ones(n, dtype=np.float32)
          fi, fo = int(SR * 0.8), int(SR * 1.5)
          if n > fi + fo:
              env[:fi] = np.linspace(0, 1, fi)
              env[-fo:] = np.linspace(1, 0, fo)
          buf[:n] += m[:n] * env * 0.12

          buf = np.clip(buf * 0.92, -1, 1)
          with wave.open("audio.wav", "wb") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(SR)
              wf.writeframes((buf * 32767).astype(np.int16).tobytes())

          # ================================================================== ENCODE
          ff = subprocess.Popen(["ffmpeg", "-v", "error", "-y", "-f", "rawvideo", "-pix_fmt", "rgb24", "-s", f"{W}x{H}", "-r", str(FPS),
                                 "-i", "-", "-i", "audio.wav", "-c:v", "libx264", "-preset", "veryfast", "-crf", "20", "-pix_fmt", "yuv420p",
                                 "-c:a", "aac", "-b:a", "192k", "-ac", "2", "-t", f"{TOTAL:.2f}", "-movflags", "+faststart", "final.mp4"],
                                stdin=subprocess.PIPE)
          for k in range(int(TOTAL * FPS)):
              ff.stdin.write(render(k / FPS).tobytes())
          ff.stdin.close()
          ff.wait()
          for s in segs:
              if s.get("reader"):
                  s["reader"].close()

          # ================================================================== METADATA (SEO)
          title, ref, lesson, verse, vref = st["title"], st["ref"], st["lesson"], st["verse"], st["vref"]
          story_text = " ".join(x[0] for x in st["scenes"])
          TITLES = [f"{title} Explained in 1 Minute \u271D\uFE0F Bible Story",
                    f"The Story of {title} | Bible Stories #{EP}",
                    f"{title} ({ref}) | Bible Story with Lesson",
                    f"{title}: What Is the Lesson? \U0001F4D6 Bible Story"]
          hashtags = ["#BibleStory", "#BibleStories", "#Jesus", "#Christian", "#KJV", "#Shorts"]
          desc = (f"{title} ({ref}): a Bible story told in under a minute, with the lesson and key verse.\n\n"
                  f"THE STORY\n{story_text}\n\n"
                  f"THE LESSON\n{lesson}\n\n"
                  f"\U0001F4D6 {vref} (KJV): \"{verse}\"\n\n"
                  "\U0001F4AC What does this story mean to you? Tell us in the comments.\n\n"
                  "\U0001F4D6 Bible translation: King James Version (KJV, public domain).\n"
                  "\U0001F514 Subscribe for a new Bible story every day.\n\n" + " ".join(hashtags))
          base_tags = ["bible story", "bible stories", "bible stories short", "jesus", "christian shorts", "bible study", "kjv", "faith", "scripture", "bible lesson"]
          tags, total_len = [], 0
          for tg in base_tags + [title.lower(), ref.lower(), f"{title.lower()} bible story"]:
              if tg not in tags and total_len + len(tg) + 3 < 480:
                  tags.append(tg)
                  total_len += len(tg) + 3
          comment = (f"\u271D\uFE0F {title} ({ref})\nLesson: {lesson}\n\n{vref} (KJV): \"{verse}\"\n\n"
                     "What does this story mean to you? \U0001F447 Which Bible story should we tell next?")
          json.dump(dict(title=random.choice(TITLES)[:100], description=desc[:4900], tags=tags, comment=comment, fmt="story"),
                    open("meta.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          json.dump(used, open(USED_FILE, "w"), ensure_ascii=False, indent=1)
          print("Done.")
          PYEOF

          python3 story.py
          ls -lh final.mp4

      - name: post-to-youtube
        id: post
        timeout-minutes: 8
        env:
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_PLAYLISTS: ${{ secrets.YT_PLAYLISTS }}
        run: |
          python3 << 'PYEOF'
          import os, json, time
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials

          meta = json.load(open("meta.json", encoding="utf-8"))

          creds = Credentials(
              token=os.environ.get("YT_ACCESS_TOKEN"),
              refresh_token=os.environ.get("YT_REFRESH_TOKEN"),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ.get("YT_CLIENT_ID"),
              client_secret=os.environ.get("YT_CLIENT_SECRET"),
          )
          youtube = build("youtube", "v3", credentials=creds)

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": meta["title"],
                      "description": meta["description"],
                      "tags": meta["tags"],
                      "categoryId": "27",
                      "defaultLanguage": "en",
                      "defaultAudioLanguage": "en",
                  },
                  "status": {"privacyStatus": "public", "selfDeclaredMadeForKids": False},
              },
              media_body=MediaFileUpload("final.mp4", mimetype="video/mp4", resumable=True),
          )

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"Upload progress: {int(status.progress() * 100)}%")

          vid = response.get("id", "")
          print(f"Uploaded: https://youtube.com/shorts/{vid}")

          for attempt in range(4):
              try:
                  time.sleep(20)
                  youtube.commentThreads().insert(
                      part="snippet",
                      body={"snippet": {"videoId": vid, "topLevelComment": {"snippet": {"textOriginal": meta["comment"]}}}},
                  ).execute()
                  print("Comment posted")
                  break
              except Exception as ex:
                  print(f"::warning::Comment attempt {attempt + 1} failed: {ex}")

          try:
              pl = json.loads(os.environ.get("YT_PLAYLISTS") or "{}")
              pid = pl.get(meta["fmt"])
              if pid:
                  youtube.playlistItems().insert(
                      part="snippet",
                      body={"snippet": {"playlistId": pid, "resourceId": {"kind": "youtube#video", "videoId": vid}}},
                  ).execute()
                  print("Added to playlist")
          except Exception as ex:
              print(f"::warning::Playlist add failed: {ex}")
          PYEOF

