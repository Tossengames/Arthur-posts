name: bible-story-shorts

"on":
  workflow_dispatch:
    inputs:
      visuals:
        description: "Visuals"
        required: false
        default: "auto"
        type: choice
        options: [auto, illustration, stock]
      story:
        description: "Story title (optional, leave auto for random)"
        required: false
        default: "auto"
        type: string
  schedule:
  #  - cron: "0 22 * * *"   # once a day, 6 PM EST / 22:00 UTC

permissions:
  contents: write

concurrency:
  group: bible-story-shorts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install-deps
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq python3-pip fonts-noto-core fonts-dejavu-core fonts-liberation
          for p in fonts-playfair-display fonts-merriweather; do
            sudo apt-get install -y "$p" || true
          done
          pip install --quiet --break-system-packages pillow numpy edge-tts google-auth google-auth-oauthlib google-api-python-client || pip install --quiet pillow numpy edge-tts google-auth google-auth-oauthlib google-api-python-client

      - name: build-video
        id: build
        timeout-minutes: 18
        env:
          VISUALS: ${{ github.event.inputs.visuals }}
          STORY: ${{ github.event.inputs.story }}
          # Scheduled runs use this. Set to "illustration" or "stock" to lock it, or "mix" to alternate randomly.
          AUTO_VISUALS: mix
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: |
          cat > story.py << 'PYEOF'
          import os, re, json, random, math, subprocess, glob, wave, sys, urllib.request, urllib.parse
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          W, H, FPS, SR = 1080, 1920, 24, 44100
          CW, CH = 1188, 2112          # art canvas, 10% larger than the frame so we can zoom and pan
          HZ = 900                      # horizon line on the canvas
          VOICES = ["en-US-AndrewNeural", "en-US-GuyNeural", "en-US-AriaNeural"]
          GOLD, GINK = "#D4AF37", "#1A1208"
          PANEL = (16, 16, 36, 208)

          # ================================================================== FONTS / HELPERS
          ALL_FONTS = glob.glob("/usr/share/fonts/**/*.[ot]tf", recursive=True)


          def pick(*cands, ital=False):
              for toks in cands:
                  for f in sorted(ALL_FONTS):
                      n = os.path.basename(f).lower()
                      if all(t in n for t in toks) and (("italic" in n) == ital):
                          return f
              return None


          SANS_B = pick(("notosans-bold",), ("liberationsans-bold",), ("dejavusans-bold",))
          SERIF_B = pick(("notoserif-bold",), ("liberationserif-bold",), ("dejavuserif-bold",))
          PLAY_B = pick(("playfair", "bold"), ("merriweather", "bold")) or SERIF_B
          SERIF_I = pick(("notoserif-bold",), ("dejavuserif-bold",), ("liberationserif-bold",), ital=True) or SERIF_B

          _fc = {}


          def font(p, s):
              k = (p, s)
              if k not in _fc:
                  _fc[k] = ImageFont.truetype(p, s)
              return _fc[k]


          M = ImageDraw.Draw(Image.new("RGBA", (1, 1)))


          def hexrgb(h):
              h = h.lstrip("#")
              return tuple(int(h[i:i + 2], 16) for i in (0, 2, 4))


          def rgba(c, a=255):
              if isinstance(c, str):
                  return hexrgb(c) + (a,)
              return tuple(c) if len(c) == 4 else tuple(c) + (a,)


          def wrap(text, f, maxw):
              lines, cur = [], ""
              for w in text.split():
                  tr = (cur + " " + w).strip()
                  if cur and M.textlength(tr, font=f) > maxw:
                      lines.append(cur)
                      cur = w
                  else:
                      cur = tr
              if cur:
                  lines.append(cur)
              return lines


          def text_img(text, fp, size, color, maxw, lh=1.25):
              f = font(fp, size)
              lines = wrap(text, f, maxw)
              wd = int(max(M.textlength(l, font=f) for l in lines)) + 40
              hd = int(size * lh * len(lines)) + 30
              im = Image.new("RGBA", (wd, hd), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              for i, l in enumerate(lines):
                  cy = 15 + size * lh * (i + 0.5)
                  d.text((wd / 2 + 3, cy + 4), l, font=f, fill=(0, 0, 0, 150), anchor="mm")
                  d.text((wd / 2, cy), l, font=f, fill=rgba(color), anchor="mm")
              return im


          def panel_img(text, fp, size, maxw=930, maxh=480, pad=44, fillc=PANEL, ink="#FFFFFF", outline=GOLD, lh=1.3):
              while True:
                  f = font(fp, size)
                  lines = wrap(text, f, maxw - 2 * pad)
                  h = int(size * lh * len(lines)) + 2 * pad
                  if h <= maxh or size <= 28:
                      break
                  size -= 2
              wd = int(max(M.textlength(l, font=f) for l in lines)) + 2 * pad
              m = 14
              im = Image.new("RGBA", (wd + 2 * m, h + 2 * m), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              d.rounded_rectangle([m + 4, m + 8, m + wd + 4, m + h + 8], radius=44, fill=(0, 0, 0, 70))
              d.rounded_rectangle([m, m, m + wd, m + h], radius=44, fill=rgba(fillc), outline=rgba(outline), width=5)
              for i, l in enumerate(lines):
                  d.text((m + wd / 2, m + pad + size * lh * (i + 0.5)), l, font=f, fill=rgba(ink), anchor="mm")
              return im


          def pill_img(text, fp, size, fill, ink, maxw=940, outline="#FFFFFF"):
              while True:
                  f = font(fp, size)
                  tw = int(M.textlength(text, font=f))
                  w = int(tw + size * 1.6)
                  if w <= maxw or size <= 26:
                      break
                  size -= 2
              h = int(size * 1.85)
              pad = 16
              im = Image.new("RGBA", (w + 2 * pad, h + 2 * pad), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              d.rounded_rectangle([pad + 4, pad + 8, pad + w + 4, pad + h + 8], radius=h // 2, fill=(0, 0, 0, 80))
              d.rounded_rectangle([pad, pad, pad + w, pad + h], radius=h // 2, fill=rgba(fill), outline=rgba(outline), width=5)
              d.text((pad + w / 2, pad + h / 2), text, font=f, fill=rgba(ink), anchor="mm")
              return im


          def spoken_ref(r):
              r = re.sub(r"^1 ", "First ", r)
              r = re.sub(r"^2 ", "Second ", r)
              r = re.sub(r"^3 ", "Third ", r)
              m = re.search(r"(\d+):(\d+)-(\d+)", r)
              if m:
                  return r[:m.start()] + f"chapter {m.group(1)}, verses {m.group(2)} through {m.group(3)}"
              m = re.search(r"(\d+):(\d+)", r)
              if m:
                  return r[:m.start()] + f"chapter {m.group(1)}, verse {m.group(2)}"
              return r


          def tts_clean(s):
              s = s.replace("\u2026", ".").replace("\u201c", "").replace("\u201d", "").replace('"', "")
              s = re.sub(r"\b[A-Z]{2,}\b", lambda m: m.group(0).capitalize(), s)
              return re.sub(r"\s+", " ", s).strip()


          def load(path):
              raw = subprocess.run(["ffmpeg", "-v", "error", "-i", path, "-f", "f32le", "-ac", "1", "-ar", str(SR), "-"],
                                   capture_output=True, check=True).stdout
              return np.frombuffer(raw, dtype=np.float32).copy()


          # ================================================================== STORIES (KJV verses)
          # scenes: (narration + on-screen caption, illustration preset, stock footage search)
          STORIES = [
              dict(title="The Good Samaritan", ref="Luke 10:25-37",
                   scenes=[
                       ("A man was traveling down a lonely road when robbers attacked him and left him half dead.", "road_alone", "dusty road"),
                       ("A priest came by, saw the man, and passed by on the other side.", "road_two", "empty road"),
                       ("A Levite came next, and he also walked past without helping.", "road_two", "walking path"),
                       ("Then a Samaritan traveler saw him, and his heart was moved with compassion.", "road_alone", "sunrise road"),
                       ("He bandaged the man's wounds and took him to an inn to recover.", "road_inn", "old village"),
                       ("He even paid the innkeeper and promised to return and cover any more costs.", "road_inn", "sunset village"),
                   ],
                   lesson="Love your neighbor by showing mercy to anyone in need.",
                   verse="Go, and do thou likewise.", vref="Luke 10:37"),
              dict(title="The Prodigal Son", ref="Luke 15:11-32",
                   scenes=[
                       ("A father had two sons. The younger one asked for his share of the inheritance and left home.", "home_day", "family home field"),
                       ("In a far country, he wasted everything he had on reckless living.", "far_country", "desert dunes"),
                       ("A famine came, and he was so hungry that he took a job feeding pigs.", "far_country", "dry field"),
                       ("At last he came to his senses and decided to go home and ask for forgiveness.", "road_alone", "walking road"),
                       ("While he was still far away, his father saw him, ran to him, and embraced him.", "home_welcome", "sunset field"),
                       ("The father called for a feast, saying his son was lost and now was found.", "feast", "candle light"),
                   ],
                   lesson="God's love welcomes us home, no matter how far we have wandered.",
                   verse="For this my son was dead, and is alive again; he was lost, and is found.", vref="Luke 15:24"),
              dict(title="The Lost Sheep", ref="Luke 15:1-7",
                   scenes=[
                       ("A shepherd had one hundred sheep, and he knew every one of them.", "pasture_day", "sheep field"),
                       ("One day, one sheep wandered off and was lost.", "pasture_day", "green hills"),
                       ("So he left the ninety-nine and went out to search for the one.", "mountain_search", "mountains fog"),
                       ("He searched through the hills and valleys until he found it.", "mountain_search", "hills sunrise"),
                       ("He lifted it onto his shoulders and carried it home, rejoicing.", "pasture_night", "night sky stars"),
                       ("Then he called his friends and neighbors to celebrate with him.", "feast", "candle flame"),
                   ],
                   lesson="Every single person matters to God.",
                   verse="Rejoice with me; for I have found my sheep which was lost.", vref="Luke 15:6"),
              dict(title="The Sower", ref="Matthew 13:3-23",
                   scenes=[
                       ("A farmer went out to sow his seed.", "field_sower", "wheat field"),
                       ("Some seed fell on the path, and the birds came and ate it.", "field_sower", "birds sky"),
                       ("Some fell on rocky ground. It sprang up quickly, but withered in the sun.", "desert_day", "dry rocks"),
                       ("Some fell among thorns, and the thorns choked it.", "field_sower", "wild bushes"),
                       ("But some fell on good soil, and it produced a great harvest.", "harvest", "golden wheat"),
                   ],
                   lesson="Keep your heart open so God's word can take root and grow.",
                   verse="But he that received seed into the good ground is he that heareth the word, and understandeth it\u2026", vref="Matthew 13:23"),
              dict(title="Jonah and the Great Fish", ref="Jonah 1-3",
                   scenes=[
                       ("God told Jonah to go to the great city of Nineveh, but Jonah ran the other way.", "city_day", "ancient city"),
                       ("He boarded a ship, and a terrible storm struck the sea.", "sea_storm", "stormy sea"),
                       ("Jonah told the sailors to throw him overboard, and the sea became calm.", "sea_calm", "calm ocean"),
                       ("God sent a great fish to swallow Jonah. For three days and nights, he prayed from inside.", "sea_fish", "deep ocean"),
                       ("The fish brought Jonah to dry land, and he went to Nineveh to share God's message.", "shore_land", "beach sunrise"),
                       ("The people turned back to God, and God showed them mercy.", "city_day", "sunrise city"),
                   ],
                   lesson="God's mercy reaches everyone, and you can always return to him.",
                   verse="I cried by reason of mine affliction unto the LORD, and he heard me\u2026", vref="Jonah 2:2"),
              dict(title="David and Goliath", ref="1 Samuel 17",
                   scenes=[
                       ("The giant Goliath mocked Israel's army for forty days, and no one dared to face him.", "giant", "mountain valley"),
                       ("A young shepherd named David said he would fight the giant.", "pasture_day", "shepherd sheep"),
                       ("King Saul offered his armor, but David chose his sling and five smooth stones.", "giant", "river stones"),
                       ("David told Goliath, I come to you in the name of the LORD.", "giant", "clouds sky"),
                       ("David's stone struck the giant, and Goliath fell.", "giant", "storm clouds"),
                       ("God gave Israel the victory that day.", "mountain_dawn", "sunrise mountains"),
                   ],
                   lesson="With God's help, you can face giants far bigger than you.",
                   verse="\u2026but I come to thee in the name of the LORD of hosts\u2026", vref="1 Samuel 17:45"),
              dict(title="Daniel in the Lions' Den", ref="Daniel 6",
                   scenes=[
                       ("Daniel was a faithful servant of God who prayed three times every day.", "palace", "ancient city"),
                       ("Jealous officials tricked the king into signing a law against praying to anyone but the king.", "palace", "candle light"),
                       ("Daniel kept praying to God, just as he always had.", "palace", "window light"),
                       ("So he was thrown into a den of lions, and the king could not sleep that night.", "den", "dark cave"),
                       ("At dawn, the king hurried to the den and called out to Daniel.", "den", "cave sunrise"),
                       ("Daniel was safe, because God had shut the lions' mouths.", "mountain_dawn", "sunrise light"),
                   ],
                   lesson="Stay faithful to God, and trust him even when it is hard.",
                   verse="My God hath sent his angel, and hath shut the lions' mouths, that they have not hurt me\u2026", vref="Daniel 6:22"),
              dict(title="Noah and the Ark", ref="Genesis 6-9",
                   scenes=[
                       ("The world had become full of violence, but Noah found favor with God.", "ark_build", "forest trees"),
                       ("God told Noah to build a great ark and bring his family and the animals inside.", "ark_build", "wood forest"),
                       ("Then the rain fell for forty days and forty nights, and the flood covered the earth.", "ark_flood", "heavy rain"),
                       ("The ark floated safely until it came to rest on the mountains of Ararat.", "ark_flood", "ocean waves"),
                       ("When the waters dried, Noah and his family stepped out onto dry ground.", "ark_rainbow", "green valley"),
                       ("God set a rainbow in the sky as a promise that he would never flood the whole earth again.", "ark_rainbow", "rainbow"),
                   ],
                   lesson="God keeps his promises, and he protects those who trust him.",
                   verse="I do set my bow in the cloud, and it shall be for a token of a covenant between me and the earth.", vref="Genesis 9:13"),
              dict(title="Jesus Calms the Storm", ref="Mark 4:35-41",
                   scenes=[
                       ("One evening, Jesus told his disciples to cross the sea with him.", "sea_calm", "sunset lake"),
                       ("A fierce storm arose, and waves crashed into the boat.", "sea_storm", "stormy sea"),
                       ("The disciples were terrified, but Jesus was asleep.", "sea_storm", "dark clouds"),
                       ("They woke him and cried out, Teacher, do you not care that we are perishing?", "sea_storm", "rain"),
                       ("Jesus stood up and said to the sea, Peace, be still.", "sea_calm_night", "calm sea night"),
                       ("The wind stopped, and there was a great calm.", "sea_calm_night", "calm ocean"),
                   ],
                   lesson="Jesus is with you in every storm, and he can bring peace.",
                   verse="And he arose, and rebuked the wind, and said unto the sea, Peace, be still. And the wind ceased, and there was a great calm.", vref="Mark 4:39"),
              dict(title="The Birth of Jesus", ref="Luke 2:1-20",
                   scenes=[
                       ("Mary and Joseph traveled to Bethlehem, because the emperor ordered a census.", "road_alone", "desert road"),
                       ("There was no room for them at the inn, so Jesus was born in a humble stable.", "stable_night", "stable night"),
                       ("Nearby, shepherds were watching their flocks at night.", "pasture_night", "night stars"),
                       ("An angel appeared and told them, Do not be afraid, for a Savior has been born.", "pasture_night", "starry sky"),
                       ("The shepherds hurried to Bethlehem and found the baby lying in a manger.", "stable_night", "candle light"),
                       ("They went away glorifying God and telling everyone what they had seen.", "mountain_dawn", "sunrise hills"),
                   ],
                   lesson="The greatest gift came quietly, and it is for everyone.",
                   verse="For unto you is born this day in the city of David a Saviour, which is Christ the Lord.", vref="Luke 2:11"),
              dict(title="The Wise and Foolish Builders", ref="Matthew 7:24-27",
                   scenes=[
                       ("Jesus told a story about two builders.", "house_rock", "building construction"),
                       ("A wise man built his house on solid rock.", "house_rock", "rock cliff"),
                       ("A foolish man built his house on sand.", "house_sand", "desert sand"),
                       ("Then the rain fell, the floods came, and the winds beat against both houses.", "house_storm", "heavy rain"),
                       ("The house on the rock stood firm, but the house on the sand fell.", "house_rock", "storm clouds"),
                   ],
                   lesson="Build your life on the words of Jesus, and it will stand.",
                   verse="Therefore whosoever heareth these sayings of mine, and doeth them, I will liken him unto a wise man, which built his house upon a rock.", vref="Matthew 7:24"),
          ]

          # ================================================================== PICK STORY + VISUAL MODE
          USED_FILE = "used_stories.json"
          used = json.load(open(USED_FILE)) if os.path.exists(USED_FILE) else {}
          want = (os.environ.get("STORY") or "auto").strip().lower()
          st = None
          if want not in ("", "auto"):
              st = next((s for s in STORIES if want in s["title"].lower()), None)
          if st is None:
              ug = used.get("done", [])
              pool = [s for s in STORIES if s["title"] not in ug and s["title"] != used.get("_last")]
              if not pool:
                  ug = []
                  pool = [s for s in STORIES if s["title"] != used.get("_last")] or STORIES
              st = random.choice(pool)
              used["done"] = ug + [st["title"]]
          used["_last"] = st["title"]
          used["_ep"] = used.get("_ep", 0) + 1
          EP = used["_ep"]
          series = f"BIBLE STORIES #{EP}"

          PIX = os.environ.get("PIXABAY_KEY", "").strip()
          vis = (os.environ.get("VISUALS") or "auto").strip()
          if vis not in ("illustration", "stock"):
              am = (os.environ.get("AUTO_VISUALS") or "mix").strip()
              vis = am if am in ("illustration", "stock") else random.choice(["illustration", "stock"])
          if vis == "stock" and not PIX:
              print("No PIXABAY_KEY secret found, falling back to illustration.")
              vis = "illustration"
          print("Story:", st["title"], "| Visuals:", vis, "| Episode:", EP)

          # ================================================================== ILLUSTRATION ENGINE
          SKY = {
              "day": [(86, 160, 214), (150, 200, 235), (235, 243, 250)],
              "dawn": [(70, 60, 120), (214, 112, 140), (255, 190, 130), (255, 225, 170)],
              "dusk": [(40, 40, 100), (150, 70, 130), (240, 130, 100), (255, 190, 120)],
              "night": [(6, 10, 36), (16, 26, 70), (38, 50, 110)],
              "storm": [(30, 36, 50), (60, 70, 90), (100, 110, 125)],
              "desert": [(120, 170, 215), (230, 205, 160), (250, 225, 180)],
          }
          GR = {"green": [(60, 120, 72), (24, 60, 40)], "sand": [(222, 190, 130), (150, 120, 80)],
                "dark": [(24, 44, 40), (8, 18, 22)], "dusk": [(70, 70, 60), (30, 30, 34)], "stone": [(110, 100, 90), (60, 56, 52)]}


          def vgrad(stops, h, w):
              ys = np.linspace(0, 1, h)[:, None]
              n = len(stops) - 1
              pos = ys * n
              idx = np.minimum(pos.astype(int), n - 1)
              fr = pos - idx
              c = np.array(stops, dtype=np.float32)
              g = c[idx[:, 0]] * (1 - fr) + c[idx[:, 0] + 1] * fr
              return np.repeat(g[:, None, :], w, axis=1)


          def p_sun(img, x, y, r, col=(255, 244, 200)):
              layer = Image.new("RGBA", img.size, (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)
              for k in range(6, 0, -1):
                  rr = r * (1 + k * 0.7)
                  d.ellipse([x - rr, y - rr, x + rr, y + rr], fill=col + (18,))
              d.ellipse([x - r, y - r, x + r, y + r], fill=col + (255,))
              img.alpha_composite(layer.filter(ImageFilter.GaussianBlur(8)))


          def p_moon(img, x, y, r):
              p_sun(img, x, y, r, (240, 240, 225))


          def p_stars(img, n=140, seed=1):
              d = ImageDraw.Draw(img)
              r = random.Random(seed)
              for _ in range(n):
                  x, y, s, v = r.randint(0, CW), r.randint(0, HZ - 40), r.choice([1, 2, 2, 3]), r.randint(170, 255)
                  d.ellipse([x, y, x + s, y + s], fill=(v, v, 255, 255))


          def p_clouds(img, items, col=(255, 255, 255), a=170):
              layer = Image.new("RGBA", img.size, (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)
              for x, y, w in items:
                  for dx, dy, k in ((0, 0, 1), (-0.35, 0.08, 0.7), (0.35, 0.1, 0.75), (0.1, -0.12, 0.6)):
                      rw, rh = w * k * 0.5, w * k * 0.22
                      d.ellipse([x + dx * w - rw, y + dy * w - rh, x + dx * w + rw, y + dy * w + rh], fill=tuple(col) + (a,))
              img.alpha_composite(layer.filter(ImageFilter.GaussianBlur(10)))


          def p_mount(img, base, col, peaks):
              d = ImageDraw.Draw(img)
              shade = tuple(int(c * 0.82) for c in col)
              for x, h, w in peaks:
                  d.polygon([(x - w, base), (x, base - h), (x + w, base)], fill=col + (255,))
                  d.polygon([(x, base - h), (x + w, base), (x + w * 0.15, base)], fill=shade + (255,))


          def p_hills(img, base, col, amp, freq, ph):
              d = ImageDraw.Draw(img)
              pts = [(x, base + amp * math.sin(x * freq + ph) + amp * 0.5 * math.sin(x * freq * 2.3 + ph * 1.7)) for x in range(0, CW + 20, 20)]
              pts += [(CW, CH), (0, CH)]
              d.polygon(pts, fill=col + (255,))


          def p_ground(img, name, top=None):
              top = top or HZ
              arr = vgrad(GR[name], CH - top, CW).astype(np.uint8)
              img.paste(Image.fromarray(arr).convert("RGBA"), (0, top))


          def p_water(img, top, c1, c2, seed=1):
              arr = vgrad([c1, c2], CH - top, CW).astype(np.uint8)
              img.paste(Image.fromarray(arr).convert("RGBA"), (0, top))
              d = ImageDraw.Draw(img)
              r = random.Random(seed)
              lt = tuple(min(255, c + 40) for c in c1)
              for _ in range(40):
                  x, y, w = r.randint(0, CW), r.randint(top + 20, CH - 100), r.randint(60, 200)
                  d.arc([x, y, x + w, y + 30], 200, 340, fill=lt + (255,), width=3)


          def p_figure(img, x, y, s=1.0, col=(50, 36, 30), staff=False):
              d = ImageDraw.Draw(img)
              c = col + (255,)
              r = int(24 * s)
              bh, tw, bw = int(150 * s), int(36 * s), int(64 * s)
              d.polygon([(x - tw // 2, y - bh), (x + tw // 2, y - bh), (x + bw // 2, y), (x - bw // 2, y)], fill=c)
              d.ellipse([x - r, y - bh - 2 * r + 4, x + r, y - bh + 4], fill=c)
              if staff:
                  d.line([(x + int(50 * s), y + 4), (x + int(42 * s), y - int(260 * s))], fill=c, width=max(3, int(6 * s)))


          def p_sheep(img, x, y, s=1.0):
              d = ImageDraw.Draw(img)
              w, h = int(70 * s), int(46 * s)
              dk = (50, 40, 36, 255)
              d.ellipse([x - w // 2, y - h, x + w // 2, y], fill=(245, 245, 240, 255))
              d.ellipse([x + w // 2 - int(8 * s), y - h + int(2 * s), x + w // 2 + int(26 * s), y - h + int(26 * s)], fill=dk)
              for dx in (-w // 4, w // 4):
                  d.rectangle([x + dx - 3, y - 2, x + dx + 3, y + int(18 * s)], fill=dk)


          def p_tree(img, x, y, s=1.0, col=(40, 100, 60)):
              d = ImageDraw.Draw(img)
              d.rectangle([x - int(10 * s), y - int(120 * s), x + int(10 * s), y], fill=(80, 56, 40, 255))
              for dx, dy, r in ((0, -170, 70), (-45, -135, 50), (45, -135, 50)):
