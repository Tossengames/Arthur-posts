name: Post Japan Footage to YouTube

on:
  workflow_dispatch:
    inputs:
      term_choice:
        description: "Pick a term (ignored if custom text below is filled in)"
        required: true
        default: "Random - any Japan term"
        type: choice
        options:
          - "Random - any Japan term"
          - "Tokyo city"
          - "Kyoto"
          - "Osaka"
          - "Mount Fuji"
          - "Cherry blossom (sakura)"
          - "Japan snow / winter"
          - "Japan night city"
          - "Japan countryside"
          - "Japan temple"
          - "Japan street walk"
          - "Shibuya"
          - "Japan train"
          - "Japan garden"
          - "Japan autumn"
      custom_terms:
        description: "Write your own search terms (comma separated, optional). Overrides the dropdown."
        required: false
        default: ""
      min_size:
        description: "Minimum footage size to search for"
        required: true
        default: "100"
        type: choice
        options:
          - "100"
          - "200"
          - "400"
          - "500"
          - "700"
          - "1000"
          - "2000"
  schedule:
    - cron: "0 19 * * 1,3,5"

jobs:
  post:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install requests google-auth google-auth-oauthlib google-api-python-client
          echo "Done"

      - name: Find and download footage
        timeout-minutes: 10
        run: |
          python3 << 'PYEOF'
          import requests, os, sys, json, random

          POSTED_FILE = "posted.txt"
          already_posted = set()
          if os.path.exists(POSTED_FILE):
              with open(POSTED_FILE) as f:
                  already_posted = set(line.strip() for line in f if line.strip())
          print(f"Already posted: {len(already_posted)} items")

          ALL_TIERS = [100, 200, 400, 500, 700, 1000, 2000]
          min_size = int(os.environ.get("MIN_SIZE_MB", "100"))
          SIZE_TIERS_MB = sorted(set(t for t in ALL_TIERS if t >= min_size))
          if not SIZE_TIERS_MB:
              SIZE_TIERS_MB = [2000]

          PIXABAY_KEY = os.environ.get("PIXABAY_KEY", "")
          if not PIXABAY_KEY:
              print("PIXABAY_KEY missing")
              sys.exit(1)

          term_choice = os.environ.get("TERM_CHOICE", "Random - any Japan term").strip()
          custom_raw = os.environ.get("CUSTOM_TERMS", "").strip()
          custom_terms = [t.strip() for t in custom_raw.split(",") if t.strip()] if custom_raw else []

          # Big rotation pool used for "Random" and as overall fallback pool
          JAPAN_ALL = [
              "japan city", "tokyo city", "tokyo night", "tokyo street",
              "kyoto", "kyoto temple", "osaka city", "osaka night",
              "mount fuji", "japan cherry blossom", "sakura japan",
              "japan snow", "japan winter", "japan night city",
              "japan countryside", "japan rural", "japan temple",
              "japan shrine", "japan street walk", "shibuya",
              "shibuya crossing", "japan train", "shinkansen",
              "japan garden", "japan autumn", "japan fall foliage",
              "japan traditional", "japan lantern", "japan festival",
              "japan alley", "japan skyline", "japan aerial",
              "hokkaido", "okinawa", "nara japan", "japan bamboo forest"
          ]

          TERM_MAP = {
              "Tokyo city": ["tokyo city", "tokyo street", "tokyo skyline"],
              "Kyoto": ["kyoto", "kyoto temple", "kyoto street"],
              "Osaka": ["osaka city", "osaka night"],
              "Mount Fuji": ["mount fuji"],
              "Cherry blossom (sakura)": ["japan cherry blossom", "sakura japan"],
              "Japan snow / winter": ["japan snow", "japan winter", "hokkaido"],
              "Japan night city": ["japan night city", "tokyo night", "osaka night"],
              "Japan countryside": ["japan countryside", "japan rural"],
              "Japan temple": ["japan temple", "japan shrine", "kyoto temple"],
              "Japan street walk": ["japan street walk", "japan alley"],
              "Shibuya": ["shibuya", "shibuya crossing"],
              "Japan train": ["japan train", "shinkansen"],
              "Japan garden": ["japan garden", "japan bamboo forest"],
              "Japan autumn": ["japan autumn", "japan fall foliage"],
          }

          if custom_terms:
              queries = custom_terms
              print(f"Mode: custom terms -> {queries}")
          elif term_choice == "Random - any Japan term":
              queries = JAPAN_ALL
              print("Mode: random from full Japan rotation")
          else:
              queries = TERM_MAP.get(term_choice, JAPAN_ALL)
              print(f"Mode: picked term -> {term_choice} -> {queries}")

          def search_pixabay(min_mb, max_mb, qlist):
              qlist = list(qlist)
              random.shuffle(qlist)
              for query in qlist:
                  try:
                      r = requests.get(
                          "https://pixabay.com/api/videos/",
                          params={"key": PIXABAY_KEY, "q": query, "per_page": 20, "safesearch": "true"},
                          timeout=20
                      )
                      if r.status_code != 200:
                          continue
                      hits = r.json().get("hits", [])
                      random.shuffle(hits)
                      for hit in hits:
                          vid_id = str(hit.get("id", ""))
                          if vid_id in already_posted:
                              continue
                          title = hit.get("tags", "Pixabay Video").title()
                          videos = hit.get("videos", {})
                          for quality in ["large", "medium", "small", "tiny"]:
                              v = videos.get(quality)
                              if not v:
                                  continue
                              size_mb = int(v.get("size", 0)) / 1024 / 1024
                              if min_mb < size_mb <= max_mb:
                                  return {"url": v["url"], "title": title, "desc": "",
                                          "id": vid_id, "source": "Pixabay", "size_mb": size_mb,
                                          "query": query}
                  except Exception:
                      continue
              return None

          found = None
          for max_mb in SIZE_TIERS_MB:
              found = search_pixabay(min_size, max_mb, queries)
              if found:
                  break

          if not found:
              print("No footage found - stopping")
              sys.exit(1)

          print(f"Found: {found['title']} ({found['size_mb']:.1f}MB)")
          r = requests.get(found["url"], stream=True, timeout=120)
          raw_path = "/tmp/raw_footage" + os.path.splitext(found["url"].split("?")[0])[-1]
          with open(raw_path, "wb") as f:
              for chunk in r.iter_content(chunk_size=65536):
                  f.write(chunk)
          print(f"Downloaded: {os.path.getsize(raw_path)/1024/1024:.1f}MB")

          with open("/tmp/meta.json", "w") as f:
              json.dump({**found, "raw_path": raw_path, "niche": "Japan"}, f)
          PYEOF
        env:
          MIN_SIZE_MB: ${{ github.event.inputs.min_size || '100' }}
          TERM_CHOICE: ${{ github.event.inputs.term_choice || 'Random - any Japan term' }}
          CUSTOM_TERMS: ${{ github.event.inputs.custom_terms || '' }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}

      - name: Process footage
        timeout-minutes: 15
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os, sys, time, random, glob

          with open("/tmp/meta.json") as f:
              meta = json.load(f)

          raw = meta["raw_path"]
          out = "/tmp/processed.mp4"

          probe = subprocess.run(["ffprobe", "-v", "quiet", "-print_format", "json", "-show_streams", raw],
                                  capture_output=True, text=True)
          info = json.loads(probe.stdout)
          duration = 0
          width = height = 0
          for s in info.get("streams", []):
              if s.get("codec_type") == "video":
                  width = s.get("width", 0)
                  height = s.get("height", 0)
              try:
                  duration = max(duration, float(s.get("duration", 0)))
              except Exception:
                  pass
          file_size_mb = os.path.getsize(raw) / 1024 / 1024
          print(f"SOURCE INFO: {width}x{height}, duration={duration:.1f}s, size={file_size_mb:.1f}MB")

          audio_probe = subprocess.run(
              ["ffprobe", "-v", "error", "-select_streams", "a",
               "-show_entries", "stream=index", "-of", "csv=p=0", raw],
              capture_output=True, text=True
          )
          has_audio = bool(audio_probe.stdout.strip())
          print(f"Has audio: {has_audio}")

          music_file = None
          music_files = []
          for ext in ["*.mp3", "*.mp4", "*.m4a", "*.wav", "*.ogg", "*.flac"]:
              music_files += glob.glob(f"bgmusic/{ext}")
          if music_files:
              music_file = random.choice(music_files)
              print(f"Music: {music_file}")
          else:
              print("No bgmusic found")

          vf = "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2"

          if has_audio and music_file:
              cmd = [
                  "ffmpeg", "-y", "-i", raw, "-stream_loop", "-1", "-i", music_file,
                  "-vf", vf,
                  "-filter_complex", "[0:a]volume=0.7[a1];[1:a]volume=0.3[a2];[a1][a2]amix=inputs=2:duration=first[aout]",
                  "-map", "0:v", "-map", "[aout]",
                  "-c:v", "libx264", "-preset", "veryfast", "-crf", "20",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-b:a", "192k",
                  "-movflags", "+faststart",
                  out
              ]
          elif has_audio and not music_file:
              cmd = [
                  "ffmpeg", "-y", "-i", raw,
                  "-vf", vf,
                  "-c:v", "libx264", "-preset", "veryfast", "-crf", "20",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-b:a", "192k",
                  "-movflags", "+faststart",
                  out
              ]
          elif not has_audio and music_file:
              cmd = [
                  "ffmpeg", "-y", "-i", raw, "-stream_loop", "-1", "-i", music_file,
                  "-vf", vf,
                  "-map", "0:v", "-map", "1:a",
                  "-c:v", "libx264", "-preset", "veryfast", "-crf", "20",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-b:a", "192k",
                  "-shortest",
                  "-movflags", "+faststart",
                  out
              ]
          else:
              cmd = [
                  "ffmpeg", "-y", "-i", raw,
                  "-f", "lavfi", "-i", "anullsrc=channel_layout=stereo:sample_rate=44100",
                  "-vf", vf,
                  "-c:v", "libx264", "-preset", "veryfast", "-crf", "20",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-b:a", "192k",
                  "-shortest",
                  "-movflags", "+faststart",
                  out
              ]

          t0 = time.time()
          result = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
          print(f"Main encode took {time.time()-t0:.1f}s")
          if result.returncode != 0:
              print(f"ffmpeg error:\n{result.stderr[-3000:]}")
              sys.exit(1)
          print(f"Processed: {os.path.getsize(out)/1024/1024:.1f}MB")

          try:
              short_out = "/tmp/short.mp4"
              short_len = 25
              max_start = max(0, duration - short_len)
              clip_start = random.uniform(0, max_start) if max_start > 0 else 0
              short_vf = "crop=ih*9/16:ih,scale=1080:1920"

              if has_audio and music_file:
                  short_cmd = [
                      "ffmpeg", "-y", "-ss", str(clip_start), "-i", raw, "-stream_loop", "-1", "-i", music_file,
                      "-t", str(short_len),
                      "-vf", short_vf,
                      "-filter_complex", "[0:a]volume=0.7[a1];[1:a]volume=0.3[a2];[a1][a2]amix=inputs=2:duration=first[aout]",
                      "-map", "0:v", "-map", "[aout]",
                      "-c:v", "libx264", "-preset", "veryfast", "-crf", "22",
                      "-pix_fmt", "yuv420p",
                      "-c:a", "aac", "-b:a", "128k",
                      short_out
                  ]
              elif has_audio and not music_file:
                  short_cmd = [
                      "ffmpeg", "-y", "-ss", str(clip_start), "-i", raw, "-t", str(short_len),
                      "-vf", short_vf,
                      "-c:v", "libx264", "-preset", "veryfast", "-crf", "22",
                      "-pix_fmt", "yuv420p",
                      "-c:a", "aac", "-b:a", "128k",
                      short_out
                  ]
              elif not has_audio and music_file:
                  short_cmd = [
                      "ffmpeg", "-y", "-ss", str(clip_start), "-i", raw, "-stream_loop", "-1", "-i", music_file,
                      "-t", str(short_len),
                      "-vf", short_vf,
                      "-map", "0:v", "-map", "1:a",
                      "-c:v", "libx264", "-preset", "veryfast", "-crf", "22",
                      "-pix_fmt", "yuv420p",
                      "-c:a", "aac", "-b:a", "128k",
                      "-shortest",
                      short_out
                  ]
              else:
                  short_cmd = [
                      "ffmpeg", "-y", "-ss", str(clip_start), "-i", raw,
                      "-f", "lavfi", "-i", "anullsrc=channel_layout=stereo:sample_rate=44100",
                      "-t", str(short_len),
                      "-vf", short_vf,
                      "-c:v", "libx264", "-preset", "veryfast", "-crf", "22",
                      "-pix_fmt", "yuv420p",
                      "-c:a", "aac", "-b:a", "128k",
                      "-shortest",
                      short_out
                  ]

              t0 = time.time()
              r2 = subprocess.run(short_cmd, capture_output=True, text=True, timeout=120)
              print(f"Short encode took {time.time()-t0:.1f}s")
              if r2.returncode == 0:
                  print(f"Short created: {os.path.getsize(short_out)/1024/1024:.1f}MB")
              else:
                  print(f"Short failed, skipping: {r2.stderr[-500:]}")
          except Exception as e:
              print(f"Short skipped: {e}")

          os.remove(raw)
          PYEOF

      - name: Upload to YouTube
        timeout-minutes: 15
        run: |
          python3 << 'PYEOF'
          import os, json, sys, re
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials

          with open("/tmp/meta.json") as f:
              meta = json.load(f)

          mp4 = "/tmp/processed.mp4"
          if not os.path.exists(mp4):
              print("Processed video not found")
              sys.exit(1)

          title_base = meta["title"].strip()
          query = meta.get("query", "japan")
          niche = meta.get("niche", "Japan")
          title_base = re.sub(r'[^\w\s\-\(\)\:\,\.\!]', '', title_base)[:80].strip()
          title = title_base[:97] + "..." if len(title_base) > 100 else title_base
          if not title:
              title = query.title()

          hashtag_query = query.replace(" ", "").lower()

          def build_description(is_short=False):
              lines = [
                  title_base if title_base else query.title(),
                  "", "Pixabay -- pixabay.com",
                  f"Original footage ID: {meta['id']}",
                  "", "----------------------------------------", "About this video:",
                  f"{query.title()} footage from Japan.",
                  "", "Subscribe for more.", "",
                  "----------------------------------------",
                  f"Tags: japan, {query}, relaxation, ambient, timelapse, documentary",
                  "----------------------------------------", "",
                  f"#japan #{hashtag_query} #relaxation #ambient #timelapse #documentary" + (" #shorts" if is_short else ""),
              ]
              return "\n".join(lines)

          tags = list(dict.fromkeys([
              "japan", query, "relaxation", "ambient", "timelapse",
              "documentary", "footage", "stock footage", "tokyo", "kyoto"
          ]))[:30]

          creds = Credentials(
              token=os.environ.get("YT_ACCESS_TOKEN"),
              refresh_token=os.environ.get("YT_REFRESH_TOKEN"),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ.get("YT_CLIENT_ID"),
              client_secret=os.environ.get("YT_CLIENT_SECRET"),
          )
          youtube = build("youtube", "v3", credentials=creds)

          def upload(filepath, vid_title, vid_desc):
              request = youtube.videos().insert(
                  part="snippet,status",
                  body={
                      "snippet": {"title": vid_title, "description": vid_desc, "tags": tags,
                                  "categoryId": "22", "defaultLanguage": "en"},
                      "status": {"privacyStatus": "public", "madeForKids": False, "selfDeclaredMadeForKids": False}
                  },
                  media_body=MediaFileUpload(filepath, mimetype="video/mp4", resumable=True)
              )
              response = None
              while response is None:
                  status, response = request.next_chunk()
                  if status:
                      print(f"Upload progress: {int(status.progress()*100)}%")
              return response.get("id", "")

          video_id = upload(mp4, title, build_description(False))
          print(f"https://youtube.com/watch?v={video_id}")
          os.remove(mp4)

          short_path = "/tmp/short.mp4"
          if os.path.exists(short_path):
              short_title = (title[:90] + " #shorts") if len(title) <= 90 else (title[:90] + "#shorts")
              short_id = upload(short_path, short_title, build_description(True))
              print(f"https://youtube.com/shorts/{short_id}")
              os.remove(short_path)
          else:
              print("No short to upload")

          with open("posted.txt", "a") as f:
              f.write(meta["id"] + "\n")
          PYEOF
        env:
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}

      - name: Save posted.txt to repo
        timeout-minutes: 5
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posted.txt
          git diff --staged --quiet || git commit -m "track posted footage [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}