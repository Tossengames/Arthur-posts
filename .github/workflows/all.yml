name: Post Pixabay Footage to YouTube

on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Pick a niche (used only if custom terms below is empty)"
        required: true
        default: "Space"
        type: choice
        options:
          - "City"
          - "Nature"
          - "Driving"
          - "Ocean"
          - "Space"
          - "Animals"
      custom_terms:
        description: "Custom search terms (comma separated, optional). If set, only these are searched - no fallback."
        required: false
        default: ""
      min_size:
        description: "Minimum footage size to search for"
        required: true
        default: "100"
        type: choice
        options:
          - "100"
          - "200"
          - "400"
          - "500"
          - "700"
          - "1000"
          - "2000"
  schedule:
    - cron: "0 19 * * 1,3,5"

jobs:
  post:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu
          pip install requests
          echo "Done"

      - name: Find and download footage
        timeout-minutes: 10
        run: |
          python3 << 'PYEOF'
          import requests, os, sys, json, random

          POSTED_FILE = "posted.txt"
          already_posted = set()
          if os.path.exists(POSTED_FILE):
              with open(POSTED_FILE) as f:
                  already_posted = set(line.strip() for line in f if line.strip())
          print(f"Already posted: {len(already_posted)} items")

          ALL_TIERS = [100, 200, 400, 500, 700, 1000, 2000]
          min_size = int(os.environ.get("MIN_SIZE_MB", "100"))
          SIZE_TIERS_MB = sorted(set(t for t in ALL_TIERS if t >= min_size))
          if not SIZE_TIERS_MB:
              SIZE_TIERS_MB = [2000]

          PIXABAY_KEY = os.environ.get("PIXABAY_KEY", "")
          if not PIXABAY_KEY:
              print("PIXABAY_KEY missing")
              sys.exit(1)

          niche = os.environ.get("NICHE", "Space").strip()
          custom_raw = os.environ.get("CUSTOM_TERMS", "").strip()
          custom_terms = [t.strip() for t in custom_raw.split(",") if t.strip()] if custom_raw else []

          NICHE_QUERIES = {
              "City": ["city skyline", "city traffic", "street life", "city timelapse",
                       "downtown city", "urban night city", "city aerial view", "busy street"],
              "Nature": ["forest", "mountains", "waterfall", "landscape nature",
                         "national park", "sunrise nature", "meadow", "river nature"],
              "Driving": ["car driving", "highway driving", "road trip", "dashboard view driving",
                          "night driving", "car on road", "driving mountain road", "traffic road"],
              "Ocean": ["ocean waves", "underwater", "beach ocean", "deep sea",
                        "coral reef", "ocean aerial", "ship ocean", "sea waves"],
              "Space": ["rocket launch", "space", "galaxy", "planet",
                        "night sky stars", "moon", "nebula", "space station"],
              "Animals": ["wildlife", "birds flying", "lion", "elephant",
                          "forest animals", "ocean animals", "safari animals", "animals nature"],
          }

          queries = custom_terms if custom_terms else NICHE_QUERIES.get(niche, NICHE_QUERIES["Space"])
          print(f"Mode: {'custom terms' if custom_terms else 'niche list'} -> {niche if not custom_terms else custom_terms}")
          print(f"Queries to try: {queries}")

          def search_pixabay(min_mb, max_mb, qlist):
              qlist = list(qlist)
              random.shuffle(qlist)
              for query in qlist:
                  try:
                      r = requests.get(
                          "https://pixabay.com/api/videos/",
                          params={"key": PIXABAY_KEY, "q": query, "per_page": 20, "safesearch": "true"},
                          timeout=20
                      )
                      if r.status_code != 200:
                          continue
                      hits = r.json().get("hits", [])
                      random.shuffle(hits)
                      for hit in hits:
                          vid_id = str(hit.get("id", ""))
                          if vid_id in already_posted:
                              continue
                          title = hit.get("tags", "Pixabay Video").title()
                          videos = hit.get("videos", {})
                          for quality in ["large", "medium", "small", "tiny"]:
                              v = videos.get(quality)
                              if not v:
                                  continue
                              size_mb = int(v.get("size", 0)) / 1024 / 1024
                              if min_mb < size_mb <= max_mb:
                                  return {"url": v["url"], "title": title, "desc": "",
                                          "id": vid_id, "source": "Pixabay", "size_mb": size_mb,
                                          "query": query}
                  except Exception:
                      continue
              return None

          found = None
          for max_mb in SIZE_TIERS_MB:
              found = search_pixabay(min_size, max_mb, queries)
              if found:
                  break

          if not found:
              if custom_terms:
                  print("No footage found for custom terms - stopping (no fallback as requested)")
              else:
                  print(f"No footage found for niche '{niche}'")
              sys.exit(1)

          print(f"Found: {found['title']} ({found['size_mb']:.1f}MB)")
          r = requests.get(found["url"], stream=True, timeout=120)
          raw_path = "/tmp/raw_footage" + os.path.splitext(found["url"].split("?")[0])[-1]
          with open(raw_path, "wb") as f:
              for chunk in r.iter_content(chunk_size=65536):
                  f.write(chunk)
          print(f"Downloaded: {os.path.getsize(raw_path)/1024/1024:.1f}MB")

          with open("/tmp/meta.json", "w") as f:
              json.dump({**found, "raw_path": raw_path, "niche": niche}, f)
          PYEOF
        env:
          MIN_SIZE_MB: ${{ github.event.inputs.min_size || '100' }}
          NICHE: ${{ github.event.inputs.niche || 'Space' }}
          CUSTOM_TERMS: ${{ github.event.inputs.custom_terms || '' }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}

      - name: Process footage
        timeout-minutes: 20
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os, sys, random, glob

          with open("/tmp/meta.json") as f:
              meta = json.load(f)

          raw = meta["raw_path"]
          out = "/tmp/processed.mp4"

          zoom = round(random.uniform(1.05, 1.15), 2)

          music_file = None
          music_files = []
          for ext in ["*.mp3", "*.mp4", "*.m4a", "*.wav", "*.ogg", "*.flac"]:
              music_files += glob.glob(f"bgmusic/{ext}")
          if music_files:
              music_file = random.choice(music_files)

          cta_options = [("SUBSCRIBE", "red"), ("LIKE", "blue")]

          probe = subprocess.run(["ffprobe", "-v", "quiet", "-print_format", "json", "-show_streams", raw],
                                  capture_output=True, text=True)
          info = json.loads(probe.stdout)
          duration = 0
          for s in info.get("streams", []):
              try:
                  duration = max(duration, float(s.get("duration", 0)))
              except Exception:
                  pass

          t_start = min(2.0, duration * 0.1)
          t_mid = duration / 2
          t_end = max(duration - 4.0, t_mid + 2)
          cta_times = [t_start, t_mid, t_end]

          font = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          drawtext_filters = []
          for t in cta_times:
              text, color = random.choice(cta_options)
              t_in, t_out, fade_dur = t, t + 2.0, 0.4
              alpha_expr = (
                  f"if(lt(t,{t_in+fade_dur}),(t-{t_in})/{fade_dur},"
                  f"if(gt(t,{t_out-fade_dur}),({t_out}-t)/{fade_dur},1))"
              )
              drawtext_filters.append(
                  f"drawtext=fontfile={font}:text='{text}':fontsize=64:fontcolor=white:"
                  f"x=(w-text_w)/2:y=(h-text_h)/2:box=1:boxcolor={color}@0.75:boxborderw=20:"
                  f"enable='between(t,{t_in},{t_out})':alpha='{alpha_expr}'"
              )

          vf_chain = f"scale=iw*{zoom}:ih*{zoom},crop=iw/{zoom}:ih/{zoom}," + ",".join(drawtext_filters) + \
                     ",scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2"

          ping_inputs, ping_filter_parts = [], []
          for i, t in enumerate(cta_times):
              ping_inputs += ["-f", "lavfi", "-i", "sine=frequency=1500:duration=0.3"]
              ping_filter_parts.append(f"[{i+1}:a]adelay={int(t*1000)}|{int(t*1000)},volume=0.5[ping{i}]")

          main_inputs = ["-i", raw]
          if music_file:
              main_inputs += ["-stream_loop", "-1", "-i", music_file]

          audio_mix_parts = []
          if music_file:
              audio_mix_parts += ["[0:a]volume=1.0[a1]", "[1:a]volume=0.15[a2]"]
              base_audio, n_base = "[a1][a2]", 2
          else:
              audio_mix_parts.append("[0:a]volume=1.0[a1]")
              base_audio, n_base = "[a1]", 1

          ping_labels = "".join(f"[ping{i}]" for i in range(len(cta_times)))
          n_total = n_base + len(cta_times)
          audio_mix_parts.append(f"{base_audio}{ping_labels}amix=inputs={n_total}:duration=first[aout]")

          filter_complex = f"[0:v]{vf_chain}[vout];" + ";".join(ping_filter_parts) + ";" + ";".join(audio_mix_parts)

          cmd = ["ffmpeg", "-y"] + main_inputs + ping_inputs + [
              "-filter_complex", filter_complex,
              "-map", "[vout]", "-map", "[aout]",
              "-c:v", "libx264", "-preset", "medium", "-crf", "18",
              "-pix_fmt", "yuv420p",
              "-c:a", "aac", "-b:a", "192k", "-ar", "44100",
              "-movflags", "+faststart",
              out
          ]
          result = subprocess.run(cmd, capture_output=True, text=True)
          if result.returncode != 0:
              print(f"ffmpeg error:\n{result.stderr[-3000:]}")
              sys.exit(1)
          print(f"Processed: {os.path.getsize(out)/1024/1024:.1f}MB")

          # Simple Short: plain 25s clip cut straight from raw footage
          try:
              short_out = "/tmp/short.mp4"
              short_len = 25
              max_start = max(0, duration - short_len)
              clip_start = random.uniform(0, max_start) if max_start > 0 else 0
              short_cmd = [
                  "ffmpeg", "-y", "-ss", str(clip_start), "-i", raw, "-t", str(short_len),
                  "-vf", "crop=ih*9/16:ih,scale=1080:1920",
                  "-c:v", "libx264", "-preset", "fast", "-crf", "20",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac", "-b:a", "128k",
                  short_out
              ]
              r2 = subprocess.run(short_cmd, capture_output=True, text=True, timeout=180)
              if r2.returncode == 0:
                  print(f"Short created: {os.path.getsize(short_out)/1024/1024:.1f}MB")
              else:
                  print("Short failed, skipping it")
          except Exception as e:
              print(f"Short skipped due to error: {e}")

          os.remove(raw)
          PYEOF

      - name: Upload to YouTube
        timeout-minutes: 15
        run: |
          python3 << 'PYEOF'
          import os, json, sys, re
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials

          with open("/tmp/meta.json") as f:
              meta = json.load(f)

          mp4 = "/tmp/processed.mp4"
          if not os.path.exists(mp4):
              print("Processed video not found")
              sys.exit(1)

          title_base = meta["title"].strip()
          query = meta.get("query", "footage")
          niche = meta.get("niche", "")
          title_base = re.sub(r'[^\w\s\-\(\)\:\,\.\!]', '', title_base)[:80].strip()
          title = title_base[:97] + "..." if len(title_base) > 100 else title_base
          if not title:
              title = query.title()

          hashtag_query = query.replace(" ", "").lower()

          def build_description(is_short=False):
              lines = [
                  title_base if title_base else query.title(),
                  "",
                  "Pixabay -- pixabay.com",
                  f"Original footage ID: {meta['id']}",
                  "This footage has been transformed (zoomed, reprocessed) for this upload.",
                  "", "----------------------------------------", "About this video:",
                  f"{query.title()} footage.",
                  "", "Subscribe for more.", "",
                  "----------------------------------------",
                  f"Tags: {query}, {niche.lower()}, relaxation, ambient, timelapse, documentary",
                  "----------------------------------------", "",
                  f"#{hashtag_query} #{niche.lower()} #relaxation #ambient #timelapse #documentary" + (" #shorts" if is_short else ""),
              ]
              return "\n".join(lines)

          tags = list(dict.fromkeys([
              query, niche.lower(), "relaxation", "ambient", "timelapse",
              "documentary", "footage", "stock footage"
          ]))[:30]

          creds = Credentials(
              token=os.environ.get("YT_ACCESS_TOKEN"),
              refresh_token=os.environ.get("YT_REFRESH_TOKEN"),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ.get("YT_CLIENT_ID"),
              client_secret=os.environ.get("YT_CLIENT_SECRET"),
          )
          youtube = build("youtube", "v3", credentials=creds)

          def upload(filepath, vid_title, vid_desc):
              request = youtube.videos().insert(
                  part="snippet,status",
                  body={
                      "snippet": {"title": vid_title, "description": vid_desc, "tags": tags,
                                  "categoryId": "22", "defaultLanguage": "en"},
                      "status": {"privacyStatus": "public", "madeForKids": False, "selfDeclaredMadeForKids": False}
                  },
                  media_body=MediaFileUpload(filepath, mimetype="video/mp4", resumable=True)
              )
              response = None
              while response is None:
                  status, response = request.next_chunk()
                  if status:
                      print(f"Upload progress: {int(status.progress()*100)}%")
              return response.get("id", "")

          video_id = upload(mp4, title, build_description(False))
          print(f"https://youtube.com/watch?v={video_id}")
          os.remove(mp4)

          short_path = "/tmp/short.mp4"
          if os.path.exists(short_path):
              short_title = (title[:90] + " #shorts") if len(title) <= 90 else (title[:90] + "#shorts")
              short_id = upload(short_path, short_title, build_description(True))
              print(f"https://youtube.com/shorts/{short_id}")
              os.remove(short_path)
          else:
              print("No short to upload")

          with open("posted.txt", "a") as f:
              f.write(meta["id"] + "\n")
          PYEOF
        env:
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}

      - name: Save posted.txt to repo
        timeout-minutes: 5
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posted.txt
          git diff --staged --quiet || git commit -m "track posted footage [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}