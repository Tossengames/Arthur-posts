          <body>
            <div class="flash" id="flash"></div>
            <div class="topbar"><span id="title">STOP SAYING THIS WRONG ❌</span></div>
            <div class="card wrong" id="cardwrong">"__WRONG__"</div>
            <div class="badge x" id="badgex">✕</div>
            <div class="card right" id="cardright">"__RIGHT__"</div>
            <div class="badge check" id="badgecheck">✓</div>
            <div class="footer" id="footer">COMMENT "GOT IT" IF THIS HELPED ✅</div>
          <script>
          window.FRAME_STATE = { phase:'init' };
          const timeline = [
            { t:0.0, sfx:null, fn:()=>{ document.getElementById('title').style.opacity='1'; }},
            { t:0.8, sfx:'pop', fn:()=>{ const c=document.getElementById('cardwrong'); c.style.opacity='1'; c.style.transform='scale(1)'; }},
            { t:1.3, sfx:'buzz', fn:()=>{ const b=document.getElementById('badgex'); b.style.opacity='1'; b.style.transform='scale(1)'; }},
            { t:2.2, sfx:'pop', fn:()=>{ const c=document.getElementById('cardright'); c.style.opacity='1'; c.style.transform='scale(1)'; }},
            { t:2.7, sfx:'ding', fn:()=>{
                const b=document.getElementById('badgecheck'); b.style.opacity='1'; b.style.transform='scale(1)';
                const f=document.getElementById('flash'); f.style.opacity='0.25';
                setTimeout(()=>{ f.style.opacity='0'; }, 150);
              }},
            { t:5.0, sfx:null, fn:()=>{ document.getElementById('footer').style.opacity='1'; }},
          ];
          window.__TIMELINE__ = timeline;
          let applied = new Set();
          function tick(tSec){ timeline.forEach((ev,i)=>{ if(tSec>=ev.t && !applied.has(i)){ applied.add(i); ev.fn(); }}); }
          window.__tick = tick;
          window.__DURATION__ = 6.0;
