          HTMLEOF

          cat > templates/pronunciation.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <style>
            @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
            * { margin:0; padding:0; box-sizing:border-box; font-family:'Press Start 2P',monospace; }
            body { width:1080px; height:1920px; background:#0f1a12; overflow:hidden; position:relative;
                   background-image: linear-gradient(#16281a 2px, transparent 2px), linear-gradient(90deg, #16281a 2px, transparent 2px);
                   background-size:40px 40px; }
            .screen { position:absolute; top:180px; left:60px; right:60px; bottom:260px; background:#0a120c; border:8px solid #7CFC00; border-radius:8px; box-shadow:0 0 40px #39ff14 inset; }
            .header { position:absolute; top:60px; width:100%; text-align:center; color:#ffe600; font-size:30px; opacity:0; }
            .letters { position:absolute; top:420px; width:100%; text-align:center; font-size:60px; color:#7CFC00; letter-spacing:8px; text-shadow:0 0 15px #39ff14; padding:0 30px; word-break:break-all; }
            .letters span { opacity:0; display:inline-block; transition:opacity 0.2s; }
            .letters span.silent { color:#3a3a3a; text-decoration:line-through; }
            .progressbar { position:absolute; top:750px; left:120px; right:120px; height:36px; background:#0a120c; border:4px solid #7CFC00; border-radius:6px; overflow:hidden; }
            .progressfill { height:100%; width:0%; background:repeating-linear-gradient(90deg,#39ff14,#39ff14 20px,#2bd10f 20px,#2bd10f 40px); }
            .correct { position:absolute; top:900px; width:100%; text-align:center; font-size:44px; color:#ffe600; opacity:0; }
            .cleared { position:absolute; top:1100px; width:100%; text-align:center; font-size:38px; color:#fff; background:#39ff14; padding:24px 0; opacity:0; transform:scale(0.7); box-shadow:0 0 30px #39ff14; transition:opacity 0.3s, transform 0.3s; }
            .footer { position:absolute; bottom:110px; width:100%; text-align:center; font-size:26px; color:#7CFC00; opacity:0; }
          </style></head>
          <body>
            <div class="screen"></div>
            <div class="header" id="header">PRONOUNCE THIS RIGHT 🎮</div>
            <div class="letters" id="letters"></div>
            <div class="progressbar"><div class="progressfill" id="progressfill"></div></div>
            <div class="correct" id="correct">✅ "__PHONETIC__"</div>
            <div class="cleared" id="cleared">LEVEL CLEARED!</div>
            <div class="footer" id="footer">SAY IT OUT LOUD 3x 📌</div>
          <script>
          window.FRAME_STATE = { phase:'init' };
          const WORD = "__WORD__";
          const SILENT_IDX = __SILENT_IDX__;
          const lettersDiv = document.getElementById('letters');
          WORD.split('').forEach((ch,i)=>{
            const span = document.createElement('span');
            span.textContent = ch;
            if(SILENT_IDX.includes(i)) span.classList.add('silent');
            lettersDiv.appendChild(span);
          });
          const letterEls = document.querySelectorAll('.letters span');
          const timeline = [
            { t:0.0, sfx:'whoosh', fn:()=>{ document.getElementById('header').style.opacity='1'; }},
          ];
          letterEls.forEach((el,i)=>{
            timeline.push({ t:0.5+i*0.22, sfx:'tick', fn:()=>{ el.style.opacity = el.classList.contains('silent') ? '0.4' : '1'; }});
          });
          const lastLetterT = 0.5 + letterEls.length*0.22;
          timeline.push(
            { t:lastLetterT+0.3, sfx:'ding', fn:()=>{ document.getElementById('correct').style.opacity='1'; }},
            { t:lastLetterT+0.9, sfx:'pop', fn:()=>{ const c=document.getElementById('cleared'); c.style.opacity='1'; c.style.transform='scale(1)'; }},
            { t:lastLetterT+2.0, sfx:null, fn:()=>{ document.getElementById('footer').style.opacity='1'; }},
          );
          window.__TIMELINE__ = timeline;
          let applied = new Set();
          function tick(tSec){
            timeline.forEach((ev,i)=>{ if(tSec>=ev.t && !applied.has(i)){ applied.add(i); ev.fn(); }});
            const pct = Math.min(100, (tSec/(lastLetterT+0.9))*100);
            document.getElementById('progressfill').style.width = pct+'%';
          }
          window.__tick = tick;
          window.__DURATION__ = lastLetterT + 3.0;
          </script>
          </body></html>
          HTMLEOF

          cat > templates/slang_match.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <style>
            @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap');
            * { margin:0; padding:0; box-sizing:border-box; font-family:'Baloo 2',sans-serif; }
            body { width:1080px; height:1920px; background:linear-gradient(160deg,#ffd6f0 0%,#c9f0ff 50%,#fff6c9 100%); overflow:hidden; position:relative; }
            .title { position:absolute; top:100px; width:100%; text-align:center; font-size:46px; font-weight:800; color:#7a2e8a; opacity:0; }
            .bubble { position:absolute; border-radius:50px; padding:34px 30px; font-size:34px; font-weight:700; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,0.1); opacity:0; transform:scale(0.7) translateY(20px); transition:opacity 0.3s, transform 0.3s, box-shadow 0.3s; }
            .left { left:60px; width:420px; background:#ff8fd8; color:#5a0038; top:400px; }
            .right { right:60px; width:420px; background:#8fe3ff; color:#003a5a; top:660px; }
            .bubble.matched { box-shadow:0 0 0 8px #ffe066, 0 8px 30px rgba(0,0,0,0.15); }
            .connector { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
            .pop { position:absolute; width:20px; height:20px; border-radius:50%; opacity:0; }
            .footer { position:absolute; bottom:110px; width:100%; text-align:center; font-size:34px; font-weight:700; color:#7a2e8a; opacity:0; padding:0 30px; }
          </style></head>
          <body>
            <div class="title" id="title">MATCH THE SLANG 🍬</div>
            <div class="bubble left" id="term">"__TERM__"</div>
            <div class="bubble right" id="meaning">__MEANING__</div>
            <svg class="connector" id="svg"><line id="line" x1="0" y1="0" x2="0" y2="0" stroke="#ffb703" stroke-width="8" stroke-linecap="round" opacity="0"/></svg>
            <div id="pops"></div>
            <div class="footer" id="footer">SAVE THIS TO SOUND LIKE A NATIVE 📌</div>
          <script>
          window.FRAME_STATE={phase:'init'};
          function drawLine(){
            const a = document.getElementById('term').getBoundingClientRect();
            const b = document.getElementById('meaning').getBoundingClientRect();
            const line = document.getElementById('line');
            line.setAttribute('x1', a.right); line.setAttribute('y1', a.top+a.height/2);
            line.setAttribute('x2', b.left); line.setAttribute('y2', b.top+b.height/2);
            line.setAttribute('opacity','1');
          }
          function popBurst(el){
            const box = el.getBoundingClientRect();
            const colors=['#ffb703','#ff8fd8','#8fe3ff','#ffe066'];
            for(let i=0;i<16;i++){
              const p=document.createElement('div'); p.className='pop';
              p.style.background=colors[i%colors.length];
              p.style.left=(box.left+box.width/2)+'px'; p.style.top=(box.top+box.height/2)+'px';
              p.style.opacity='1'; p.style.transition='transform 0.6s ease-out, opacity 0.6s ease-out';
              document.getElementById('pops').appendChild(p);
              const ang=(Math.PI*2*i)/16, dist=90+Math.random()*50;
              requestAnimationFrame(()=>{ p.style.transform=`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px)`; p.style.opacity='0'; });
            }
          }
          const timeline=[
            { t:0.0, sfx:'whoosh', fn:()=>{ document.getElementById('title').style.opacity='1'; }},
            { t:0.6, sfx:'pop', fn:()=>{ const t=document.getElementById('term'); t.style.opacity='1'; t.style.transform='scale(1) translateY(0)'; }},
            { t:1.4, sfx:'pop', fn:()=>{ const m=document.getElementById('meaning'); m.style.opacity='1'; m.style.transform='scale(1) translateY(0)'; }},
            { t:2.6, sfx:'tick', fn:()=>{ drawLine(); }},
            { t:3.2, sfx:'ding', fn:()=>{
                document.getElementById('term').classList.add('matched');
                document.getElementById('meaning').classList.add('matched');
                popBurst(document.getElementById('meaning'));
              }},
            { t:5.2, sfx:null, fn:()=>{ document.getElementById('footer').style.opacity='1'; }},
          ];
          window.__TIMELINE__ = timeline;
          let applied=new Set();
          function tick(tSec){ timeline.forEach((ev,i)=>{ if(tSec>=ev.t && !applied.has(i)){ applied.add(i); ev.fn(); }}); }
          window.__tick=tick;
          window.__DURATION__ = 6.5;
          </script>
          </body></html>
          HTMLEOF

          cat > templates/mini_dialogue.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <style>
            @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap');
            * { margin:0; padding:0; box-sizing:border-box; font-family:'Nunito',sans-serif; }
            body { width:1080px; height:1920px; background:#e9edf3; overflow:hidden; position:relative; }
            .phonebar { position:absolute; top:0; left:0; right:0; height:140px; background:#075e54; display:flex; align-items:center; justify-content:center; }
            .phonebar span { color:#fff; font-size:38px; font-weight:800; }
            .chat { position:absolute; top:180px; left:0; right:0; bottom:420px; padding:30px; }
            .bubble { max-width:70%; padding:26px 32px; border-radius:30px; font-size:32px; font-weight:700; margin-bottom:26px; opacity:0; transform:translateY(20px); transition:opacity 0.4s, transform 0.4s; }
            .them { background:#fff; color:#222; border-bottom-left-radius:6px; }
            .you { background:#dcf8c6; color:#1b1b1b; border-bottom-right-radius:6px; margin-left:auto; }
            .options { position:absolute; bottom:120px; left:40px; right:40px; display:flex; flex-direction:column; gap:22px; }
            .replyopt { background:#fff; border:3px solid #075e54; border-radius:40px; padding:24px; text-align:center; font-size:30px; font-weight:700; color:#075e54; opacity:0; transform:scale(0.9); transition:opacity 0.3s, transform 0.3s, background 0.3s, color 0.3s; }
            .replyopt.fade { opacity:0.15 !important; transform:scale(0.85) !important; }
            .replyopt.chosen { background:#25d366; color:#fff; border-color:#25d366; }
          </style></head>
          <body>
            <div class="phonebar"><span id="topic">__TOPIC__</span></div>
            <div class="chat" id="chatbox">
              <div class="bubble them" id="msg1">__MSG1__</div>
              <div class="bubble you" id="msg2" style="display:none;">__YOU1__</div>
              <div class="bubble them" id="msg3" style="display:none;">__MSG2__</div>
            </div>
            <div class="options" id="options">
              <div class="replyopt" id="r1">"__RIGHT__"</div>
              <div class="replyopt" id="r2">"__WRONG1__"</div>
              <div class="replyopt" id="r3">"__WRONG2__"</div>
            </div>
          <script>
          window.FRAME_STATE={phase:'init'};
          const timeline=[
            { t:0.3, sfx:'pop', fn:()=>{ const m=document.getElementById('msg1'); m.style.opacity='1'; m.style.transform='translateY(0)'; }},
            { t:1.2, sfx:'pop', fn:()=>{ const m=document.getElementById('msg2'); m.style.display='block'; requestAnimationFrame(()=>{ m.style.opacity='1'; m.style.transform='translateY(0)'; }); }},
            { t:2.1, sfx:'pop', fn:()=>{ const m=document.getElementById('msg3'); m.style.display='block'; requestAnimationFrame(()=>{ m.style.opacity='1'; m.style.transform='translateY(0)'; }); }},
            { t:3.0, sfx:'whoosh', fn:()=>{ ['r1','r2','r3'].forEach((id,i)=>{ setTimeout(()=>{ const el=document.getElementById(id); el.style.opacity='1'; el.style.transform='scale(1)'; }, i*250); }); }},
            { t:5.2, sfx:'ding', fn:()=>{
                document.getElementById('r2').classList.add('fade');
                document.getElementById('r3').classList.add('fade');
                document.getElementById('r1').classList.add('chosen');
              }},
            { t:5.8, sfx:'pop', fn:()=>{
                const bubble=document.createElement('div');
                bubble.className='bubble you'; bubble.textContent='"__RIGHT__"';
                bubble.style.opacity='0'; bubble.style.transform='translateY(20px)';
                document.getElementById('chatbox').appendChild(bubble);
                requestAnimationFrame(()=>{ bubble.style.opacity='1'; bubble.style.transform='translateY(0)'; });
              }},
          ];
          window.__TIMELINE__ = timeline;
          let applied=new Set();
          function tick(tSec){ timeline.forEach((ev,i)=>{ if(tSec>=ev.t && !applied.has(i)){ applied.add(i); ev.fn(); }}); }
          window.__tick=tick;
          window.__DURATION__ = 7.0;
          </script>
          </body></html>
          HTMLEOF
          echo "Templates written"

      - name: Pick content and fill template
        timeout-minutes: 2
        run: |
          python3 << 'PYEOF'
          import json, os, random, re, html

          POSTED_FILE = "posted.txt"
          already_posted = set()
          if os.path.exists(POSTED_FILE):
              with open(POSTED_FILE) as f:
                  already_posted = set(line.strip() for line in f if line.strip())
          print(f"Already posted: {len(already_posted)} items")

          with open("content/bank.json") as f:
              bank = json.load(f)

          FORMAT_MAP = {
              "Word Blast (vocabulary)": "word_blast",
              "Right or Wrong (grammar)": "grammar_fix",
              "Spell Check Speedrun (pronunciation)": "pronunciation",
              "Match the Slang (slang)": "slang_match",
              "Pick the Reply (dialogue)": "mini_dialogue",
          }
          choice = os.environ.get("FORMAT_CHOICE", "Random - any format").strip()
          if choice == "Random - any format" or choice not in FORMAT_MAP:
              fmt = random.choice(list(bank.keys()))
          else:
              fmt = FORMAT_MAP[choice]

          candidates = [item for item in bank[fmt] if item["id"] not in already_posted]
          if not candidates:
              print(f"All items used for {fmt}, resetting rotation for this format")
              candidates = bank[fmt]
          item = random.choice(candidates)
          print(f"Format: {fmt} | Item: {item['id']}")

          with open(f"templates/{fmt}.html") as f:
              tpl = f.read()

          def esc(s):
              return html.escape(str(s), quote=True)

          if fmt == "word_blast":
              tpl = tpl.replace("__WORD__", esc(item["word"]))
              tpl = tpl.replace("__MEANING__", esc(item["meaning"]))
              tpl = tpl.replace("__WRONG1__", esc(item["wrong1"]))
              tpl = tpl.replace("__WRONG2__", esc(item["wrong2"]))
              title_seed = item["word"]
              desc_seed = f"{item['word']} means: {item['meaning']}"
          elif fmt == "grammar_fix":
              tpl = tpl.replace("__WRONG__", esc(item["wrong"]))
              tpl = tpl.replace("__RIGHT__", esc(item["right"]))
              title_seed = item["right"]
              desc_seed = f"Correct grammar: {item['right']} (not {item['wrong']})"
          elif fmt == "pronunciation":
              tpl = tpl.replace("__WORD__", esc(item["word"]))
              tpl = tpl.replace("__SILENT_IDX__", json.dumps(item["silentIdx"]))
              tpl = tpl.replace("__PHONETIC__", esc(item["phonetic"]))
              title_seed = item["word"]
              desc_seed = f"How to pronounce {item['word']}: {item['phonetic']}"
          elif fmt == "slang_match":
              tpl = tpl.replace("__TERM__", esc(item["term"]))
              tpl = tpl.replace("__MEANING__", esc(item["meaning"]))
              title_seed = item["term"]
              desc_seed = f"American slang: {item['term']} means {item['meaning']}"
          elif fmt == "mini_dialogue":
              tpl = tpl.replace("__TOPIC__", esc(item["topic"]))
              tpl = tpl.replace("__MSG1__", esc(item["msg1"]))
              tpl = tpl.replace("__YOU1__", esc(item["you1"]))
              tpl = tpl.replace("__MSG2__", esc(item["msg2"]))
              tpl = tpl.replace("__RIGHT__", esc(item["right"]))
              tpl = tpl.replace("__WRONG1__", esc(item["wrong1"]))
              tpl = tpl.replace("__WRONG2__", esc(item["wrong2"]))
              title_seed = item["topic"]
              desc_seed = f"English conversation practice: {item['topic']}"

          with open("/tmp/rendered.html", "w") as f:
              f.write(tpl)

          with open("/tmp/meta.json", "w") as f:
              json.dump({
                  "id": item["id"], "format": fmt,
                  "title_seed": title_seed, "desc_seed": desc_seed
              }, f)

          print("Template rendered to /tmp/rendered.html")
          PYEOF
        env:
          FORMAT_CHOICE: ${{ github.event.inputs.format_choice || 'Random - any format' }}

      - name: Render frames with Playwright
        timeout-minutes: 8
        run: |
          python3 << 'PYEOF'
          import asyncio, os, json
          from playwright.async_api import async_playwright

          with open("/tmp/meta.json") as f:
              meta = json.load(f)

          async def main():
              os.makedirs("/tmp/frames", exist_ok=True)
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(viewport={"width":1080,"height":1920})
                  await page.goto("file:///tmp/rendered.html")
                  await page.wait_for_timeout(300)
                  duration = await page.evaluate("window.__DURATION__")
                  timeline = await page.evaluate("window.__TIMELINE__.map(e => ({t: e.t, sfx: e.sfx}))")
                  fps = 24
                  n = int(duration * fps)
                  print(f"Rendering {n} frames over {duration}s")
                  for i in range(n):
                      t = i / fps
                      await page.evaluate(f"window.__tick({t})")
                      await page.screenshot(path=f"/tmp/frames/f_{i:05d}.png")
                  await browser.close()

              with open("/tmp/sfx_timeline.json", "w") as f:
                  json.dump({"timeline": timeline, "duration": duration, "fps": fps}, f)
              print("Done rendering")

          asyncio.run(main())
          PYEOF

      - name: Stitch frames and add synced SFX
        timeout-minutes: 10
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os

          with open("/tmp/sfx_timeline.json") as f:
              data = json.load(f)
          timeline = data["timeline"]
          duration = data["duration"]
          fps = data["fps"]

          os.makedirs("/tmp/sfx", exist_ok=True)

          def synth(name, cmd_args):
              path = f"/tmp/sfx/{name}.wav"
              if os.path.exists(path):
                  return path
              subprocess.run(["ffmpeg", "-y"] + cmd_args + [path], check=True,
                              capture_output=True)
              return path

          sfx_paths = {
              "pop": synth("pop", ["-f", "lavfi", "-i", "sine=frequency=800:duration=0.15",
                                    "-af", "afade=t=in:d=0.01,afade=t=out:st=0.1:d=0.05,volume=0.6"]),
              "whoosh": synth("whoosh", ["-f", "lavfi", "-i", "anoisesrc=d=0.3:c=pink",
                                         "-af", "afade=t=in:d=0.05,afade=t=out:st=0.2:d=0.1,lowpass=f=2000,volume=0.4"]),
              "ding": synth("ding", ["-f", "lavfi", "-i", "sine=frequency=1200:duration=0.4",
                                     "-af", "afade=t=in:d=0.01,afade=t=out:st=0.25:d=0.15,volume=0.5"]),
              "buzz": synth("buzz", ["-f", "lavfi", "-i", "sine=frequency=200:duration=0.25",
                                     "-af", "afade=t=in:d=0.01,afade=t=out:st=0.15:d=0.1,volume=0.5"]),
              "tick": synth("tick", ["-f", "lavfi", "-i", "sine=frequency=1500:duration=0.06",
                                     "-af", "volume=0.3"]),
          }

          # Stitch frames into silent video
          subprocess.run([
              "ffmpeg", "-y", "-framerate", str(fps), "-i", "/tmp/frames/f_%05d.png",
              "-c:v", "libx264", "-preset", "veryfast", "-crf", "20",
              "-pix_fmt", "yuv420p", "-movflags", "+faststart",
              "/tmp/silent_video.mp4"
          ], check=True, capture_output=True)
          print("Frames stitched")

          # Build SFX mix from timeline events that have an sfx type
          sfx_events = [e for e in timeline if e.get("sfx")]
          if sfx_events:
              inputs = []
              filter_parts = []
              for i, ev in enumerate(sfx_events):
                  inputs += ["-i", sfx_paths[ev["sfx"]]]
                  delay_ms = int(ev["t"] * 1000)
                  filter_parts.append(f"[{i+1}:a]adelay={delay_ms}|{delay_ms}[a{i}]")
              mix_inputs = "".join(f"[a{i}]" for i in range(len(sfx_events)))
              filter_complex = ";".join(filter_parts) + f";{mix_inputs}amix=inputs={len(sfx_events)}:duration=first:dropout_transition=0[aout]"

              cmd = ["ffmpeg", "-y", "-i", "/tmp/silent_video.mp4"] + inputs + [
                  "-filter_complex", filter_complex,
                  "-map", "0:v", "-map", "[aout]",
                  "-c:v", "copy", "-c:a", "aac", "-b:a", "128k",
                  "-shortest", "/tmp/processed.mp4"
              ]
              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode != 0:
                  print("SFX mix failed:", result.stderr[-2000:])
                  raise SystemExit(1)
              print("SFX mixed into video")
          else:
              subprocess.run(["cp", "/tmp/silent_video.mp4", "/tmp/processed.mp4"], check=True)
              print("No SFX events found, using silent video")

          print(f"Final size: {os.path.getsize('/tmp/processed.mp4')/1024/1024:.1f}MB")
          PYEOF

      - name: Upload to YouTube
        timeout-minutes: 15
        run: |
          python3 << 'PYEOF'
          import os, json, sys
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials

          with open("/tmp/meta.json") as f:
              meta = json.load(f)

          mp4 = "/tmp/processed.mp4"
          if not os.path.exists(mp4):
              print("Processed video not found")
              sys.exit(1)

          fmt_labels = {
              "word_blast": "Word Blast",
              "grammar_fix": "Grammar Fix",
              "pronunciation": "Pronunciation Challenge",
              "slang_match": "Slang Match",
              "mini_dialogue": "English Conversation",
          }
          label = fmt_labels.get(meta["format"], "English Practice")
          title = f"{label}: {meta['title_seed']} #shorts"[:100]
          description = "\n".join([
              meta["desc_seed"], "",
              "A fun bite-sized English learning game 🎮",
              "Follow for daily language challenges!",
              "", "#englishlearning #learnenglish #shorts #languagelearning #vocabulary",
          ])
          tags = ["english learning", "learn english", "vocabulary", "grammar",
                  "language learning", "shorts", meta["format"]]

          creds = Credentials(
              token=os.environ.get("YT_ACCESS_TOKEN"),
              refresh_token=os.environ.get("YT_REFRESH_TOKEN"),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ.get("YT_CLIENT_ID"),
              client_secret=os.environ.get("YT_CLIENT_SECRET"),
          )
          youtube = build("youtube", "v3", credentials=creds)

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {"title": title, "description": description, "tags": tags,
                              "categoryId": "27", "defaultLanguage": "en"},
                  "status": {"privacyStatus": "public", "madeForKids": False, "selfDeclaredMadeForKids": False}
              },
              media_body=MediaFileUpload(mp4, mimetype="video/mp4", resumable=True)
          )
          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"Upload progress: {int(status.progress()*100)}%")

          video_id = response.get("id", "")
          print(f"https://youtube.com/shorts/{video_id}")

          with open("posted.txt", "a") as f:
              f.write(meta["id"] + "\n")
          PYEOF
        env:
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}

      - name: Save posted.txt to repo
        timeout-minutes: 5
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posted.txt
          git diff --staged --quiet || git commit -m "track posted content [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}