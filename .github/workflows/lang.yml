name: Post Language Game Short to YouTube

on:
  workflow_dispatch:
    inputs:
      format_choice:
        description: "Pick a game format (Random picks any)"
        required: true
        default: "Random - any format"
        type: choice
        options:
          - "Random - any format"
          - "Word Blast (vocabulary)"
          - "Right or Wrong (grammar)"
          - "Spell Check Speedrun (pronunciation)"
          - "Match the Slang (slang)"
          - "Pick the Reply (dialogue)"
  schedule:
    - cron: "0 19 * * 1,3,5"

jobs:
  post:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install --quiet playwright google-auth google-auth-oauthlib google-api-python-client
          python3 -m playwright install --with-deps chromium
          echo "Done"

      - name: Write content bank
        timeout-minutes: 2
        run: |
          mkdir -p content
          cat > content/bank.json << 'BANKEOF'
          {
            "word_blast": [
              {"id":"wb1","word":"SERENDIPITY","meaning":"Finding good things by accident","wrong1":"An ancient pottery style","wrong2":"A feeling of extreme tiredness"},
              {"id":"wb2","word":"EPHEMERAL","meaning":"Lasting for a very short time","wrong1":"Extremely heavy or dense","wrong2":"Related to royal families"},
              {"id":"wb3","word":"RESILIENT","meaning":"Able to recover quickly from difficulty","wrong1":"Very quiet and shy","wrong2":"Made of rubber material"},
              {"id":"wb4","word":"AMBIGUOUS","meaning":"Open to more than one interpretation","wrong1":"Extremely bright or colorful","wrong2":"Related to walking speed"},
              {"id":"wb5","word":"MELANCHOLY","meaning":"A deep, thoughtful sadness","wrong1":"A type of sweet dessert","wrong2":"Extreme excitement"},
              {"id":"wb6","word":"TENACIOUS","meaning":"Holding firmly, not giving up","wrong1":"Very quiet and soft-spoken","wrong2":"Related to ten items"},
              {"id":"wb7","word":"EUPHORIA","meaning":"Intense happiness or excitement","wrong1":"A fear of open spaces","wrong2":"A type of ancient currency"},
              {"id":"wb8","word":"PRAGMATIC","meaning":"Dealing with things sensibly and practically","wrong1":"Extremely emotional","wrong2":"Related to public speaking"}
            ],
            "grammar_fix": [
              {"id":"gf1","wrong":"I could care less","right":"I couldn't care less"},
              {"id":"gf2","wrong":"Me and him went there","right":"He and I went there"},
              {"id":"gf3","wrong":"I have less friends now","right":"I have fewer friends now"},
              {"id":"gf4","wrong":"She don't like it","right":"She doesn't like it"},
              {"id":"gf5","wrong":"I seen it yesterday","right":"I saw it yesterday"},
              {"id":"gf6","wrong":"Between you and I","right":"Between you and me"},
              {"id":"gf7","wrong":"He is more taller","right":"He is taller"},
              {"id":"gf8","wrong":"I didn't went there","right":"I didn't go there"}
            ],
            "pronunciation": [
              {"id":"pr1","word":"WEDNESDAY","silentIdx":[2,4,5],"phonetic":"WENS-day"},
              {"id":"pr2","word":"COMFORTABLE","silentIdx":[3,4],"phonetic":"KUMF-ter-bul"},
              {"id":"pr3","word":"ISLAND","silentIdx":[1],"phonetic":"EYE-land"},
              {"id":"pr4","word":"SALMON","silentIdx":[2],"phonetic":"SAM-un"},
              {"id":"pr5","word":"RECEIPT","silentIdx":[3],"phonetic":"ri-SEET"},
              {"id":"pr6","word":"SUBTLE","silentIdx":[2],"phonetic":"SUT-tl"}
            ],
            "slang_match": [
              {"id":"sm1","term":"BITE THE BULLET","meaning":"Do something hard you've been avoiding 💪"},
              {"id":"sm2","term":"SPILL THE TEA","meaning":"Share juicy gossip ☕"},
              {"id":"sm3","term":"HIT THE SACK","meaning":"Go to bed / go to sleep 🛏️"},
              {"id":"sm4","term":"BREAK THE ICE","meaning":"Start a conversation comfortably 🧊"},
              {"id":"sm5","term":"COST AN ARM AND A LEG","meaning":"Be very expensive 💸"},
              {"id":"sm6","term":"UNDER THE WEATHER","meaning":"Feeling a little sick 🤒"}
            ],
            "mini_dialogue": [
              {"id":"md1","topic":"☕ Ordering Coffee","msg1":"Hi! What can I get you today?","you1":"I'll have a latte, please.","msg2":"For here or to go?","right":"To go, please.","wrong1":"I don't like coffee.","wrong2":"What's your name?"},
              {"id":"md2","topic":"🛫 At the Airport","msg1":"Can I see your boarding pass?","you1":"Sure, here you go.","msg2":"Do you have any checked bags?","right":"Just one, thank you.","wrong1":"I love flying.","wrong2":"What time is it?"},
              {"id":"md3","topic":"🍽️ At a Restaurant","msg1":"Are you ready to order?","you1":"Yes, I'll have the pasta.","msg2":"Would you like anything to drink?","right":"Just water, please.","wrong1":"I'm not hungry.","wrong2":"Is it raining outside?"}
            ]
          }
          BANKEOF
          echo "Content bank written"

      - name: Write HTML templates
        timeout-minutes: 2
        run: |
          mkdir -p templates

          cat > templates/word_blast.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <style>
            @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
            * { margin:0; padding:0; box-sizing:border-box; font-family:'Orbitron',sans-serif; }
            body { width:1080px; height:1920px; background:radial-gradient(circle at 50% 30%, #2d0b4e 0%, #0a0015 70%); overflow:hidden; position:relative; }
            .grid-bg { position:absolute; inset:0; background-image:linear-gradient(rgba(255,0,200,0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,255,0.08) 1px, transparent 1px); background-size:60px 60px; }
            .timerbar { position:absolute; top:40px; left:40px; right:40px; height:24px; background:#1a0430; border:3px solid #ff2ec4; border-radius:20px; overflow:hidden; box-shadow:0 0 20px #ff2ec4; }
            .timerfill { height:100%; background:linear-gradient(90deg,#ff2ec4,#ffe600); width:100%; transform-origin:left; }
            .label { position:absolute; top:110px; width:100%; text-align:center; color:#00fff2; font-size:44px; letter-spacing:6px; text-shadow:0 0 20px #00fff2; opacity:0; }
            .wordcard { position:absolute; top:280px; width:100%; text-align:center; opacity:0; }
            .wordcard .word { font-size:100px; font-weight:900; color:#fff; text-shadow:0 0 30px #ff2ec4, 0 0 60px #ff2ec4; letter-spacing:2px; padding:0 20px; word-break:break-word; }
            .options { position:absolute; top:620px; width:100%; padding:0 60px; display:flex; flex-direction:column; gap:36px; }
            .opt { background:linear-gradient(135deg,#1a0430,#2d0b4e); border:4px solid #00fff2; border-radius:24px; padding:38px 30px; color:#fff; font-size:38px; text-align:center; box-shadow:0 0 25px rgba(0,255,242,0.4); opacity:0; transform:translateY(40px); transition:opacity 0.3s, transform 0.3s, background 0.3s, border-color 0.3s, box-shadow 0.3s; }
            .opt.correct { border-color:#39ff14; box-shadow:0 0 50px #39ff14; background:linear-gradient(135deg,#0a2e0a,#123a12); }
            .opt.wrong { opacity:0.3 !important; filter:grayscale(0.6); }
            .footer { position:absolute; bottom:90px; width:100%; text-align:center; color:#ffe600; font-size:36px; font-weight:700; opacity:0; text-shadow:0 0 15px #ffe600; }
            .particle { position:absolute; width:14px; height:14px; border-radius:50%; opacity:0; }
          </style></head>
          <body>
            <div class="grid-bg"></div>
            <div class="timerbar"><div class="timerfill" id="timerfill"></div></div>
            <div class="label" id="label">WORD BLAST 💥</div>
            <div class="wordcard" id="wordcard"><div class="word" id="word">__WORD__</div></div>
            <div class="options" id="options">
              <div class="opt" id="opt1">A) __WRONG1__</div>
              <div class="opt" id="opt2">B) __MEANING__</div>
              <div class="opt" id="opt3">C) __WRONG2__</div>
            </div>
            <div class="footer" id="footer">SAVE THIS TO SOUND SMARTER 📌</div>
            <div id="particles"></div>
          <script>
          window.FRAME_STATE = { phase:'init' };
          function spawnParticles(){
            const colors=['#ff2ec4','#00fff2','#ffe600','#39ff14'];
            const box = document.getElementById('opt2').getBoundingClientRect();
            for(let i=0;i<24;i++){
              const p = document.createElement('div');
              p.className='particle'; p.style.background = colors[i%colors.length];
              p.style.left = (box.left+box.width/2)+'px'; p.style.top = (box.top+box.height/2)+'px';
              p.style.opacity='1'; const ang = (Math.PI*2*i)/24; const dist = 120+Math.random()*80;
              p.style.transition='transform 0.8s ease-out, opacity 0.8s ease-out';
              document.getElementById('particles').appendChild(p);
              requestAnimationFrame(()=>{ p.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`; p.style.opacity='0'; });
            }
          }
          const timeline = [
            { t:0.0, sfx:'whoosh', fn:()=>{ document.getElementById('label').style.opacity='1'; }},
            { t:0.6, sfx:'pop', fn:()=>{ document.getElementById('wordcard').style.opacity='1'; }},
            { t:2.0, sfx:'tick', fn:()=>{ const o=document.getElementById('options').children[0]; o.style.opacity='1'; o.style.transform='translateY(0)'; }},
            { t:2.4, sfx:'tick', fn:()=>{ const o=document.getElementById('options').children[1]; o.style.opacity='1'; o.style.transform='translateY(0)'; }},
            { t:2.8, sfx:'tick', fn:()=>{ const o=document.getElementById('options').children[2]; o.style.opacity='1'; o.style.transform='translateY(0)'; }},
            { t:5.0, sfx:'ding', fn:()=>{
                document.getElementById('opt1').classList.add('wrong');
                document.getElementById('opt3').classList.add('wrong');
                document.getElementById('opt2').classList.add('correct');
                spawnParticles();
              }},
            { t:6.0, sfx:null, fn:()=>{ document.getElementById('footer').style.opacity='1'; }},
          ];
          window.__TIMELINE__ = timeline;
          let applied = new Set();
          function tick(tSec){
            timeline.forEach((ev,i)=>{ if(tSec>=ev.t && !applied.has(i)){ applied.add(i); ev.fn(); }});
            const timerPct = Math.max(0, 1 - tSec/5.0);
            document.getElementById('timerfill').style.transform = `scaleX(${timerPct})`;
          }
          window.__tick = tick;
          window.__DURATION__ = 7.0;
          </script>
          </body></html>
          HTMLEOF

          cat > templates/grammar_fix.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <style>
