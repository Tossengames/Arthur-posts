<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Farm Shorts — tiny-space farm videos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1b2e;--bg:#231527;--cream:#fff3d1;--leaf:#4dc15a;--sun:#ffd23f;--tomato:#ff4b3e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'Nunito','Trebuchet MS',system-ui,sans-serif;font-weight:700}
.app{max-width:1100px;margin:0 auto;padding:12px 14px 40px;display:grid;gap:14px;grid-template-columns:1fr}
h1{font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:34px;margin:0;color:var(--sun);text-shadow:3px 3px 0 #ff5d4a;letter-spacing:.5px}
header p{margin:2px 0 0;opacity:.8;font-size:15px}
.phone{position:relative;margin:0 auto;aspect-ratio:9/16;width:min(100%,calc((100vh - 230px)*9/16),460px);width:min(100%,calc((100dvh - 230px)*9/16),460px);border-radius:24px;overflow:hidden;background:#000;box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--sun),0 20px 50px rgba(0,0,0,.5)}
canvas{width:100%;height:100%;display:block}
.bigplay{position:absolute;inset:0;margin:auto;width:100%;height:100%;border:0;background:rgba(35,21,39,.28);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-family:'Lilita One',Impact,sans-serif;font-size:30px}
.bigplay[hidden]{display:none}
.bigplay i{width:92px;height:92px;border-radius:50%;background:var(--sun);border:5px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:grid;place-items:center}
.bigplay i:after{content:"";margin-left:8px;border-left:30px solid var(--ink);border-top:19px solid transparent;border-bottom:19px solid transparent}
.bigplay span{text-shadow:0 3px 0 var(--ink);-webkit-text-stroke:1px var(--ink)}
.rec{position:absolute;top:12px;right:12px;background:var(--tomato);color:#fff;padding:4px 10px;border-radius:99px;font-size:13px}
.prog{height:8px;border-radius:9px;background:rgba(255,255,255,.15);margin:10px auto 0;width:min(100%,460px);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--leaf)}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{font:inherit;font-family:'Lilita One',Impact,sans-serif;font-weight:400;font-size:19px;padding:11px 18px;border-radius:14px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);box-shadow:0 5px 0 #9c8b6a;cursor:pointer}
.btn.primary{background:var(--sun);box-shadow:0 5px 0 #c98a00;font-size:22px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0003}
.btn:disabled{opacity:.6}
.group h2{font-size:15px;margin:0 0 7px;opacity:.85}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:14.5px;padding:8px 13px;border-radius:99px;border:2px solid rgba(255,243,209,.35);background:rgba(255,243,209,.08);color:var(--cream);cursor:pointer}
.chip.on{background:var(--leaf);border-color:var(--ink);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.row{display:flex;gap:8px}
.info{opacity:.7;font-size:13px;margin:4px 0 0}
.right{display:grid;gap:16px;align-content:start}
@media(min-width:900px){.app{grid-template-columns:auto 1fr;gap:44px;padding:28px}.phone{width:auto;height:min(86vh,880px);height:min(86dvh,880px)}.right{padding-top:8px}header{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
 <header><h1>Farm Shorts</h1><p>A fresh tiny-space farming video every tap. Pick a set, or let it surprise you.</p></header>
 <section class="left">
  <div class="phone"><canvas id="cv" width="720" height="1280"></canvas>
   <button class="bigplay" id="big" aria-label="Play"><i></i><span id="bigtxt">Tap to play</span></button>
   <div class="rec" id="recBadge" hidden>Recording</div></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="actions"><button class="btn primary" id="btnNew">New video</button><button class="btn" id="btnReplay">Replay</button><button class="btn" id="btnSave">Save video</button></div>
 </section>
 <section class="right">
  <div class="group"><h2>Format</h2><div class="chips" id="fmts"></div></div>
  <div class="group"><h2>Length</h2><div class="chips" id="lens"></div></div>
  <div class="group"><h2>Set</h2><div class="chips" id="sets"></div></div>
  <div class="group"><h2>Topic</h2><div class="chips" id="topics"></div></div>
  <div class="group"><h2>Light</h2><div class="chips" id="tods"></div></div>
  <div class="row"><button class="chip" id="btnSound" type="button">Sound on</button><button class="chip" id="btnRes" type="button">720p</button></div>
  <p class="info" id="info"></p>
 </section>
</div>
<script>window.onerror=function(m){window._error=window._error||String(m)};</script>
<script src="content_farm.js"></script>
<script>
'use strict';
/* =====================================================================
   SPROUT SHORTS — procedural 2D farming shorts, made fresh every tap
   ===================================================================== */
const W=1080,H=1920,FLOOR=1290,CX=540,TAU=Math.PI*2,PI=Math.PI;
const X0=-700,X1=1780,Y0=-600,Y1=2600;
const FONT="'Lilita One','Arial Rounded MT Bold','Arial Black',Impact,sans-serif";
const C={ink:'#2b1b2e',cream:'#fff3d1',leaf:'#4dc15a',leafD:'#2d9547',leafL:'#a4e56c',tomato:'#ff4b3e',sun:'#ffd23f',sunD:'#ffa920',soil:'#6b4228',hollow:'#2b1a24',water:'#4cc3ff',pink:'#ff8fb1',teal:'#25c2b0',purple:'#7a4cff'};

const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  lin:t=>t,
  out2:t=>1-(1-t)*(1-t),
  out3:t=>1-Math.pow(1-t,3),
  in2:t=>t*t,
  in3:t=>t*t*t,
  io3:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{t=clamp(t);const c=1.70158,d=c+1;return 1+d*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  elastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(TAU/3))+1,
  bounce:t=>{t=clamp(t);const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d){t-=1.5/d;return n*t*t+.75}if(t<2.5/d){t-=2.25/d;return n*t*t+.9375}t-=2.625/d;return n*t*t+.984375}
};
function hex(c){if(c.length===4)c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
const h2=n=>{n=Math.max(0,Math.min(255,Math.round(n)));return(n<16?'0':'')+n.toString(16)};
function mixc(a,b,t){const A=hex(a),B=hex(b);return'#'+h2(A[0]+(B[0]-A[0])*t)+h2(A[1]+(B[1]-A[1])*t)+h2(A[2]+(B[2]-A[2])*t)}
const shade=(c,a)=>mixc(c,'#2b1b2e',a), tint=(c,a)=>mixc(c,'#ffffff',a);
const rgba=(c,a)=>{const x=hex(c);return`rgba(${x[0]},${x[1]},${x[2]},${a})`};
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)%a.length];
const nz=(t,s)=>Math.sin(t*1.7+s)*.5+Math.sin(t*2.9+s*2.3)*.3+Math.sin(t*4.7+s*.7)*.2;

/* ---------- drawing primitives ---------- */
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.arcTo(x+w,y,x+w,y+r,r);g.lineTo(x+w,y+h-r);g.arcTo(x+w,y+h,x+w-r,y+h,r);g.lineTo(x+r,y+h);g.arcTo(x,y+h,x,y+h-r,r);g.lineTo(x,y+r);g.arcTo(x,y,x+r,y,r);g.closePath()}
function ell(g,x,y,rx,ry,rot=0){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU)}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,Math.max(.1,r),0,TAU)}
function ol(g,fill,lw=8,stroke=C.ink){if(fill){g.fillStyle=fill;g.fill()}g.lineWidth=lw;g.strokeStyle=stroke;g.lineJoin='round';g.lineCap='round';g.stroke()}
function sparkle(g,x,y,r,rot=0){g.save();g.translate(x,y);g.rotate(rot);g.beginPath();g.moveTo(0,-r);g.quadraticCurveTo(r*.12,-r*.12,r,0);g.quadraticCurveTo(r*.12,r*.12,0,r);g.quadraticCurveTo(-r*.12,r*.12,-r,0);g.quadraticCurveTo(-r*.12,-r*.12,0,-r);g.closePath();g.restore()}
function heart(g,x,y,s){g.beginPath();g.moveTo(x,y+s*.9);g.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.8,y-s*1.1,x,y-s*.4);g.bezierCurveTo(x+s*.8,y-s*1.1,x+s*1.5,y-s*.1,x,y+s*.9);g.closePath()}
function shadowEll(g,x,y,rx,ry,a=.28){ell(g,x,y,rx,ry);g.fillStyle=`rgba(43,27,46,${a})`;g.fill()}

/* ---------- stateless particles (replayable, scrub-safe) ---------- */
function drawP(g,kind,x,y,sz,rot,col,al){
  g.globalAlpha=al;
  switch(kind){
    case'star':sparkle(g,x,y,sz*1.7,rot);g.fillStyle=col;g.fill();break;
    case'dirt':g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=col;g.fillRect(-sz/2,-sz/2,sz,sz*.8);g.restore();break;
    case'drop':g.beginPath();g.moveTo(x,y-sz*1.4);g.quadraticCurveTo(x+sz*1.1,y+sz*.3,x,y+sz);g.quadraticCurveTo(x-sz*1.1,y+sz*.3,x,y-sz*1.4);g.fillStyle=col;g.fill();break;
    case'conf':g.save();g.translate(x,y);g.rotate(rot);g.scale(1,Math.cos(rot*2.3));g.fillStyle=col;g.fillRect(-sz*.6,-sz*.3,sz*1.2,sz*.6);g.restore();break;
    case'heart':heart(g,x,y,sz);g.fillStyle=col;g.fill();break;
    case'dot':g.beginPath();g.arc(x,y,sz,0,TAU);g.fillStyle=col;g.fill();break;
    case'leaf':leaf(g,x,y,sz*3,sz*1.2,rot,col,col,3);break;
    case'strip':g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=col;g.fillRect(-sz*1.2,-sz*.18,sz*2.4,sz*.36);g.restore();break;
  }
  g.globalAlpha=1;
}
function parts(g,o){
  const dt=o.t-o.t0;if(dt<0||dt>o.life)return;
  const r=rng(o.seed||1),cols=o.cols||['#fff'],k=dt/o.life,al=k<.6?1:1-(k-.6)/.4;
  for(let i=0;i<o.n;i++){
    const a=o.a0===undefined?r()*TAU:o.a0+(r()-.5)*(o.arc||1),sp=o.speed*(.35+r()*.9),rot=r()*TAU+dt*(r()-.5)*8,sz=o.size*(.6+r()*.8),col=cols[(r()*cols.length)|0];
    const x=o.x+Math.cos(a)*sp*dt,y=o.y+Math.sin(a)*sp*dt+.5*(o.grav||0)*dt*dt;
    drawP(g,o.kind,x,y,sz*(o.shrink?1-k*.6:1),rot,col,al);
  }
}
function stream(g,o){
  const dt=o.t-o.t0;if(dt<0)return;
  const r=rng(o.seed||7);
  for(let i=0;i<o.n;i++){
    const off=i/o.n*o.life,j1=r()-.5,j2=r()-.5;let age=dt-off;if(age<0)continue;
    const cyc=Math.floor(age/o.life);age=age-cyc*o.life;
    if(o.t1!==undefined&&o.t0+off+cyc*o.life>o.t1)continue;
    const x=o.x+(o.vx+j1*(o.jit||0))*age,y=o.y+(o.vy+j2*(o.jit||0)*.5)*age+.5*o.grav*age*age;
    if(o.stopY!==undefined&&y>o.stopY)continue;
    drawP(g,o.kind,x,y,o.size*(.7+.6*((i*7)%5)/5),age*6+i,o.cols[i%o.cols.length],1);
  }
}
function rays(g,x,y,t,col,n,len,al=.25,spd=.25){
  g.save();g.translate(x,y);g.rotate(t*spd);g.fillStyle=rgba(col,al);
  for(let i=0;i<n;i++){const a=i/n*TAU,w=TAU/n*.38;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a-w)*len,Math.sin(a-w)*len);g.lineTo(Math.cos(a+w)*len,Math.sin(a+w)*len);g.closePath();g.fill()}
  g.restore();
}
function thump(lt,times,amp=10,k=10,f=60){let s=0;for(const t0 of times){const d=lt-t0;if(d>0)s+=Math.exp(-d*k)*Math.sin(d*f)*amp}return s}
/* =====================  PLANTS  ===================== */
function leaf(g,x,y,len,wid,ang,fill,vein,lw=6){
  if(len<3)return;
  g.save();g.translate(x,y);g.rotate(ang);
  g.beginPath();g.moveTo(0,0);g.bezierCurveTo(len*.2,-wid*1.1,len*.7,-wid*.9,len,0);g.bezierCurveTo(len*.7,wid*.9,len*.2,wid*1.1,0,0);g.closePath();
  ol(g,fill,lw);
  g.beginPath();g.moveTo(len*.08,0);g.lineTo(len*.8,0);g.strokeStyle=vein;g.lineWidth=Math.max(2,lw*.55);g.stroke();
  g.restore();
}
function frill(g,len,wid,ang,fill,vein){
  g.save();g.rotate(ang);g.beginPath();g.moveTo(0,0);const N=22;
  for(let i=0;i<=N;i++){const u=i/N,w=Math.pow(Math.sin(u*PI),.8)*wid*(1+.14*Math.sin(u*34));g.lineTo(u*len,-w)}
  for(let i=N;i>=0;i--){const u=i/N,w=Math.pow(Math.sin(u*PI),.8)*wid*(1+.14*Math.sin(u*34+1.3));g.lineTo(u*len,w)}
  g.closePath();ol(g,fill,6);g.beginPath();g.moveTo(len*.06,0);g.lineTo(len*.8,0);g.strokeStyle=vein;g.lineWidth=4;g.stroke();g.restore();
}
function stemPt(x0,Hh,sw,u){const cx=sw*.2,cy=-Hh*.55,b=2*(1-u)*u,c=u*u;return[x0+b*cx+c*sw,b*cy-c*Hh]}
function stem(g,Hh,sw,w,col=C.leafD,x0=0){
  g.beginPath();g.moveTo(x0,0);g.quadraticCurveTo(x0+sw*.2,-Hh*.55,x0+sw,-Hh);
  g.lineCap='round';g.strokeStyle=C.ink;g.lineWidth=w+8;g.stroke();g.strokeStyle=col;g.lineWidth=w;g.stroke();
}
function fruit(g,x,y,r,col){
  circ(g,x,y,r);ol(g,col,7);
  ell(g,x-r*.35,y-r*.35,r*.22,r*.14,-.7);g.fillStyle='rgba(255,255,255,.55)';g.fill();
  g.save();g.translate(x,y-r*.88);g.fillStyle=C.leafD;for(let i=0;i<5;i++){g.rotate(TAU/5);ell(g,0,-r*.2,r*.12,r*.28);g.fill()}g.restore();
}
function pepperS(g,x,y,r,col,rot=0){
  g.save();g.translate(x,y);g.rotate(rot);
  g.beginPath();g.moveTo(-r*.55,0);g.bezierCurveTo(-r*.7,r*1.5,-r*.2,r*2.4,0,r*2.7);g.bezierCurveTo(r*.2,r*2.4,r*.7,r*1.5,r*.55,0);g.bezierCurveTo(r*.4,-r*.25,-r*.4,-r*.25,-r*.55,0);g.closePath();ol(g,col,7);
  ell(g,-r*.25,r*.9,r*.1,r*.5,.1);g.fillStyle='rgba(255,255,255,.5)';g.fill();
  ell(g,0,-r*.1,r*.6,r*.22);ol(g,C.leafD,6);
  g.beginPath();g.moveTo(0,-r*.2);g.lineTo(r*.12,-r*.75);g.strokeStyle=C.ink;g.lineWidth=9;g.stroke();g.strokeStyle=C.leafD;g.lineWidth=4;g.stroke();
  g.restore();
}
function berry(g,x,y,r,rot=0){
  g.save();g.translate(x,y);g.rotate(rot);
  g.beginPath();g.moveTo(0,r*1.3);g.bezierCurveTo(-r*1.4,r*.2,-r*1.15,-r*1,0,-r*.7);g.bezierCurveTo(r*1.15,-r*1,r*1.4,r*.2,0,r*1.3);g.closePath();ol(g,'#ff3f55',7);
  g.fillStyle='#ffe58a';[[-.5,0],[.5,0],[0,.35],[-.35,.7],[.35,.7],[0,-.25]].forEach(([a,b])=>{ell(g,a*r,b*r,r*.07,r*.11);g.fill()});
  g.fillStyle=C.leafD;for(let i=0;i<5;i++){g.save();g.translate(0,-r*.7);g.rotate(-1.2+i*.6);ell(g,0,-r*.22,r*.13,r*.3);g.fill();g.restore()}
  g.restore();
}
function potatoS(g,x,y,r,rot=0){
  g.save();g.translate(x,y);g.rotate(rot);ell(g,0,0,r*1.2,r);ol(g,'#dba866',7);
  g.fillStyle='#b8834a';[[-.4,-.2],[.3,.25],[.5,-.35],[-.1,.4]].forEach(([a,b])=>{ell(g,a*r,b*r,r*.09,r*.07);g.fill()});
  ell(g,-r*.45,-r*.4,r*.3,r*.13,-.5);g.fillStyle='rgba(255,255,255,.4)';g.fill();g.restore();
}
let CURLOOK={};
const LF=(def,i=0)=>CURLOOK.leaf?CURLOOK.leaf[((i%CURLOOK.leaf.length)+CURLOOK.leaf.length)%CURLOOK.leaf.length]:def;
const PL={};
PL.tomato=(g,k,raw,t,sd)=>{
  const Hh=560*k,sw=Math.sin(t*1.7+sd)*14*k;stem(g,Hh,sw,18);
  const n=1+Math.floor(k*8);
  for(let i=0;i<n;i++){
    const u=.14+.78*i/Math.max(n,2),[px,py]=stemPt(0,Hh,sw,u),side=i%2?1:-1,sz=clamp((k-u*.5)*2.4)*175*(1-u*.45);
    const a=side>0?-.5+Math.sin(t*2+i)*.07:PI+.5-Math.sin(t*2+i+1)*.07;
    leaf(g,px,py,sz,sz*.38,a,i%2?C.leaf:'#38b04e',C.leafD);
  }
  const[tx,ty]=stemPt(0,Hh,sw,1);leaf(g,tx,ty,120*k,44*k,-PI/2+sw*.01,C.leaf,C.leafD);
  if(raw>.5){const f=seg(raw,.5,1);
    const fn=CURLOOK.fn||4,fsz=CURLOOK.fs||1;for(let j=0;j<fn;j++){const u=.26+j*(.6/fn),[px,py]=stemPt(0,Hh,sw,u),side=j%2?1:-1,fx=px+side*54*Math.max(.6,fsz),fy=py+70*Math.max(.6,fsz),r=36*fsz*E.back(clamp(f*1.5-j*.1));
      if(r<3)continue;g.beginPath();g.moveTo(px,py);g.lineTo(fx,fy-r);g.strokeStyle=C.ink;g.lineWidth=9;g.stroke();
      fruit(g,fx,fy,r,mixc('#9bd84f',CURLOOK.ripe||'#ff4b3e',clamp(f*1.6-j*.15)));}}
};
PL.pepper=(g,k,raw,t,sd)=>{
  const Hh=400*k,sw=Math.sin(t*1.5+sd)*10*k;stem(g,Hh,sw,16);
  const n=2+Math.floor(k*6);
  for(let i=0;i<n;i++){const u=.2+.75*i/Math.max(n,2),[px,py]=stemPt(0,Hh,sw,u),sz=clamp((k-u*.4)*2.2)*110*(1-u*.3);
    leaf(g,px,py,sz,sz*.45,-PI/2+1.0+Math.sin(t*2+i)*.06,i%2?C.leaf:'#38b04e',C.leafD);leaf(g,px,py,sz,sz*.45,-PI/2-1.0-Math.sin(t*2+i)*.06,i%2?'#38b04e':C.leaf,C.leafD)}
  const[tx,ty]=stemPt(0,Hh,sw,1);leaf(g,tx,ty,80*k,34*k,-PI/2,C.leaf,C.leafD);
  if(raw>.45){const f=seg(raw,.45,1);
    for(let j=0;j<4;j++){const u=.38+j*.1,[px,py]=stemPt(0,Hh,sw,u),side=j%2?1:-1,r=24*(CURLOOK.fs||1)*E.back(clamp(f*1.5-j*.12));if(r<3)continue;
      pepperS(g,px+side*38,py+14,r,mixc('#7fd04a',(CURLOOK.ripe||(j%2?'#ffb62e':'#ff3b30')),clamp(f*1.7-j*.15)),side*.12)}}
};
PL.basil=(g,k,raw,t,sd)=>{
  [[-1,.78,-70],[1,.78,70],[0,1,0]].forEach(([sx,hs,bd],si)=>{
    const Hh=300*k*hs,x0=sx*24,sw=bd*k+Math.sin(t*2+sd+sx)*8*k;stem(g,Hh,sw,13,C.leafD,x0);
    const n=2+Math.floor(k*4);

      g.fillStyle='#d9a05b';[[-90,100],[-72,120],[84,110],[100,92]].forEach(([a,b])=>{ell(g,a,b,9,14,.5);ol(g,'#d9a05b',4)});break;

const BOXG={
  bucket:{tw:480,bw:380,h:420,k:.16},
  pot:{tw:440,bw:290,h:340,k:.16,band:62},
  tray:{tw:760,bw:700,h:130,k:.13},
  box:{tw:800,bw:760,h:210,k:.13},
  bag:{tw:460,bw:430,h:420,k:.17},
  bin:{tw:740,bw:640,h:300,k:.14,band:40}
};
const TIERS=[{tw:540,bw:350,h:260,k:.16,band:46},{tw:420,bw:270,h:220,k:.16,band:40},{tw:310,bw:200,h:190,k:.16,band:34}];
function geo(type){
  if(type==='jar')return{type,rx:150,ry:16,ey:-440,h:440,sw:170,slots:[{x:-72,y:-34,s:.9},{x:0,y:-34,s:.96},{x:72,y:-34,s:.9}]};
  if(type==='tower'){
    return{type,rx:284,ry:86,ey:-670,h:670,sw:300,slots:[{x:-200,y:-260+86*.15,s:.85},{x:200,y:-260+86*.15,s:.85},{x:-155,y:-480+67*.15,s:.8},{x:155,y:-480+67*.15,s:.8},{x:0,y:-670+50*.15,s:.85}],bases:[0,-260,-480]};
  }
  const d=BOXG[type],ry=d.tw*d.k,ey=-d.h,rx=(d.band?d.tw+28:d.tw)/2,g={type,rx,ry,ey,h:d.h,sw:d.tw*.58,slots:[]};
  const sy=ey+ry*.12;
  if(type==='tray')for(let i=0;i<9;i++)g.slots.push({x:-300+i*75,y:sy,s:1});
  else if(type==='box')[-255,-85,85,255].forEach(x=>g.slots.push({x,y:sy,s:.95}));
  else if(type==='bin')[-230,-110,0,115,235].forEach((x,i)=>g.slots.push({x,y:sy+(i%2?8:-6),s:1}));
  else g.slots.push({x:0,y:sy,s:1});
  return g;
}
function drawFace(g,x,y,sz,t){

  [-1,1].forEach(sd=>{ell(g,x+sd*sz*.55,y,sz*.34,sz*.4*bl);g.fillStyle='#fff';g.fill();g.lineWidth=6;g.strokeStyle=C.ink;g.stroke();
    if(bl>.5){circ(g,x+sd*sz*.55+sz*.05,y+sz*.04,sz*.17);g.fillStyle=C.ink;g.fill();circ(g,x+sd*sz*.55+sz*.1,y-sz*.04,sz*.06);g.fillStyle='#fff';g.fill()}
    ell(g,x+sd*sz*1.0,y+sz*.52,sz*.2,sz*.12);g.fillStyle='rgba(255,93,130,.55)';g.fill()});
  g.beginPath();g.arc(x,y+sz*.32,sz*.3,.12*PI,.88*PI);g.lineWidth=7;g.strokeStyle=C.ink;g.lineCap='round';g.stroke();
}
function soilColor(o){
  const paper=o.kind==='paper';let c=mixc(C.hollow,paper?'#efdcb2':C.soil,clamp(o.soil||0));
  c=mixc(c,paper?'#cdb88e':'#3d2316',(o.wet||0)*.4*clamp(o.soil||0));

function drawVessel(g,type,d,x,y,o){
  const{tw,bw,h}=d,ry=tw*d.k,topY=y-h,col=o.col,lt=tint(col,.4),dk=shade(col,.3);
  if(type==='bucket'){g.beginPath();g.moveTo(x-tw/2+14,topY);g.bezierCurveTo(x-tw/2-40,topY-210,x+tw/2+40,topY-210,x+tw/2-14,topY);g.strokeStyle=C.ink;g.lineWidth=20;g.lineCap='round';g.stroke();g.strokeStyle='#dfe3f0';g.lineWidth=9;g.stroke()}
  if(type==='bag'){for(const s of[-1,1]){g.beginPath();g.moveTo(x+s*tw*.33,topY+40);g.bezierCurveTo(x+s*tw*.33,topY-80,x+s*tw*.5,topY-80,x+s*tw*.5,topY+40);g.strokeStyle=C.ink;g.lineWidth=30;g.stroke();g.strokeStyle=shade(col,.15);g.lineWidth=16;g.stroke()}}
  g.beginPath();g.moveTo(x-tw/2,topY);g.lineTo(x+tw/2,topY);g.lineTo(x+bw/2,y);g.quadraticCurveTo(x,y+bw*.2,x-bw/2,y);g.closePath();ol(g,col,9);
  g.save();g.clip();
  g.fillStyle=lt;g.globalAlpha=.45;g.fillRect(x-tw/2-10,topY,tw*.14,h+90);
  g.fillStyle=dk;g.globalAlpha=.32;g.fillRect(x+tw/2-tw*.2,topY,tw*.3,h+90);g.globalAlpha=1;
  g.strokeStyle='rgba(43,27,46,.3)';g.lineWidth=6;

  if(type==='tray'){for(let i=-6;i<=6;i++){g.beginPath();g.moveTo(x+i*54,topY+30);g.lineTo(x+i*52,y);g.stroke()}}
  if(type==='box'){for(const f of[.38,.7]){g.beginPath();g.moveTo(x-tw/2,topY+h*f);g.lineTo(x+tw/2,topY+h*f);g.stroke()}g.fillStyle='rgba(43,27,46,.45)';for(const s of[-1,1])for(const f of[.2,.55,.85]){circ(g,x+s*(tw/2-24),topY+h*f,5);g.fill()}}
  if(type==='bag'){g.setLineDash([16,14]);for(const s of[-1,1]){g.beginPath();g.moveTo(x+s*(tw/2-34),topY+30);g.lineTo(x+s*(bw/2-34),y-10);g.stroke()}g.setLineDash([]);rr(g,x-90,topY+h*.45,180,100,16);g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=6;g.stroke()}
  g.restore();
  if(o.holes&&(type==='bucket'||type==='pot'||type==='bag')){for(const dx of[-100,0,100]){ell(g,x+dx*.9,y-26+Math.abs(dx)*.03,16,9);g.fillStyle=C.ink;g.fill()}}
  if(d.band){rr(g,x-tw/2-14,topY-2,tw+28,d.band,16);ol(g,tint(col,.12),9);g.beginPath();g.moveTo(x-tw/2,topY+d.band*.7);g.lineTo(x+tw/2,topY+d.band*.7);g.strokeStyle='rgba(43,27,46,.25)';g.lineWidth=5;g.stroke()}
  const rx=(d.band?tw+28:tw)/2;
  ell(g,x,topY,rx,ry);ol(g,lt,9);
  const irx=rx-16,iry=ry-10;ell(g,x,topY+2,irx,iry);g.fillStyle=soilColor(o);g.fill();g.lineWidth=5;g.strokeStyle=C.ink;g.stroke();
  if((o.soil||0)>.25){
    const r=rng(5),paper=o.kind==='paper';g.save();ell(g,x,topY+2,irx-2,iry-2);g.clip();
    if(o.mound){ell(g,x,topY-6*o.mound,irx*.88,iry*.8);g.fillStyle=mixc(soilColor(o),'#ffffff',.08);g.fill()}
    for(let i=0;i<(paper?16:12);i++){const px=x+(r()-.5)*irx*1.7,py=topY+(r()-.5)*iry*1.5;
      if(paper){g.save();g.translate(px,py);g.rotate(r()*3);g.fillStyle='rgba(255,255,255,.55)';g.fillRect(-22,-3,44,6);g.restore()}else{ell(g,px,py,6+r()*6,3+r()*3);g.fillStyle=i%2?'rgba(255,255,255,.1)':'rgba(0,0,0,.18)';g.fill()}}
    g.restore();
  }
  if(o.face)drawFace(g,x,y-h*.5,Math.min(60,tw*.14),o.t||0);
}
function drawJar(g,x,y,o){
  const w=300,h=440,rx=150,top=y-h;
  rr(g,x-rx,top,w,h,44);g.fillStyle='rgba(196,238,255,.42)';g.fill();
  const wl=clamp(o.water||0);
  if(wl>0){g.save();rr(g,x-rx,top,w,h,44);g.clip();const wh=h*.34*wl,wy=y-wh;g.beginPath();g.moveTo(x-rx,y+10);g.lineTo(x-rx,wy);
    for(let i=0;i<=20;i++)g.lineTo(x-rx+w*i/20,wy+Math.sin(i*.9+(o.t||0)*3)*5);g.lineTo(x+rx,y+10);g.closePath();g.fillStyle='rgba(76,195,255,.62)';g.fill();g.restore()}
  return function front(g){
    rr(g,x-rx,top,w,h,44);g.lineWidth=10;g.strokeStyle=C.ink;g.stroke();
    rr(g,x-rx+16,top+40,16,h*.55,8);g.fillStyle='rgba(255,255,255,.6)';g.fill();circ(g,x-rx+24,top+h*.55+66,8);g.fill();
    rr(g,x-rx-8,top-16,w+16,34,14);ol(g,'#cfe9f5',9);

function drawBox(g,type,x,y,o){
  const G=geo(type);
  if(type==='jar'){G.front=drawJar(g,x,y,o);return G}
  if(type==='tower'){
    const placed=o.tiers===undefined?3:o.tiers;
    for(let i=0;i<3;i++){const q=clamp(placed-i);if(q<=0)continue;const dy=-(1-E.bounce(q))*760;
      g.save();g.translate(0,dy);drawVessel(g,'pot',TIERS[i],x,y+G.bases[i],{...o,col:i%2?(o.col2||o.col):o.col,face:i===1?o.face:0});g.restore()}
    return G;
  }
  drawVessel(g,type,BOXG[type],x,y,o);return G;
}

/* ---- stage: container + contents ---- */
function base(s){
  const T=s.env.topic,p=s.pre;
  return{holes:p.holes,soil:p.soil,wet:p.wet,water:p.water,planted:p.planted,grow:p.grow,tiers:T.box==='tower'?p.tiers:3,mode:T.mode,roots:p.grow,scN:p.scN,face:0,kind:T.fillKind};
}
function slotQ(st,i,n){return st.pp===undefined?1:clamp(st.pp*(1+.3*(n-1))-.3*i)}
function drawContents(g,env,box,st,t){
  const T=env.topic,slots=box.slots,n=slots.length;
  if(T.crop==='worm'){
    const r=rng(21),cnt=st.planted?5+Math.floor((st.grow||0)*9):0;
    for(let i=0;i<Math.min(cnt,14);i++){
      const sl=i<5?slots[i]:{x:(r()-.5)*box.rx*1.3,y:box.ey+box.ry*(r()*.5-.2)};
      const q=i<5?slotQ(st,i,5):1;if(q<=0)continue;const dy=-(1-E.bounce(q))*500;
      worm(g,sl.x+(i<5?0:0),sl.y+dy+(i>=5?0:0),80+(i%3)*10,(i%2?.15:-.2)+Math.sin(t*2+i)*.1,t,i*1.7);
    }
    const sN=st.scN||0;for(let i=0;i<Math.min(4,sN);i++){const sc=1-(st.grow||0)*.9;if(sc>.05)scrap(g,[0,1,2,3][i],[-170,-40,110,210][i],box.ey+box.ry*[.1,-.25,.2,-.1][i]-6,.62*sc,[.3,-.4,.2,-.2][i])}
    return;
  }
  if(T.box==='jar'){
    slots.forEach((sl,i)=>{
      const q=slotQ(st,i,n);if(!st.planted||q<=0)return;const dy=-(1-E.bounce(q))*520;
      g.save();g.translate(sl.x,sl.y+dy);drawBulb(g,0,0,36,clamp(st.roots*1.2),t);
      drawPlant(g,'onion',0,-40,.8*sl.s,st.grow>.12?st.grow:0,t,i*2.3);g.restore();
    });return;
  }
  if(T.mode==='seedling'&&st.planted){
    slots.forEach((sl,i)=>{
      const q=slotQ(st,i,n);if(q<=0)return;const dy=-(1-E.bounce(q))*560,land=Math.max(0,q-.364),sq=1+.22*Math.sin(land*34)*Math.exp(-land*9)*(q<1?1:1);
      g.save();g.translate(sl.x,sl.y+dy);g.scale(1/sq,sq);
      if(q<1||st.grow<.2){ell(g,0,2,34,18);ol(g,'#6b4228',6)}
      const gr=st.grow<.14?.14:st.grow;drawPlant(g,T.crop,0,0,sl.s*(T.sc||1),gr,t,i*3.1);g.restore();
    });return;
  }
  if(st.grow>0)slots.forEach((sl,i)=>drawPlant(g,T.crop,sl.x,sl.y,sl.s*(T.sc||1),st.grow,t,i*3.1));
}
function drawStage(g,env,st,t,after){
  const T=env.topic,G=geo(T.box);
  g.save();g.translate(CX+(st.ox||0),FLOOR+(st.oy||0));g.scale(st.sx||1,st.sy||1);
  shadowEll(g,0,14,G.sw*1.05,G.sw*.17,.3);
  const box=drawBox(g,T.box,0,0,{col:env.pal.box,col2:env.pal.box2,soil:st.soil,kind:st.kind,wet:st.wet,water:st.water,holes:st.holes,tiers:st.tiers,face:st.face,mound:st.mound,dark:st.dark,t});
  drawContents(g,env,box,st,t);
  if(box.front)box.front(g);
  if(after)after(g,box);
  g.restore();
  return box;
}

function bee(g,x,y,t,dir){
  g.save();g.translate(x,y);g.scale(1.5*dir,1.5);const fl=Math.abs(Math.sin(t*55));
  for(const o of[-1,1]){g.save();g.translate(o*4,-14);g.rotate(o*(.4+fl*.5));ell(g,0,-16,13,22*(.6+fl*.4));g.fillStyle='rgba(255,255,255,.8)';g.fill();g.lineWidth=3;g.strokeStyle=C.ink;g.stroke();g.restore()}

function ambient(g,s,lt){

SETS.windowsill={name:'Windowsill',

function transition(g,kind,k,a){

    case'zoom':blit(g,BB,0,0,1,lerp(.55,1,E.out3(k)));blit(g,BA,0,0,1-E.in2(k),lerp(1,2.4,e));break;

    case'wipe':{blit(g,BA);const ang=.35,off=lerp(-700,W+H*.4+700,e);g.save();g.beginPath();g.moveTo(off,-100);g.lineTo(off+H*Math.tan(ang)+0,H+100);g.lineTo(-300,H+100);g.lineTo(-300,-100);g.closePath();
      g.clip();blit(g,BB);g.restore();

    case'slide':blit(g,BA,0,-e*H*.3);blit(g,BB,0,(1-e)*H);g.fillStyle=`rgba(43,27,46,${.4*(1-e)})`;g.fillRect(0,0,W,H*.0);break;

function drawFrame(plan,t){

const AU={ctx:null,bus:null,mus:null};
const ST={fmt:'auto',len:'short',sound:true,res:720,set:'auto',topic:'auto',tod:'auto',playing:false,plan:null,at0:0,raf:0,rec:null};
function auInit(){
  if(AU.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=AU.ctx=new AC();
  AU.master=c.createGain();AU.master.gain.value=.9;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=5;AU.master.connect(comp);
  AU.spk=c.createGain();AU.spk.gain.value=ST.sound?1:0;comp.connect(AU.spk);AU.spk.connect(c.destination);
  try{AU.rec=c.createMediaStreamDestination();comp.connect(AU.rec)}catch(e){}
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
}
function newBus(){
  const c=AU.ctx;if(AU.bus){try{AU.bus.gain.setValueAtTime(0,c.currentTime);AU.bus.disconnect()}catch(e){}}
  AU.bus=c.createGain();AU.bus.connect(AU.master);AU.mus=c.createGain();AU.mus.gain.value=.5;AU.mus.connect(AU.bus);
}
function tone(at,f,d,o={}){
  const c=AU.ctx,osc=c.createOscillator(),g=c.createGain();osc.type=o.type||'triangle';osc.frequency.setValueAtTime(f,at);
  if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,at+d);
  let node=osc;if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;osc.connect(fl);node=fl}
  node.connect(g);g.connect(o.dest||AU.bus);const v=o.vol||.2;
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(v,at+(o.a||.005));g.gain.exponentialRampToValueAtTime(.0001,at+d);
  osc.start(at);osc.stop(at+d+.05);
}
function noiseHit(at,d,o={}){
  const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.noise;s.loop=true;const fl=c.createBiquadFilter();fl.type=o.type||'bandpass';
  fl.frequency.setValueAtTime(o.f0||1000,at);if(o.f1)fl.frequency.exponentialRampToValueAtTime(o.f1,at+d);fl.Q.value=o.q||1;
  const g=c.createGain();s.connect(fl);fl.connect(g);g.connect(o.dest||AU.bus);const v=o.vol||.2,a=o.a||.005;
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(v,at+a);g.gain.exponentialRampToValueAtTime(.0001,at+d);s.start(at,Math.random()*.5);s.stop(at+d+.05);
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const SFX={
  whoosh:(at)=>noiseHit(at,.34,{f0:500,f1:4200,q:.9,vol:.3,a:.12}),
  pop:(at,n=0)=>tone(at,520+n*60,.1,{type:'sine',vol:.14,to:880+n*80}),
  thud:(at)=>{tone(at,130,.22,{type:'sine',vol:.5,to:42});noiseHit(at,.08,{type:'lowpass',f0:600,vol:.15})},
  ding:(at,n=0)=>{const f=mtof(81+[0,2,4,7,9,12,14][n%7]);tone(at,f,.5,{type:'sine',vol:.16});tone(at,f*2,.3,{type:'sine',vol:.06})},
  drill:(at)=>tone(at,150,.3,{type:'sawtooth',vol:.1,lp:1000,to:230,a:.03}),
  splash:(at,d=1)=>noiseHit(at,Math.max(.3,d),{f0:2600,q:1.2,vol:.1,a:.12}),
  pour:(at,d=1)=>noiseHit(at,Math.max(.3,d),{type:'lowpass',f0:1300,q:.5,vol:.18,a:.1}),
  sparkle:(at)=>[0,4,7,12,16].forEach((s,i)=>tone(at+i*.05,mtof(84+s),.28,{type:'sine',vol:.08})),
  boing:(at)=>tone(at,220,.35,{type:'sine',vol:.26,to:760}),
  tick:(at)=>tone(at,1900,.03,{type:'square',vol:.04}),
  rise:(at,d=2)=>tone(at,180,d,{type:'sawtooth',vol:.04,lp:2500,to:1100,a:.3}),
  boom:(at)=>{tone(at,95,.55,{type:'sine',vol:.55,to:32});noiseHit(at,.35,{f0:3000,f1:300,vol:.2})}

function kick(at,v=.5){tone(at,150,.17,{type:'sine',vol:v,to:45,dest:AU.mus})}
function hat(at,v=.06){noiseHit(at,.045,{type:'highpass',f0:7500,vol:v,dest:AU.mus})}
function clap(at){[0,.012,.024].forEach(o=>noiseHit(at+o,.11,{f0:1700,q:.8,vol:.15,dest:AU.mus}))}
function scheduleMusic(plan,at0,soft=false){
  const r=rng(plan.mel),b=plan.beat,total=plan.total+.5,root=60+plan.key;
  const progs=[[[0,4,7],[7,11,14],[9,12,16],[5,9,12]],[[0,4,7],[9,12,16],[5,9,12],[7,11,14]],[[5,9,12],[0,4,7],[7,11,14],[9,12,16]]];
  const prog=progs[plan.prog],pent=[0,2,4,7,9,12,14,16];
  const pat=[0,1,2,3,2,1,2,3].map((x,i)=>(r()<.25?(x+1)%4:x)),motif=[];for(let i=0;i<8;i++)motif.push(r()<.3?-1:Math.floor(r()*pent.length));
  const dropBar=Math.ceil(plan.shots[1].t0/(b*4));
  for(let bar=0;bar*4*b<total;bar++){
    const ch=prog[bar%4],bt=at0+bar*4*b,tri=[ch[0],ch[1],ch[2],ch[0]+12];
    for(let i=0;i<8;i++){const at=bt+i*b/2;if(at-at0>total)break;tone(at,mtof(root+tri[pat[i]]),.28,{type:'triangle',vol:.2,lp:2600,dest:AU.mus,a:.004})}
    for(const[bo,v]of[[0,.3],[1.5,.22],[2,.26],[3.5,.2]])tone(bt+bo*b,mtof(root-24+ch[0]),.3,{type:'sine',vol:v,dest:AU.mus});
    if(bar>=dropBar-1){for(let i=0;i<8;i++){const m=motif[i];if(m<0)continue;tone(bt+i*b/2,mtof(root+12+pent[m]+(bar%4===3&&i>5?2:0)),.24,{type:'sine',vol:.13,dest:AU.mus,a:.006})}}
    if(bar>=dropBar){for(let k=0;k<4;k++){const at=bt+k*b;if(at-at0>total)break;kick(at,soft?.2:.5);hat(at+b/2,soft?.03:.06);if(k%2&&!soft)clap(at)}hat(bt+b*3.75,.04)}
    else if(bar===dropBar-1){for(let k=0;k<8;k++)hat(bt+k*b/2,.03+k*.006)}
  }
  const end=at0+plan.total-.25;tone(end,mtof(root+12),.5,{type:'triangle',vol:.18,dest:AU.mus});tone(end,mtof(root+16),.5,{type:'triangle',vol:.14,dest:AU.mus});tone(end,mtof(root+19),.5,{type:'triangle',vol:.14,dest:AU.mus});
}
function scheduleAudio(plan,at0,music=true,soft=false){
  if(music)scheduleMusic(plan,at0,soft);
  plan.sfx.forEach(e=>{if(e.t<0)return;const f=SFX[e.k];if(f)f(at0+e.t,...(e.a||[]))});
}

/* =====================  PLAYER  ===================== */
const $=id=>document.getElementById(id);
function poster(){if(!ST.plan)return;const p=ST.plan,s=p.shots[0];drawFrame(p,s.t0+1.15)}
function stopPlay(){ST.playing=false;cancelAnimationFrame(ST.raf);if(AU.bus){try{AU.bus.gain.setValueAtTime(0,AU.ctx.currentTime)}catch(e){}}}
function startPlay(opts={}){
  stopPlay();auInit();
  if(AU.ctx){AU.ctx.resume();newBus();ST.at0=AU.ctx.currentTime+.2;scheduleAudio(ST.plan,ST.at0)}
  const perf0=performance.now()+200;
  ST.playing=true;$('big').hidden=true;
  const clock=()=>AU.ctx?AU.ctx.currentTime-ST.at0:(performance.now()-perf0)/1000;
  const loop=()=>{
    if(!ST.playing)return;const t=clock(),tot=ST.plan.total;
    if(t>=0)drawFrame(ST.plan,Math.min(t,tot-.001));
    $('bar').style.width=clamp(t/tot)*100+'%';
    if(t>=tot+.15){ST.playing=false;$('big').hidden=false;$('bigtxt').textContent='Replay';if(opts.onEnd)opts.onEnd();return}
    ST.raf=requestAnimationFrame(loop);
  };
  ST.raf=requestAnimationFrame(loop);
}
function describe(){
  const p=ST.plan;$('info').textContent=`${p.topic.name}${p.long?' (full guide)':''}  ·  ${SETS[p.set].name}  ·  ${TODS[p.todKey].name}  ·  ${p.format} format  ·  ${p.bpm} BPM  ·  ${p.total.toFixed(1)}s  ·  seed ${p.seed}`;
}
function makeVideo(play=true,seed){
  stopPlay();
  seed=seed||((Math.random()*1e9)|0);
  ST.plan=buildPlan(seed,{topic:ST.topic,set:ST.set,tod:ST.tod,long:ST.len==='long',format:ST.fmt});
  describe();poster();$('bar').style.width='0%';
  if(play)startPlay();else{$('big').hidden=false;$('bigtxt').textContent='Tap to play'}
}

  if(!window.MediaRecorder||!CV.captureStream){alert('Saving needs a browser with MediaRecorder support (Chrome, Edge, Firefox, or recent Safari).');return}
  stopPlay();auInit();
  const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const stream=CV.captureStream(30);
  if(AU.rec){AU.rec.stream.getAudioTracks().forEach(t=>stream.addTrack(t))}
  const chunks=[];let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:9e6}:{})}catch(e){alert('Could not start recording.');return}
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const done=new Promise(res=>{rec.onstop=res});
  $('recBadge').hidden=false;$('btnSave').disabled=true;$('btnSave').textContent='Recording…';
  rec.start(250);
  startPlay({onEnd:()=>setTimeout(()=>rec.stop(),250)});
  await done;
  $('recBadge').hidden=true;$('btnSave').disabled=false;$('btnSave').textContent='Save video';
  const ext=(rec.mimeType||mime).includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type:rec.mimeType||mime||'video/webm'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sprout-short-${ST.plan.topic.id}-${ST.plan.seed}.${ext}`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}

function chips(id,list,key){
  const box=$(id);box.innerHTML='';
  list.forEach(([v,label])=>{const b=document.createElement('button');b.className='chip'+(ST[key]===v?' on':'');b.textContent=label;b.type='button';
    b.onclick=()=>{ST[key]=v;[...box.children].forEach(c=>c.classList.toggle('on',c===b));makeVideo(true)};box.appendChild(b)});
}
function init(){
  CV=$('cv');CTX=CV.getContext('2d');BA=document.createElement('canvas');BB=document.createElement('canvas');GA=BA.getContext('2d');GB=BB.getContext('2d');
  setRes(ST.res);
  chips('sets',[['auto','Surprise me'],...Object.keys(SETS).map(k=>[k,SETS[k].name])],'set');
  chips('topics',[['auto','Surprise me'],...STORIES.map(t=>[t.id,t.name||t.title||t.id])],'topic');
  chips('fmts',[['auto','Surprise me'],['classic','Classic how-to'],['quick','Quick'],['tips','3 tips']],'fmt');
  chips('lens',[['short','Short (~25s)'],['long','Full guide (1-3 min)']],'len');
  chips('tods',[['auto','Surprise me'],...Object.keys(TODS).map(k=>[k,TODS[k].name])],'tod');
  $('btnNew').onclick=()=>makeVideo(true);
  $('btnReplay').onclick=()=>startPlay();
  $('big').onclick=()=>{if($('bigtxt').textContent==='Tap to play'||!ST.plan)startPlay();else startPlay()};
  $('btnSave').onclick=saveVideo;
  $('btnSound').onclick=()=>{ST.sound=!ST.sound;$('btnSound').textContent=ST.sound?'Sound on':'Sound off';if(AU.spk)AU.spk.gain.value=ST.sound?1:0};
  $('btnRes').onclick=()=>{ST.res=ST.res===720?1080:720;$('btnRes').textContent=ST.res+'p';setRes(ST.res);poster()};
  const go=()=>{try{makeVideo(false);window._ready=true}catch(e){window._error=String(e&&e.stack||e)}};
  (document.fonts&&document.fonts.load?Promise.race([document.fonts.load(`48px 'Lilita One'`),new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(go,go);
}
window.addEventListener('DOMContentLoaded',()=>{try{init()}catch(e){window._error=String(e&&e.stack||e)}});

window.ENGINE_PLUS_VERSION='farm2-1.0';

  const p=ST.plan,T=p.topic;
  return{long:!!p.long,format:p.format,id:T.id,kind:T.kind||'grow',title:T.name,caption:T.hook||p.shots[0].vo,footer:T.footer||'',tags:T.tags||'',vo:p.shots.map(s=>s.vo)};

window.setVoiceDurations=function(durs){return layout(ST.plan,durs)};
window.frameJPEG=function(t){drawFrame(ST.plan,Math.max(0,Math.min(t,ST.plan.total-.001)));return CV.toDataURL('image/jpeg',.92).split(',')[1]};
window.renderAudioBase64=async function(hasVoice,musicVol){
  const mv=(musicVol===undefined||musicVol===null)?(hasVoice?0:1):(Number(musicVol)||0);
  const p=ST.plan,sr=48000,oc=new OfflineAudioContext(2,Math.ceil(p.total*sr),sr),saved=Object.assign({},AU);
  try{
    AU.ctx=oc;AU.master=oc.createGain();AU.master.gain.value=.9;const comp=oc.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=5;AU.master.connect(comp);comp.connect(oc.destination);
    const nb=oc.createBuffer(1,sr,sr),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
    AU.bus=oc.createGain();AU.bus.gain.value=hasVoice?.7:1;AU.bus.connect(AU.master);AU.mus=oc.createGain();AU.mus.gain.value=hasVoice?mv:.5;AU.mus.connect(AU.bus);
    scheduleAudio(p,0,hasVoice?mv>0:true,hasVoice);
    const buf=await oc.startRendering(),L=buf.getChannelData(0),R=buf.getChannelData(1),out=new Int16Array(L.length*2);
    for(let i=0;i<L.length;i++){out[2*i]=Math.max(-1,Math.min(1,L[i]))*32767;out[2*i+1]=Math.max(-1,Math.min(1,R[i]))*32767}
    const u8=new Uint8Array(out.buffer);let s='';for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));
    return btoa(s);
  }finally{Object.keys(AU).forEach(k=>delete AU[k]);Object.assign(AU,saved)}
};
