<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Explainers (Sticky-Note Wall)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Gloria+Hallelujah&family=Kalam:wght@400;700&family=Permanent+Marker&family=Rock+Salt&display=block">
<style>
  html, body { margin:0; height:100%; background:#0d0a07; color:#f0e8da; font:15px Kalam, "Segoe UI", sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  #stage { flex:1; min-height:0; position:relative; background:#0d0a07; }
  canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#0d0a07; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:400 26px "Permanent Marker", cursive; pointer-events:none; }
  #bar { display:flex; align-items:center; gap:10px; padding:8px 12px; background:#1c1610; border-top:1px solid #3a2e20; flex-wrap:wrap; }
  #bar button, #bar select { background:#2c231a; color:#f0e8da; border:1px solid #4a3b29; border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; min-width:44px; }
  #bar button:focus-visible, #bar select:focus-visible, #seek:focus-visible { outline:2px solid #ee6a70; outline-offset:2px; }
  #bar button[aria-pressed="true"] { background:#4a3b29; }
  #seek { flex:1; min-width:120px; accent-color:#ee6a70; }
  #time { font-variant-numeric:tabular-nums; min-width:110px; text-align:right; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c" width="1280" height="720"></canvas><div id="loading">Pinning up the board...</div></div>
  <div id="bar">
    <button id="play" aria-label="Play">Play</button>
    <select id="topic" aria-label="Topic"></select>
    <input id="seek" type="range" min="0" max="25" step="0.01" value="0" aria-label="Scrub">
    <span id="time">0:00.0 / 0:25.0</span>
    <button id="snd" aria-pressed="true" aria-label="Sound on or off">Sound</button>
    <button id="loop" aria-pressed="true" aria-label="Loop on or off">Loop</button>
  </div>
</div>

<script>
// ===================== H helper library (unchanged) =====================
(function () {
  const STYLES = (window.STYLES = window.STYLES || []);
  window.registerStyle = (s) => STYLES.push(s);

  const H = (window.H = {});

  // ---------- seeded randomness ----------
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- gradient noise ----------
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };

  // ---------- math ----------
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };

  // ---------- color ----------
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };

  // ---------- canvas utilities ----------
  H.layer = (W, H_, ) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  H.paper = function (ctx, W, Hh, base = '#f3ecdc', seed = 3, strength = 0.06) {
    ctx.save(); ctx.fillStyle = base; ctx.fillRect(0, 0, W, Hh);
    const nz = H.makeNoise(seed), cell = 4, [br, bg, bb] = H.hex(base);
    for (let y = 0; y < Hh; y += cell) for (let x = 0; x < W; x += cell) {
      const v = nz.fbm2(x * 0.01, y * 0.01, 3) * 0.6 + nz.n2(x * 0.15, y * 0.04) * 0.4;
      const s = 1 + v * strength * 2;
      ctx.fillStyle = `rgb(${br * s | 0},${bg * s | 0},${bb * s | 0})`; ctx.fillRect(x, y, cell, cell);
    }
    ctx.restore();
  };
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };

  // ---------- rendering entry ----------
  H.W = 1280; H.H = 720;
  H.loadFonts = async function (style) {
    const specs = style.fonts || [];
    try { const sample = 'AaZz09' + (window.FONT_SAMPLE || '');
      await Promise.all(specs.map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) { /* render anyway */ }
  };
  H.render = function (style, canvas, t) {
    const ctx = canvas.getContext('2d', { willReadFrequently: !!style.readsPixels });
    const sx = canvas.width / H.W, sy = canvas.height / H.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(sx, sy);
    style.draw(ctx, H.W, H.H, t == null ? style.frameT || 0 : t);
    ctx.restore();
  };
})();
</script>

<script>
// ===================== SOUND kit (unchanged) =====================
// sound.js: a small synthesized sound kit for the style explainers. Plain Web Audio, no audio files.
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;

  // seeded random in [0,1), keyed by any string
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // note names to Hz: 'A4' = 440, 'C#5', 'Eb3'
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;

  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6; // voiceover-mode volume for minor sounds
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0; // explainer time that maps to ctx time `base`
    const base = ctx.currentTime + (o.delay || 0);
    // Start times snap to the sample grid (+ a quarter sample): in Chrome a source started a hair off the grid can
    // spike to about twice its set level.
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;

    // ---- buses: sfx, amb, music -> compressor -> master; one shared reverb send
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;
        for (let i = 0; i < n; i++) { const u = i / n; lp += (0.6 - 0.45 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 3); }
      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }

    // ---- automation helpers
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    }
    function filterNode(p, t) {
      if (!p.filter) return null;
      const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 1 : p.q;
      sweep(f.frequency, p.f == null ? 1000 : p.f, t);
      return f;
    }

    // ---- primitives
    function tone(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    function noise(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }

    // ---- named sounds
    const S = {
      // UI / motion graphics
      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      stamp: (t, o) => { S.thud(t, { ...o, f: 160 }); noise(t, { dur: 0.05, filter: 'bandpass', f: 1300, q: 1.2, gain: 0.4 * o.g, pan: o.pan }); noise(t + 0.004, { dur: 0.012, filter: 'highpass', f: 3500, gain: 0.25 * o.g, pan: o.pan }); },
      ding: (t, o) => { const f = hz(o.f || 'E6'); tone(t, { f, dur: 1.3, gain: 0.2 * o.g, verb: 0.3, pan: o.pan }); tone(t, { f: f * 2.76, dur: 0.5, gain: 0.05 * o.g, verb: 0.3, pan: o.pan }); },
      success: (t, o) => { S.ding(t, { ...o, f: o.f || 'C6' }); S.ding(t + 0.09, { ...o, f: hz(o.f || 'C6') * 1.5, g: o.g * 0.9 }); },
      error: (t, o) => { tone(t, { f: o.f || 'A3', type: 'square', dur: 0.13, gain: 0.09 * o.g, hold: 0.08, filter: 'lowpass', f2: 1400, pan: o.pan }); tone(t + 0.15, { f: hz(o.f || 'A3') * 0.8, type: 'square', dur: 0.22, gain: 0.09 * o.g, hold: 0.14, filter: 'lowpass', f2: 1200, pan: o.pan }); },
      buzz: (t, o) => { const d = o.dur || 0.3; tone(t, { f: o.f || 110, type: 'sawtooth', dur: d, gain: 0.12 * o.g, hold: d * 0.7, filter: 'lowpass', f2: 900, pan: o.pan }); tone(t, { f: (o.f || 110) * 1.01, type: 'sawtooth', dur: d, gain: 0.1 * o.g, hold: d * 0.7, filter: 'lowpass', f2: 900, pan: o.pan }); },
      sparkle: (t, o) => { const r = rand('sparkle' + t), notes = ['C6', 'D6', 'E6', 'G6', 'A6', 'C7']; for (let i = 0; i < (o.n || 6); i++) { const ti = t + i * 0.04 + r() * 0.01, f = hz(notes[Math.floor(r() * notes.length)]), pan = r() * 1.2 - 0.6; tone(ti, { f, dur: 0.6, gain: 0.04 * o.g, a: 0.002, verb: 0.35, pan }); tone(ti, { f: f * 2.76, dur: 0.2, gain: 0.012 * o.g, a: 0.002, pan }); } },
      glitch: (t, o) => { const r = rand('glitch' + t); for (let i = 0; i < 7; i++) tone(t + i * 0.022, { f: 200 + r() * 1800, type: 'square', dur: 0.02, gain: 0.07 * o.g, a: 0.001, hold: 0.015, pan: r() * 1.4 - 0.7 }); noise(t, { dur: 0.16, filter: 'bandpass', f: 2500, q: 0.6, gain: 0.12 * o.g }); },

function icon(c, name, x, y, s, col, r) {
  const w = Math.max(1.8, 2.1 * Math.min(s, 1.25));
  const L = (pts, ww, close) => mline(c, pts, ww || w, col, r, close);
  switch (name) {
    case 'cup': cup(c, x, y, s, col, r); break;
    case 'up': upArrow(c, x, y, s, col, r); break;
    case 'check': check(c, x, y, s * 1.1, col, r); break;
    case 'coin':
      L(arcPts(x, y, 17 * s, 17 * s, 0, TAU, 22), w, true); L(arcPts(x, y, 12 * s, 12 * s, 0, TAU, 18), w * 0.55, true);
      hand(c, ['$'], x, y + 1, '400 ' + Math.round(20 * s) + 'px "Permanent Marker"', col, 7, 20); break;
    case 'stack':
      for (let k = 0; k < 3; k++) { const yy = y + (1 - k) * 9 * s; L(arcPts(x, yy, 18 * s, 6 * s, 0, TAU, 18), w, true); }
      L([[x - 18 * s, y - 9 * s], [x - 18 * s, y + 9 * s]], w); L([[x + 18 * s, y - 9 * s], [x + 18 * s, y + 9 * s]], w); break;
    case 'chart':
      L([[x - 18 * s, y - 16 * s], [x - 18 * s, y + 16 * s], [x + 20 * s, y + 16 * s]]);
      L([[x - 12 * s, y + 8 * s], [x - 2 * s, y - 2 * s], [x + 6 * s, y + 4 * s], [x + 18 * s, y - 12 * s]], w * 1.1);
      L([[x + 10 * s, y - 12 * s], [x + 18 * s, y - 12 * s], [x + 18 * s, y - 4 * s]]); break;
    case 'house':
      L([[x - 20 * s, y - 2 * s], [x, y - 18 * s], [x + 20 * s, y - 2 * s]]);
      L([[x - 14 * s, y - 4 * s], [x - 14 * s, y + 16 * s], [x + 14 * s, y + 16 * s], [x + 14 * s, y - 4 * s]]);
      L([[x - 4 * s, y + 16 * s], [x - 4 * s, y + 6 * s], [x + 4 * s, y + 6 * s], [x + 4 * s, y + 16 * s]], w * 0.8); break;
    case 'shield':
      L([[x - 16 * s, y - 16 * s], [x + 16 * s, y - 16 * s], [x + 16 * s, y + 2 * s], [x, y + 18 * s], [x - 16 * s, y + 2 * s]], w, true);
      L([[x - 7 * s, y - 1 * s], [x - 2 * s, y + 5 * s], [x + 8 * s, y - 8 * s]], w * 0.9); break;
    case 'card':
      L([[x - 20 * s, y - 12 * s], [x + 20 * s, y - 12 * s], [x + 20 * s, y + 12 * s], [x - 20 * s, y + 12 * s]], w, true);
      L([[x - 20 * s, y - 5 * s], [x + 20 * s, y - 5 * s]], w * 1.8); L([[x - 14 * s, y + 6 * s], [x - 4 * s, y + 6 * s]], w * 0.8); break;
    case 'clock':
      L(arcPts(x, y, 17 * s, 17 * s, 0, TAU, 22), w, true); L([[x, y], [x, y - 11 * s]], w); L([[x, y], [x + 8 * s, y + 4 * s]], w); break;
    case 'umbrella':
      L(arcPts(x, y - 2 * s, 20 * s, 16 * s, Math.PI, TAU, 14), w); L([[x - 20 * s, y - 2 * s], [x + 20 * s, y - 2 * s]], w);
      L([[x, y - 2 * s], [x, y + 16 * s]], w); L(arcPts(x - 5 * s, y + 16 * s, 5 * s, 4 * s, 0, Math.PI, 8), w); break;
    case 'bag':

// auto-fit handwriting: shrink the font until the widest line fits maxW
const PM = 'Permanent Marker', KA = 'Kalam', CA = 'Caveat';
function fit(c, lines, wt, fam, size, maxW) {
  c.save(); let s = size;
  for (;;) { c.font = wt + ' ' + s + 'px "' + fam + '"'; let w = 0; for (const l of lines) w = Math.max(w, c.measureText(l).width); if (w <= maxW || s <= 26) break; s -= 2; }
  c.restore(); return wt + ' ' + s + 'px "' + fam + '"';
}
const hf = (c, lines, x, y, wt, fam, size, maxW, color, seed, lh) => hand(c, lines, x, y, fit(c, lines, wt, fam, size, maxW), color, seed, lh);

// ===================== TIMELINE =====================
// The picture is authored on a base clock (0 to 25 s) in 8 segments that each end with the camera at rest. Each segment
// plays at normal speed, then holds its last frame until its narration line has finished. Real time T maps to base time t.
const SEG = [[0, 1.9], [1.9, 5.8], [5.8, 7.8], [7.8, 11.9], [11.9, 15.2], [15.2, 18.9], [18.9, 21.8], [21.8, 25]];
const VOICE_OFF = 0.35, VOICE_TAIL = 0.5, END_HOLD = 0.8;
let TL = null;
function buildTL(v) {
  const E = [], R = [], starts = []; let t = 0;
  for (let i = 0; i < 8; i++) {
    const d = SEG[i][1] - SEG[i][0], r = v && v[i] > 0 ? Math.max(d, VOICE_OFF + v[i] + VOICE_TAIL) : d;
    E.push(t); R.push(r); starts.push(t + VOICE_OFF); t += r;
  }
  return { E, R, starts, total: t + (v ? END_HOLD : 0) };
}
function baseOf(T) { // real time -> base time
  let i = 7; for (let k = 0; k < 8; k++) if (T < TL.E[k] + TL.R[k]) { i = k; break; }
  const d = SEG[i][1] - SEG[i][0];
  return SEG[i][0] + Math.min(Math.max(0, T - TL.E[i]), d);
}
function realOf(t) { // base time -> real time (for the sound score)
  let i = 7; for (let k = 0; k < 8; k++) if (t < SEG[k][1]) { i = k; break; }
  return TL.E[i] + (t - SEG[i][0]);
}
let TOPIC = TOPICS[0];
TL = buildTL(null);
function loadTopic(id) {
  TOPIC = TOPICS.find((x) => x.id === id) || TOPICS[0]; TL = buildTL(null);
  return { id: TOPIC.id, title: TOPIC.hook.join(' '), vo: TOPIC.vo, caption: TOPIC.caption, tags: TOPIC.tags };
}
function setVoiceDurations(v) { TL = buildTL(v); return { starts: TL.starts, total: TL.total }; }

// ===================== CAMERA =====================
const K = [[0, 560, 260, 1.25], [1.9, 560, 260, 1.25], [2.8, 1560, 600, 1.0], [7.8, 1560, 600, 1.0], [8.7, 2450, 620, 1.0], [11.9, 2450, 620, 1.0],
  [12.8, 2560, 1200, 1.0], [15.2, 2560, 1200, 1.0], [16.0, 1500, 1200, 1.0], [18.9, 1500, 1200, 1.0], [19.8, 640, 1060, 1.0], [21.8, 640, 1060, 1.0],
  [22.7, 900, 1086, 0.7], [99, 900, 1086, 0.7]];
function cam(t, W, H_) {
  let ki = 0; while (ki < K.length - 2 && t > K[ki + 1][0]) ki++;
  const [ta, ax, ay, az] = K[ki], [tb, bx, by, bz] = K[ki + 1], e = H.ease.inOut(H.clamp((t - ta) / (tb - ta)));
  const z = Math.exp(H.lerp(Math.log(az), Math.log(bz), e)), hw = W / 2 / z, hh = H_ / 2 / z;
  return { z, cx: H.clamp(H.lerp(ax, bx, e), hw, XW - hw), cy: H.clamp(H.lerp(ay, by, e), hh, XH - hh) };
}

// ===================== THE EXPLAINER =====================
function explainer(ctx, W, H_, T) {
  const t = baseOf(T), gt = T, P = TOPIC;
  const pat = grainPattern(ctx, 3);
  const YEL = '#fbe36a', PNK = '#ff8db5', ORG = '#ffb04f', GRN = '#b6e27a', BLU = '#86d0f2', GREEN = '#1d7a33';
  const cm = cam(t, W, H_), z = cm.z;
  const cx = cm.cx + Math.sin(gt * 0.9) * 3, cy = cm.cy + Math.cos(gt * 0.7) * 2; // tiny sway keeps held frames alive
  ctx.save(); ctx.translate(W / 2, H_ / 2); ctx.scale(z, z); ctx.translate(-cx, -cy);
  ctx.drawImage(bigCork(), 0, 0);

  const slap = (t0) => { const a = H.clamp((t - t0) / 0.3); return a <= 0 ? 0 : 1 + 0.32 * (1 - H.ease.back(a)); };
  const put = (n, t0) => { const s = slap(t0); if (!s) return false; n.air = s - 1; ctx.save(); ctx.translate(n.x, n.y); ctx.scale(s, s); ctx.translate(-n.x, -n.y); note(ctx, n, pat); ctx.restore(); return true; };
  const pin = (x, y, col, t0) => { const k = (t - t0) / 0.14; if (k < 0) return; pinShadow(ctx, x, y); const sc = 1 + 0.9 * Math.pow(1 - H.clamp(k), 2); ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.translate(-x, -y); pinHead(ctx, x, y, col); ctx.restore(); };
  const icard = (t0, x, y, w, h, rot, fn) => {
    const s = slap(t0); if (!s) return false;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    ctx.save(); ctx.filter = `blur(${7 + (s - 1) * 40}px)`; ctx.fillStyle = 'rgba(40,20,5,0.4)'; ctx.fillRect(-w / 2 + 6 + (s - 1) * 60, -h / 2 + 10 + (s - 1) * 80, w, h); ctx.restore();
    ctx.fillStyle = '#fbfaf3'; ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.12; ctx.fillStyle = pat; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.restore();
    ctx.fillStyle = 'rgba(220,60,70,0.7)'; ctx.fillRect(-w / 2, -h / 2 + h * 0.17, w, 1.6);
    ctx.fillStyle = 'rgba(80,140,210,0.5)'; for (let k = 0; k < 12; k++) { const yy = -h / 2 + h * 0.27 + k * 24; if (yy < h / 2) ctx.fillRect(-w / 2, yy, w, 1); }
    fn(ctx); ctx.restore(); return true;
  };

  // ===== red yarn trail: leads the camera from region to region (each starts when its segment's camera move starts) =====
  yarn(ctx, [560, 110], [1140, 409], 60, H.clamp((t - 1.9) / 0.9), H.rng(61));
  yarn(ctx, [1980, 409], [2100, 364], 20, H.clamp((t - 5.2) / 0.4), H.rng(62));
  yarn(ctx, [2800, 364], [2560, 999], 90, H.clamp((t - 11.9) / 0.8), H.rng(63));
  yarn(ctx, [2155, 1209], [1900, 1119], 30, H.clamp((t - 15.3) / 0.6), H.rng(64));
  yarn(ctx, [1100, 1119], [620, 844], 50, H.clamp((t - 18.9) / 0.7), H.rng(65));
  yarn(ctx, [250, 844], [560, 1194], 50, H.clamp((t - 21.8) / 0.6), H.rng(66));

  // ===== BEAT 1 (0-1.9): hook card =====
  icard(0.1, 560, 260, 560, 300, -0.03, (c) => {
    wr(c, (t - 0.35) / 0.55, -280, -150, 560, 150, () => hf(c, [P.hook[0]], 0, -60, '400', PM, 54, 510, INK, 41, 54));
    wr(c, (t - 0.85) / 0.45, -280, -10, 560, 120, () => hf(c, [P.hook[1]], 0, 30, '400', PM, 62, 510, INK, 42, 54));
    if (t > 1.3) arrowM(c, qpts([-200, 92], [0, 104], [200, 86]), (t - 1.3) / 0.3, RED, 5, H.rng(43));
  });
  if (t > 0.4) { tape(ctx, 300, 120, 90, 30, -0.6, 31); tape(ctx, 820, 104, 90, 30, 0.55, 32); }
  pin(560, 110, '#d22b2b', 1.55);

  // ===== BEAT 2 (1.9-5.8): chain of three notes =====
  const CH = P.chain, XS = [1140, 1560, 1980], ROT = [-0.04, 0.03, -0.03], CCOL = [YEL, BLU, PNK], CT0 = [2.5, 3.9, 4.9];
  const CPIN = ['#d22b2b', '#2a62c9', '#f0c419'], CNUM = [INK, INK, RED];
  CH.notes.forEach((n, i) => {
    const t0 = CT0[i], seed = 201 + i * 10;
    put({ x: XS[i], y: 520, w: 250, h: 250, rot: ROT[i], col: CCOL[i], seed, lift: 0.8, pin: [0, 0, CPIN[i]], draw(c) {

      icon(c, n.icon || 'coin', 0, -22, 2.2, INK, H.rng(seed + 2));
      wr(c, (t - t0 - 0.3) / 0.3, -125, 20, 250, 100, () => hf(c, [n.big], 0, 66, '400', PM, 70, 215, CNUM[i], seed + 3, 60));
    } }, t0);
    pin(XS[i], 409, CPIN[i], t0 + 0.3);
  });
  { const R = H.rng(230);
    [[3.4, 1350, 1285, 1415], [4.4, 1770, 1705, 1835]].forEach(([ta, lx, x0, x1], i) => {
      arrowM(ctx, qpts([x0, 520], [(x0 + x1) / 2, 492], [x1, 520], 12), (t - ta) / 0.4, RED, 6, R);
      const lb = CH.arrows[i];
      if (lb) wr(ctx, (t - ta - 0.15) / 0.3, lx - 80, 400, 160, 70, () => hf(ctx, [lb], lx, 440, '700', CA, 46, 140, BLUE, 231 + i, 30));
    }); }

  // ===== BEAT 3 (5.8-7.8): the name for it =====
  put({ x: 1560, y: 830, w: 520, h: 190, rot: -0.02, col: ORG, seed: 301, lift: 0.8, pin: [0, 0, '#d22b2b'], draw(c) {
    wr(c, (t - 6.1) / 0.5, -260, -95, 520, 100, () => hf(c, [P.name.word], 0, -22, '400', PM, 64, 480, INK, 302, 56));
    wr(c, (t - 6.6) / 0.5, -260, 14, 520, 70, () => hf(c, [P.name.sub], 0, 46, '700', CA, 40, 480, BLUE, 303, 26));
    if (t > 7.2) mline(c, [[-190, 74], [-60, 68], [60, 74], [190, 66]], 5, RED, H.rng(304));
  } }, 6.0);
  pin(1560, 749, '#d22b2b', 6.3);
  arrowM(ctx, qpts([1790, 735], [1900, 735], [1950, 655], 14), (t - 6.9) / 0.35, RED, 6, H.rng(305));

  // ===== BEAT 4 (7.8-11.9): compare two notes, then the key number =====
  const CM = P.cmp, KCOL = CM.good ? GREEN : RED;

      wr(c, (t - t0 - 0.9) / 0.3, -150, 0, 300, 170, () => { hf(c, [n.big], 0, n.sub ? 46 : 70, '400', PM, 80, 270, bigCol, seed + 3, 70); if (n.sub) hf(c, [n.sub], 0, 122, '700', CA, 46, 270, BLUE, seed + 4, 30); });

  cmpNote(2100, -0.03, YEL, 401, 8.6, CM.a, INK, '#2a62c9'); pin(2100, 364, '#2a62c9', 8.9);
  arrowM(ctx, qpts([2265, 520], [2450, 490], [2635, 520], 16), (t - 9.6) / 0.4, RED, 7, H.rng(410));
  wr(ctx, (t - 9.7) / 0.3, 2370, 410, 180, 70, () => hf(ctx, [CM.mid], 2450, 440, '700', CA, 50, 170, BLUE, 411, 30));
  cmpNote(2800, 0.03, BLU, 421, 9.9, CM.b, KCOL, '#f0c419'); pin(2800, 364, '#f0c419', 10.2);
  icard(11.0, 2450, 860, 600, 190, 0.02, (c) => {
    wr(c, (t - 11.1) / 0.3, -300, -95, 600, 120, () => hf(c, [CM.key.big], 0, -14, '400', PM, 110, 540, KCOL, 431, 100));
    wr(c, (t - 11.35) / 0.3, -300, 40, 600, 60, () => hf(c, [CM.key.sub], 0, 64, '700', CA, 42, 540, BLUE, 432, 30));
    if (t > 11.4) mline(c, arcPts(0, -12, 230, 70, -0.4, -0.4 + TAU * 1.06 * H.clamp((t - 11.4) / 0.35), 30), 5, RED, H.rng(433));
  });

  // ===== BEAT 5 (11.9-15.2): list of three =====
  const LS = P.list;
  icard(12.6, 2560, 1060, 520, 150, -0.02, (c) => { wr(c, (t - 12.75) / 0.5, -260, -60, 520, 120, () => hf(c, [LS.head], 0, 4, '400', PM, 46, 480, INK, 501, 40)); });
  pin(2560, 999, '#d22b2b', 12.9);
  const LX = [2250, 2600, 2950], LR = [-0.03, 0.03, -0.02], LC = [YEL, PNK, GRN], LT = [13.2, 13.6, 14.0], LP = ['#d22b2b', '#2a62c9', '#f0c419'];
  LS.items.forEach((it, i) => {
    const t0 = LT[i], seed = 511 + i * 10;
    put({ x: LX[i], y: 1330, w: 270, h: 270, rot: LR[i], col: LC[i], seed, lift: 0.8, pin: [0, 0, LP[i]], draw(c) {
      wr(c, (t - t0 - 0.1) / 0.3, -135, -135, 270, 60, () => hf(c, [it.t], 0, -76, '400', PM, 38, 240, INK, seed + 1, 30));
      wr(c, (t - t0 - 0.35) / 0.3, -135, -40, 270, 90, () => hf(c, it.l, 0, -6, '700', KA, 32, 240, BLUE, seed + 2, 36));
      if (t > t0 + 0.6) icon(c, it.icon || 'up', 0, 82, 1.0, RED, H.rng(seed + 3));
    } }, t0);
    pin(LX[i] - 95, 1209, LP[i], t0 + 0.3);
  });
  { const R = H.rng(540);
    arrowM(ctx, qpts([2440, 1140], [2330, 1150], [2262, 1188], 12), (t - 13.0) / 0.3, RED, 6, R);
    arrowM(ctx, qpts([2560, 1140], [2575, 1160], [2595, 1188], 12), (t - 13.4) / 0.3, RED, 6, R);
    arrowM(ctx, qpts([2680, 1140], [2790, 1150], [2940, 1188], 12), (t - 13.8) / 0.3, RED, 6, R); }

  // ===== BEAT 6 (15.2-18.9): equation  a op b = c =====
  const EQ = P.eq, ECOL = EQ.bad ? RED : GREEN;
  icard(16.1, 1500, 1000, 560, 110, 0.015, (c) => { wr(c, (t - 16.2) / 0.5, -280, -50, 560, 100, () => hf(c, [EQ.head], 0, 4, '400', PM, 46, 520, INK, 601, 40)); });
  const eqNote = (x, rot, col, seed, t0, n, vt, vcol, pinCol, extra) => {
    put({ x, y: 1230, w: 250, h: 250, rot, col, seed, lift: 0.8, pin: [0, 0, pinCol], draw(c) {
      hf(c, [n.t], 0, -80, '400', PM, 34, 225, INK, seed + 1, 30);
      wr(c, (t - vt) / 0.3, -125, -35, 250, 120, () => hf(c, [n.v], 0, 12, '400', PM, 92, 220, vcol, seed + 2, 80));
      if (extra) extra(c);
    } }, t0);
    pin(x, 1119, pinCol, t0 + 0.3);
  };
  const opShape = (op, ox, oy, seed) => {
    const R = H.rng(seed), L = (a, b) => mline(ctx, [a, b], 9, INK, R);
    if (op === '-') L([ox - 32, oy], [ox + 32, oy - 2]);
    else if (op === '+') { L([ox - 32, oy], [ox + 32, oy - 2]); L([ox, oy - 32], [ox + 2, oy + 32]); }
    else if (op === 'x') { L([ox - 24, oy - 24], [ox + 24, oy + 24]); L([ox + 24, oy - 24], [ox - 24, oy + 24]); }
    else if (op === '/') { L([ox - 32, oy], [ox + 32, oy - 2]); ctx.fillStyle = INK; [[ox, oy - 28], [ox, oy + 28]].forEach(([px, py]) => { ctx.beginPath(); ctx.arc(px, py, 7, 0, TAU); ctx.fill(); }); }
    else { L([ox - 32, oy - 16], [ox + 32, oy - 18]); L([ox - 32, oy + 18], [ox + 32, oy + 16]); }
  };
  eqNote(1100, -0.03, YEL, 611, 16.5, EQ.a, 16.7, INK, '#2a62c9');
  wr(ctx, (t - 17.0) / 0.2, 1250, 1180, 100, 100, () => opShape(EQ.op, 1300, 1230, 621));
  eqNote(1500, 0.03, BLU, 631, 17.1, EQ.b, 17.4, INK, '#d22b2b');
  wr(ctx, (t - 17.7) / 0.2, 1650, 1180, 100, 100, () => opShape('=', 1700, 1230, 641));
  eqNote(1900, -0.02, PNK, 651, 18.0, EQ.c, 18.25, ECOL, '#f2f2ee', (c) => {
    if (EQ.c.s) wr(c, (t - 18.5) / 0.25, -125, 70, 250, 60, () => hf(c, [EQ.c.s], 0, 96, '700', CA, 40, 220, BLUE, 654, 30));
    if (t > 18.45) mline(c, arcPts(0, 8, 112, 54, -0.4, -0.4 + TAU * 1.06 * H.clamp((t - 18.45) / 0.3), 30), 5, RED, H.rng(655));
  });

  // ===== BEAT 7 (18.9-21.8): the fix =====
  const FX = P.fix;
  icard(19.7, 435, 770, 440, 110, -0.02, (c) => { wr(c, (t - 19.8) / 0.4, -220, -50, 440, 100, () => hf(c, [FX.head], 0, 4, '400', PM, 56, 400, INK, 701, 40)); });
  const fixNote = (x, rot, col, seed, t0, n, pinCol, ct) => {
    put({ x, y: 960, w: 260, h: 260, rot, col, seed, lift: 0.8, pin: [0, 0, pinCol], draw(c) {
      wr(c, (t - t0 - 0.1) / 0.3, -130, -130, 260, 60, () => hf(c, [n.t], 0, -82, '400', PM, 36, 230, INK, seed + 1, 30));
      wr(c, (t - t0 - 0.4) / 0.4, -130, -40, 260, 100, () => hf(c, n.l, 0, 4, '700', KA, 32, 230, BLUE, seed + 2, 38));
      if (t > ct) check(c, 70, 92, 1, GREEN, H.rng(seed + 3));
    } }, t0);
    pin(x, 844, pinCol, t0 + 0.3);
  };
  fixNote(250, -0.04, GRN, 711, 20.0, FX.a, '#3fae4a', 21.2);
  fixNote(620, 0.03, ORG, 721, 20.5, FX.b, '#d22b2b', 21.5);
  arrowM(ctx, qpts([395, 975], [435, 950], [480, 975], 10), (t - 20.7) / 0.3, RED, 5, H.rng(730));

  // ===== BEAT 8 (21.8-25): takeaway =====
  put({ x: 560, y: 1330, w: 820, h: 300, rot: -0.02, col: ORG, seed: 801, lift: 0.7, pin: [0, 0, '#d22b2b'], draw(c) {
    wr(c, (t - 23.0) / 0.4, -410, -150, 820, 120, () => hf(c, [P.end[0]], 0, -50, '400', PM, 84, 760, INK, 802, 70));
    wr(c, (t - 23.35) / 0.4, -410, 0, 820, 130, () => hf(c, [P.end[1]], 0, 52, '400', PM, 84, 760, INK, 803, 70));
    if (t > 23.8) mline(c, [[-250, 112], [-80, 106], [100, 112], [260, 104]], 6, RED, H.rng(804));
  } }, 22.9);
  pin(560, 1194, '#d22b2b', 23.15);

  ctx.restore();
  // lamp + vignette + grain (screen space), same strength as the reference
  { const g = ctx.createRadialGradient(330, 120, 50, 400, 200, 1100); g.addColorStop(0, 'rgba(255,240,210,0.18)'); g.addColorStop(0.5, 'rgba(255,240,210,0)'); g.addColorStop(1, 'rgba(40,20,0,0.3)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H_); }
  H.vignette(ctx, W, H_, 0.35, '30,15,0');
  H.grain(ctx, W, H_, 0.04, 8 + Math.floor(gt * 12));
}

// ===================== SOUND SCORE =====================
// Authored on the base clock; every start time is mapped to real time (realOf) so sounds follow the holds. A note slapped
// at t0 first hits the board at t0 + 0.11; a pin at t0 seats at t0 + 0.14. Pans follow the same camera as the picture.
function scoreSound(k) {
  const P = TOPIC;
  { const k0 = k, sn = (t) => (Math.round(realOf(t) * 48000) + 0.25) / 48000; k = { ...k0, play: (n, t, o) => k0.play(n, sn(t), o), tone: (t, o) => k0.tone(sn(t), o), noise: (t, o) => k0.noise(sn(t), o) }; }
  const W = 1280, LAND = 0.11, SEAT = 0.14;
  const pan = (x, t) => { const c = cam(t, 1280, 720); return H.clamp((x - c.cx) * c.z / (W / 2), -1, 1) * 0.6; };
  const slapN = (t0, x, size = 0, g = 1, minor = false) => {
    const t = t0 + LAND, p = pan(x, t);
    k.play('slap', t, { gain: (0.3 + 0.2 * size) * g, pan: p, minor });
    k.noise(t, { dur: 0.08, color: 'pink', filter: 'lowpass', f: 450 + 250 * size, gain: (0.25 + 0.2 * size) * g, a: 0.002, pan: p, minor });
    k.tone(t, { f: [[0, 150 - 40 * size], [0.07, 65]], dur: 0.1, gain: (0.1 + 0.12 * size) * g, pan: p, minor });
  };
  const pinIn = (t0, x, g = 1, minor = true) => {
    const t = t0 + SEAT, p = pan(x, t);
    k.noise(t, { dur: 0.035, filter: 'bandpass', f: 1300, q: 1.6, gain: 0.3 * g, a: 0.001, pan: p, minor });
    k.tone(t, { f: [[0, 260], [0.05, 140]], dur: 0.07, gain: 0.16 * g, pan: p, minor });
  };
  const mk = (a, b, x, g = 1, minor = true) => { const p = pan(x, a); k.noise(a, { dur: 0.02, filter: 'bandpass', f: 1500, q: 1.4, gain: 0.18 * g, a: 0.001, pan: p, minor }); k.play('stroke', a, { material: 'marker', dur: b - a, gain: g, pan: p, minor }); };
  const write = (s, a, d, x, g = 0.85, minor = true) => { const n = s.length, re = /\S+/g; let m; while ((m = re.exec(s))) mk(a + d * m.index / n, a + d * (m.index + m[0].length) / n, x, g, minor); };
  const yarnPull = (a, d, x0, x1) => {
    k.noise(a, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 500], [d, 900]], q: 0.9, gain: 0.08, a: d * 0.3, hold: d * 0.4, pan: (pan(x0, a) + pan(x1, a + d)) / 2, minor: true });
    k.tone(a + d, { f: 'A2', type: 'triangle', dur: 0.35, gain: 0.12, a: 0.003, pan: pan(x1, a + d) });
    k.tone(a + d, { f: 'A3', dur: 0.2, gain: 0.03, a: 0.003, pan: pan(x1, a + d) });
  };
  const tickRun = (a, x, n) => { for (let i = 0; i < n; i++) k.play('count', a + 0.45 * (1 - Math.pow(1 - i / n, 1.6)), { gain: 0.7, pan: pan(x, a), minor: true }); };

  // the one long sound: a quiet room bed (real time). Voiceover mode drops beds automatically.
  k.bed('room', Math.min(window.SOUND_FROM || 0, TL.total - 0.5), TL.total, { gain: 0.45 });

  // ---- BEAT 1: hook card
  slapN(0.1, 560, 1, 0.9);
  k.play('tape', 0.4, { dur: 0.12, gain: 0.5, pan: pan(300, 0.4), minor: true }); k.play('tape', 0.47, { dur: 0.1, gain: 0.45, pan: pan(820, 0.47), minor: true });
  write(P.hook[0], 0.35, 0.55, 560, 0.95); write(P.hook[1], 0.85, 0.45, 560, 1.0, false);
  mk(1.3, 1.6, 560, 1.1, false); pinIn(1.55, 560, 1.1, false);
  yarnPull(1.9, 0.9, 560, 1140);

  // ---- BEAT 2: chain
  [[2.5, 1140, 0.5], [3.9, 1560, 0.5], [4.9, 1980, 0.8]].forEach(([t0, x, sz], i) => {
    slapN(t0, x, sz, 1); pinIn(t0 + 0.3, x); write(P.chain.notes[i].big, t0 + 0.3, 0.3, x, 0.95, false);
  });
  [[3.4, 3.8, 1350], [4.4, 4.8, 1770]].forEach(([a, b, x], i) => { mk(a, b, x, 0.9); if (P.chain.arrows[i]) write(P.chain.arrows[i], a + 0.15, 0.3, x, 0.7); });
  k.play('tock', 5.62, { f: 300, gain: 0.4, pan: pan(1980, 5.62) });
  yarnPull(5.2, 0.4, 1980, 2100);

  // ---- BEAT 3: the name
  slapN(6.0, 1560, 0.8, 1); pinIn(6.3, 1560);
  write(P.name.word, 6.1, 0.5, 1560, 1.1, false); write(P.name.sub, 6.6, 0.5, 1560, 0.8);
  mk(6.9, 7.25, 1850, 0.9); mk(7.2, 7.35, 1560, 0.9);
  k.play('ding', 7.4, { f: 'E5', gain: 0.3, pan: pan(1560, 7.4) });

  // ---- BEAT 4: compare, then the big hit on the key number
  const CM = P.cmp;
  slapN(8.6, 2100, 0.7, 1); pinIn(8.9, 2100);
  write(CM.a.title, 8.75, 0.3, 2100, 0.8); tickRun(9.0, 2100, 5); write(CM.a.big, 9.0 + 0.9, 0.3, 2100, 0.8);
  mk(9.6, 10.0, 2450, 1.0); write(CM.mid, 9.7, 0.3, 2450, 0.7);
  slapN(9.9, 2800, 0.7, 1); pinIn(10.2, 2800);
  write(CM.b.title, 10.05, 0.3, 2800, 0.8); tickRun(10.3, 2800, 4); write(CM.b.big, 10.8, 0.3, 2800, 0.8);
  slapN(11.0, 2450, 1, 1.2);
  k.play('impact', 11.11, { gain: 1.35, pan: pan(2450, 11.11) });
  write(CM.key.big, 11.1, 0.3, 2450, 1.4, false); write(CM.key.sub, 11.35, 0.3, 2450, 0.7);
  mk(11.4, 11.75, 2450, 1.2, false);
  if (CM.good) k.play('success', 11.5, { f: 'G5', gain: 0.35, pan: pan(2450, 11.5) }); else k.play('error', 11.5, { f: 'A3', gain: 0.35, pan: pan(2450, 11.5) });

  // ---- BEAT 5: list of three
  yarnPull(11.9, 0.8, 2800, 2560);
  slapN(12.6, 2560, 0.8, 1); pinIn(12.9, 2560);
  write(P.list.head, 12.75, 0.5, 2560, 0.9);
  mk(13.0, 13.3, 2350, 0.8); mk(13.4, 13.7, 2575, 0.8); mk(13.8, 14.1, 2800, 0.8);
  [[13.2, 2250], [13.6, 2600], [14.0, 2950]].forEach(([t0, x], i) => {
    const it = P.list.items[i];
    slapN(t0, x, 0.5, 1); pinIn(t0 + 0.3, x - 95);
    write(it.t, t0 + 0.1, 0.3, x, 0.8); write(it.l.join(' '), t0 + 0.35, 0.3, x, 0.65);
    mk(t0 + 0.6, t0 + 0.7, x, 0.7);
  });

  // ---- BEAT 6: equation
  const EQ = P.eq;
  yarnPull(15.3, 0.6, 2155, 1900);
  slapN(16.1, 1500, 0.8, 1); write(EQ.head, 16.2, 0.5, 1500, 0.9);
  slapN(16.5, 1100, 0.5, 1); pinIn(16.8, 1100); write(EQ.a.v, 16.7, 0.3, 1100, 1.0);
  mk(17.0, 17.2, 1300, 0.9);
  slapN(17.1, 1500, 0.5, 1); pinIn(17.4, 1500); write(EQ.b.v, 17.4, 0.3, 1500, 1.0);
  mk(17.7, 17.9, 1700, 0.9);
  slapN(18.0, 1900, 0.7, 1.1); pinIn(18.3, 1900);
  write(EQ.c.v, 18.25, 0.25, 1900, 1.3, false);
  if (EQ.bad) k.play('error', 18.3, { f: 'F3', gain: 0.55, pan: pan(1900, 18.3) }); else k.play('success', 18.3, { f: 'E5', gain: 0.45, pan: pan(1900, 18.3) });
  if (EQ.c.s) write(EQ.c.s, 18.5, 0.25, 1900, 0.8);
  mk(18.45, 18.75, 1900, 1.2, false);

  // ---- BEAT 7: the fix, two checks
  const FX = P.fix;
  yarnPull(18.9, 0.7, 1100, 620);
  slapN(19.7, 435, 0.6, 1); write(FX.head, 19.8, 0.4, 435, 0.9);
  slapN(20.0, 250, 0.5, 1); pinIn(20.3, 250); write(FX.a.t, 20.1, 0.3, 250, 0.8); write(FX.a.l.join(' '), 20.4, 0.4, 250, 0.7);
  slapN(20.5, 620, 0.5, 1); pinIn(20.8, 620); write(FX.b.t, 20.6, 0.3, 620, 0.8); write(FX.b.l.join(' '), 20.9, 0.4, 620, 0.7);
  mk(20.7, 21.0, 435, 0.8);
  mk(21.2, 21.35, 250, 1.0, false); k.play('success', 21.35, { f: 'G5', gain: 0.4, pan: pan(250, 21.35) });
  mk(21.5, 21.65, 620, 1.0, false); k.play('success', 21.65, { f: 'C6', gain: 0.5, pan: pan(620, 21.65) });

  // ---- BEAT 8: camera pulls back, takeaway lands, resolving chord
  yarnPull(21.8, 0.6, 250, 560);
  k.play('whoosh', 21.85, { dur: 0.8, gain: 0.35 });
  slapN(22.9, 560, 1, 1.15); pinIn(23.15, 560, 1.2, false);
  write(P.end[0], 23.0, 0.4, 560, 1.2, false); write(P.end[1], 23.35, 0.4, 560, 1.2, false);
  mk(23.8, 23.95, 560, 1.1, false);
  ['C5', 'E5', 'G5'].forEach((f, i) => k.play('ding', 23.85 + i * 0.08, { f, gain: 0.38 - i * 0.06, pan: (i - 1) * 0.25 }));
}

// ===================== exports for the automated render (Selenium) =====================
window.TOPIC_IDS = TOPICS.map((x) => x.id);
window.loadTopic = loadTopic;
window.setVoiceDurations = setVoiceDurations;
window.scoreSound = scoreSound;
Object.defineProperty(window, 'DURATION', { get: () => TL.total });

// ===================== PLAYER =====================
(async function () {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d', { willReadFrequently: true });
  const playBtn = document.getElementById('play'), seekEl = document.getElementById('seek'), timeEl = document.getElementById('time');
  const sndBtn = document.getElementById('snd'), loopBtn = document.getElementById('loop'), loading = document.getElementById('loading'), topicEl = document.getElementById('topic');
  let cur = 0, playing = false, tPrev = 0, loop = true, soundOn = true, stopSound = () => {};
  const mmss = (t) => Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0');
  TOPICS.forEach((x) => { const o = document.createElement('option'); o.value = x.id; o.textContent = x.id; topicEl.appendChild(o); });
  const wanted = new URLSearchParams(location.search).get('topic'); if (wanted) { loadTopic(wanted); topicEl.value = TOPIC.id; }

  const specs = ['400 30px "Permanent Marker"', '700 28px "Kalam"', '700 30px "Caveat"', '400 22px "Gloria Hallelujah"', '400 22px "Rock Salt"'];
  try { await Promise.all(specs.map((f) => document.fonts.load(f, 'AaZz09$%+-~'))); await document.fonts.ready; } catch (e) {}
  await new Promise((r) => setTimeout(r, 30));
  bigCork();

  function draw(T) {
    seekEl.max = TL.total; explainer(ctx, 1280, 720, T);
    seekEl.value = T; timeEl.textContent = mmss(T) + ' / ' + mmss(TL.total);
  }
  window.seek = (T) => { cur = H.clamp(T, 0, TL.total); draw(cur); };

  function startSound() {
    stopSound(); stopSound = () => {};
    window.SOUND_FROM = cur;
    if (soundOn && playing) stopSound = SOUND.live(scoreSound, cur, { voiceover: false });
  }
  function pause() { playing = false; stopSound(); stopSound = () => {}; playBtn.textContent = 'Play'; playBtn.setAttribute('aria-label', 'Play'); }
  function play() {
    if (cur >= TL.total - 0.01) cur = 0;
    playing = true; tPrev = performance.now(); playBtn.textContent = 'Pause'; playBtn.setAttribute('aria-label', 'Pause');
    startSound(); requestAnimationFrame(tick);
  }
  function tick(now) {
    if (!playing) return;
    cur += (now - tPrev) / 1000; tPrev = now;
    if (cur >= TL.total) {
      if (loop) { cur = cur % TL.total; startSound(); }
      else { cur = TL.total; draw(cur); pause(); return; }
    }
    draw(cur);
    requestAnimationFrame(tick);
  }

  playBtn.onclick = () => (playing ? pause() : play());
  cv.onclick = () => (playing ? pause() : play());
  seekEl.oninput = () => { cur = parseFloat(seekEl.value); draw(cur); if (playing) { tPrev = performance.now(); startSound(); } };
  topicEl.onchange = () => { const was = playing; pause(); loadTopic(topicEl.value); cur = 0; draw(0); if (was) play(); };
  sndBtn.onclick = () => { soundOn = !soundOn; sndBtn.setAttribute('aria-pressed', soundOn); if (!soundOn) { stopSound(); stopSound = () => {}; } else if (playing) startSound(); };
  loopBtn.onclick = () => { loop = !loop; loopBtn.setAttribute('aria-pressed', loop); };
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playing ? pause() : play(); } });

  // ---- hooks used by the Selenium render ----
  window.frameJPEG = (T) => { window.seek(T); return cv.toDataURL('image/jpeg', 0.93).split(',')[1]; };
  window.renderAudioBase64 = async (vo) => { // 48 kHz stereo, 16-bit little-endian, base64
    window.SOUND_FROM = 0;
    const r = await SOUND.renderOffline(scoreSound, TL.total, 48000, { voiceover: !!vo });
    const n = r.inter.length, i16 = new Int16Array(n);
    for (let i = 0; i < n; i++) i16[i] = Math.max(-1, Math.min(1, r.inter[i])) * 32767;
    const u8 = new Uint8Array(i16.buffer); let s = ''; const CH = 0x8000;
    for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
    return btoa(s);
  };

  draw(0);
  window._ready = true;
  loading.style.display = 'none';
})();
</script>
