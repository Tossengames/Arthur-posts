    bell: (t) => { const f = noteHz('A3'); tone(t, f, 3.2, { g: 0.16, vb: 0.6 }); tone(t, f * 2.4, 1.4, { g: 0.05, vb: 0.4 }); },
    wind: (t, d) => noise(t, d || 3, { f: [400, 900], q: 0.4, g: 0.07, swell: true }),
    waves: (t, d) => { for (let k = 0; k < (d || 4) / 2; k++) noise(t + k * 2, 2.4, { f: [500, 1400], q: 0.5, g: 0.09, swell: true }); },
    rumble: (t) => noise(t, 2.6, { f: 160, type: 'lowpass', g: 0.22, swell: true }),
    steps: (t) => { for (let k = 0; k < 8; k++) noise(t + k * 0.27, 0.05, { f: 1100, type: 'lowpass', g: 0.1, pan: (k % 2) * 0.3 }); },
    crowd: (t, d) => noise(t, d || 3, { f: [500, 800], q: 0.6, g: 0.06, swell: true }),
    gulls: (t) => { for (let k = 0; k < 5; k++) tone(t + k * 0.4, [2600, 1700], 0.25, { g: 0.04, a: 0.03, pan: (k % 2) - 0.5 }); },
    birds: (t) => { for (let k = 0; k < 10; k++) tone(t + k * 0.12, [3200 + (k % 4) * 300, 4400], 0.08, { g: 0.035, pan: (k % 5) * 0.4 - 0.8 }); },
    splash: (t) => { noise(t, 1.4, { f: 3500, type: 'highpass', g: 0.2, a: 0.01 }); tone(t, [160, 50], 0.5, { g: 0.4 }); },
    alarm: (t) => { for (let k = 0; k < 6; k++) tone(t + k * 0.32, 880, 0.18, { type: 'square', g: 0.05, lp: 2400 }); },
    cheer: (t) => { noise(t, 2.2, { f: [900, 1500], q: 0.5, g: 0.1, swell: true }); for (let k = 0; k < 8; k++) noise(t + 0.2 + k * 0.17, 0.04, { f: 2200, q: 1.5, g: 0.1, pan: (k % 3) - 1 }); },
    clack: (t) => { for (let k = 0; k < 8; k++) noise(t + k * 0.11 + (k % 3) * 0.03, 0.02, { f: 3000, q: 3, g: 0.11 }); },
    boom: (t) => { tone(t, [90, 30], 1.2, { g: 0.6 }); noise(t, 1.4, { f: [1800, 200], q: 0.4, g: 0.25 }); },
    thunder: (t) => { noise(t, 3.0, { f: 120, type: 'lowpass', g: 0.3, swell: true }); tone(t + 0.3, [60, 34], 1.8, { g: 0.3 }); noise(t, 0.12, { f: 3000, g: 0.25 }); },
    rain: (t, d) => noise(t, d || 4, { f: 5000, type: 'highpass', g: 0.05, swell: true }),
    squelch: (t) => { for (let k = 0; k < 5; k++) tone(t + k * 0.16, [180 + k * 20, 90], 0.22, { g: 0.12, lp: 500 }); noise(t, 0.9, { f: 300, type: 'lowpass', g: 0.14, swell: true }); },
    drum: (t, d) => { const n = Math.floor((d || 4) / 0.375); for (let k = 0; k < n; k++) { tone(t + k * 0.375, [150, 70], 0.16, { g: k % 4 === 0 ? 0.32 : 0.2 }); if (k % 2) noise(t + k * 0.375, 0.05, { f: 1800, g: 0.07 }); } },
    buzz: (t, d) => { tone(t, [210, 220], d || 3, { type: 'sawtooth', g: 0.035, lp: 700, a: 0.3, pan: -0.3 }); tone(t, [260, 250], d || 3, { type: 'sawtooth', g: 0.025, lp: 800, a: 0.3, pan: 0.3 }); },
    drip: (t) => { tone(t, [1600, 700], 0.12, { g: 0.1, vb: 0.7 }); tone(t + 0.9, [1500, 650], 0.12, { g: 0.08, vb: 0.7 }); },
    magic: (t) => { [0, 1, 2, 3, 4, 5].forEach((k) => tone(t + k * 0.08, noteHz(['C5', 'E5', 'G5', 'C6', 'E6', 'G6'][k]), 1.2, { g: 0.06, vb: 0.7 })); },
    beep: (t) => { for (let k = 0; k < 3; k++) tone(t + k * 0.2, 1100 + k * 160, 0.1, { type: 'square', g: 0.05, lp: 2400 }); },
    crash: (t) => { noise(t, 1.2, { f: [4000, 900], q: 0.5, g: 0.28 }); tone(t, [200, 60], 0.8, { type: 'sawtooth', g: 0.25, lp: 700 }); },
    hum: (t, d) => tone(t, 110, d || 3, { type: 'triangle', g: 0.05, a: 0.6, lp: 400 }),
    pop: (t) => tone(t, [500, 1000], 0.08, { g: 0.12 }),
    fire: (t, d) => noise(t, d || 3, { f: [600, 1500], q: 0.3, g: 0.05, swell: true }),
  };
  const LONG = ['wind', 'waves', 'crowd', 'rain', 'drum', 'buzz', 'hum', 'fire'], R0 = MUS[STORY.music || 'hope'].map(noteHz);
  if (false) { /* music score switched off */
    R0.forEach((f, k) => { const o = ctx.createOscillator(); o.type = k ? 'triangle' : 'sine'; o.frequency.value = f; const g = ctx.createGain(), gn = [0.05, 0.03, 0.02][k] * (vo ? 0.7 : 1); g.gain.setValueAtTime(0, 0); g.gain.linearRampToValueAtTime(gn, 1.5); g.gain.setValueAtTime(gn, Math.max(1.5, T - 1.5)); g.gain.linearRampToValueAtTime(0, T); o.connect(g); out(g, 0, 0.25); o.start(0); o.stop(T + 0.1); });
    const q = rng(id); for (let t = 0.6; t < T - 1; t += 1.1) if (q() < 0.7) tone(t, R0[Math.floor(q() * 3)] * (q() < 0.5 ? 2 : 4), 1.8, { type: 'triangle', g: (vo ? 0.025 : 0.045), vb: 0.5, pan: q() - 0.5 });
  }
  STORY.beats.forEach((b, i) => {
    const e0 = TL.E[i], R = TL.R[i]; if (i > 0) FX.whoosh(e0 - 0.05);
    (b.sfx || []).forEach((sp) => { const [n, fr] = sp.split('@'), lg = LONG.indexOf(n) >= 0, t = e0 + (lg ? 0.05 : (fr ? +fr : 0.3) * R); if (FX[n] && !(window.BAN_SFX || []).includes(n)) FX[n](t, lg ? R : undefined); });
  });
}
window.renderAudioBase64 = async function (vo, noScore) {
  const sr = 48000, len = Math.ceil(TL.total * sr), ctx = new OfflineAudioContext(2, len, sr); buildAudio(ctx, !!vo, !noScore);
  const buf = await ctx.startRendering(), L = buf.getChannelData(0), R = buf.getChannelData(1), o = new Int16Array(len * 2);
  for (let k = 0; k < len; k++) { o[2 * k] = cl(L[k], -1, 1) * 32767; o[2 * k + 1] = cl(R[k], -1, 1) * 32767; }
  const bytes = new Uint8Array(o.buffer); let s = ''; for (let k = 0; k < bytes.length; k += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(k, k + 0x8000)); return btoa(s);
};
// =====================================================================
//  PAGE: preview player + hooks used by the render script
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
window.frameJPEG = function (t) { explainer(ctx, t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
(function ui() {

  const fmt = (s) => Math.floor(s / 60) + ':' + (s % 60).toFixed(1).padStart(4, '0');
  function draw() { if (catMode) { drawCatalog(ctx, +$('catpage').value || 0, T); return; } explainer(ctx, T); $('seek').max = TL.total; $('seek').value = T; $('time').textContent = fmt(T) + ' / ' + fmt(TL.total); }
  function audioStop() { try { if (SRC) SRC.stop(); } catch (e) {} SRC = null; }
  async function audioStart(off) { audioStop(); if (!snd || catMode) return; const key = STORY.id + TL.total; if (BUFKEY !== key) { const oc = new OfflineAudioContext(2, Math.ceil(TL.total * 44100), 44100); buildAudio(oc, false, true); BUF = await oc.startRendering(); BUFKEY = key; } if (!playing) return; AC2 = AC2 || new (window.AudioContext || window.webkitAudioContext)(); SRC = AC2.createBufferSource(); SRC.buffer = BUF; SRC.connect(AC2.destination); SRC.start(0, Math.min(off, TL.total - 0.05)); }
  function frame(now) { if (!playing) return; T += (now - tPrev) / 1000; tPrev = now; if (!catMode && T >= TL.total) { if (loop) { T = 0; audioStart(0); } else { playing = false; $('play').textContent = 'Play'; T = TL.total - 0.01; audioStop(); } } draw(); requestAnimationFrame(frame); }
  function play() { playing = true; $('play').textContent = 'Pause'; tPrev = performance.now(); audioStart(T); requestAnimationFrame(frame); }
  function pause() { playing = false; $('play').textContent = 'Play'; audioStop(); }
  $('play').onclick = () => (playing ? pause() : play()); $('seek').oninput = () => { T = parseFloat($('seek').value); draw(); if (playing) audioStart(T); };
  $('snd').onclick = () => { snd = !snd; $('snd').setAttribute('aria-pressed', snd); if (!snd) audioStop(); else if (playing) audioStart(T); };
  $('loop').onclick = () => { loop = !loop; $('loop').setAttribute('aria-pressed', loop); };

  $('cat').onclick = () => { catMode = !catMode; $('cat').setAttribute('aria-pressed', catMode); $('catpage').style.display = catMode ? '' : 'none'; if (catMode && !playing) play(); if (!catMode) T = 0; draw(); };
  $('catpage').onchange = draw;
  STORIES.forEach((s) => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.title; $('topic').appendChild(o); });

    for (const s of STORIES) { const er = validateStory(s); if (er.length) console.warn('STORY PROBLEMS', s.id, er); }
    for (let i = 0; i < window.catalogPages(); i++) { const o = document.createElement('option'); o.value = i; o.textContent = 'Catalog ' + (i + 1); $('catpage').appendChild(o); }
