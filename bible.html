<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gospel Washes (Bible Reels, Watercolor)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=block">
<style>
  html,body{margin:0;height:100%;background:#16120e;color:#f3ead8;font:15px system-ui,sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  #stage{flex:1;min-height:0;position:relative;background:#16120e}
  canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#16120e}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 34px Caveat,cursive;pointer-events:none}
  #bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#241d15;border-top:1px solid #3d3122;flex-wrap:wrap}
  #bar button,#bar select{background:#33281c;color:#f3ead8;border:1px solid #54432e;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer;min-width:44px}
  #bar button:focus-visible,#bar select:focus-visible,#seek:focus-visible{outline:2px solid #d9a441;outline-offset:2px}
  #bar button[aria-pressed="true"]{background:#54432e}
  #seek{flex:1;min-width:120px;accent-color:#d9a441}
  #time{font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c" width="720" height="1280"></canvas><div id="loading">Mixing paint...</div></div>
  <div id="bar">
    <button id="play" aria-label="Play">Play</button>
    <select id="topic" aria-label="Topic"></select>
    <input id="seek" type="range" min="0" max="30" step="0.01" value="0" aria-label="Scrub">
    <span id="time">0:00.0</span>
    <button id="snd" aria-pressed="true" aria-label="Sound on or off">Sound</button>
    <button id="loop" aria-pressed="true" aria-label="Loop on or off">Loop</button>
  </div>
</div>

<script>
// ===================== H helper library =====================
(function () {
  const H = (window.H = {});
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };
  H.layer = (W, H_) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };
})();
</script>

<script>
// ===================== SOUND kit (unchanged logic) =====================
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;
  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6;
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0;
    const base = ctx.currentTime + (o.delay || 0);
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;
        for (let i = 0; i < n; i++) { const u = i / n; lp += (0.6 - 0.45 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 3); }
      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    }
    function filterNode(p, t) {
      if (!p.filter) return null;
      const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 1 : p.q;
      sweep(f.frequency, p.f == null ? 1000 : p.f, t);
      return f;
    }
    function tone(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    function noise(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }
    const S = {
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      ding: (t, o) => { const f = hz(o.f || 'E6'); tone(t, { f, dur: 1.3, gain: 0.2 * o.g, verb: 0.3, pan: o.pan }); tone(t, { f: f * 2.76, dur: 0.5, gain: 0.05 * o.g, verb: 0.3, pan: o.pan }); },
      success: (t, o) => { S.ding(t, { ...o, f: o.f || 'C6' }); S.ding(t + 0.09, { ...o, f: hz(o.f || 'C6') * 1.5, g: o.g * 0.9 }); },
      stroke: (t, o) => {
        const d = o.dur || 0.4, m = o.material || 'marker', r = rand('stroke' + m + t);
        const M = {
          marker: { f: 2900, q: 2.2, g: 0.16, grain: 0.05 },
          pencil: { f: 4600, q: 0.8, g: 0.16, grain: 0.04, filter: 'highpass' },
          brush: { f: 900, q: 0.5, g: 0.1, grain: 0.09, color: 'pink' },
        }[m];
        for (let x = 0; x < d; x += M.grain * (0.7 + r() * 0.6)) {
          const gd = M.grain * (0.8 + r() * 0.9);
          noise(t + x, { dur: gd, color: M.color, filter: M.filter || 'bandpass', f: M.f * (0.8 + r() * 0.4), q: M.q, gain: M.g * o.g * (0.6 + r() * 0.5), a: gd * 0.3, pan: (o.pan || 0) + (r() - 0.5) * 0.2 });
        }
      },
    };
    function play(name, t, opts) {
      const fn = S[name];
      if (!fn) throw new Error('unknown sound: ' + name);
      const o2 = Object.assign({}, opts); o2.g = o2.gain == null ? 1 : o2.gain;
      if (opts && opts.minor) withMinor(() => fn(t, o2)); else fn(t, o2);
    }
    function withMinor(fn) { const was = inMinor; inMinor = true; try { fn(); } finally { inMinor = was; } }
    function bed(name, t0, t1, p) {
      if (VO) return;
      p = p || {}; const g = p.gain == null ? 1 : p.gain, d = t1 - t0, fade = Math.min(0.4, d / 4);
      const long = (q) => Object.assign({ dur: d, a: fade, hold: d - fade * 2, bus: 'amb' }, q);
      if (name === 'room') noise(t0, long({ color: 'brown', filter: 'lowpass', f: 320, gain: 0.12 * g }));
      else throw new Error('unknown bed: ' + name);
    }
    function music(name, t0, t1, p) {
      if (VO) return;
      p = p || {}; const g = p.gain == null ? 1 : p.gain, bpm = p.bpm || 100, beat = 60 / bpm, bar = beat * 4;
      const chords = p.chords || [['C4', 'E4', 'G4', 'B4']];
      let i = 0;
      for (let t = t0; t < t1 - 0.05; t += bar, i++) {
        const ch = chords[i % chords.length], len = Math.min(bar, t1 - t);
        ch.forEach((n, k) => { tone(t, { f: n, type: 'triangle', dur: len + 0.3, gain: 0.035 * g, a: 0.25, hold: len - 0.3, bus: 'music', filter: 'lowpass', f2: 1400, pan: (k - 1.5) * 0.25, verb: 0.25 }); tone(t, { f: hz(n) * 1.004, type: 'sine', dur: len + 0.3, gain: 0.03 * g, a: 0.3, hold: len - 0.3, bus: 'music' }); });
      }

  };

    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    return () => { try { ctx.close(); } catch (e) {} };
  };
  SOUND.renderOffline = async function (fn, duration, sampleRate, kitOpts) {
    const sr = sampleRate || 48000, len = Math.ceil(duration * sr);

    const buf = await ctx.startRendering();

    for (let i = 0; i < len; i++) { inter[2 * i] = L[i]; inter[2 * i + 1] = R[i]; peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); }
    return { inter, peak, frames: len, sr };
  };
})();
</script>

<script>
// ===================== WATERCOLOR ENGINE (portrait 720x1280 for Reels) =====================
const CW = 720, CH = 1280, TAU = Math.PI * 2;
const cl = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const lerp = (a, b, u) => a + (b - a) * u;
const win = (t, a, b) => cl((t - a) / (b - a));
const ez = (u) => H.ease.inOut(cl(u));
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
const rgbs = (a) => `rgb(${a[0]},${a[1]},${a[2]})`;

function deform(pts, r, depth, amt) {
  let p = pts;
  for (let d = 0; d < depth; d++) {
    const out = [];
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length];
      out.push(a);
      const len = Math.hypot(b.x - a.x, b.y - a.y), v = (a.v + b.v) * 0.5, s = len * amt * v;
      out.push({ x: (a.x + b.x) / 2 + r.gauss() * s, y: (a.y + b.y) / 2 + r.gauss() * s, v: v * (0.7 + r() * 0.6) });
    }
    p = out;
  }
  return p;
}
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y); c.closePath(); }
const P = (x, y, v = 1) => ({ x, y, v });
function circlePts(cx, cy, rx, ry, n, r, vv = 1) {
  const out = [];
  for (let i = 0; i < n; i++) { const a = TAU * i / n; out.push(P(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, vv * (0.6 + r() * 0.8))); }
  return out;
}
function exWash(c, base, col, { layers = 26, alpha = 0.06, amt = 0.14, depth = 3, seed = 1, comp = 'source-over' } = {}) {
  const r = H.rng(seed);
  c.save(); c.globalCompositeOperation = comp; c.fillStyle = Array.isArray(col) ? H.rgba(col, 1) : col;
  for (let i = 0; i < layers; i++) { c.globalAlpha = alpha * (0.6 + r() * 0.8); poly(c, deform(base, r, depth, amt)); c.fill(); }
  c.restore();
}
const disc = (x, y, rx, ry, seed) => deform(circlePts(x, y, rx, ry, 12, H.rng(seed), 1), H.rng(seed + 1), 2, 0.12);
const lift = (c, pts, a, seed, layers = 10) => exWash(c, pts, '#000', { layers, alpha: a / 5, amt: 0.3, depth: 2, seed, comp: 'destination-out' });
function drop(c, col, blobs) {
  c.save(); c.globalCompositeOperation = 'source-atop';
  blobs.forEach(([x, y, rx, ry, a]) => {
    c.save(); c.translate(x, y); c.scale(1, ry / rx); const g = c.createRadialGradient(0, 0, 0, 0, 0, rx * 1.3);
    g.addColorStop(0, H.rgba(col, a)); g.addColorStop(0.55, H.rgba(col, a * 0.7)); g.addColorStop(1, H.rgba(col, 0));
    c.fillStyle = g; c.fillRect(-rx * 1.3, -rx * 1.3, rx * 2.6, rx * 2.6); c.restore();
  });
  c.restore();
}
function rimPool(cv, pool = 2.2, blur = 4) {
  const w = cv.width, h = cv.height, c = cv.getContext('2d');
  const B = H.layer(w, h), b = B.getContext('2d');
  b.filter = `blur(${blur}px)`; b.drawImage(cv, 0, 0); b.filter = 'none';
  const A = c.getImageData(0, 0, w, h), d = A.data, e = b.getImageData(0, 0, w, h).data;
  for (let i = 3; i < d.length; i += 4) { const rim = d[i] - e[i]; if (rim > 0) d[i] = Math.min(255, d[i] + rim * pool); }
  c.putImageData(A, 0, 0);
  return cv;
}
let SOFT = null;
function softMottle() {
  if (SOFT) return SOFT;
  const r = H.rng(77);
  const cell = (w, h, lo) => { const c = H.layer(w, h), x = c.getContext('2d'), im = x.createImageData(w, h); for (let i = 0; i < w * h; i++) im.data[i * 4 + 3] = (lo + r() * (1 - lo)) * 255; x.putImageData(im, 0, 0); return c; };
  const m = H.layer(760, 1240), mx = m.getContext('2d'); mx.imageSmoothingQuality = 'high';
  mx.drawImage(cell(48, 80, 0.55), 0, 0, 760, 1240); mx.globalCompositeOperation = 'destination-in'; mx.drawImage(cell(160, 260, 0.75), 0, 0, 760, 1240);
  SOFT = H.layer(760, 1240); const s = SOFT.getContext('2d'); s.fillStyle = 'rgba(0,0,0,0.5)'; s.fillRect(0, 0, 760, 1240); s.drawImage(m, 0, 0);
  return SOFT;
}
function mk(w, h, fn, pool = 2.4, blur = 5) {
  const cv = H.layer(w, h), c = cv.getContext('2d');
  fn(c, w, h);
  c.globalCompositeOperation = 'destination-in'; c.drawImage(softMottle(), 0, 0, w, h); c.globalCompositeOperation = 'source-over';
  rimPool(cv, pool, blur);

}

const TEXTC = new Map();
function wcText(c, str, x, y, size, col, { align = 'left', reveal = 1, weight = '700', alpha = 0.97 } = {}) {

  let cv = TEXTC.get(key);
  if (!cv) {
    const m = H.layer(4, 4).getContext('2d'); m.font = `${weight} ${size}px "Caveat", cursive`;
    const w = Math.ceil(m.measureText(str).width) + 30, h = Math.ceil(size * 1.5);
    cv = H.layer(w, h); const tc = cv.getContext('2d');
    tc.font = `${weight} ${size}px "Caveat", cursive`; tc.fillStyle = col; tc.textBaseline = 'alphabetic';
    tc.globalAlpha = 0.92; tc.fillText(str, 15, size * 1.08); tc.globalAlpha = 0.4; tc.fillText(str, 16.2, size * 1.08 + 0.8);
    rimPool(cv, 1.8, 2.2);
    cv.base = size * 1.08;
    if (TEXTC.size > 400) TEXTC.clear();
    TEXTC.set(key, cv);
  }
  const w = cv.width - 30, ox = align === 'center' ? -w / 2 : align === 'right' ? -w : 0;

  const rw = Math.max(1, cv.width * cl(reveal));

  c.restore();
}

    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;

    L.push([pts[i][0] - dy / l * ww, pts[i][1] + dx / l * ww]); R.push([pts[i][0] + dy / l * ww, pts[i][1] - dx / l * ww]);
  }

}

    ref: 'John 4:14', sref: 'John four, fourteen', quote: 'But whosoever drinketh of the water that I shall give him shall never thirst.',

    step: 'Ask Jesus plainly for the one thing you need most today.', end: 'Ask him plainly.' },
  { id: 'tomb', series: 'What Happened', fmt: 'B', pal: 'dusk', scene: 'cross',
    hook: 'What the Gospels record on the first Easter morning.', intro: 'Here is what the Gospels record about the first Easter morning.',
    panels: [
      { scene: 'cross', cap: 'Jesus was crucified at Golgotha, with two others crucified beside him.', ref: 'Matthew 27:33 to 38', sref: 'Matthew twenty-seven, thirty-three to thirty-eight' },
      { scene: 'tomb', cap: 'Joseph of Arimathaea laid his body in his own new tomb, and rolled a great stone to the door.', ref: 'Matthew 27:57 to 60', sref: 'Matthew twenty-seven, fifty-seven to sixty' },
      { scene: 'tombOpen', pal: 'dawn', cap: 'As the first day of the week began to dawn, two women came to see the tomb, and an angel rolled back the stone.', ref: 'Matthew 28:1 and 2', sref: 'Matthew twenty-eight, one and two', ctx: 'All four Gospels record the empty tomb.' }],
    ref: 'Matthew 28:6', sref: 'Matthew twenty-eight, six', quote: 'He is not here: for he is risen, as he said. Come, see the place where the Lord lay.',
    meaning: 'The angel told the women that Jesus had risen, as he had said, and invited them to see the place. They were sent to tell his disciples (verses 6 and 7).',
    step: 'This week, read one resurrection account in full: Matthew 28, Mark 16, Luke 24, or John 20.', end: 'He is risen.' },
];
function buildVO(T) {
  if (T.fmt === 'A') return [T.intro, `In the King James Version, ${T.sref}. ${T.quote}`, 'Some context. ' + T.context.map((r) => r[0] + '. ' + r[1]).join(' '), T.meaning, `Remember these words. ${T.key}.`, 'Try this today. ' + T.step, T.end];
  return [T.intro, ...T.panels.map((p) => p.cap + ' ' + p.sref + '.' + (p.ctx ? ' Some context. ' + p.ctx : '')), `In the King James Version, ${T.sref}. ${T.quote}`, T.meaning + ' Try this today. ' + T.step, T.end];
}

// ---------- timeline: every beat plays at normal speed, then holds until its narration line has finished ----------
const VOICE_OFF = 0.35, VOICE_TAIL = 0.5, END_HOLD = 0.8, TRN = 0.8;
let TOPIC = null, LAY = [], TL = null;
function buildTL(v) {
  const E = [], R = [], starts = []; let t = 0;
  LAY.forEach((b, i) => { const r = v && v[i] > 0 ? Math.max(b.d, VOICE_OFF + v[i] + VOICE_TAIL) : b.d; E.push(t); R.push(r); starts.push(t + VOICE_OFF); t += r; });
  return { E, R, starts, total: t + (v ? END_HOLD : 0) };
}
function loadTopic(id) {
  TOPIC = TOPICS.find((x) => x.id === id) || TOPICS[0];
  LAY = buildLayout(TOPIC); TL = buildTL(null);
  const T = TOPIC;
  return { id: T.id, title: T.hook, vo: buildVO(T), caption: `${T.series}: ${T.hook}\n\n\u201C${T.quote}\u201D (${T.ref}, KJV)`, tags: '#Bible #Jesus #KJV #Faith #Scripture #' + T.series.replace(/[^A-Za-z]/g, '') };
}
function setVoiceDurations(v) { TL = buildTL(v); return { starts: TL.starts, total: TL.total }; }

// ---------- drawing ----------
function drawItem(c, it, lt) {
  switch (it.k) {
    case 'text': wcText(c, it.s, it.x, it.y, it.size, it.col, { align: it.align, reveal: win(lt, it.a, it.b), weight: it.weight }); break;
    case 'stroke': wcStroke(c, it.pts, it.w, it.col, win(lt, it.a, it.b), { head: it.head, alpha: it.alpha }); break;
    case 'pencil': pencil(c, it.pts, win(lt, it.a, it.b), 0.5, 1.6); break;
    case 'scene': { const p = win(lt, it.a, it.b); if (p > 0) bloomIn(c, sceneCanvas(it.kind, it.pal), it.x, it.y, p, it.w, it.h); break; }
    case 'wash': { const p = win(lt, it.a, it.b); if (p > 0) bloomIn(c, washCanvas(it), it.cx - it.rx - 40, it.cy - it.ry - 40, p); break; }
  }
}
function drawBeat(c, B, pal, lt, u) {
  c.save(); const s = 1 + 0.035 * u;
  c.translate(CW / 2, CH / 2); c.scale(s, s); c.translate(-CW / 2, -CH / 2);
  c.drawImage(paperFor(pal), 0, 0);
  B.items.forEach((it) => drawItem(c, it, lt));
  c.restore();
}
const OLD = H.layer(CW, CH), OC = OLD.getContext('2d');
function locate(T) {
  let i = LAY.length - 1;
  for (let k = 0; k < LAY.length; k++) if (T < TL.E[k] + TL.R[k]) { i = k; break; }
  const rt = T - TL.E[i];
  return { i, rt, lt: Math.min(Math.max(0, rt), LAY[i].d), u: cl(rt / TL.R[i]) };
}
function explainer(ctx, W, H_, T) {
  const { i, rt, lt, u } = locate(T), pal = TOPIC.pal;
  drawBeat(ctx, LAY[i], pal, lt, u);
  if (i > 0 && rt < TRN) { // the previous page dries away under a spreading wet bloom
    drawBeat(OC, LAY[i - 1], pal, LAY[i - 1].d, 1);
    const k = ez(rt / TRN), r = H.rng(i * 31 + 7); OC.save(); OC.globalCompositeOperation = 'destination-out';
    for (let n = 0; n < 3; n++) {
      const cx = r.range(120, 600), cy = r.range(300, 980), R = lerp(0, 1100, k) * (0.8 + n * 0.25);
      const g = OC.createRadialGradient(cx, cy, R * 0.55, cx, cy, R + 1); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      OC.fillStyle = g; OC.fillRect(0, 0, CW, CH);
    }
    OC.restore(); ctx.drawImage(OLD, 0, 0);
  }
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(tooth(), 0, 0); ctx.restore();
  H.vignette(ctx, CW, CH, 0.26, '60,40,20');
  H.grain(ctx, CW, CH, 0.022, 8 + Math.floor(T * 12) % 9);
}

// ---------- sound score (same item times as the picture) ----------
function scoreSound(k) {
  const total = TL.total, pan = (x) => clampN((x - 360) / 360, -1, 1) * 0.5;
  const brush = (a, b, g = 1, pn = 0, minor = true) => {
    k.noise(a, { dur: 0.05, color: 'pink', filter: 'lowpass', f: 700, gain: 0.16 * g, a: 0.008, pan: pn, minor });
    k.play('stroke', a, { material: 'brush', dur: Math.max(0.1, b - a), gain: 1.5 * g, pan: pn, minor });
  };
  const letter = (s, a, b, g, pn) => { const re = /\S+/g; let m; while ((m = re.exec(s))) brush(a + (b - a) * m.index / s.length, a + (b - a) * (m.index + m[0].length) / s.length, g, pn); };
  const wash = (a, b, g = 1, pn = 0, minor = true) => {
    const d = b - a;
    k.noise(a, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 260], [d * 0.45, 820], [d, 420]], q: 0.7, gain: 0.09 * g, a: d * 0.4, pan: pn, minor, verb: 0.1 });
    k.noise(a + 0.03, { dur: d * 0.7, color: 'brown', filter: 'lowpass', f: 380, gain: 0.08 * g, a: d * 0.3, pan: pn, minor });
  };
  const dropS = (t, g = 1, pn = 0) => k.tone(t, { f: [[0, 330], [0.05, 560]], dur: 0.08, gain: 0.07 * g, a: 0.003, pan: pn, minor: true, verb: 0.2 });
  const rinse = (t, d) => {
    for (let i = 0; i < 3; i++) { const ti = t + i * d / 4; k.noise(ti, { dur: d / 2.2, color: 'pink', filter: 'bandpass', f: [[0, 420], [d / 5, 1100], [d / 2.2, 520]], q: 1.6, gain: 0.1, a: d / 9, pan: i % 2 ? 0.2 : -0.2, minor: true }); }
    dropS(t + d * 0.4, 1, 0); k.play('tock', t + d, { f: 900, gain: 0.3, minor: true });
  };
  k.bed('room', 0, total, { gain: 0.4 });
  k.music('pad', 0, total, { bpm: 56, gain: 0.3, chords: [['F3', 'A3', 'C4', 'E4'], ['D3', 'F3', 'A3', 'C4'], ['Bb2', 'D3', 'F3', 'A3'], ['C3', 'G3', 'C4', 'E4']] });
  LAY.forEach((B, i) => {
    const E = TL.E[i];
    if (i > 0) rinse(E, 0.6);
    B.items.forEach((it) => {
      if (it.k === 'text') letter(it.s, E + it.a, E + it.b, 0.9, pan(it.x));
      else if (it.k === 'stroke') {
        brush(E + it.a, E + it.b, 1.0, 0, false);
        if (it.sfx === 'hit') { k.play('thud', E + it.b, { f: 100, gain: 0.5 }); k.play('ding', E + it.b, { f: 'C5', gain: 0.4 }); }
        if (it.sfx === 'ok') k.play('success', E + it.b, { f: 'A5', gain: 0.4 });
      } else if (it.k === 'scene') wash(E + it.a, E + it.b, 1.0, 0, false);
      else if (it.k === 'wash') wash(E + it.a, E + it.b, 0.6, 0, true);
      else if (it.k === 'pencil') k.play('stroke', E + it.a, { material: 'pencil', dur: it.b - it.a, gain: 0.5, minor: true });
    });
  });
  const tEnd = TL.E[LAY.length - 1] + LAY[LAY.length - 1].d - 0.5;
  k.play('ding', tEnd, { f: 'F4', gain: 0.4 });
  ['A4', 'C5', 'F5'].forEach((f, i) => k.tone(tEnd + 0.06 + i * 0.06, { f, dur: 1.4, gain: 0.07 - i * 0.01, verb: 0.3, pan: (i - 1) * 0.3 }));
}

// ===================== exports for the automated render =====================
window.TOPIC_IDS = TOPICS.map((x) => x.id);
window.loadTopic = loadTopic;
window.setVoiceDurations = setVoiceDurations;
window.scoreSound = scoreSound;
Object.defineProperty(window, 'DURATION', { get: () => TL.total });

// ===================== PLAYER =====================
(async function () {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d', { willReadFrequently: true });
  const playBtn = document.getElementById('play'), seekEl = document.getElementById('seek'), timeEl = document.getElementById('time');
  const sndBtn = document.getElementById('snd'), loopBtn = document.getElementById('loop'), loading = document.getElementById('loading'), topicEl = document.getElementById('topic');
  let cur = 0, playing = false, tPrev = 0, loop = true, soundOn = true, stopSound = () => {};
  const mmss = (t) => Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0');
  TOPICS.forEach((x) => { const o = document.createElement('option'); o.value = x.id; o.textContent = x.id; topicEl.appendChild(o); });
  try { await Promise.all(['700 60px "Caveat"', '400 60px "Caveat"'].map((f) => document.fonts.load(f, 'AaZz09\u201C\u201D\u2014'))); await document.fonts.ready; } catch (e) {}
  await new Promise((r) => setTimeout(r, 30));
  const wanted = new URLSearchParams(location.search).get('topic');
  loadTopic(wanted || TOPICS[0].id); topicEl.value = TOPIC.id;
  function draw(T) { seekEl.max = TL.total; explainer(ctx, CW, CH, T); seekEl.value = T; timeEl.textContent = mmss(T) + ' / ' + mmss(TL.total); }
  window.seek = (T) => { cur = H.clamp(T, 0, TL.total); draw(cur); };
  function startSound() { stopSound(); stopSound = () => {}; if (soundOn && playing) stopSound = SOUND.live(scoreSound, cur, { voiceover: false }); }
  function pause() { playing = false; stopSound(); stopSound = () => {}; playBtn.textContent = 'Play'; playBtn.setAttribute('aria-label', 'Play'); }
  function play() { if (cur >= TL.total - 0.01) cur = 0; playing = true; tPrev = performance.now(); playBtn.textContent = 'Pause'; playBtn.setAttribute('aria-label', 'Pause'); startSound(); requestAnimationFrame(tick); }
  function tick(now) {
    if (!playing) return;
    cur += (now - tPrev) / 1000; tPrev = now;
    if (cur >= TL.total) { if (loop) { cur = cur % TL.total; startSound(); } else { cur = TL.total; draw(cur); pause(); return; } }
    draw(cur); requestAnimationFrame(tick);
  }
  playBtn.onclick = () => (playing ? pause() : play());
  cv.onclick = () => (playing ? pause() : play());
  seekEl.oninput = () => { cur = parseFloat(seekEl.value); draw(cur); if (playing) { tPrev = performance.now(); startSound(); } };
  topicEl.onchange = () => { const was = playing; pause(); loadTopic(topicEl.value); cur = 0; draw(0); if (was) play(); };
  sndBtn.onclick = () => { soundOn = !soundOn; sndBtn.setAttribute('aria-pressed', soundOn); if (!soundOn) { stopSound(); stopSound = () => {}; } else if (playing) startSound(); };
  loopBtn.onclick = () => { loop = !loop; loopBtn.setAttribute('aria-pressed', loop); };
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playing ? pause() : play(); } });
  window.frameJPEG = (T) => { window.seek(T); return cv.toDataURL('image/jpeg', 0.93).split(',')[1]; };
  window.renderAudioBase64 = async (vo) => {
    const r = await SOUND.renderOffline(scoreSound, TL.total, 48000, { voiceover: !!vo });
    const n = r.inter.length, i16 = new Int16Array(n);
    for (let i = 0; i < n; i++) i16[i] = Math.max(-1, Math.min(1, r.inter[i])) * 32767;
    const u8 = new Uint8Array(i16.buffer); let s = ''; const CHK = 0x8000;
    for (let i = 0; i < u8.length; i += CHK) s += String.fromCharCode.apply(null, u8.subarray(i, i + CHK));
    return btoa(s);
  };
  draw(0);
  window._ready = true;
  loading.style.display = 'none';
})();
</script>
