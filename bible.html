<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible Reels (Elias)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=block">
<style>
  html,body{margin:0;height:100%;background:#16120e;color:#f3ead8;font:15px system-ui,sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  #stage{flex:1;min-height:0;position:relative;background:#16120e}
  canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#16120e}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 34px Caveat,cursive;pointer-events:none}
  #bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#241d15;border-top:1px solid #3d3122;flex-wrap:wrap}
  #bar button,#bar select{background:#33281c;color:#f3ead8;border:1px solid #54432e;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer;min-width:44px}
  #bar button:focus-visible,#bar select:focus-visible,#seek:focus-visible{outline:2px solid #d9a441;outline-offset:2px}
  #bar button[aria-pressed="true"]{background:#54432e}
  #seek{flex:1;min-width:120px;accent-color:#d9a441}
  #time{font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c" width="720" height="1280"></canvas><div id="loading">Mixing paint...</div></div>
  <div id="bar">
    <button id="play" aria-label="Play">Play</button>
    <select id="topic" aria-label="Topic"></select>
    <button id="newcol" aria-label="New colors">Colors</button>
    <input id="seek" type="range" min="0" max="30" step="0.01" value="0" aria-label="Scrub">
    <span id="time">0:00.0</span><span style="opacity:.6;font-size:12px">v3 one narrator</span>
    <button id="snd" aria-pressed="true" aria-label="Sound on or off">Sound</button>
    <button id="loop" aria-pressed="true" aria-label="Loop on or off">Loop</button>
  </div>
</div>

<script>
// ===================== H helper library =====================
(function () {
  const H = (window.H = {});
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };
  H.layer = (W, H_) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };
})();
</script>

<script>
// ===================== SOUND kit (unchanged logic) =====================
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);

  SOUND.hz = hz;
  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6;
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0;
    const base = ctx.currentTime + (o.delay || 0);
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;
        for (let i = 0; i < n; i++) { const u = i / n; lp += (0.6 - 0.45 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 3); }
      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    }
    function filterNode(p, t) {
      if (!p.filter) return null;
      const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 1 : p.q;
      sweep(f.frequency, p.f == null ? 1000 : p.f, t);

    }
    function tone(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    function noise(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }
    const S = {
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      ding: (t, o) => { const f = hz(o.f || 'E6'); tone(t, { f, dur: 1.3, gain: 0.2 * o.g, verb: 0.3, pan: o.pan }); tone(t, { f: f * 2.76, dur: 0.5, gain: 0.05 * o.g, verb: 0.3, pan: o.pan }); },
      success: (t, o) => { S.ding(t, { ...o, f: o.f || 'C6' }); S.ding(t + 0.09, { ...o, f: hz(o.f || 'C6') * 1.5, g: o.g * 0.9 }); },
      stroke: (t, o) => {
        const d = o.dur || 0.4, m = o.material || 'marker', r = rand('stroke' + m + t);
        const M = {
          marker: { f: 2900, q: 2.2, g: 0.16, grain: 0.05 },
          pencil: { f: 4600, q: 0.8, g: 0.16, grain: 0.04, filter: 'highpass' },
          brush: { f: 900, q: 0.5, g: 0.1, grain: 0.09, color: 'pink' },
        }[m];
        for (let x = 0; x < d; x += M.grain * (0.7 + r() * 0.6)) {
          const gd = M.grain * (0.8 + r() * 0.9);
          noise(t + x, { dur: gd, color: M.color, filter: M.filter || 'bandpass', f: M.f * (0.8 + r() * 0.4), q: M.q, gain: M.g * o.g * (0.6 + r() * 0.5), a: gd * 0.3, pan: (o.pan || 0) + (r() - 0.5) * 0.2 });
        }
      },
    };
    function play(name, t, opts) {
      const fn = S[name];
      if (!fn) throw new Error('unknown sound: ' + name);
      const o2 = Object.assign({}, opts); o2.g = o2.gain == null ? 1 : o2.gain;
      if (opts && opts.minor) withMinor(() => fn(t, o2)); else fn(t, o2);
    }
    function withMinor(fn) { const was = inMinor; inMinor = true; try { fn(); } finally { inMinor = was; } }
    function bed(name, t0, t1, p) {
      if (VO) return;
      p = p || {}; const g = p.gain == null ? 1 : p.gain, d = t1 - t0, fade = Math.min(0.4, d / 4);
      const long = (q) => Object.assign({ dur: d, a: fade, hold: d - fade * 2, bus: 'amb' }, q);

    }
    function music(name, t0, t1, p) {
      if (VO) return;
      p = p || {}; const g = p.gain == null ? 1 : p.gain, bpm = p.bpm || 100, beat = 60 / bpm, bar = beat * 4;
      const chords = p.chords || [['C4', 'E4', 'G4', 'B4']];

        const ch = chords[i % chords.length], len = Math.min(bar, t1 - t);
        ch.forEach((n, k) => { tone(t, { f: n, type: 'triangle', dur: len + 0.3, gain: 0.035 * g, a: 0.25, hold: len - 0.3, bus: 'music', filter: 'lowpass', f2: 1400, pan: (k - 1.5) * 0.25, verb: 0.25 }); tone(t, { f: hz(n) * 1.004, type: 'sine', dur: len + 0.3, gain: 0.03 * g, a: 0.3, hold: len - 0.3, bus: 'music' }); });

  };

</script>

<script>
// ===================== WATERCOLOR ENGINE (portrait 720x1280 for Reels) =====================
const CW = 720, CH = 1280, TAU = Math.PI * 2;
const cl = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const clr = (v, a, b) => (v < a ? a : v > b ? b : v);          // clamp to any range (used by the characters)
const lerp = (a, b, u) => a + (b - a) * u;
const win = (t, a, b) => cl((t - a) / (b - a));
const ez = (u) => H.ease.inOut(cl(u));
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
const rgbs = (a) => `rgb(${Math.round(a[0])},${Math.round(a[1])},${Math.round(a[2])})`;
const backOut = (u) => { u = cl(u); const k = 1.70158; u -= 1; return 1 + (k + 1) * u * u * u + k * u * u; };
const wrapH = (h) => ((h % 360) + 360) % 360;
const hsl = (h, s, l, a = 1) => `hsla(${wrapH(h).toFixed(1)},${s.toFixed(1)}%,${l.toFixed(1)}%,${a})`;
function h2r(h, s, l) { // hsl to [r,g,b]
  h = wrapH(h); s /= 100; l /= 100;
  const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
}

function deform(pts, r, depth, amt) {
  let p = pts;
  for (let d = 0; d < depth; d++) {
    const out = [];
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length];
      out.push(a);
      const len = Math.hypot(b.x - a.x, b.y - a.y), v = (a.v + b.v) * 0.5, s = len * amt * v;
      out.push({ x: (a.x + b.x) / 2 + r.gauss() * s, y: (a.y + b.y) / 2 + r.gauss() * s, v: v * (0.7 + r() * 0.6) });
    }
    p = out;
  }
  return p;
}
function poly(c, pts) { c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y); c.closePath(); }
const P = (x, y, v = 1) => ({ x, y, v });
function circlePts(cx, cy, rx, ry, n, r, vv = 1) {
  const out = [];
  for (let i = 0; i < n; i++) { const a = TAU * i / n; out.push(P(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, vv * (0.6 + r() * 0.8))); }
  return out;
}
function exWash(c, base, col, { layers = 26, alpha = 0.06, amt = 0.14, depth = 3, seed = 1, comp = 'source-over' } = {}) {
  const r = H.rng(seed);
  c.save(); c.globalCompositeOperation = comp; c.fillStyle = Array.isArray(col) ? H.rgba(col, 1) : col;
  for (let i = 0; i < layers; i++) { c.globalAlpha = alpha * (0.6 + r() * 0.8); poly(c, deform(base, r, depth, amt)); c.fill(); }
  c.restore();
}
const disc = (x, y, rx, ry, seed) => deform(circlePts(x, y, rx, ry, 12, H.rng(seed), 1), H.rng(seed + 1), 2, 0.12);
const lift = (c, pts, a, seed, layers = 10) => exWash(c, pts, '#000', { layers, alpha: a / 5, amt: 0.3, depth: 2, seed, comp: 'destination-out' });
function drop(c, col, blobs) {
  c.save(); c.globalCompositeOperation = 'source-atop';
  blobs.forEach(([x, y, rx, ry, a]) => {
    c.save(); c.translate(x, y); c.scale(1, ry / rx); const g = c.createRadialGradient(0, 0, 0, 0, 0, rx * 1.3);
    g.addColorStop(0, H.rgba(col, a)); g.addColorStop(0.55, H.rgba(col, a * 0.7)); g.addColorStop(1, H.rgba(col, 0));
    c.fillStyle = g; c.fillRect(-rx * 1.3, -rx * 1.3, rx * 2.6, rx * 2.6); c.restore();
  });
  c.restore();
}
function rimPool(cv, pool = 2.2, blur = 4) {
  const w = cv.width, h = cv.height, c = cv.getContext('2d');
  const B = H.layer(w, h), b = B.getContext('2d');
  b.filter = `blur(${blur}px)`; b.drawImage(cv, 0, 0); b.filter = 'none';
  const A = c.getImageData(0, 0, w, h), d = A.data, e = b.getImageData(0, 0, w, h).data;
  for (let i = 3; i < d.length; i += 4) { const rim = d[i] - e[i]; if (rim > 0) d[i] = Math.min(255, d[i] + rim * pool); }
  c.putImageData(A, 0, 0);
  return cv;
}
let SOFT = null;
function softMottle() {

// Three rich hue families, four harmony schemes, no muddy yellow-green skies.
const ARCS = [[190, 250, 'Sapphire'], [262, 322, 'Amethyst'], [345, 395, 'Ember']];
const SCHEMES = {
  analogous:  { glow: 38,  ground: -28, adj: 'Silken' },
  complement: { glow: 180, ground: 24,  adj: 'Radiant' },
  split:      { glow: 150, ground: 208, adj: 'Stained-glass' },
  triad:      { glow: 120, ground: 240, adj: 'Jewel' },
};
const MOODDIM = { night: 0.5, storm: 0.4, dusk: 0.15 };

  const r = H.rng(seed), arc = r.pick(ARCS), h = wrapH(r.range(arc[0], arc[1]));
  const sk = r.pick(Object.keys(SCHEMES)), Sc = SCHEMES[sk], g = safeHue(h + Sc.glow), gr = safeHue(h + Sc.ground);
  const d = MOODDIM[mood] || 0, L = (x) => x * (1 - d), Sa = (x) => x * (1 - d * (mood === 'storm' ? 0.7 : 0.2));
  const p = { id: 'p' + seed, seed, mood, name: `${Sc.adj} ${arc[2]}`, h, g, gr };
  p.top = hsl(h, Sa(60), L(14 + r.range(0, 6)));
  p.mid = hsl(h + 10, Sa(64), L(30 + r.range(0, 6)));
  p.low = hsl(g, Sa(80), L(56 + r.range(0, 6)));
  p.hor = hsl(g + 8, Sa(92), L(72 + r.range(0, 4)));
  p.sun = hsl(g + 14, 100, mood === 'night' ? 84 : 90);
  p.far = hsl(h + 12, Sa(44), L(26 + r.range(0, 4)));
  p.farMist = hsl(g, Sa(60), L(52));
  p.mid2 = hsl(gr, Sa(36), L(25));
  p.near = hsl(gr, Sa(42), L(16));
  p.gold = hsl(44, 92, 64); p.goldD = hsl(36, 80, 42); p.rayA = hsl(g, 100, 76);
  p.sunX = r.range(220, 500);
  p.ink = h2r(h, 58, 15); p.acc = h2r(g, 66, 36); p.paper = h2r(h, 38, 96); p.warm = h2r(44, 88, 72);

// ---------- paper tooth ----------
function grid(W, H_, cell, r) {
  const gw = Math.ceil(W / cell) + 2, gh = Math.ceil(H_ / cell) + 2, g = new Float32Array(gw * gh);
  for (let i = 0; i < g.length; i++) g[i] = r();
  return (x, y) => {
    const fx = x / cell, fy = y / cell, ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy, sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
    const a = g[iy * gw + ix], b = g[iy * gw + ix + 1], c = g[(iy + 1) * gw + ix], d = g[(iy + 1) * gw + ix + 1];
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  };
}
let TOOTH = null;
function tooth() {
  if (TOOTH) return TOOTH;
  const cv = H.layer(CW, CH), c = cv.getContext('2d'), im = c.createImageData(CW, CH), d = im.data, r = H.rng(99);
  const fine = grid(CW, CH, 2.2, r), mid = grid(CW, CH, 7, r), big = grid(CW, CH, 40, r);
  for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) {
    const h = fine(x, y) * 0.3 + mid(x, y) * 0.5 + big(x, y) * 0.2, v = Math.max(0, Math.min(255, 243 + (h - 0.5) * 36)), o = (y * CW + x) * 4;
    d[o] = d[o + 1] = d[o + 2] = v; d[o + 3] = 255;
  }
  c.putImageData(im, 0, 0); TOOTH = cv; return cv;
}

      { k: 'tell', scene: 'hill', show: 'Some tired doesn\u2019t go away when you sleep.',
        say: 'You know the kind of tired I mean. You sleep a full night and wake up already worn out. Jesus spoke to people who felt exactly like that.' },
      { k: 'verse', label: 'He said', q: 'Come unto me, all ye that labour and are heavy laden, and I will give you rest.', ref: 'Matthew 11:28',
        lead: 'This is what he told them. Matthew eleven, twenty-eight.' },
      { k: 'note', title: 'Look who he\u2019s talking to', show: 'Not the strong ones. The people carrying too much.',
        say: 'Look at who he\u2019s talking to. Not the people who have it all figured out. The ones carrying more than they can manage. If that\u2019s you, the invitation is for you.' },
      { k: 'tell', scene: 'field', show: 'A yoke is a wooden bar that lets two oxen pull one load together.',
        say: 'In the next verse he says, take my yoke upon you. A yoke is the wooden bar that joins two oxen so they share one load. A lot of people read that as Jesus offering to pull alongside us.' },
      { k: 'verse', label: 'And then', q: 'Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls.', ref: 'Matthew 11:29',
        lead: 'Then he tells them what he\u2019s like.' },
      { k: 'end', show: 'Tell him what\u2019s heavy. Start there.', ref: 'Matthew 11:28 to 30',
        say: 'So you don\u2019t have to clean yourself up first. Just tell him what\u2019s heavy, and start there.' },
    ] },

  { id: 'peace', series: 'Words of Jesus', pal: 'night', scene: 'house', hook: 'The night before the cross',
    ref: 'John 14:27', quote: 'Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you.',
    beats: [
      { k: 'tell', scene: 'house', show: 'The night before he died, Jesus sat down with his friends.',
        say: 'The night before he was crucified, Jesus ate with his friends. He knew what was coming. And what gets me is how he spent that night. He tried to calm them down.' },
      { k: 'verse', label: 'John 14', q: 'Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.', ref: 'John 14:27',
        lead: 'This is some of what he said.' },
      { k: 'words', big: 'Not as the world giveth.', small: 'His peace is a different kind.', circle: true,
        say: 'Not as the world giveth. The world\u2019s kind of peace depends on things going well. What he offered was something to hold onto when things go badly. And that night, things were about to go very badly.' },
      { k: 'tell', scene: 'torches', show: 'Within hours, they all ran.',
        say: 'These were frightened men. Before the night was over they would scatter, and one of them would swear he never knew him. Jesus knew that. And he still gave them this.' },
      { k: 'ask', show: 'What has your heart in knots today?',
        say: 'So what has your heart in knots today? He told them not to be afraid, knowing full well they would be. Which makes me think he isn\u2019t surprised by our fear, either.' },
      { k: 'end', show: 'His peace. Not the world\u2019s kind.', ref: 'John 14:27',
        say: 'His peace. Not the world\u2019s kind. The kind that holds on in the dark.' },
    ] },

  { id: 'anxious', series: 'Words of Jesus', pal: 'garden', scene: 'hill', hook: 'Worried about tomorrow?',
    ref: 'Matthew 6:34', quote: 'Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself.',
    beats: [
      { k: 'tell', scene: 'hill', show: 'Tomorrow hasn\u2019t even happened yet.',
        say: 'Funny thing about tomorrow. It hasn\u2019t happened yet, and somehow it already weighs a ton. Jesus had something to say about that.' },
      { k: 'note', title: 'A word that changed', show: 'In 1611, \u201Ctake no thought\u201D meant \u201Cdon\u2019t worry.\u201D',
        say: 'One quick thing first. This verse can sound strange to us. When the King James Bible was written, to take thought meant to worry. So Jesus isn\u2019t telling you to stop planning. He\u2019s saying don\u2019t let worry run your day.' },
      { k: 'verse', label: 'Matthew 6:34', q: 'Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day is the evil thereof.', ref: 'Matthew 6:34',
        lead: 'Here\u2019s the line.' },
      { k: 'tell', scene: 'light', show: 'Look at the birds. You matter more to him than they do.', ref: 'Matthew 6:26',
        say: 'Just before that, he points at the birds. They don\u2019t plant or store up food, he says, and your heavenly Father still feeds them. Then he asks, aren\u2019t you worth more than they are?' },
      { k: 'words', big: 'One day at a time.', small: 'Today has enough trouble of its own.',
        say: 'The last line says each day has enough trouble of its own. I don\u2019t hear that as gloomy. I hear permission. Today\u2019s trouble is plenty. You don\u2019t have to carry tomorrow\u2019s on top of it.' },
      { k: 'end', show: 'Do today\u2019s work. Leave tomorrow with God.', ref: 'Matthew 6:34',
        say: 'So here\u2019s my little rule. Do today\u2019s work, and leave tomorrow with God. He\u2019ll be there when it comes.' },
    ] },

  { id: 'jeremiah', series: 'Verses We Misread', pal: 'earth', scene: 'road', hook: 'You\u2019ve seen Jeremiah 29:11 on a mug',
    ref: 'Jeremiah 29:11', quote: 'For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.',
    beats: [
      { k: 'tell', scene: 'road', show: 'It\u2019s on mugs, cards, and graduation gifts.',
        say: 'You\u2019ve probably seen Jeremiah twenty-nine, eleven on a coffee mug. Maybe a graduation card. It\u2019s a lovely verse. But it was first written to people in a very different spot than most of us.' },
      { k: 'verse', label: 'Here it is', q: 'For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.', ref: 'Jeremiah 29:11',
        lead: 'Here\u2019s the verse.' },
      { k: 'tell', scene: 'field', show: 'It was a letter to families taken from their homes.',
        say: 'It comes from a letter. The prophet Jeremiah sent it to Jewish families who had been carried off as captives to Babylon. They were far from home, and they weren\u2019t going back anytime soon.' },
      { k: 'verse', label: 'Look at the verse before', q: 'For thus saith the LORD, That after seventy years be accomplished at Babylon I will visit you, and perform my good word toward you, in causing you to return to this place.', ref: 'Jeremiah 29:10',
        lead: 'And right before it, God tells them how long.' },
      { k: 'tell', scene: 'house', show: 'Build houses. Plant gardens. Pray for the city.', ref: 'Jeremiah 29:5 to 7',
        say: 'So what were they supposed to do while they waited? God told them to build houses, plant gardens, and pray for the city where they had ended up. In other words, live your life there.' },
      { k: 'end', show: 'A promise for people in a long wait.', ref: 'Jeremiah 29:11',
        say: 'That changes how I read it. It isn\u2019t a promise that every plan works out this week. It\u2019s a promise to people in a long wait, that God hadn\u2019t forgotten them. If you\u2019re waiting on something right now, that one\u2019s for you.' },
    ] },

  { id: 'phil413', series: 'Verses We Misread', pal: 'dusk', scene: 'hill', hook: 'Where was Paul when he wrote this?',
    ref: 'Philippians 4:13', quote: 'I can do all things through Christ which strengtheneth me.',
    beats: [
      { k: 'ask', show: 'Where was Paul when he wrote it?',
        say: 'You\u2019ve probably seen this one on a jersey or a pair of sneakers. I can do all things through Christ. But have you ever wondered where Paul was when he wrote it?' },
      { k: 'verse', label: 'Philippians 4', q: 'I can do all things through Christ which strengtheneth me.', ref: 'Philippians 4:13',
        lead: 'Here\u2019s the verse.' },
      { k: 'tell', scene: 'night', show: 'Paul was in chains.',
        say: 'He was in prison. He mentions his chains right in chapter one. No stadium, no crowd cheering. Just a man with very little say over his own days.' },
      { k: 'verse', label: 'The line just before', q: 'I know both how to be abased, and I know how to abound: every where and in all things I am instructed both to be full and to be hungry, both to abound and to suffer need.', ref: 'Philippians 4:12',
        lead: 'And look at the line just before it, where he explains what he means.' },
      { k: 'words', big: 'Strength to get through it.', small: 'Not a promise to win.', circle: true,
        say: 'So he isn\u2019t promising you\u2019ll win every game or land every job. He\u2019s saying that whether he\u2019s full or hungry, free or in chains, Christ gives him strength to get through it. That\u2019s a different kind of promise, and I think a deeper one.' },
      { k: 'end', show: 'Strength for whatever comes.', ref: 'Philippians 4:13',
        say: 'Next time you see that verse, picture a man in a prison cell, calm, saying I can face this. That\u2019s what it\u2019s about.' },
    ] },

  { id: 'healed', series: 'Jesus Asked', pal: 'earth', scene: 'pool', hook: '\u201CWilt thou be made whole?\u201D',
    ref: 'John 5:6', quote: 'Wilt thou be made whole?',
    beats: [
      { k: 'tell', scene: 'pool', show: 'Thirty-eight years beside a pool.', ref: 'John 5:2 to 5',
        say: 'In Jerusalem there was a pool called Bethesda, with a crowd of sick people lying around it. One man had been there thirty-eight years.' },
      { k: 'verse', label: 'Jesus asked him', q: 'Wilt thou be made whole?', ref: 'John 5:6',
        lead: 'Jesus saw him, and he knew how long the man had been there. So he asked him this.' },
      { k: 'ask', show: 'Isn\u2019t that obvious?',
        say: 'Now that sounds like a strange question. Of course he wants to be well. But listen to how the man answers.' },
      { k: 'verse', label: 'His answer', q: 'Sir, I have no man, when the water is troubled, to put me into the pool: but while I am coming, another steppeth down before me.', ref: 'John 5:7',
        lead: 'He doesn\u2019t say yes. He says,' },
      { k: 'tell', scene: 'light', show: 'Rise, take up thy bed, and walk.', ref: 'John 5:8 and 9',
        say: 'He gives a reason, not a yes. I wonder if, after that long, hoping had become hard. And Jesus doesn\u2019t argue with him. He just says, rise, take up thy bed, and walk. And the man did.' },
      { k: 'end', show: 'Tell him plainly what you want.', ref: 'John 5:6',
        say: 'I think that\u2019s the invitation for us. No speech needed, just an honest answer. What do you want Jesus to change in you? Tell him plainly.' },
    ] },

  { id: 'storm', series: 'A Story from Matthew', pal: 'storm', scene: 'storm', hook: 'He slept through the storm',
    ref: 'Matthew 8:27', quote: 'But the men marvelled, saying, What manner of man is this, that even the winds and the sea obey him!',
    beats: [
      { k: 'tell', scene: 'storm', show: 'The sky went black, and Jesus was asleep.',
        say: 'Picture a small boat on a big lake. The sky goes black, the waves start coming over the sides, and Jesus is asleep in the boat.' },
      { k: 'note', title: 'Why they were scared', show: 'Storms come up fast on the Sea of Galilee.',
        say: 'That lake sits down among hills, and storms can drop on it quickly. Some of these men were fishermen. They had seen weather before. This one scared them.' },
      { k: 'verse', label: 'They woke him', q: 'And his disciples came to him, and awoke him, saying, Lord, save us: we perish.', ref: 'Matthew 8:25',
        lead: 'So they shook him awake.' },
      { k: 'tell', scene: 'calm', tone: 'gold', show: 'He spoke, and everything went still.', ref: 'Matthew 8:26',
        say: 'Jesus asked them why they were so afraid. Then he got up and spoke to the wind and the water, and there was a great calm.' },
      { k: 'verse', label: 'What they said', q: 'But the men marvelled, saying, What manner of man is this, that even the winds and the sea obey him!', ref: 'Matthew 8:27',
        lead: 'The men could hardly believe it.' },
      { k: 'end', show: 'He was in the boat the whole time.', ref: 'Matthew 8:23 to 27',
        say: 'Here\u2019s what stays with me. He was in the boat the whole time. The storm was real, but so was he. Whatever you\u2019re sailing through today, you\u2019re not out there alone.' },
    ] },

  { id: 'gethsemane', series: 'A Story from Matthew', pal: 'night', scene: 'night', hook: 'The night he could have stopped it',
    ref: 'Matthew 26:53', quote: 'Thinkest thou that I cannot now pray to my Father, and he shall presently give me more than twelve legions of angels?',
    beats: [
      { k: 'tell', scene: 'night', show: 'A garden, late at night.',
        say: 'After supper, Jesus took his friends to a garden called Gethsemane, and he went a little further on to pray alone. He was troubled. You can hear it in how he prays.' },
      { k: 'verse', label: 'His prayer', q: 'And he went a little further, and fell on his face, and prayed, saying, O my Father, if it be possible, let this cup pass from me: nevertheless not as I will, but as thou wilt.', ref: 'Matthew 26:39',
        lead: 'This is what he prayed.' },
      { k: 'tell', scene: 'torches', show: 'Judas came with a crowd, and a kiss.',
        say: 'Then Judas showed up with a crowd carrying swords and clubs. He had arranged a signal with them. A kiss. Listen to what Jesus said to him.' },
      { k: 'verse', label: 'To Judas', q: 'Friend, wherefore art thou come?', ref: 'Matthew 26:50',
        lead: 'Jesus looked at the man who was betraying him, and called him friend.' },
      { k: 'verse', label: 'To his own men', q: 'Thinkest thou that I cannot now pray to my Father, and he shall presently give me more than twelve legions of angels?', ref: 'Matthew 26:53',
        lead: 'When one of his men reached for a sword, Jesus stopped him.',
        tail: 'A Roman legion was thousands of soldiers. He had more than twelve of those within reach, and he stayed.' },
      { k: 'end', show: 'He could have stopped it. He stayed.', ref: 'Matthew 26:53',
        say: 'He had the power to walk away. He stayed. I can\u2019t think of a better reason to say thank you.' },
    ] },

  { id: 'zacchaeus', series: 'A Story from Luke', pal: 'day', scene: 'tree', hook: 'The richest man in town climbed a tree',
    ref: 'Luke 19:10', quote: 'For the Son of man is come to seek and to save that which was lost.',
    beats: [
      { k: 'tell', scene: 'tree', show: 'Short, rich, and not liked.',
        say: 'Zacchaeus was the chief tax collector in Jericho, and he was rich. Nobody liked him. Tax collectors had a reputation for charging more than they should. And Zacchaeus was short.' },
      { k: 'tell', scene: 'road', show: 'So he ran ahead and climbed a tree.',
        say: 'Jesus was coming through town, the crowd was packed in, and Zacchaeus couldn\u2019t see over anybody. So he did something a man in his position probably wouldn\u2019t. He ran ahead and climbed a tree.' },
      { k: 'verse', label: 'Then Jesus looked up', q: 'And when Jesus came to the place, he looked up, and saw him, and said unto him, Zacchaeus, make haste, and come down; for to day I must abide at thy house.', ref: 'Luke 19:5',
        lead: 'Out of that whole crowd, Jesus stops right at his tree.' },
      { k: 'tell', scene: 'house', tone: 'dawn', show: 'The crowd muttered.', ref: 'Luke 19:7',
        say: 'The crowd didn\u2019t like it. They grumbled that Jesus had gone to be the guest of a sinner.' },
      { k: 'verse', label: 'What Zacchaeus said', q: 'Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold.', ref: 'Luke 19:8',
        lead: 'At his table, something changed. Zacchaeus stood up and told Jesus,' },
      { k: 'end', show: 'For the Son of man is come to seek and to save that which was lost.', ref: 'Luke 19:10',
        say: 'Nobody asked him to do that. Meeting Jesus did something to him. And Jesus said why he had come. For the Son of man is come to seek and to save that which was lost. The man everybody wrote off was exactly who he came for.' },
    ] },

  { id: 'prodigal', series: 'A Story from Luke', pal: 'earth', scene: 'road', hook: 'The father who ran',
    ref: 'Luke 15:24', quote: 'For this my son was dead, and is alive again; he was lost, and is found.',
    beats: [
      { k: 'tell', scene: 'road', show: 'A son asks for his inheritance early.', ref: 'Luke 15:11 and 12',
        say: 'Jesus told this story to people who were complaining that he welcomed sinners. A man had two sons, and the younger one asked for his share of the inheritance. Now, while his father was still alive. That was a hard thing to ask.' },
      { k: 'tell', scene: 'field', tone: 'dusk', show: 'He wasted it all. Then a famine hit.', ref: 'Luke 15:13 to 16',
        say: 'He left for a far country and spent everything. Then a famine came, and he ended up feeding pigs, so hungry he wished he could eat what the pigs ate.' },
      { k: 'verse', label: 'Then something shifted', q: 'And when he came to himself, he said, How many hired servants of my father\u2019s have bread enough and to spare, and I perish with hunger!', ref: 'Luke 15:17',
        lead: 'And then comes a quiet moment.' },
      { k: 'verse', label: 'The father', q: 'And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him.', ref: 'Luke 15:20',
        lead: 'He starts the long walk home, rehearsing what he\u2019ll say. But look what happens first.' },
      { k: 'note', title: 'Notice this', show: 'He was already watching the road.',
        say: 'Notice the father didn\u2019t wait at the gate with his arms crossed. He saw his son while he was still a long way off. Which makes me think he had been watching that road for a long time.' },
      { k: 'end', show: 'Dead, and alive again. Lost, and found.', ref: 'Luke 15:24',
        say: 'That\u2019s how Jesus said God feels about people who come home. Dead, and alive again. Lost, and found. If you\u2019ve been far away, take one step. He\u2019s watching the road.' },
    ] },

  { id: 'sheep', series: 'A Story from Luke', pal: 'day', scene: 'sheep', hook: 'Would you leave 99 for one?',
    ref: 'Luke 15:6', quote: 'Rejoice with me; for I have found my sheep which was lost.',
    beats: [
      { k: 'ask', show: 'Would you leave 99 to find one?',
        say: 'I\u2019ve kept sheep most of my life, so this one is close to my heart. If you had a hundred and lost one, would you leave the ninety-nine to go find it? Jesus asked people exactly that.' },
      { k: 'verse', label: 'How he put it', q: 'What man of you, having an hundred sheep, if he lose one of them, doth not leave the ninety and nine in the wilderness, and go after that which is lost, until he find it?', ref: 'Luke 15:4',
        lead: 'Here\u2019s how he asked it.' },
      { k: 'tell', scene: 'sheep', show: 'A sheep doesn\u2019t get lost on purpose.',
        say: 'A lost sheep isn\u2019t usually running away. It follows the next patch of grass, looks up, and nobody\u2019s around. That\u2019s why a shepherd goes looking. He doesn\u2019t wait for it to find its own way back.' },
      { k: 'tell', scene: 'hill', tone: 'dusk', show: 'He doesn\u2019t scold it. He carries it.', ref: 'Luke 15:5',
        say: 'Notice what the shepherd doesn\u2019t do. He doesn\u2019t scold it. He lifts it onto his shoulders, and the verse says he\u2019s rejoicing.' },
      { k: 'verse', label: 'Then he calls the neighbors', q: 'And when he cometh home, he calleth together his friends and neighbours, saying unto them, Rejoice with me; for I have found my sheep which was lost.', ref: 'Luke 15:6',
        lead: 'And when he gets home, he throws a party.' },
      { k: 'end', show: 'Heaven celebrates when one person comes home.', ref: 'Luke 15:7',
        say: 'Jesus says heaven is like that. Joy over one person who turns back. So if you\u2019ve ever felt you wandered too far, you\u2019re exactly the kind of person he comes looking for.' },
    ] },

  { id: 'well', series: 'A Story from John', pal: 'earth', scene: 'well', hook: 'Why Jesus stopped at a well',
    ref: 'John 4:14', quote: 'But whosoever drinketh of the water that I shall give him shall never thirst.',
    beats: [
      { k: 'tell', scene: 'well', show: 'Noon, a hot day, a tired man at a well.', ref: 'John 4:6 and 7',
        say: 'It\u2019s about noon. Jesus is worn out from walking, and he sits down by a well in Samaria. A woman comes to draw water, and he asks her for a drink.' },
      { k: 'note', title: 'Why that was a big deal', show: 'Jews and Samaritans kept their distance.',
        say: 'That was a big deal. Jews and Samaritans normally kept away from each other. She says so herself. John even adds a note to explain it.' },
      { k: 'verse', label: 'What he offered her', q: 'But whosoever drinketh of the water that I shall give him shall never thirst; but the water that I shall give him shall be in him a well of water springing up into everlasting life.', ref: 'John 4:14',
        lead: 'Then he tells her he can give her something better than well water.' },
      { k: 'tell', scene: 'light', tone: 'dawn', show: 'He knew her story, and he stayed.', ref: 'John 4:16 to 19',
        say: 'The conversation gets personal. Jesus mentions parts of her life he had no way of knowing. But he doesn\u2019t walk away from her. He keeps talking.' },
      { k: 'verse', label: 'Then she ran', q: 'Come, see a man, which told me all things that ever I did: is not this the Christ?', ref: 'John 4:29',
        lead: 'She left her water jar right there at the well, went back to town, and told everyone,' },
      { k: 'end', show: 'One conversation. A whole town heard.', ref: 'John 4:39',
        say: 'And John tells us many people in that town believed because of what she said. One honest conversation, and a whole town heard about it.' },
    ] },

  { id: 'bartimaeus', series: 'A Story from Mark', pal: 'dawn', scene: 'road', hook: 'The blind man who wouldn\u2019t be quiet',
    ref: 'Mark 10:51', quote: 'What wilt thou that I should do unto thee?',
    beats: [
      { k: 'tell', scene: 'road', tone: 'earth', show: 'A blind man begging by the road.', ref: 'Mark 10:46 and 47',
        say: 'Bartimaeus couldn\u2019t see, so he sat by the road outside Jericho and begged. One day he hears a big crowd go by, and someone tells him it\u2019s Jesus of Nazareth.' },
      { k: 'verse', label: 'They told him to hush', q: 'And many charged him that he should hold his peace: but he cried the more a great deal, Thou son of David, have mercy on me.', ref: 'Mark 10:48',
        lead: 'He starts shouting. And the people around him tell him to be quiet. Here\u2019s what he did.' },
      { k: 'tell', scene: 'light', show: 'Out of the whole crowd, Jesus stopped for him.', ref: 'Mark 10:49',
        say: 'And Jesus stood still. Think about that. A huge crowd, a long road, and he stops for one loud man nobody wanted to hear. He says, call him.' },
      { k: 'note', title: 'A small detail', show: 'He threw off his cloak and jumped up.',
        say: 'Here\u2019s a small detail I love. Bartimaeus threw off his cloak and jumped up. For a beggar, that cloak was probably one of the few things he owned. He just went.' },
      { k: 'verse', label: 'The question', q: 'And Jesus answered and said unto him, What wilt thou that I should do unto thee? The blind man said unto him, Lord, that I might receive my sight.', ref: 'Mark 10:51',
        lead: 'Then Jesus asks him something that seems obvious.' },
      { k: 'end', show: 'Ask him plainly.', ref: 'Mark 10:52',
        say: 'He answers plainly, and Jesus says his faith has made him whole. Right away he could see, and he followed Jesus down the road. So what do you need? Don\u2019t be shy about it. Ask.' },
    ] },

  { id: 'tomb', series: 'Easter', pal: 'dusk', scene: 'tombOpen', hook: 'What happened that Sunday morning',
    ref: 'Matthew 28:6', quote: 'He is not here: for he is risen, as he said. Come, see the place where the Lord lay.',
    beats: [
      { k: 'tell', scene: 'cross', show: 'Friday. It looked like the end.', ref: 'Matthew 27:57 to 60',
        say: 'On Friday, Jesus was crucified. Some of his followers watched from a distance. A man named Joseph of Arimathaea asked for the body, laid it in his own new tomb, and rolled a heavy stone across the door.' },
      { k: 'tell', scene: 'tomb', tone: 'night', show: 'A long, quiet Saturday.',
        say: 'Then came the Sabbath, and everything went quiet. Imagine what that day felt like for the people who loved him.' },
      { k: 'tell', scene: 'tombOpen', tone: 'dawn', show: 'Sunday, at first light.', ref: 'Matthew 28:1 and 2',
        say: 'Early Sunday, as it was getting light, Mary Magdalene and the other Mary went to look at the tomb. There was an earthquake, and an angel rolled the stone away.' },
      { k: 'verse', label: 'The angel said', q: 'He is not here: for he is risen, as he said. Come, see the place where the Lord lay.', ref: 'Matthew 28:6',
        lead: 'And the angel told the women,' },
      { k: 'note', title: 'Read it yourself', show: 'All four Gospels tell about the empty tomb.',
        say: 'All four Gospels tell about the empty tomb: Matthew, Mark, Luke, and John. If you want to read it for yourself, any one of them is a good place to start.' },
      { k: 'end', show: 'He is risen.', ref: 'Matthew 28:6',
        say: 'He is risen. That\u2019s the heart of the Christian hope, and it fits in three words.' },
    ] },
];
// what Elias says, beat by beat (the cover is silent)
function buildVO(T) {
  const fix = (s) => s.replace(/\bLORD\b/g, 'Lord');
  return ['', ...T.beats.map((b) => fix(b.k === 'verse' ? [b.lead, b.q, b.tail].filter(Boolean).join(' ') : b.say))];
}

// ---------- timeline: every beat plays at normal speed, then holds until its narration line has finished ----------
const VOICE_OFF = 0.35, VOICE_TAIL = 0.5, END_HOLD = 0.8, TRN = 0.8;
let TOPIC = null, LAY = [], TL = null;
function buildTL(v) {
  const E = [], R = [], starts = []; let t = 0;
  LAY.forEach((b, i) => { const r = v && v[i] > 0 ? Math.max(b.d, VOICE_OFF + v[i] + VOICE_TAIL) : b.d; E.push(t); R.push(r); starts.push(t + VOICE_OFF); t += r; });
  return { E, R, starts, total: t + (v ? END_HOLD : 0) };
}
function loadTopic(id, seedOverride) {
  TOPIC = TOPICS.find((x) => x.id === id) || TOPICS[0];
  const T = TOPIC, qs = new URLSearchParams(location.search).get('seed');
  const seed = seedOverride || (qs ? parseInt(qs, 10) : 0) || (Math.floor(Math.random() * 1e9) + 1);
  PAL = makePalette(seed, T.pal);                       // a fresh, always-harmonious palette for this video
  BG = buildBG(PAL); PANELC = buildPanel(PAL); buildSkyFx(PAL);
  ROLES = buildCast(T, PAL); VD = null;
  LAY = buildLayout(T); BM = buildBM(T); TL = buildTL(null);
  return { id: T.id, title: T.hook, vo: buildVO(T), caption: `${T.series}: ${T.hook}\n\n\u201C${T.quote}\u201D (${T.ref}, KJV)`, tags: '#Bible #Jesus #KJV #Faith #Scripture #' + T.series.replace(/[^A-Za-z]/g, ''), host: 'elias', cast: ROLES.map((r) => r.id), palette: PAL.name, seed };
}
function setVoiceDurations(v) { VD = v; TL = buildTL(v); return { starts: TL.starts, total: TL.total }; }

// ---------- drawing ----------
function drawItem(c, it, lt) {
  switch (it.k) {
    case 'text': wcText(c, it.s, it.x, it.y, it.size, it.col, { align: it.align, reveal: win(lt, it.a, it.b), weight: it.weight }); break;
    case 'stroke': wcStroke(c, it.pts, it.w, it.col, win(lt, it.a, it.b), { head: it.head, alpha: it.alpha }); break;
    case 'pencil': pencil(c, it.pts, win(lt, it.a, it.b), 0.5, 1.6); break;
    case 'scene': { const p = win(lt, it.a, it.b); if (p > 0) bloomIn(c, sceneCanvas(it.kind, it.pal), it.x, it.y, p, it.w, it.h); break; }
    case 'wash': { const p = win(lt, it.a, it.b); if (p > 0) bloomIn(c, washCanvas(it), it.cx - it.rx - 40, it.cy - it.ry - 40, p); break; }
  }
}
function drawPanelBeat(c, B, lt, u) {   // the parchment panel and everything written or painted on it
  c.save(); const s = 1 + 0.02 * u;
  c.translate(CW / 2, 530); c.scale(s, s); c.translate(-CW / 2, -530);
  c.drawImage(PANELC, 0, 0);
  B.items.forEach((it) => drawItem(c, it, lt));
  c.restore();
}
const OLD = H.layer(CW, CH), OC = OLD.getContext('2d');
function locate(T) {
  let i = LAY.length - 1;
  for (let k = 0; k < LAY.length; k++) if (T < TL.E[k] + TL.R[k]) { i = k; break; }
  const rt = T - TL.E[i];
  return { i, rt, lt: Math.min(Math.max(0, rt), LAY[i].d), u: cl(rt / TL.R[i]) };
}
function explainer(ctx, W, H_, T) {
  const loc = locate(T), { i, rt, lt, u } = loc;
  ctx.drawImage(BG, 0, 0);
  drawSkyFx(ctx, T);
  drawPanelBeat(ctx, LAY[i], lt, u);
  if (i > 0 && rt < TRN) { // the previous page dries away under a spreading wet bloom
    OC.clearRect(0, 0, CW, CH);
    drawPanelBeat(OC, LAY[i - 1], LAY[i - 1].d, 1);
    const k = ez(rt / TRN), r = H.rng(i * 31 + 7); OC.save(); OC.globalCompositeOperation = 'destination-out';
    for (let n = 0; n < 3; n++) {
      const cx = r.range(120, 600), cy = r.range(300, 980), R = lerp(0, 1100, k) * (0.8 + n * 0.25);
      const g = OC.createRadialGradient(cx, cy, R * 0.55, cx, cy, R + 1); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      OC.fillStyle = g; OC.fillRect(0, 0, CW, CH);
    }
    OC.restore(); ctx.drawImage(OLD, 0, 0);
  }
  // host and reactors stand in front of the panel, on the hill
  for (const R of ROLES) R.st = poseAt(R, T, loc);
  const host = ROLES[0];
  if (host.st.hl > 0.02) { const g = ctx.createRadialGradient(host.x, host.y - 170, 10, host.x, host.y - 170, 240); g.addColorStop(0, hsl(44, 100, 72, 0.32 * host.st.hl)); g.addColorStop(1, hsl(44, 100, 72, 0)); ctx.fillStyle = g; ctx.fillRect(host.x - 260, host.y - 430, 520, 520); }
  for (let k = ROLES.length - 1; k >= 0; k--) drawChar(ctx, ROLES[k], T, PAL);
  drawFrame(ctx, PAL);
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(tooth(), 0, 0); ctx.restore();
  H.vignette(ctx, CW, CH, 0.34, '20,10,30');
  H.grain(ctx, CW, CH, 0.022, 8 + Math.floor(T * 12) % 9);
}

// ---------- sound score (same item times as the picture) ----------
function scoreSound(k) {
  const total = TL.total, pan = (x) => clampN((x - 360) / 360, -1, 1) * 0.5;
  const brush = (a, b, g = 1, pn = 0, minor = true) => {
    k.noise(a, { dur: 0.05, color: 'pink', filter: 'lowpass', f: 700, gain: 0.16 * g, a: 0.008, pan: pn, minor });
    k.play('stroke', a, { material: 'brush', dur: Math.max(0.1, b - a), gain: 1.5 * g, pan: pn, minor });
  };
  const letter = (s, a, b, g, pn) => { const re = /\S+/g; let m; while ((m = re.exec(s))) brush(a + (b - a) * m.index / s.length, a + (b - a) * (m.index + m[0].length) / s.length, g, pn); };
  const wash = (a, b, g = 1, pn = 0, minor = true) => {
    const d = b - a;
    k.noise(a, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 260], [d * 0.45, 820], [d, 420]], q: 0.7, gain: 0.09 * g, a: d * 0.4, pan: pn, minor, verb: 0.1 });
    k.noise(a + 0.03, { dur: d * 0.7, color: 'brown', filter: 'lowpass', f: 380, gain: 0.08 * g, a: d * 0.3, pan: pn, minor });
  };
  const dropS = (t, g = 1, pn = 0) => k.tone(t, { f: [[0, 330], [0.05, 560]], dur: 0.08, gain: 0.07 * g, a: 0.003, pan: pn, minor: true, verb: 0.2 });
  const rinse = (t, d) => {
    for (let i = 0; i < 3; i++) { const ti = t + i * d / 4; k.noise(ti, { dur: d / 2.2, color: 'pink', filter: 'bandpass', f: [[0, 420], [d / 5, 1100], [d / 2.2, 520]], q: 1.6, gain: 0.1, a: d / 9, pan: i % 2 ? 0.2 : -0.2, minor: true }); }
    dropS(t + d * 0.4, 1, 0); k.play('tock', t + d, { f: 900, gain: 0.3, minor: true });
  };
  k.bed('room', 0, total, { gain: 0.4 });
  k.music('pad', 0, total, { bpm: 56, gain: 0.3, chords: [['F3', 'A3', 'C4', 'E4'], ['D3', 'F3', 'A3', 'C4'], ['Bb2', 'D3', 'F3', 'A3'], ['C3', 'G3', 'C4', 'E4']] });
  LAY.forEach((B, i) => {
    const E = TL.E[i];
    if (i > 0) rinse(E, 0.6);
    B.items.forEach((it) => {
      if (it.k === 'text') letter(it.s, E + it.a, E + it.b, 0.9, pan(it.x));
      else if (it.k === 'stroke') {
        brush(E + it.a, E + it.b, 1.0, 0, false);
        if (it.sfx === 'hit') { k.play('thud', E + it.b, { f: 100, gain: 0.5 }); k.play('ding', E + it.b, { f: 'C5', gain: 0.4 }); }
        if (it.sfx === 'ok') k.play('success', E + it.b, { f: 'A5', gain: 0.4 });
      } else if (it.k === 'scene') wash(E + it.a, E + it.b, 1.0, 0, false);
      else if (it.k === 'wash') wash(E + it.a, E + it.b, 0.6, 0, true);
      else if (it.k === 'pencil') k.play('stroke', E + it.a, { material: 'pencil', dur: it.b - it.a, gain: 0.5, minor: true });
    });
  });
  const tEnd = TL.E[LAY.length - 1] + LAY[LAY.length - 1].d - 0.5;
  k.play('ding', tEnd, { f: 'F4', gain: 0.4 });
  ['A4', 'C5', 'F5'].forEach((f, i) => k.tone(tEnd + 0.06 + i * 0.06, { f, dur: 1.4, gain: 0.07 - i * 0.01, verb: 0.3, pan: (i - 1) * 0.3 }));
}

// ===================== exports for the automated render =====================
window.TOPIC_IDS = TOPICS.map((x) => x.id);
window.loadTopic = loadTopic;
window.setVoiceDurations = setVoiceDurations;
window.scoreSound = scoreSound;
Object.defineProperty(window, 'DURATION', { get: () => TL.total });

// ===================== PLAYER =====================
(async function () {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d', { willReadFrequently: true });
  const playBtn = document.getElementById('play'), seekEl = document.getElementById('seek'), timeEl = document.getElementById('time');
  const sndBtn = document.getElementById('snd'), loopBtn = document.getElementById('loop'), loading = document.getElementById('loading'), topicEl = document.getElementById('topic'), colBtn = document.getElementById('newcol');
  let cur = 0, playing = false, tPrev = 0, loop = true, soundOn = true, stopSound = () => {};
  const mmss = (t) => Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0');
  TOPICS.forEach((x) => { const o = document.createElement('option'); o.value = x.id; o.textContent = x.id; topicEl.appendChild(o); });
  try { await Promise.race([Promise.all(['700 60px "Caveat"', '400 60px "Caveat"'].map((f) => document.fonts.load(f, 'AaZz09\u201C\u201D\u2014'))), new Promise((r) => setTimeout(r, 2500))]); } catch (e) {}
  await new Promise((r) => setTimeout(r, 30));
  const wanted = new URLSearchParams(location.search).get('topic');
  loadTopic(wanted || TOPICS[0].id); topicEl.value = TOPIC.id;
  function draw(T) { seekEl.max = TL.total; explainer(ctx, CW, CH, T); seekEl.value = T; timeEl.textContent = mmss(T) + ' / ' + mmss(TL.total); }
  window.seek = (T) => { cur = H.clamp(T, 0, TL.total); draw(cur); };
  function startSound() { stopSound(); stopSound = () => {}; if (soundOn && playing) stopSound = SOUND.live(scoreSound, cur, { voiceover: false }); }
  function pause() { playing = false; stopSound(); stopSound = () => {}; playBtn.textContent = 'Play'; playBtn.setAttribute('aria-label', 'Play'); }
  function play() { if (cur >= TL.total - 0.01) cur = 0; playing = true; tPrev = performance.now(); playBtn.textContent = 'Pause'; playBtn.setAttribute('aria-label', 'Pause'); startSound(); requestAnimationFrame(tick); }
  function tick(now) {
    if (!playing) return;
    cur += (now - tPrev) / 1000; tPrev = now;
    if (cur >= TL.total) { if (loop) { cur = cur % TL.total; startSound(); } else { cur = TL.total; draw(cur); pause(); return; } }
    draw(cur); requestAnimationFrame(tick);
  }
  playBtn.onclick = () => (playing ? pause() : play());
  cv.onclick = () => (playing ? pause() : play());
  seekEl.oninput = () => { cur = parseFloat(seekEl.value); draw(cur); if (playing) { tPrev = performance.now(); startSound(); } };
  topicEl.onchange = () => { const was = playing; pause(); loadTopic(topicEl.value); cur = 0; draw(0); if (was) play(); };
  colBtn.onclick = () => { const was = playing; pause(); loadTopic(TOPIC.id); draw(cur); if (was) play(); };   // same topic, brand new palette
  sndBtn.onclick = () => { soundOn = !soundOn; sndBtn.setAttribute('aria-pressed', soundOn); if (!soundOn) { stopSound(); stopSound = () => {}; } else if (playing) startSound(); };
  loopBtn.onclick = () => { loop = !loop; loopBtn.setAttribute('aria-pressed', loop); };
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playing ? pause() : play(); } });
  window.frameJPEG = (T) => { window.seek(T); return cv.toDataURL('image/jpeg', 0.93).split(',')[1]; };
  window.renderAudioBase64 = async (vo) => {
    const r = await SOUND.renderOffline(scoreSound, TL.total, 48000, { voiceover: !!vo });
    const n = r.inter.length, i16 = new Int16Array(n);
    for (let i = 0; i < n; i++) i16[i] = Math.max(-1, Math.min(1, r.inter[i])) * 32767;
    const u8 = new Uint8Array(i16.buffer); let s = ''; const CHK = 0x8000;
    for (let i = 0; i < u8.length; i += CHK) s += String.fromCharCode.apply(null, u8.subarray(i, i + CHK));
    return btoa(s);
  };
  draw(0);
  window._ready = true;
  loading.style.display = 'none';
})();
</script>
</body>
</html>
